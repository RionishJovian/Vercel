# Mega Magic Project - Air Hot Reload Config
# https://github.com/air-verse/air

root = "."
tmp_dir = "tmp"

[build]
  args_bin = []
  bin = "./tmp/main"
  cmd = "go build -o ./tmp/main ./cmd/server"
  delay = 1000
  exclude_dir = ["assets", "tmp", "vendor", "testdata", "migrations", "docs", "scripts"]
  exclude_file = []
  exclude_regex = ["_test\\.go$", "\\.sql$"]
  exclude_unchanged = true
  follow_symlink = true
  full_bin = ""
  include_dir = ["cmd", "internal", "pkg"]
  include_ext = ["go", "tpl", "tmpl", "html"]
  kill_delay = 500
  log = "build-errors.log"
  poll = true
  poll_interval = 300
  rerun = false
  rerun_delay = 1000
  send_interrupt = false
  stop_on_error = true

[color]
  app = "green"
  build = "yellow"
  main = "magenta"
  runner = "blue"
  watcher = "cyan"

[log]
  time = false

[misc]
  clean_on_exit = true