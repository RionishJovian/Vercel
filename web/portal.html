<!DOCTYPE html>
<html lang="my-MM">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#09090b" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)">
<title>Guest WiFi</title>
<style>
  /* Guest portal, Obsidian and Cyan (owner decision 2026-11-13; same palette as the public pages and console sign-in).
     Night is the default; guests whose phone is set to light get the Day twin automatically.
     Fonts come from this host (font-src 'self'); the page links no other external asset, so a stale shared sheet
     can never be served against fresh markup (audit finding D1). scripts/test-public-pages-ui.mjs checks these
     token pairs at 4.5:1 for text and 3:1 for control edges, in both schemes. */
  @font-face { font-family: "Instrument Sans Variable"; font-weight: 400 700; font-display: swap; src: url(/assets/fonts/instrument-sans-latin-wght-normal-BbzFLZTg.woff2) format("woff2"); }
  @font-face { font-family: "JetBrains Mono Variable"; font-weight: 100 800; font-display: swap; src: url(/assets/fonts/jetbrains-mono-latin-wght-normal.woff2) format("woff2"); }
  @font-face { font-family: "Noto Sans Myanmar"; font-weight: 400; font-display: swap; src: url(/assets/fonts/noto-sans-myanmar-myanmar-400-normal-C_Ri2PLj.woff2) format("woff2"); unicode-range: U+1000-109F, U+200C-200D, U+25CC, U+A92E, U+A9E0-A9FE, U+AA60-AA7F; }
  @font-face { font-family: "Noto Sans Myanmar"; font-weight: 600; font-display: swap; src: url(/assets/fonts/noto-sans-myanmar-myanmar-600-normal-Cju0GbT9.woff2) format("woff2"); unicode-range: U+1000-109F, U+200C-200D, U+25CC, U+A92E, U+A9E0-A9FE, U+AA60-AA7F; }

  /* Owner branding arrives as --brand / --tint (validated hex) and only recolours the primary button and a faint
     panel wash. Focus rings, text and status colours never depend on it, so any owner colour stays legible. */
  :root {
    color-scheme: dark;
    --bg: #09090b; --surface: #111114; --sunken: #0c0c0f;
    --ink: #fafafa; --ink-soft: #d4d4d8; --ink-mute: #a1a1aa;
    --line: rgba(255, 255, 255, .09); --edge: #71717a;
    --accent: #06b6d4; --accent-text: #22d3ee; --on-accent: #04141a; --accent-soft: rgba(6, 182, 212, .13);
    --ok: #10b981; --ok-soft: rgba(16, 185, 129, .13);
    --warn: #fbbf24; --warn-soft: rgba(251, 191, 36, .12);
    --bad: #f87171; --bad-soft: rgba(248, 113, 113, .12);
    --brand: var(--accent); --brand-ink: var(--on-accent); --tint: var(--surface);
    --font: "Instrument Sans Variable", "Noto Sans Myanmar", system-ui, sans-serif;
    --mono: "JetBrains Mono Variable", ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  @media (prefers-color-scheme: light) {
    :root {
      color-scheme: light;
      --bg: #fafafa; --surface: #ffffff; --sunken: #f4f4f5;
      --ink: #09090b; --ink-soft: #3f3f46; --ink-mute: #52525b;
      --line: rgba(9, 9, 11, .10); --edge: #71717a;
      --accent: #0e7490; --accent-text: #0e7490; --on-accent: #ffffff; --accent-soft: rgba(14, 116, 144, .09);
      --ok: #047857; --ok-soft: rgba(4, 120, 87, .10);
      --warn: #92400e; --warn-soft: rgba(146, 64, 14, .09);
      --bad: #b91c1c; --bad-soft: rgba(185, 28, 28, .08);
    }
  }

  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; min-height: 100vh; min-height: 100svh; color: var(--ink); background: var(--bg); font: 16px/1.5 var(--font); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
  /* Burmese stacks vowels and marks above and below the line: 1.75 for text, 1.6 for headings. */
  :lang(my) body, :lang(my) .btn, :lang(my) input { line-height: 1.75; }
  h1, h2, h3, p { margin: 0; }
  h1, h2, h3 { font-weight: 650; letter-spacing: -.025em; line-height: 1.15; text-wrap: balance; }
  :lang(my) h1, :lang(my) h2, :lang(my) h3 { line-height: 1.6; letter-spacing: 0; }
  h1 { font-size: 1.75rem; }
  h3 { font-size: 1.05rem; }
  .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; letter-spacing: 0; }
  button, input { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

  /* The screen is the panel on a phone; on wider screens it becomes one hairline panel. */
  .guest { max-width: 440px; margin: 0 auto; padding: calc(72px + env(safe-area-inset-top)) 20px calc(32px + env(safe-area-inset-bottom)); display: grid; gap: 20px; align-content: start; }
  @media (min-width: 600px) {
    .guest { margin-top: 48px; margin-bottom: 48px; padding: 32px; border: 1px solid var(--line); border-radius: 8px; background: color-mix(in srgb, var(--tint) 6%, var(--surface)); }
  }
  .guest > * { min-width: 0; }
  .head { display: grid; gap: 6px; }
  .biz { color: var(--ink-soft); font-size: .95rem; font-weight: 600; overflow-wrap: anywhere; }
  .welcome { color: var(--ink-soft); }

  /* Language and preview chrome */
  .lang { position: fixed; top: calc(12px + env(safe-area-inset-top)); right: 16px; z-index: 2; min-height: 44px; display: inline-flex; align-items: center; padding: 0 14px; border: 1px solid var(--edge); border-radius: 6px; background: var(--surface); color: var(--ink); font-weight: 600; font-size: .9rem; cursor: pointer; }
  .lang[aria-disabled="true"] { opacity: .6; cursor: not-allowed; }
  .pv-badge { position: fixed; top: calc(12px + env(safe-area-inset-top)); left: 16px; z-index: 2; min-height: 32px; display: inline-flex; align-items: center; padding: 0 10px; border: 1px solid var(--line); border-radius: 4px; background: var(--surface); color: var(--ink-mute); font: 600 .75rem var(--mono); }
  .pv-sample-note { color: var(--ink-mute); font-size: .85rem; }

  /* Progress through a real sequence: choose, pay, confirm. */
  .flow { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .flow li { padding-top: 8px; border-top: 3px solid var(--line); color: var(--ink-mute); font-size: .85rem; font-weight: 600; }
  .flow li[aria-current="step"] { border-top-color: var(--accent); color: var(--ink); }
  .flow li.done { border-top-color: var(--ok); color: var(--ink-soft); }

  /* Buttons */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 52px; padding: 0 20px; border-radius: 6px; border: 1px solid color-mix(in srgb, var(--brand) 70%, var(--ink)); background: var(--brand); color: var(--brand-ink); font-weight: 650; font-size: 1rem; text-decoration: none; cursor: pointer; transition: filter .12s, transform .12s; }
  .btn:hover { filter: brightness(1.1); }
  .btn:active { transform: translateY(1px); }
  .btn:disabled, .btn[aria-disabled="true"] { opacity: .6; cursor: not-allowed; transform: none; filter: none; }
  .btn-secondary { background: transparent; color: var(--ink); border-color: var(--edge); }
  .btn-secondary:hover { filter: none; background: var(--accent-soft); }
  .btn-quiet { width: auto; min-height: 44px; padding: 0 14px; font-size: .9rem; background: transparent; color: var(--accent-text); border-color: var(--edge); }

  /* Voucher: the code field is the hero. */
  .voucher-login { display: grid; gap: 12px; }
  .voucher-help { color: var(--ink-soft); font-size: .95rem; }
  .voucher-row { display: grid; gap: 10px; }
  .code-input, .voucher-row input { width: 100%; min-height: 60px; padding: 0 16px; border: 1px solid var(--edge); border-radius: 6px; background: var(--sunken); color: var(--ink); font: 600 1.4rem var(--mono); letter-spacing: .14em; text-transform: uppercase; }
  .voucher-row input::placeholder { color: var(--ink-mute); letter-spacing: .3em; }
  .voucher-row input:focus, .field input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent), 0 0 0 4px var(--accent-soft); }
  .voucher-msg { min-height: 1.5em; font-size: .92rem; }
  .portal-nav { display: grid; gap: 8px; padding-top: 16px; border-top: 1px solid var(--line); }
  .portal-nav-note { color: var(--ink-mute); font-size: .85rem; }

  /* Plans: ruled rows, name and speed on the left, price on the right. */
  .plan-list { display: grid; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
  .plan { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 12px; width: 100%; min-height: 64px; padding: 12px 16px; text-align: left; color: var(--ink); background: transparent; border: 0; border-bottom: 1px solid var(--line); cursor: pointer; }
  .plan:last-child { border-bottom: 0; }
  .plan:hover, .plan:focus-visible { background: var(--accent-soft); outline-offset: -2px; }
  .plan .nm { font-weight: 650; overflow-wrap: anywhere; }
  .plan .sub { display: block; margin-top: 2px; color: var(--ink-mute); font: 500 .8rem var(--mono); }
  .plan .amt { font: 600 1.1rem var(--mono); white-space: nowrap; }
  .plan .amt small { color: var(--ink-mute); font-size: .72rem; font-weight: 500; }

  /* Payment */
  .due { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
  .due span { color: var(--ink-soft); font-weight: 600; }
  .due b { font: 600 1.6rem var(--mono); letter-spacing: -.02em; }
  .due b small { color: var(--ink-mute); font-size: .8rem; font-weight: 500; }
  .qr { display: grid; justify-items: center; gap: 10px; }
  .qr img { width: 208px; height: 208px; padding: 8px; background: #fff; border: 1px solid var(--line); border-radius: 8px; }
  .bank-rows { display: grid; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
  .bank-rows > div { display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "l b" "v b"; column-gap: 12px; row-gap: 2px; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--line); }
  .bank-rows > div:last-child { border-bottom: 0; }
  .bank-rows dt { grid-area: l; color: var(--ink-mute); font-size: .85rem; }
  .bank-rows dd { grid-area: v; margin: 0; font-size: 1.05rem; font-weight: 600; overflow-wrap: anywhere; }
  .bank-rows > div > :last-child { grid-area: b; }
  .pay-note, .grace-note { padding: 12px 14px; border: 1px solid var(--line); border-radius: 6px; background: var(--sunken); color: var(--ink-soft); font-size: .92rem; }
  .pay-note { white-space: pre-wrap; }
  .grace { display: grid; gap: 6px; padding: 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--warn-soft); }
  .timer { color: var(--warn); font: 600 1.9rem var(--mono); letter-spacing: 0; }
  .field { display: grid; gap: 6px; }
  .field label, .field .lbl { color: var(--ink-soft); font-size: .9rem; font-weight: 600; }
  .field input[type="text"], .field input[type="tel"], .field input[type="search"], .field input:not([type]) { width: 100%; min-height: 52px; padding: 0 14px; border: 1px solid var(--edge); border-radius: 6px; background: var(--sunken); color: var(--ink); font-size: 1rem; }
  .field input.mono { font-family: var(--mono); font-size: 1.1rem; letter-spacing: .1em; }
  .mute { color: var(--ink-mute); font-size: .9rem; font-weight: 600; }
  .file { position: relative; display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 0 14px; border: 1px dashed var(--edge); border-radius: 6px; color: var(--ink-soft); cursor: pointer; overflow-wrap: anywhere; }
  .file:hover { background: var(--accent-soft); }
  .file:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
  .file input { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; }
  .file svg { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

  /* Messages */
  .msg { color: var(--warn); }
  .ok { color: var(--ok); }
  .terms { margin-top: 4px; padding-top: 12px; border-top: 1px solid var(--line); color: var(--ink-mute); font-size: .85rem; }
  label.terms { display: flex; align-items: flex-start; gap: 10px; min-height: 44px; }
  label.terms input { width: 22px; height: 22px; flex: none; margin: 0; accent-color: var(--accent); }

  /* Active pass: shown only after the gateway confirms the voucher. */
  .pass { display: grid; gap: 14px; animation: pass-in .3s cubic-bezier(.22, 1, .36, 1) both; }
  .pass-state { display: inline-flex; align-items: center; gap: 8px; justify-self: start; min-height: 28px; padding: 0 10px; border-radius: 4px; background: var(--ok-soft); color: var(--ok); font-size: .85rem; font-weight: 650; }
  .pass-state i { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
  .pass-clock { display: grid; gap: 2px; padding: 16px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
  .pass-clock span { color: var(--ink-soft); font-size: .9rem; font-weight: 600; }
  .pass-clock b { font: 600 2.2rem var(--mono); letter-spacing: -.02em; }
  .pass-rows { display: grid; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); margin: 0; }
  .pass-rows > div { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  .pass-rows > div:last-child { border-bottom: 0; }
  .pass-rows dt { color: var(--ink-mute); font-size: .9rem; }
  .pass-rows dd { margin: 0; font: 500 .9rem var(--mono); text-align: right; overflow-wrap: anywhere; }
  @keyframes pass-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

  /* Guest media panel. Shown only after a voucher is accepted and only when the owner configured a media server.
     Tap targets stay >=44px for iOS. */
  .mm-media { margin-top: 12px; display: grid; gap: 8px; text-align: left; }
  .mm-media-title { font-size: 1.1rem; }
  .mm-media-sub { font-size: .85rem; color: var(--ink-mute); }
  .mm-media-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 12px; margin-bottom: 8px; }
  .mm-media-grid:empty { display: none; }
  .mm-media-card { margin: 0; }
  .mm-media-img { display: block; width: 100%; aspect-ratio: 2 / 3; object-fit: cover; border-radius: 6px; background: var(--sunken); }
  .mm-media-img-empty { border: 1px solid var(--line); }
  .mm-media-card figcaption { font-size: .78rem; line-height: 1.3; margin-top: 6px; }
  .mm-media-card figcaption > :first-child { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mm-media-cap { display: block; font-size: .72rem; color: var(--ink-mute); margin-top: 2px; }
  .btn.mm-media-open { min-height: 48px; }
  .mm-media-note { display: block; font-size: .8rem; color: var(--ink-mute); }
</style>
</head>
<body>
<div class="lang" id="lang" role="button" tabindex="0">English</div>
<div class="guest" id="root"><div class="msg" id="load">…</div></div>
<script src="/assets/js/portal.js"></script>
</body>
</html>
