<!DOCTYPE html>
<html lang="my-MM">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guest WiFi</title>
<style>
  /* This page carries NO external asset. Cloudflare serves /assets/* with
     `max-age=604800, immutable` and deploy.sh only hash-stamps the URLs written
     inside app.html, so a guest page linking /assets/css/styles.css unstamped can
     be served fresh markup against week-stale CSS (audit finding D1). The rules
     below are the ONLY ones the shared sheet was contributing to this page —
     established by enumerating every rule in styles.css that mentions a class or
     tag this page uses, then confirming with a computed-style A/B (18 elements at
     the plans step, 25 at the pay step), not guessed. */
  html { color-scheme: dark; }
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; font-size: 15px; line-height: 1.45; color: #f6f8ff; -webkit-font-smoothing: antialiased; }
  h1, h2, h3, h4 { font-weight: 650; letter-spacing: -0.01em; }
  h3 { font-size: 1.17em; margin: 1em 0; }
  /* Form controls do NOT inherit the page font from the UA sheet, so the shared
     sheet's `font: inherit` is reproduced here. Without it the confirm button
     renders in Arial at `normal` line-height instead of the page font at 1.45 —
     measured, not assumed. It sits BEFORE the .btn rule below so that rule's own
     font-size still wins, exactly as it did with the stylesheet present. */
  .btn { font: inherit; }
  /* Reproduced from the shared sheet: it applies to this page's inputs below
     900px. Harmless today (they are already width:100%) but carried over so the
     mobile behaviour does not quietly depend on the UA default. */
  @media (max-width: 900px) { input, select, textarea { max-width: 100%; } }

  /* Owner-set branding arrives as --brand / --tint (validated hex). Every other
     value here is a fallback so the page is complete before the config lands. */
  :root {
    --brand: #075044; --brand-ink: #ffffff; --tint: #061f26; --bg: #051b22;
    --line: rgba(220,244,243,.42); --line-soft: rgba(224,247,248,.2);
    --muted: #d4e3df; --faint: #b7cdc8;
    --warn: #ffd08a; --ok: #90e8b7;
  }
  body { position: relative; min-height: 100vh; padding: 56px 18px; overflow-x: hidden; background: #051b22 url("/assets/images/jade-portal-wallpaper-v1.webp") center / cover no-repeat; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Segoe UI", sans-serif; isolation: isolate; }
  /* Same dark emerald glass card as the router voucher page, so guests see one design from code entry to payment. */
  .guest { position: relative; z-index: 0; max-width: 400px; margin: 0 auto; padding: 108px 25px 32px; text-align: center; background: color-mix(in srgb, var(--tint) 7%, rgba(8,37,43,.47)); border: 1px solid rgba(239,255,255,.7); border-radius: 33px; box-shadow: 0 24px 65px rgba(0,0,0,.53), 0 0 0 2px rgba(179,211,211,.21), inset 0 1px 2px rgba(255,255,255,.6), inset 2px 0 5px rgba(227,247,255,.33), inset -2px -2px 5px rgba(239,255,222,.33); -webkit-backdrop-filter: blur(18px) saturate(125%); backdrop-filter: blur(18px) saturate(125%); }
  .guest::before { content: ""; position: absolute; inset: 3px; z-index: -1; pointer-events: none; border: 1px solid rgba(224,247,248,.16); border-radius: 29px; }
  .guest::after { content: ""; position: absolute; top: 26px; left: 50%; width: 78px; height: 66px; margin-left: -39px; background: url("/assets/images/jade-portal-wifi-v1.webp") center / contain no-repeat; }
  @media (prefers-reduced-transparency: reduce) { .guest { background: #09272e; -webkit-backdrop-filter: none; backdrop-filter: none; } }
  .guest h1 { font-size: 28px; font-weight: 600; line-height: 1.15; margin: 0 0 8px; color: #fff; letter-spacing: -.025em; }
  .guest .biz { color: #fff; margin: 0 0 8px; font-size: 13px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }
  .welcome { color: var(--muted); margin: 0 0 22px; line-height: 1.6; }
  .steps { color: var(--muted); font-size: 12px; line-height: 1.55; margin: 0 0 18px; padding: 11px 13px; background: rgba(3,22,26,.35); border: 1px solid var(--line-soft); border-radius: 12px; }
  .plan { position: relative; display: block; width: 100%; text-align: left; padding: 15px 44px 15px 15px; margin: 0 0 9px; color: #fff; background: rgba(161,206,204,.08); border: 1px solid var(--line-soft); border-radius: 14px; cursor: pointer; transition: border-color .15s, background .15s, transform .15s; -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); }
  .plan::after { content: "→"; position: absolute; right: 16px; top: 50%; color: #fff; font-size: 18px; transform: translateY(-50%); }
  .plan:hover, .plan:focus-visible { border-color: color-mix(in srgb, var(--brand) 64%, white); background: rgba(255,255,255,.13); transform: translateY(-1px); outline: none; }
  .plan .nm { font-weight: 700; } .plan .sub { color: var(--muted); font-size: 13px; margin-top: 3px; }
  .portal-or { display: flex; align-items: center; gap: 10px; margin: 22px 0 16px; color: var(--faint); font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
  .portal-or::before, .portal-or::after { content: ""; flex: 1; height: 1px; background: var(--line-soft); }
  .voucher-login { padding: 16px; text-align: left; background: rgba(3,22,26,.3); border: 1px solid var(--line-soft); border-radius: 16px; }
  .voucher-login h3 { margin: 0 0 5px; }
  .voucher-help { margin: 0 0 12px; color: var(--muted); font-size: 13px; }
  .voucher-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; }
  .voucher-row input { width: 100%; min-height: 48px; padding: 11px 13px; color: #fff; background: rgba(161,206,204,.05); border: 1px solid var(--line); border-radius: 13px; font: 700 16px ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .08em; text-transform: uppercase; -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
  .voucher-row input::placeholder { color: rgba(255,255,255,.48); }
  .voucher-row input:focus { outline: 3px solid color-mix(in srgb, var(--brand) 32%, transparent); outline-offset: 1px; border-color: color-mix(in srgb, var(--brand) 70%, white); }
  .voucher-row .btn { width: auto; min-width: 108px; }
  .voucher-msg { min-height: 20px; margin: 9px 0 0; font-size: 13px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; width: 100%; min-height: 50px; color: var(--brand-ink); border: 1px solid rgba(180,255,224,.7); padding: 12px 18px; border-radius: 13px; background-color: var(--brand); background-image: linear-gradient(150deg, rgba(194,255,244,.12), rgba(255,255,255,0) 48%, rgba(0,28,26,.33)); box-shadow: 0 0 16px rgba(72,222,182,.23), inset 0 1px 3px rgba(202,255,252,.63), inset 0 -2px 4px rgba(202,255,251,.14); font-size: 15px; font-weight: 500; cursor: pointer; }
  .btn:hover { filter: brightness(1.12); }
  .btn:disabled { opacity: .5; }
  .btn-secondary { margin-top: 14px; color: #fff; background: rgba(161,206,204,.08); border: 1px solid var(--line); box-shadow: none; }
  .portal-nav { display: grid; gap: 8px; margin-top: 18px; }
  .portal-nav-note { margin: 0; color: var(--faint); font-size: 12px; text-align: center; }
  .qr { text-align: center; margin: 16px 0; }
  .qr img { width: 210px; height: 210px; padding: 8px; background: #fff; border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 20px 45px -22px rgba(0,0,0,.8); }
  .qr .bank { color: var(--muted); font-size: 14px; margin-top: 8px; }
  .pay-note { white-space: pre-wrap; text-align: left; color: #fff; }
  .timer { font-family: ui-monospace, monospace; font-size: 28px; font-weight: 700; color: var(--warn); text-align: center; margin: 14px 0; }
  .form-row { margin: 0 0 14px; } .form-row label { display: block; color: var(--muted); font-size: 12px; font-weight: 650; margin: 0 0 6px; }
  .form-row { text-align: left; }
  .form-row input { width: 100%; min-height: 46px; padding: 10px 12px; color: #fff; background: rgba(161,206,204,.05); border: 1px solid var(--line); border-radius: 12px; font-size: 16px; }
  .form-row input:focus { outline: 3px solid color-mix(in srgb, var(--brand) 30%, transparent); outline-offset: 1px; border-color: color-mix(in srgb, var(--brand) 70%, white); }
  .msg { color: var(--warn); margin: 12px 0; }
  .ok { color: var(--ok); }
  .terms { color: var(--faint); font-size: 12px; margin: 18px 0 0; border-top: 1px solid var(--line-soft); padding-top: 12px; }
  .lang { position: fixed; top: 16px; right: 18px; z-index: 2; color: #fff; background: rgba(3,22,26,.5); border: 1px solid var(--line); -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px); border-radius: 999px; padding: 8px 13px; cursor: pointer; font-size: 12px; font-weight: 650; box-shadow: 0 8px 24px rgba(0,0,0,.22); }
  /* Preview chrome: makes it unmistakable that this is not a live hotspot, and
     that its actions are inert. */
  .pv-badge { position: fixed; top: 12px; left: 14px; color: #fff; background: rgba(3,22,26,.55); border: 1px solid var(--line); -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px); border-radius: 999px; padding: 6px 11px; font-size: 11px; font-weight: 700; letter-spacing: .08em; }
  .pv-sample-note { margin: 0 0 14px; color: var(--muted); font-size: 12px; }
  @media (max-width: 600px) {
    body { padding: 64px 14px 24px; }
    .guest { min-height: 0; margin: 0 auto; padding: 108px 20px 28px; border-radius: 29px; }
    .lang { top: 13px; right: 14px; }
    .voucher-row { grid-template-columns: 1fr; }
    .voucher-row .btn { width: 100%; }
  }
  
  /* Guest media panel. Shown only after a voucher is accepted and only when the
     owner configured a media server. Tap targets stay >=44px for iOS. */
  .mm-media { margin-top: 28px; text-align: left; }
  .mm-media-title { font-size: 1.1rem; margin: 0 0 4px; }
  .mm-media-sub { font-size: .82rem; opacity: .75; margin: 0 0 14px; }
  .mm-media-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr));
    gap: 12px; margin-bottom: 16px;
  }
  .mm-media-grid:empty { display: none; }
  .mm-media-card { margin: 0; }
  .mm-media-img {
    display: block; width: 100%; aspect-ratio: 2 / 3; object-fit: cover;
    border-radius: var(--radius-sm, 8px); background: rgba(255,255,255,.08);
  }
  .mm-media-img-empty { border: 1px solid rgba(255,255,255,.12); }
  .mm-media-card figcaption {
    font-size: .74rem; line-height: 1.3; margin-top: 6px;
  }
  /* Title stays on one line; the caption wraps beneath it. */
  .mm-media-card figcaption > :first-child {
    display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .mm-media-cap { display: block; font-size: .68rem; opacity: .68; margin-top: 2px; }
  .btn.mm-media-open {
    display: inline-flex; align-items: center; justify-content: center;
    min-height: 44px; padding: 0 18px; text-decoration: none;
  }
  .mm-media-note { display: block; font-size: .76rem; opacity: .7; margin-top: 8px; }
</style>
</head>
<body>
<div class="lang" id="lang" role="button" tabindex="0">English</div>
<div class="guest" id="root"><div class="msg" id="load">…</div></div>
<script src="/assets/js/portal.js"></script>
</body>
</html>
