  <link rel="manifest" href="/site.webmanifest?v=20260930-3">
  <script src="/assets/js/signin-theme.js"></script>
  <link rel="stylesheet" href="/assets/css/landing.css?v=20261101b">
  <link rel="stylesheet" href="/assets/css/site-pages.css?v=20261101">
</head>
<body>
  <header class="nav">
    <div class="wrap">
      <a class="brand" href="/"><img src="/assets/images/mikromagic-mark-20260930.png" alt="" width="32" height="32">Mega Magic</a>
      <div class="tools">
        <button type="button" class="iconbtn" id="theme" aria-label="Day / Night">
          <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
          <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"/></svg>
        </button>
        <div class="seg" role="group" aria-label="Language">
          <button type="button" data-set-lang="my" aria-pressed="true">မြန်မာ</button>
          <button type="button" data-set-lang="en" aria-pressed="false">EN</button>
        </div>
      </div>
    </div>
  </header>

  <main class="wrap auth">
    <div class="glass auth-card">
      <img class="logo" src="/assets/images/mikromagic-mark-20260930.png" alt="" width="72" height="72">
      <h1 id="title"><span lang="en">Sign in</span><span lang="my">ဝင်မည်</span></h1>
      <div id="alert" class="alert" role="alert" hidden></div>
      <form id="login-form">
        <div class="field">
          <label for="email"><span lang="en">Email</span><span lang="my">အီးမေးလ်</span></label>
          <!-- type="text", NOT "email": migrated Mikromagic logins are TLD-less
               (e.g. kyaw@mikromagic); browser email validation would block submit. -->
          <input class="input" id="email" name="email" type="text" inputmode="email" autocomplete="username" required autofocus>
        </div>
        <div class="field">
          <label for="password"><span lang="en">Password</span><span lang="my">စကားဝှက်</span></label>
          <input class="input" id="password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <button class="btn primary" type="submit" id="submit"><span lang="en">Sign in</span><span lang="my">ဝင်မည်</span></button>
      </form>
      <form id="register-form" hidden>
        <p class="trial"><span lang="en">Free for 7 days. No payment needed to start.</span><span lang="my">၇ ရက် အခမဲ့။ စတင်ရန် ငွေပေးရန် မလိုပါ။</span></p>
        <div class="field">
          <label for="r-company"><span lang="en">Business name</span><span lang="my">လုပ်ငန်းအမည်</span></label>
          <input class="input" id="r-company" type="text" maxlength="255" autocomplete="organization" required>
        </div>
        <div class="field">
          <label for="r-name"><span lang="en">Your name</span><span lang="my">သင့်အမည်</span></label>
          <input class="input" id="r-name" type="text" maxlength="255" autocomplete="name" required>
        </div>
        <div class="field">
          <label for="r-email"><span lang="en">Email</span><span lang="my">အီးမေးလ်</span></label>
          <input class="input" id="r-email" type="email" autocomplete="email" required>
        </div>
        <div class="field">
          <label for="r-password"><span lang="en">Password (8 or more characters)</span><span lang="my">စကားဝှက် (စာလုံး ၈ လုံးနှင့်အထက်)</span></label>
          <input class="input" id="r-password" type="password" minlength="8" autocomplete="new-password" required>
        </div>
        <button class="btn primary" type="submit" id="r-submit"><span lang="en">Create account</span><span lang="my">အကောင့် ဖွင့်မည်</span></button>
      </form>
      <button type="button" class="swap" id="swap"><span class="to-register"><span lang="en">New here? Create an account</span><span lang="my">အသစ်လား? အကောင့် ဖွင့်မည်</span></span><span class="to-login" hidden><span lang="en">Have an account? Sign in</span><span lang="my">အကောင့်ရှိပြီလား? ဝင်မည်</span></span></button>
      <p class="divider"><span lang="en">Need help?</span><span lang="my">အကူအညီ လိုပါသလား?</span></p>
      <div class="tg-wrap"><i class="orbit o4" aria-hidden="true"></i><i class="orbit o3" aria-hidden="true"></i><i class="orbit o2" aria-hidden="true"></i><i class="orbit plane" aria-hidden="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.78 18.65l.28-4.23 7.68-6.92c.34-.31-.07-.46-.52-.19L7.74 13.3 3.64 12c-.88-.25-.89-.86.2-1.3l15.97-6.16c.73-.33 1.43.18 1.15 1.3l-2.72 12.81c-.19.91-.74 1.13-1.5.71L12.6 16.3l-1.99 1.93c-.23.23-.42.42-.83.42z"/></svg></i><a class="btn tg" href="https://t.me/nish2769" target="_blank" rel="noopener noreferrer"><span class="tg-badge"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.78 18.65l.28-4.23 7.68-6.92c.34-.31-.07-.46-.52-.19L7.74 13.3 3.64 12c-.88-.25-.89-.86.2-1.3l15.97-6.16c.73-.33 1.43.18 1.15 1.3l-2.72 12.81c-.19.91-.74 1.13-1.5.71L12.6 16.3l-1.99 1.93c-.23.23-.42.42-.83.42z"/></svg></span><span lang="en">Contact us on Telegram</span><span lang="my">Telegram တွင် ဆက်သွယ်ရန်</span></a></div>
    </div>
  </main>

  <script src="/assets/js/api.js" defer></script>
  <script src="/assets/js/site.js"></script>
  <script src="/assets/js/signin.js"></script>
</body>
</html>
