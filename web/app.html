/* ---------- Boot ---------- */
// External api.js/app.js load deferred; wait for window.load so MM/whoami
// exist before we boot (they are undefined before that -> ReferenceError).
window.addEventListener("load", async () => {
  const me = await whoami();
  if (!me) return;
  ME = me;
  window.MMAccountPresence?.start();
  try { me.subscription = await MM.get("/subscription"); } catch (_) { /* API remains the access authority. */ }
  document.querySelector("#rail-biz").textContent = (me.business && me.business.company_name) || "—";
  document.querySelector("#rail-user-name").textContent = (me.user && (me.user.full_name || me.user.email)) || "Signed in";
  document.querySelector("#rail-user-role").textContent = (me.user && me.user.user_role) || "Member";
  document.querySelector("#rail-user-avatar").textContent = profileInitials(me.user && (me.user.full_name || me.user.email));
  let preferredLanguage = localStorage.getItem("mm_language") || "en";
  try {
    const profilePreference = await MM.get("/me/profile");
    preferredLanguage = profilePreference.language || preferredLanguage;
  } catch (_) { /* Local preference is the offline fallback. */ }
  await MM_I18N.init(preferredLanguage);
  profileAssetURL("avatar").then(url => {
    if (!url) return;
    const image = document.createElement("img"); image.alt = ""; image.src = url;
    image.onload = () => URL.revokeObjectURL(url);
    const target = document.querySelector("#rail-user-avatar"); target.textContent = ""; target.appendChild(image);
  }).catch(() => {});
  // Visibility is presentation only; API authorization remains mandatory.
  document.querySelectorAll(".nav-item[data-view]").forEach(button => {
    button.hidden = !canOpenView(button.dataset.view, me);
  });
  const advancedTools = document.getElementById("rail-advanced");
  if (advancedTools) advancedTools.hidden = ![...advancedTools.querySelectorAll(".nav-item")].some(button => !button.hidden);
  document.querySelectorAll(".rail-section").forEach(section => {
    let sibling = section.nextElementSibling, visible = false;
    while (sibling && !sibling.classList.contains("rail-section")) {
      if (sibling.matches(".nav-item") && !sibling.hidden) visible = true;
      sibling = sibling.nextElementSibling;
    }
    section.hidden = !visible;
  });
  const main = document.getElementById("main");
  initMagicDudePopup();

  // Narrow screens: wide data tables scroll inside their panel instead of
  // running off the edge. Handled here so the 30 table render sites stay as-is.
  const wrapTables = () => main.querySelectorAll("table").forEach((t) => {
    const p = t.parentElement;
    if (p && p.classList.contains("tablewrap")) return;
    const d = document.createElement("div");
    d.className = "tablewrap";
    p.replaceChild(d, t);
    d.appendChild(t);
  });
  new MutationObserver(wrapTables).observe(main, { childList: true, subtree: true });

  // The rail collapses into a menu below 900px: close it once a view is chosen,
  // or when the tap lands outside the rail.
  const railToggle = document.getElementById("rail-toggle");
  const railMenu = document.getElementById("rail-menu");
  const setRailOpen = (open) => {
    if (!railToggle || !railMenu) return;
    railMenu.classList.toggle("open", open);
    railToggle.setAttribute("aria-expanded", open ? "true" : "false");
  };
  if (railToggle) railToggle.addEventListener("click", (event) => {
    event.stopPropagation();
    setRailOpen(railToggle.getAttribute("aria-expanded") !== "true");
  });
  document.addEventListener("click", (e) => {
    if (!railMenu || !railMenu.classList.contains("open")) return;
    if (e.target.closest(".nav-item, .rail-profile") || !e.target.closest(".rail")) setRailOpen(false);
  });

  let routeBusy = false;
  let pendingRoute = null;

  const markCurrentRoute = (name) => {
    document.querySelectorAll(".nav-item[data-view]").forEach(b => b.removeAttribute("aria-current"));
    const group = globalThis.MMWorkspace?.group(name) || name;
    const btn = document.querySelector(`.nav-item[data-view="${group}"]`);
    if (btn) {
      btn.setAttribute("aria-current", "page");
      const advanced = btn.closest(".rail-advanced");
      if (advanced) advanced.open = true;
    }
  };

  // View renderers load live data. Serializing them prevents an earlier, slower
  // response from replacing a page the user selected more recently.
  const drainRoutes = async () => {
    if (routeBusy) return;
    routeBusy = true;
    try {
      while (pendingRoute) {
        const next = pendingRoute;
        pendingRoute = null;
        await loadView(next, main, ME);
      }
    } finally {
      routeBusy = false;
      if (pendingRoute) drainRoutes();
    }
  };

  const requestRoute = (name, { push = false } = {}) => {
    const next = VIEWS[name] ? name : "overview";
    markCurrentRoute(next);
    if (push && location.hash !== `#${next}`) history.pushState({}, "", "/app.html#" + next);
    pendingRoute = next;
    drainRoutes();
  };

  document.querySelectorAll(".nav-item[data-view]").forEach(b => {
    b.addEventListener("click", () => requestRoute(b.dataset.view, { push: true }));
  });
  document.querySelector(".rail-profile[data-view]")?.addEventListener("click", event => requestRoute(event.currentTarget.dataset.view, { push: true }));
  document.getElementById("signout").addEventListener("click", async () => { try { await MM.clear(); window.MMAccountPresence?.stop(); location.href = "/"; } catch (err) { alert("Sign-out failed. Please try again."); } });
  const routeFromLocation = () => {
    const v = location.hash.slice(1);
    if (v === "magicdude") {
      history.replaceState({}, "", "/app.html#overview");
      setMagicDudeOpen(false);
    }
    requestRoute(VIEWS[v] ? v : "overview");
  };
  window.addEventListener("popstate", routeFromLocation);
  window.addEventListener("hashchange", routeFromLocation);

  const initial = location.hash.slice(1);
  if (initial === "magicdude") history.replaceState({}, "", "/app.html#overview");
  requestRoute(VIEWS[initial] ? initial : "overview");
});
</script>
