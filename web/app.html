    /* ════════════════════════════════════════════════════════════════════
       Mega Magic — Liquid-Glass luxury overlay (inline, scoped to this page)
       Backdrop-blur glass surfaces over ambient glow orbs, light sweeps,
       3D hover depth, animate-in transitions. Vanilla CSS only.
       ════════════════════════════════════════════════════════════════════ */
    :root{
      --bg:#070a10; --bg-subtle:#0a0e15;
      --surface:rgba(255,255,255,.05);
      --ink:#f4f1ea; --ink-soft:#c6c1b6; --ink-muted:#8d8a83;
      --line:rgba(255,255,255,.10); --line-soft:rgba(255,255,255,.055);
      --accent:#7dd3fc; --accent-hover:#a5e6ff; --accent-wash:rgba(125,211,252,.12);
      --gold:#e7b457; --gold-deep:#b9882c;
      --ok:#61d395; --warn:#f0b35c; --bad:#f27c83; --unknown:#9a96a0;
      --ok-wash:rgba(97,211,149,.15); --warn-wash:rgba(240,179,92,.16);
      --bad-wash:rgba(242,124,131,.15); --unknown-wash:rgba(154,150,160,.17);
      --focus:#7dd3fc; --focus-wash:rgba(125,211,252,.18);
      --radius:16px;
      --glass:blur(22px) saturate(165%);
      --ease:cubic-bezier(.20,.70,.20,1);
    }
    html{color-scheme:dark;}
    /* One stacking root + content plane so the backdrop-filter panels never
       compose against the fixed glow orbs/grain (overlap artifact fix). */
    body{
      margin:0; min-height:100vh; color:var(--ink);
      isolation:isolate;
      background:
        radial-gradient(1100px 720px at 10% -12%, rgba(56,189,248,.18), transparent 62%),
        radial-gradient(900px 640px at 102% 6%, rgba(147,51,234,.15), transparent 55%),
        radial-gradient(1000px 780px at 46% 112%, rgba(231,180,87,.12), transparent 60%),
        var(--bg);
    }
    ::selection{background:rgba(125,211,252,.28);}

    /* Ambient glow orbs (decorative, behind glass) */
    .lg-orb{position:fixed;border-radius:50%;filter:blur(88px);pointer-events:none;z-index:0;contain:layout paint;}
    .lg-orb-a{width:540px;height:540px;top:-150px;left:-130px;background:radial-gradient(circle,rgba(56,189,248,.55),transparent 70%);}
    .lg-orb-b{width:480px;height:480px;top:26%;right:-170px;background:radial-gradient(circle,rgba(168,85,247,.5),transparent 70%);}
    .lg-orb-c{width:460px;height:460px;bottom:-150px;left:36%;background:radial-gradient(circle,rgba(231,180,87,.45),transparent 70%);}
    .lg-grain{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.055;
      background-image:radial-gradient(#fff 1px,transparent 1px);background-size:3px 3px;}

    .layout{position:relative;z-index:1;isolation:isolate;}

    /* ---------- Left rail: frosted glass ---------- */
    .rail{
      background:rgba(9,12,18,.55);
      -webkit-backdrop-filter:var(--glass); backdrop-filter:var(--glass);
      border-right:1px solid var(--line);
      box-shadow:1px 0 40px -20px rgba(0,0,0,.9);
    }
    .rail-brand{color:#fff;text-shadow:0 0 24px rgba(125,211,252,.28);}
    .rail-brand .dot{
      background:radial-gradient(circle at 32% 30%, #ffe9ae, var(--gold) 58%, var(--gold-deep));
      box-shadow:0 0 16px rgba(231,180,87,.7), inset 0 0 6px rgba(255,255,255,.55);
      border-radius:4px;
    }
    .rail-sub{color:var(--ink-muted);}
    .rail-section{color:var(--ink-muted);letter-spacing:.16em;}
    .nav-item{
      color:var(--ink-soft); border-radius:11px; position:relative;
      transition:transform var(--ease) .35s, background .25s, color .25s, box-shadow .35s;
    }
    .nav-item:hover{background:rgba(125,211,252,.10);color:#fff;transform:translateX(3px);}
    .nav-item[aria-current="page"],.nav-item.active{
      background:rgba(125,211,252,.14);color:#fff;font-weight:650;
      box-shadow:inset 0 0 0 1px rgba(125,211,252,.30), 0 10px 30px -12px rgba(56,189,248,.55);
    }
    .nav-item#signout{margin-top:auto;}

    main{padding:34px 40px;}
    #content>*{animation:lgIn .55s var(--ease) both;}
    @keyframes lgIn{from{opacity:0;transform:translateY(12px) scale(.99);}to{opacity:1;transform:none;}}

    .page-title{color:#fff;font-size:22px;}
    .page-lead{color:var(--ink-soft);}

    /* ---------- Glass panels with sweep + 3D hover ---------- */
    .panel{
      position:relative;overflow:hidden;
      background:rgba(255,255,255,.05);
      -webkit-backdrop-filter:var(--glass); backdrop-filter:var(--glass);
      border:1px solid var(--line); border-radius:18px;
      box-shadow:0 24px 55px -32px rgba(0,0,0,.95), inset 0 1px 0 rgba(255,255,255,.07);
      transition:transform var(--ease) .4s, box-shadow var(--ease) .4s, border-color .4s;
    }
    .panel:hover{
      transform:translateY(-3px);
      box-shadow:0 34px 80px -38px rgba(0,0,0,.98), 0 0 0 1px rgba(255,255,255,.09),
                 inset 0 1px 0 rgba(255,255,255,.09);
    }
    .panel::after{ /* hairline top gleam */
      content:"";position:absolute;top:0;left:10%;right:10%;height:1px;
      background:linear-gradient(90deg,transparent,rgba(255,255,255,.28),transparent);
    }
    .panel::before{ /* periodic light sweep */
      content:"";position:absolute;top:-20%;left:-80%;width:52%;height:140%;
      background:linear-gradient(105deg,transparent,rgba(255,255,255,.06),transparent);
      transform:skewX(-12deg);animation:lgSweep 4.6s ease-in-out infinite;pointer-events:none;
    }
    @keyframes lgSweep{0%{left:-80%;}62%,100%{left:135%;}}
    .panel-head{border-bottom:1px solid var(--line-soft);padding:14px 18px;}
    .panel-title{color:#fff;letter-spacing:.02em;}
    .panel-body{padding:6px 18px 16px;}

    /* ---------- Stats ---------- */
    .stat .stat-label{color:var(--ink-soft);letter-spacing:.05em;}
    .stat .stat-value{color:#fff;font-size:30px;text-shadow:0 0 26px rgba(125,211,252,.40);}

    /* ---------- Tables ---------- */
    thead th{color:var(--ink-muted);border-bottom:1px solid var(--line);}
    tbody td{border-bottom:1px solid var(--line-soft);}
    tbody tr:hover{background:rgba(255,255,255,.045);}
    .num{color:var(--ink);}
    .mono{color:var(--ink-soft);}

    /* Status pills on glass: glowing dot, frosted body */
    .status{-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);}
    .status::before{box-shadow:0 0 11px currentColor;}

    /* Device marker: luminous orbs */
    .dev{box-shadow:0 0 0 3px rgba(255,255,255,.06), 0 0 18px currentColor;}

    /* ---------- Buttons ---------- */
    .btn{
      background:rgba(255,255,255,.045);
      -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
      border:1px solid var(--line); color:var(--ink); border-radius:11px;
      text-decoration:none;
      transition:transform var(--ease) .3s, background .25s, box-shadow .3s, border-color .3s;
    }
    .btn:hover{background:rgba(255,255,255,.10);transform:translateY(-1px);}
    .btn-primary{
      background:radial-gradient(130% 220% at 22% 0%, #43b8f8, #0ea5e9 55%, #0369a1);
      color:#04121a;border:none;font-weight:650;
      box-shadow:inset 0 0 0 1px rgba(255,255,255,.18), 0 10px 28px -10px rgba(56,189,248,.65);
    }
    .btn-primary:hover{box-shadow:inset 0 0 0 1px rgba(255,255,255,.28), 0 16px 34px -10px rgba(56,189,248,.8);}
    .btn-danger{color:#ffb0b5;border-color:rgba(242,124,131,.35);}
    .btn-danger:hover{background:rgba(242,124,131,.14);}
    .btn:disabled{opacity:.45;cursor:not-allowed;transform:none;}

    /* ---------- Forms ---------- */
    input,select,textarea{
      font:inherit;color:var(--ink);
      background:rgba(0,0,0,.28);border:1px solid var(--line);
      border-radius:10px;padding:8px 10px;
      transition:border-color .2s, box-shadow .2s;
    }
    input::placeholder{color:var(--ink-muted);}
    input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px var(--focus-wash);}
    .input{background:rgba(0,0,0,.28);color:var(--ink);border-color:var(--line);}
    .field label{color:var(--ink-soft);}
    select option{background:#0c1016;color:var(--ink);}

    /* ---------- Empty / alerts ---------- */
    .empty{color:var(--ink-soft);}
    .empty .empty-title{color:#fff;}
    .alert{
      background:rgba(242,124,131,.16);border:1px solid rgba(242,124,131,.34);
      color:#ffd6d8;border-radius:12px;
      -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
    }
    hr.rule{border-top:1px solid var(--line);}

    .muted{color:var(--ink-muted);}

    @media (prefers-reduced-motion: reduce){
      *{transition:none!important;animation:none!important;}
      .panel::before{animation:none;display:none;}
    }
  </style>

const VIEWS = {

let ME = null;
function canOpenView(name, me = ME) {
  const role = me?.user?.user_role;
  if (["subscription_only","individual_pass"].includes(me?.subscription?.mode) && ["coins", "unlockkeys"].includes(name)) return false;
  if (["platform", "i18n"].includes(name)) return role === "DEVELOPER";
  if(name === "team") return role === "DEVELOPER";
  if (["templates", "termlog", "aiusage", "media", "jellyfin-portal"].includes(name)) return ["OWNER", "ADMIN", "DEVELOPER"].includes(role);
  return true;
}
let disposeSiteMap = null;
let disposeSitePicker = null;
// A portal save re-renders the entire view from a fresh API read. Keep the
// one-shot confirmation outside that discarded DOM so a successful action does
// not appear to do nothing when its old status element disappears.
let PORTAL_NOTICE = "";
// Media server configured once per business in the portal settings, then reused by
// every HotSpot portal deployment on that business.
let PORTAL_MEDIA = {media_host: "", media_port: ""};

async function loadView(name, main, me) {
  if (!canOpenView(name, me)) {
    main.innerHTML = '<div class="panel"><div class="panel-body" role="alert">This workspace is not available for your role.</div></div>';
    return;
  }
  disposeSiteMap?.(); disposeSiteMap = null;
  disposeSitePicker?.(); disposeSitePicker = null;
  const v = VIEWS[name] || VIEWS.overview;
  const taskBack = ["network","wan","pppoe","wifi","existing"].includes(name) ? '<p><a href="#internet">Back to Internet Setup</a></p>' : "";

function errorText(err, fallback = "The server did not return a usable response.") {
  if (!err) return fallback;
  if (typeof err === "string") return err;
  const data = err.data !== undefined ? err.data : err;
  if (typeof data === "string") return data;
  if (data && typeof data === "object") {
    return String(data.error || data.reason || data.message || fallback);
  }
  return String(err.message || fallback);
}

/* ---------- Fleet pulse (Stage 1) ---------- */
const FIX_KINDS = { reboot: 1, restore_backup: 1, reprovision_peer: 1 };
const FIX_HIGH_RISK = { reboot: 1, restore_backup: 1 };

function actionKind(inc) {
  return (inc && inc.suggested_action && inc.suggested_action.kind) ? inc.suggested_action.kind : "";
}
function applyFixCell(inc) {
  const k = actionKind(inc);
  if (FIX_KINDS[k]) return ["ADMIN", "OWNER", "DEVELOPER"].includes(ME?.user?.user_role) ? `<button class="btn btn-sm" data-fix="${esc(inc.id)}" data-kind="${esc(k)}">Apply fix</button>` : '<span class="muted small">Admin action required</span>';
  if (k === "review" || k === "none") return `<span class="muted small">Manual review</span>`;
  return "";
}
function wireFixes(scope, main, refresh) {
  scope.querySelectorAll("button[data-fix]").forEach(btn => {
    btn.addEventListener("click", async () => {
      const id = btn.dataset.fix, kind = btn.dataset.kind;
      if (!FIX_KINDS[kind]) return;
      if (FIX_HIGH_RISK[kind] && !confirm("Apply " + kind + " to fix this incident? This is a high-risk action.")) return;
      btn.disabled = true; btn.textContent = "…";
      try {
        await MM.post("/incidents/" + encodeURIComponent(id) + "/action", {});
        btn.textContent = "fix queued";
        if (refresh) await refresh();
      } catch (e) {
        if (e.status === 503) { btn.textContent = "auto-fix unavailable offline"; btn.disabled = true; }
        else if (e.status === 400) { btn.textContent = "Manual review"; btn.disabled = true; }
        else { btn.disabled = false; btn.textContent = "Retry"; }
      }
    });
  });
}

async function renderPulse(main) {
  let pulse;
  try { pulse = await MM.get("/fleet/pulse"); } catch (_) { return; }
  if (!pulse) return;
  const content = main.querySelector("#content");
  const head = pulse.open_incidents_head || [];
  const attention = (pulse.attention && pulse.attention[0]) || null;
  const sev = (s) => `<span class="status ${{ critical: "bad", warning: "warn", warn: "warn" }[String(s).toLowerCase()] || "unknown"}">${esc(s || "info")}</span>`;
  const headRows = head.map(inc => `<tr><td>${sev(inc.severity)}</td><td><span class="num">${esc(inc.subject_label || "—")}</span></td><td class="mono">${esc(inc.kind)}</td><td>${applyFixCell(inc)}</td></tr>`).join("");
  const strip = document.createElement("div");
  strip.innerHTML = (attention ? `<div class="panel" style="margin-bottom:14px;border-left:3px solid var(--bad)"><div class="panel-head"><h2 class="panel-title">Needs attention</h2></div><div class="panel-body"><div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">${sev(attention.severity)}<span class="num">${esc(attention.subject_label || "—")}</span><span class="muted small">${esc(attention.kind)}</span><span style="flex:1"></span>${applyFixCell(attention)}</div></div></div>` : "") +
    (head.length
      ? `<div class="panel" style="margin-bottom:14px"><div class="panel-head"><h2 class="panel-title">Open incidents</h2></div><div class="panel-body"><table><thead><tr><th>Severity</th><th>Subject</th><th>Kind</th><th></th></tr></thead><tbody>${headRows}</tbody></table></div></div>`
      : `<div class="health-banner"><span class="status ok">Clear</span><div><strong>No recovery incidents</strong><span>No unresolved tunnel or policy incidents right now.</span></div></div>`);
  const stats = content.querySelector(".stat-cluster");
  if (attention) content.insertBefore(strip, content.firstChild);
  else if (stats) stats.insertAdjacentElement("afterend", strip);
  else content.insertBefore(strip, content.firstChild);
  wireFixes(content, main, async () => { await renderOverview(main); });
}

async function renderFleet(main) {
  const [fleet, routerResult, pulseResult] = await Promise.all([
    MM.get("/fleet/health"),
    MM.get("/routers").catch(() => ({ routers: [] })),
    MM.get("/fleet/pulse").catch(() => null),
  ]);
  const routers = asArray(routerResult && routerResult.routers ? routerResult.routers : routerResult);
  const routerByID = new Map(routers.map(r => [r.device_id, r]));
  main.querySelector("#content").innerHTML = fleetBoard(fleet, routerByID, pulseResult);
  const openRouters = main.querySelector("#fleet-open-routers");
  if (openRouters) openRouters.addEventListener("click", () => { location.hash = "gateways"; });
}

function fleetBoard(fleet, routerByID, pulse) {
  const peers = asArray(fleet && fleet.peers);
  if (!peers.length) return `<div class="empty"><div class="empty-title">No peers yet</div>Provision a router to see it here.</div>`;
  const stateMeta = {
    up: { label: "ONLINE", note: "MANAGEMENT REACHABLE", level: 10 },
    stale: { label: "STALE", note: "CHECK MANAGEMENT SIGNAL", level: 5 },
    offline: { label: "OFFLINE", note: "NO REACHABILITY", level: 1 },
    unknown: { label: "UNKNOWN", note: "AWAITING SIGNAL", level: 0 },
  };
  const total = Number(fleet.total_peers || peers.length);
  const available = total ? Math.round(Number(fleet.up || 0) / total * 100) : 0;
  const incidents = asArray(pulse && pulse.open_incidents_head);
  const attention = Number(fleet.stale || 0) + Number(fleet.offline || 0);
  const cells = (level, state) => `<span class="fleet-signal" aria-label="${level} of 10 health segments">${Array.from({length: 10}, (_, i) => `<i class="${i < level ? `on ${state}` : ""}"></i>`).join("")}</span>`;
  const rows = peers.map((p, index) => {
    const state = String(p.state || "unknown").toLowerCase();
    const meta = stateMeta[state] || stateMeta.unknown;
    const router = routerByID.get(p.device_id) || {};
    const detail = [router.deployment_layer ? topologyLayerLabel(router.deployment_layer) : "Managed peer", router.vendor].filter(Boolean).join(" · ");
    return `<article class="fleet-board-row state-${esc(state)}">
      <span class="fleet-index">${String(index + 1).padStart(2, "0")}</span>
      <div class="fleet-identity"><strong>${esc(p.hardware_name || "Unnamed router")}</strong><span>${esc(detail)}</span></div>
      <div class="fleet-visual">${cells(meta.level, state)}<span class="mono">${esc(String(p.device_id || "").slice(0, 12))}</span></div>
      <div class="fleet-reading"><strong>${meta.label}</strong><span>${meta.note}</span></div>
    </article>`;
  }).join("");
  return `<section class="fleet-console" aria-label="Fleet systems board">
    <header class="fleet-console-head"><div><span class="fleet-kicker">NETWORK STATUS</span><h2>${total} managed router${total === 1 ? "" : "s"}</h2><p>See which routers can currently be reached through their secure management connection.</p></div><button class="btn" id="fleet-open-routers" type="button">Manage routers</button></header>
    <div class="fleet-board-summary">
      <div><span>Availability</span><strong>${available}%</strong><small>${fleet.up || 0} online</small></div>
      <div><span>Needs attention</span><strong>${attention}</strong><small>${fleet.stale || 0} stale · ${fleet.offline || 0} offline</small></div>
      <div><span>Open incidents</span><strong>${incidents.length}</strong><small>${incidents.length ? "Latest operational head" : "No reported incidents"}</small></div>
      <div><span>Overall state</span><strong class="fleet-overall ${esc(String(fleet.overall_state || "unknown").toLowerCase())}">${esc(String(fleet.overall_state || "unknown").toUpperCase())}</strong><small>Worst current peer state</small></div>
    </div>
    <div class="fleet-board-labels"><span>NODE</span><span>ROUTER / ROLE</span><span>HEALTH SIGNAL / ID</span><span>STATUS</span></div>
    <div class="fleet-board-rows">${rows}</div>
    <footer class="fleet-console-foot"><span><i class="fleet-live-dot"></i>Live connection status</span><span>Updated from each router's management path</span></footer>
  </section>`;
}

function fleetTable(fleet) {
  if (!fleet.peers || !fleet.peers.length) return `<div class="empty"><div class="empty-title">No peers yet</div>Provision a router to see it here.</div>`;
  const rows = fleet.peers.map(p => `
    <tr>
      <td><span class="num">${esc(p.hardware_name)}</span></td>
      <td>${badge(p.state)}</td>
      <td class="mono">${esc(p.device_id)}</td>
    </tr>`).join("");
  return `<table>
    <thead><tr><th>Device</th><th>State</th><th>ID</th></tr></thead>
    <tbody>${rows}</tbody></table>`;
}

// A Go nil slice marshals to JSON null, so `data.routers || data` yields the
// wrapper OBJECT when a tenant has none and the next .map() throws. Never trust
// the shape — coerce to an array.
function asArray(v) { return Array.isArray(v) ? v : []; }

function siteGeoPanel(sites) {

        <div class="field"><label>Name *</label><input class="input" id="gs-name"></div>

    <div id="geo-alert"></div>`;
}

function wireSiteGeo(main, sites, refresh = () => renderSites(main)) {
  const content = main.querySelector("#content");
  const notify = (m) => {
    const el = document.getElementById("geo-alert");
    if (el) el.innerHTML = `<div class="alert" role="alert">${esc(m)}</div>`;
  };
  const num = (id) => {
    const v = document.getElementById(id).value.trim();
    return v === "" ? null : Number(v);
  };

  const addBtn = document.getElementById("geo-add");
  let editingSite = null;
  const open = async site => {
    editingSite = site;
    const f = document.getElementById("geo-form");
    f.hidden = false;
    document.getElementById("geo-form-title").textContent = site ? "Edit site" : "New site";
    document.getElementById("gs-save").textContent = site ? "Save site" : "Create site";
    document.getElementById("gs-msg").textContent = "";
    for (const [field,value] of Object.entries({name:site?.name||"",location:site?.location||"",tz:site?.timezone||"Asia/Yangon",lat:site?.latitude??"",lng:site?.longitude??"",notes:site?.notes||""})) document.getElementById("gs-"+field).value=value;
    content.querySelectorAll("[data-site-select], [data-gedit], [data-gdel], #geo-add, #site-clear-filter").forEach(button=>{button.disabled=true;});
    await wireSiteLocationPicker("gs");
    document.getElementById("site-global-map")?.scrollIntoView({behavior:"smooth",block:"center"});
  };
  if (addBtn) addBtn.addEventListener("click", () => open(null));
  document.getElementById("gs-cancel")?.addEventListener("click",()=>{
    disposeSitePicker?.();disposeSitePicker=null;editingSite=null;
    document.getElementById("geo-form").hidden=true;
    content.querySelectorAll("[data-site-select], [data-gedit], [data-gdel], #geo-add, #site-clear-filter").forEach(button=>{button.disabled=false;});
  });

  const saveBtn = document.getElementById("gs-save");
  if (saveBtn) saveBtn.addEventListener("click", async () => {
    const body = {
      name: document.getElementById("gs-name").value.trim(),
      location: document.getElementById("gs-location").value.trim() || null,
      timezone: document.getElementById("gs-tz").value.trim() || null,
      latitude: num("gs-lat"),
      longitude: num("gs-lng"),
      notes: document.getElementById("gs-notes").value.trim() || null,
    };
    if (!body.name) { document.getElementById("gs-msg").textContent = "Name is required."; return; }
    // Half a coordinate is worse than none — require both or neither.
    if ((body.latitude === null) !== (body.longitude === null)) {
      document.getElementById("gs-msg").textContent = "Give both latitude and longitude, or neither.";
      return;
    }
    saveBtn.disabled = true; saveBtn.textContent = "…";
    try { if(editingSite) await MM.put("/sites/"+encodeURIComponent(editingSite.site_id),body); else await MM.post("/sites", body); await refresh(); }
    catch (e) {
      saveBtn.disabled = false; saveBtn.textContent = editingSite ? "Save site" : "Create site";
      notify((e.data && e.data.error) ? e.data.error : e.message);
    }
  });

  content.querySelectorAll("button[data-gdel]").forEach(btn => btn.addEventListener("click", async () => {
    const s = sites.find(x => x.site_id === btn.dataset.gdel);
    if (!confirm(`Delete site "${s ? s.name : ""}"? Its routers stay and become unassigned.`)) return;
    try { await MM.del("/sites/" + encodeURIComponent(btn.dataset.gdel)); await refresh(); }
    catch (e) { notify((e.data && e.data.error) ? e.data.error : e.message); }
  }));

  content.querySelectorAll("button[data-gedit]").forEach(btn => btn.addEventListener("click", () => {
    open(sites.find(x => x.site_id === btn.dataset.gedit));
  }));
}

function siteOperationsMap(sites, conns) {
  const tr = (key, vars) => window.MM_I18N ? MM_I18N.t(key, vars) : key;
  const selectedID = localStorage.getItem("mm_selected_site") || "";
  const siteState = site => {
    const paths = conns.filter(c => c.site_id === site.site_id);
    if (paths.some(connectionIsFresh)) return "online";
    if (paths.length) return "offline";
    return "unassigned";
  };
  const cards = sites.map(site => {
    const state = siteState(site);
    const paths = conns.filter(c => c.site_id === site.site_id);
    const stateLabel = tr(state === "online" ? "Management path online" : (state === "offline" ? "Path needs attention" : "No management path assigned"));
    const deviceCount = Number(site.device_count || 0);
    const deviceLabel = tr(deviceCount === 1 ? "{count} device" : "{count} devices", { count: deviceCount });
    const pathLabel = tr(paths.length === 1 ? "{count} management path" : "{count} management paths", { count: paths.length });
    return `<div class="site-location-entry"><button class="site-location-card${site.site_id === selectedID ? " is-selected" : ""}" type="button" data-site-select="${esc(site.site_id)}">
      <span class="site-location-state ${state}"></span><span><strong>${esc(site.name)}</strong><small>${esc(site.location || tr("Location not set"))}</small></span><span class="site-location-meta"><b>${esc(deviceLabel)}</b><small>${esc(pathLabel)}</small></span><em>${esc(stateLabel)}</em>
    </button>${SITE_EDITOR_ROLES.includes(ME?.user?.user_role) ? `<div class="site-location-actions"><button class="btn btn-sm" type="button" data-gedit="${esc(site.site_id)}">Edit site</button><button class="btn btn-sm" type="button" data-gdel="${esc(site.site_id)}">Delete site</button></div>` : ""}</div>`;
  }).join("");
  const selected = sites.find(s => s.site_id === selectedID);
  const selectedPaths = selected ? conns.filter(c => c.site_id === selected.site_id) : [];
  const checks = selected ? [
    [selected.latitude != null && selected.longitude != null, tr("Coordinates")],
    [Number(selected.device_count || 0) > 0, tr("Managed device")],
    [selectedPaths.length > 0, tr("Management path")],
    [selectedPaths.some(connectionIsFresh), tr("Live signal")],
  ] : [];
  const locationCount = tr(sites.length === 1 ? "{count} physical location" : "{count} physical locations", { count: sites.length });
  return `<section class="site-ops-console">
    <header><div><span class="fleet-kicker">${esc(tr("SITE OPERATIONS"))}</span><h2>${esc(locationCount)}</h2><p>${esc(tr("Choose a location to see its routers, connection state, and setup progress."))}</p></div>${selected ? `<button class="btn btn-sm" id="site-clear-filter" type="button">${esc(tr("Show all sites"))}</button>` : ""}</header>
    <div class="site-map-shell">
      <div class="site-map-toolbar"><button class="btn btn-sm" id="site-map-2d" type="button" aria-pressed="true">2D</button><button class="btn btn-sm" id="site-map-3d" type="button" aria-pressed="false">3D buildings</button><button class="btn btn-sm" id="site-map-fit" type="button">Show all locations</button><span class="muted small" id="site-map-status" role="status">Loading global map…</span></div>
      <div class="site-global-map" id="site-global-map" aria-label="Global site map"></div>
      <p class="muted small">Zoom in for building detail. 3D coverage varies by location. Map tiles are provided by OpenFreeMap; site names and router details stay in Mega Magic.</p>
      <div class="site-map-legend"><span><i class="online"></i>${esc(tr("Online path"))}</span><span><i class="offline"></i>${esc(tr("Needs attention"))}</span><span><i class="unassigned"></i>${esc(tr("Unassigned"))}</span></div>
    </div>
    <div class="site-location-list">${cards || `<div class="empty compact-empty"><div class="empty-title">${esc(tr("No sites yet"))}</div>${esc(tr("Add a physical location below."))}</div>`}</div>
    ${selected ? `<div class="site-readiness"><div><span class="fleet-kicker">${esc(tr("GO LIVE READINESS"))}</span><strong>${esc(selected.name)}</strong></div>${checks.map(([ready, label]) => `<span class="${ready ? "ready" : "missing"}">${ready ? "✓" : "○"} ${esc(label)}</span>`).join("")}<button class="btn btn-sm" type="button" id="site-open-routers">${esc(tr("Open gateways"))}</button></div>` : ""}
  </section>`;
}

async function renderSiteWorkspace(main) {
  const [siteResult, connResult] = await Promise.all([
    MM.get("/sites"),
    MM.get("/router-connections").catch(() => ({ connections: [] })),
  ]);
  const sites = asArray(siteResult && siteResult.sites);
  const conns = asArray(connResult && connResult.connections);
  const content = main.querySelector("#content");
  if (!content?.isConnected) return;
  disposeSiteMap?.(); disposeSiteMap = null;
  disposeSitePicker?.(); disposeSitePicker = null;
  content.innerHTML = `<section class="panel"><div class="panel-body"><h2>Your site</h2><p>Save your location, then <a href="#gateways">connect your router</a>.</p></div></section>${siteOperationsMap(sites, conns)}${siteGeoPanel(sites)}`;
  wireSiteGeo(main, sites, () => renderSiteWorkspace(main));
  content.querySelectorAll("[data-site-select]").forEach(button => button.addEventListener("click", async () => {
    localStorage.setItem("mm_selected_site", button.dataset.siteSelect);
    await renderSiteWorkspace(main);
  }));
  content.querySelector("#site-clear-filter")?.addEventListener("click", async () => {
    localStorage.removeItem("mm_selected_site");
    await renderSiteWorkspace(main);
  });
  content.querySelector("#site-open-routers")?.addEventListener("click", () => { location.hash = "gateways"; });
  const mapContainer = content.querySelector("#site-global-map");
  try {
    const { mountSiteMap } = await import("/assets/js/site-map.js?v=3");
    if (!mapContainer.isConnected) return;
    disposeSiteMap = mountSiteMap(mapContainer, sites, conns, id => {
      localStorage.setItem("mm_selected_site", id);
      renderSiteWorkspace(main);
    });
    if (!document.getElementById("geo-form")?.hidden && document.getElementById("gs-lat")) await wireSiteLocationPicker("gs");
  } catch (_) {
    if (mapContainer.isConnected) content.querySelector("#site-map-status").textContent = "Map unavailable. Your locations and router controls below still work.";
  }
}

/* ---------- Router connections ---------- */
// Saved management connections ported from Mikromagic. The API never returns the
// ported password ciphertext — only a flag saying it must be re-entered.
const CONN_CLOUD_CLASS = { online: "ok", pending: "warn", offline: "bad", error: "bad" };

function connectionIsFresh(connection, now = Date.now()) {
  const seen = Date.parse(connection.cloud_last_seen_at);
  return String(connection.cloud_status || "").toLowerCase() === "online" && Number.isFinite(seen) && seen <= now + 30000 && now - seen <= 300000;
}

function connCloudBadge(status) {
  if (!status) return `<span class="muted small">unknown</span>`;
  const cls = CONN_CLOUD_CLASS[status] || "";
  return `<span class="status ${cls}">${esc(status)}</span>`;
}

function connPanel(conns) {
  const canEdit = SITE_EDITOR_ROLES.indexOf((ME && ME.user && ME.user.user_role) || "") >= 0;

  const rows = conns.length ? conns.map(c => {
    const endpoint = c.host
      ? `<span class="mono">${esc(c.host)}${c.port ? ":" + c.port : ""}</span>${c.use_tls ? ` <span class="muted small">TLS</span>` : ""}`
      : `<span class="muted small">—</span>`;
    return `<tr>
      <td><span class="num">${esc(c.name)}</span>${c.is_default ? ` <span class="muted small">default</span>` : ""}</td>
      <td>${endpoint}</td>
      <td>${c.connection_mode ? esc(c.connection_mode) : `<span class="muted small">—</span>`}</td>
      <td>${connCloudBadge(c.cloud_status === "online" && !connectionIsFresh(c) ? "unverified" : c.cloud_status)}</td>
      <td>${c.site_name ? esc(c.site_name) : `<span class="muted small">unassigned</span>`}</td>
      <td class="num">${c.device_count || 0}</td>
      <td>${c.credentials_need_reentry ? `<span class="status warn">re-entry needed</span>` : `<span class="muted small">—</span>`}</td>
      ${canEdit ? `<td>
        <button class="btn btn-sm" data-cedit="${esc(c.id)}">Edit</button>
        <button class="btn btn-sm" data-cdel="${esc(c.id)}">Delete</button>
      </td>` : "<td></td>"}
    </tr>`;
  }).join("") : `<tr><td colspan="8" class="muted small">No router connections yet.</td></tr>`;

  return `<div class="panel"><div class="panel-head"><h2 class="panel-title">Saved connection records</h2>${canEdit ? `<button class="btn btn-primary" type="button" id="conn-add">Add connection record</button>` : ""}</div>
      <div class="panel-body">
        <p class="muted small">These records describe management paths. Saving an endpoint or selecting hub mode does not enroll a gateway, establish a tunnel or configure router authentication.</p>
        ${needReentry ? `<div class="alert" role="status">${needReentry} connection(s) have unusable legacy credentials. Editing this record does not replace router credentials; authenticated Magic Hub onboarding is still required.</div>` : ""}
        <table><thead><tr><th>Name</th><th>Endpoint</th><th>Mode</th><th>Cloud</th><th>Site</th><th>Devices</th><th>Credentials</th><th></th></tr></thead>
        <tbody>${rows}</tbody></table>
      </div></div>
    ${canEdit ? `
    <div class="panel" id="conn-form" hidden><div class="panel-head"><h2 class="panel-title">New router connection</h2></div>
      <div class="panel-body record-form-grid">
        <div class="field"><label for="cs-name">Name *</label><input class="input" id="cs-name" placeholder="e.g. CCR2004"></div>
        <div class="field"><label>Host</label><input class="input" id="cs-host" placeholder="router hostname or IP"></div>
        <div class="field"><label>Port</label><input class="input" id="cs-port" type="number" min="1" max="65535" placeholder="443"></div>
        <div class="field"><label>Mode</label><input class="input" id="cs-mode" placeholder="hub"></div>
        <div class="field"><label>Environment</label><input class="input" id="cs-env" placeholder="production"></div>
        <div class="field"><label>Site</label><select class="input" id="cs-site"></select></div>
        <div class="field"><label><input type="checkbox" id="cs-tls" checked> Use TLS</label></div>
        <div class="field"><label><input type="checkbox" id="cs-default"> Default connection</label></div>
        <button class="btn btn-primary" id="cs-save">Create connection</button>
        <span id="cs-msg" class="muted small"></span>
      </div></div>` : ""}
    <div id="conn-alert"></div>`;
}

function siteOptionsHtml(sites, selectedId) {
  const opts = [`<option value="">— unassigned —</option>`].concat(
    sites.map(s => `<option value="${esc(s.site_id)}"${s.site_id === selectedId ? " selected" : ""}>${esc(s.name)}</option>`)
  );
  return opts.join("");
}

function readConnForm(prefix) {
  const val = id => { const el = document.getElementById(id); return el ? el.value.trim() : ""; };
  const chk = id => { const el = document.getElementById(id); return el ? el.checked : false; };
  const portRaw = val(prefix + "port");
  return {
    name: val(prefix + "name"),
    host: val(prefix + "host") || null,
    port: portRaw === "" ? null : Number(portRaw),
    connection_mode: val(prefix + "mode") || null,
    environment: val(prefix + "env") || null,
    site_id: val(prefix + "site") || null,
    use_tls: chk(prefix + "tls"),
    is_default: chk(prefix + "default"),
  };
}

function wireConns(main, conns, sites) {
  const content = main.querySelector("#content");
  const notify = (m) => {
    const el = document.getElementById("conn-alert");
    if (el) el.innerHTML = `<div class="alert" role="alert">${esc(m)}</div>`;
  };

  const addBtn = document.getElementById("conn-add");
  if (addBtn) addBtn.addEventListener("click", () => {
    const f = document.getElementById("conn-form");
    f.hidden = !f.hidden;
    if (!f.hidden) {
      document.getElementById("cs-site").innerHTML = siteOptionsHtml(sites, null);
      document.getElementById("cs-name").focus();
    }
  });

  const saveBtn = document.getElementById("cs-save");
  if (saveBtn) saveBtn.addEventListener("click", async () => {
    const body = readConnForm("cs-");
    if (!body.name) { document.getElementById("cs-msg").textContent = "Name is required."; return; }
    if (body.port !== null && (body.port < 1 || body.port > 65535)) {
      document.getElementById("cs-msg").textContent = "Port must be between 1 and 65535.";
      return;
    }
    saveBtn.disabled = true; saveBtn.textContent = "…";
    try { await MM.post("/router-connections", body); await renderSites(main); }
    catch (e) {
      saveBtn.disabled = false; saveBtn.textContent = "Create connection";
      notify((e.data && e.data.error) ? e.data.error : e.message);
    }
  });

  content.querySelectorAll("button[data-cdel]").forEach(btn => btn.addEventListener("click", async () => {
    const c = conns.find(x => x.id === btn.dataset.cdel);
    if (!confirm(`Delete connection "${c ? c.name : ""}"? Its devices stay and become unlinked.`)) return;
    try { await MM.del("/router-connections/" + encodeURIComponent(btn.dataset.cdel)); await renderSites(main); }
    catch (e) { notify((e.data && e.data.error) ? e.data.error : e.message); }
  }));

  content.querySelectorAll("button[data-cedit]").forEach(btn => btn.addEventListener("click", () => {
    openEditConn(main, conns.find(x => x.id === btn.dataset.cedit), sites);
  }));
}

      </div></div>`;

  document.getElementById("ec-cancel").addEventListener("click", () => renderSites(main));

    }
    try { await MM.put("/router-connections/" + encodeURIComponent(c.id), body); await renderSites(main); }
    catch (e) { el.innerHTML = `<div class="alert" role="alert">${esc((e.data && e.data.error) ? e.data.error : e.message)}</div>`; }
  });
}

/* ---------- Device allowances + requests ---------- */
// Granted capacity ported from Mikromagic, plus the request workflow. Approved
// request quantities are applied to the matching allowance by the API.
function allowancePanel(a) {
  if (!a) return "";
  const row = (label, granted, used) => {
    const limited = granted !== null;
    const remaining = limited ? Math.max(0, granted - used) : null;
    const over = limited && used > granted;
    const atLimit = limited && used === granted;
    const status = over
      ? `<span class="status bad">Over limit</span>`
      : (atLimit ? `<span class="status warn">At limit</span>` : `<span class="status ok">Available</span>`);
    return `<div class="capacity-row">
      <strong>${esc(label)}</strong>
      <span class="capacity-metric"><small>Granted</small><b class="num">${limited ? granted : "—"}</b></span>
      <span class="capacity-metric"><small>In use</small><b class="num">${used}</b></span>
      <span class="capacity-metric"><small>Remaining</small><b class="num">${remaining === null ? "—" : remaining}</b></span>
      <span>${status}</span>
    </div>`;
  };

  return `<div class="panel"><div class="panel-head"><h2 class="panel-title">Device allowances</h2></div>
      <div class="panel-body">
        <div class="capacity-list">
          ${row("Routers", a.routers, a.used_routers)}
          ${row("Controllers", a.controllers, a.used_controllers)}
          ${row("Sites", a.sites, a.used_sites)}
          ${row("Access points", null, a.used_access_points)}
        </div>
        ${a.included_router_name ? `<p class="muted small">Grant includes router connection: <span class="mono">${esc(a.included_router_name)}</span></p>` : ""}
        <p class="muted small">Routers and controllers are counted from each device's deployment layer; access points are listed separately because the ported grant never specified whether it covered them.</p>
      </div></div>`;
}

function requestStatusBadge(status) {
  const cls = status === "approved" ? "ok" : (status === "rejected" ? "bad" : "warn");
  return `<span class="status ${cls}">${esc(status)}</span>`;
}

function requestPanel(requests) {
  const canDecide = ((ME && ME.user && ME.user.user_role) || "") === "DEVELOPER";
  const pending = requests.filter(r => r.status === "pending").length;

  const rows = requests.map(r => `<tr>
      <td><span class="num">${esc(r.kind)}</span></td>
      <td class="num">${esc(r.quantity || 1)}</td>
      <td>${r.user_email ? esc(r.user_email) : `<span class="muted small">—</span>`}</td>
      <td>${r.reason ? esc(r.reason) : `<span class="muted small">—</span>`}</td>
      <td>${requestStatusBadge(r.status)}</td>
      <td>${r.decided_at ? esc(ts(r.decided_at)) : `<span class="muted small">—</span>`}</td>
      ${canDecide ? `<td>${r.status === "pending" ? `
        <button class="btn btn-sm" data-qapprove="${esc(r.id)}">Approve</button>
        <button class="btn btn-sm" data-qreject="${esc(r.id)}">Reject</button>` : `<span class="muted small">decided</span>`}</td>` : "<td></td>"}
    </tr>`).join("");

  return `<div class="panel"><div class="panel-head"><h2 class="panel-title">Device requests</h2></div>
      <div class="panel-body">
        ${canDecide && pending ? `<div class="alert" role="status">${pending} request(s) awaiting your decision. Approval immediately adds the requested quantity to this tenant's allowance.</div>` : ""}
        ${requests.length ? `<div class="tablewrap"><table><thead><tr><th>Kind</th><th>Quantity</th><th>Requested by</th><th>Reason</th><th>Status</th><th>Decided</th><th></th></tr></thead>
        <tbody>${rows}</tbody></table></div>` : `<div class="empty compact-empty"><div class="empty-title">No capacity requests</div>Request additional routers, controllers, or sites when you need them.</div>`}
      </div></div>
    <div class="sites-actions">
      <button class="btn btn-primary" type="button" id="req-add">Request capacity</button>
    </div>
    <div class="panel" id="req-form" hidden><div class="panel-head"><h2 class="panel-title">New capacity request</h2></div>
      <div class="panel-body">
        <div class="field"><label>Capacity</label><select class="input" id="qr-kind"></select></div>
        <div class="field"><label>Quantity</label><input class="input" id="qr-quantity" type="number" min="1" max="100" value="1"></div>
        <div class="field"><label>Reason</label><input class="input" id="qr-reason" placeholder="why you need more"></div>
        <button class="btn btn-primary" type="button" id="qr-save">Submit request</button>
        <span id="qr-msg" class="muted small"></span>
      </div></div>
    <div id="req-alert"></div>`;
}

function wireAllowance(main, allowance, requests, kinds) {
  const content = main.querySelector("#content");
  const notify = (m) => {
    const el = document.getElementById("req-alert");
    if (el) el.innerHTML = `<div class="alert" role="alert">${esc(m)}</div>`;
  };

  const addBtn = document.getElementById("req-add");
  if (addBtn) addBtn.addEventListener("click", () => {
    const f = document.getElementById("req-form");
    f.hidden = !f.hidden;
    if (!f.hidden) {
      const sel = document.getElementById("qr-kind");
      sel.innerHTML = (kinds && kinds.length ? kinds : ["routers", "controllers", "sites"])
        .map(k => `<option value="${esc(k)}">${esc(k)}</option>`).join("");
      document.getElementById("qr-reason").focus();
    }
  });

  const saveBtn = document.getElementById("qr-save");
  if (saveBtn) saveBtn.addEventListener("click", async () => {
    const kind = document.getElementById("qr-kind").value;
    const quantity = parseInt(document.getElementById("qr-quantity").value, 10);
    const reason = document.getElementById("qr-reason").value.trim() || null;
    if (!Number.isInteger(quantity) || quantity < 1 || quantity > 100) return notify("Quantity must be between 1 and 100.");
    saveBtn.disabled = true; saveBtn.textContent = "…";
    try { await MM.post("/device-requests", { kind, quantity, reason }); await renderSites(main); }
    catch (e) {
      saveBtn.disabled = false; saveBtn.textContent = "Submit request";
      notify((e.data && e.data.error) ? e.data.error : e.message);
    }
  });

  const decide = async (id, status) => {
    try { await MM.post(`/device-requests/${encodeURIComponent(id)}/decide`, { status }); await renderSites(main); }
    catch (e) { notify((e.data && e.data.error) ? e.data.error : e.message); }
  };
  content.querySelectorAll("button[data-qapprove]").forEach(b =>
    b.addEventListener("click", () => decide(b.dataset.qapprove, "approved")));
  content.querySelectorAll("button[data-qreject]").forEach(b =>
    b.addEventListener("click", () => decide(b.dataset.qreject, "rejected")));
}

      </div></div>` : `<div id="tp-add"></div>`}
    <div id="tp-alert"></div>`;

  document.getElementById("tp-apply").addEventListener("click", () => {

    tplState.q = document.getElementById("tp-q").value.trim();
    loadTemplates(main);
  });
  document.getElementById("tp-reset").addEventListener("click", () => {
    tplState = { category: "", q: "" };
    document.getElementById("tp-cat").value = "";
    document.getElementById("tp-q").value = "";
    loadTemplates(main);
  });
  document.getElementById("tp-q").addEventListener("keydown", (e) => {
    if (e.key === "Enter") document.getElementById("tp-apply").click();
  });
  const addBtn = document.getElementById("tp-add");
  if (addBtn && canEdit) addBtn.addEventListener("click", () => {
    const f = document.getElementById("tp-form");
    f.hidden = !f.hidden;
    if (!f.hidden) document.getElementById("nt-name").focus();
  });
  const saveBtn = document.getElementById("nt-save");
  if (saveBtn) saveBtn.addEventListener("click", async () => {
    const val = id => document.getElementById(id).value.trim();
    const body = {
      name: val("nt-name"), category: val("nt-cat"),
      method: val("nt-method"), path: val("nt-path"),
      description: val("nt-desc") || null, body: val("nt-body") || null,
    };
    const msg = document.getElementById("nt-msg");
    if (!body.name || !body.category || !body.path) { msg.textContent = "Name, category and path are required."; return; }
    saveBtn.disabled = true; saveBtn.textContent = "…";
    try { await MM.post("/terminal-templates", body); await renderTemplates(main); }
    catch (e) {
      saveBtn.disabled = false; saveBtn.textContent = "Create template";
      msg.textContent = (e.data && e.data.error) ? e.data.error : e.message;
    }
  });

  await loadTemplates(main);
}

async function loadTemplates(main) {
  const qs = new URLSearchParams();
  if (tplState.category) qs.set("category", tplState.category);
  if (tplState.q) qs.set("q", tplState.q);
  const body = document.getElementById("tp-body");
  if (!body) return;
  try {
    const d = await MM.get("/terminal-templates" + (qs.toString() ? "?" + qs.toString() : ""));
    const sel = document.getElementById("tp-cat");
    if (sel && sel.options.length <= 1) {
      (d.categories || []).forEach(c => sel.add(new Option(c, c)));
      sel.value = tplState.category;
    }

    const canEdit = SITE_EDITOR_ROLES.indexOf((ME && ME.user && ME.user.user_role) || "") >= 0;
    const list = asArray(d.templates);
    body.innerHTML = list.length ? list.map(t => `<tr>
        <td><span class="num">${esc(t.name)}</span>${t.is_builtin ? ` <span class="muted small">built-in</span>` : ` <span class="status ok">custom</span>`}</td>
        <td>${esc(t.category)}</td>
        <td>${methodBadge(t.method)}</td>
        <td><span class="mono">${esc(t.path)}</span></td>
        <td>${canEdit && !t.is_builtin ? `
          <button class="btn btn-sm" data-tdel="${esc(t.id)}">Delete</button>` : ""}</td>
      </tr>`).join("") : `<tr><td colspan="5" class="muted small">No templates match.</td></tr>`;

    document.getElementById("tp-summary").textContent =
      `${d.count} template(s) — ${d.builtin} built-in, ${d.custom} custom` +
      (tplState.category || tplState.q ? " (filtered)" : "");

    body.querySelectorAll("button[data-tdel]").forEach(b => b.addEventListener("click", async () => {
      if (!confirm("Delete this custom template?")) return;
      const el = document.getElementById("tp-alert");
      try { await MM.del("/terminal-templates/" + encodeURIComponent(b.dataset.tdel)); await renderTemplates(main); }
      catch (e) { if (el) el.innerHTML = `<div class="alert" role="alert">${esc((e.data && e.data.error) ? e.data.error : e.message)}</div>`; }
    }));
  } catch (e) {
    body.innerHTML = `<tr><td colspan="5" class="muted small">Could not load templates.</td></tr>`;
  }
}

/* ---------- Event log (syslog) ---------- */
// Read-only, newest-first, paged. State lives here so paging and filtering can
// refresh only the table body rather than tearing down the filter controls.
const EVENTS_PAGE = 50;
let eventsState = { severity: "", program: "", q: "", offset: 0, pages: 0 };

const SEV_CLASS = { info: "", warning: "warn", critical: "bad" };

function sevBadge(sev) {
  const cls = SEV_CLASS[sev] !== undefined ? SEV_CLASS[sev] : "";
  return `<span class="status ${cls}">${esc(sev)}</span>`;
}

// Router syslog lines are long; keep rows scannable but never hide the text —
// the full message stays reachable via the title attribute.
function clampMsg(m, n) {
  const s = String(m == null ? "" : m);
  return s.length > n ? s.slice(0, n) + "…" : s;
}

async function renderEvents(main) {
  eventsState = { severity: "", program: "", q: "", offset: 0, pages: 0 };
  const content = main.querySelector("#content");
  content.innerHTML = `
    <div class="panel"><div class="panel-head"><h2 class="panel-title">Filters</h2></div>
      <div class="panel-body">
        <div class="field"><label>Severity</label><select class="input" id="ev-sev">
          <option value="">all severities</option></select></div>
        <div class="field"><label>Program</label><select class="input" id="ev-prog">
          <option value="">all programs</option></select></div>
        <div class="field"><label>Message contains</label><input class="input" id="ev-q" placeholder="e.g. logged in"></div>
        <button class="btn btn-primary" id="ev-apply">Apply</button>
        <button class="btn" id="ev-reset">Reset</button>
        <span id="ev-msg" class="muted small"></span>
      </div></div>
    <div class="panel"><div class="panel-head"><h2 class="panel-title">Events</h2></div>
      <div class="panel-body">
        <p class="muted small" id="ev-summary">Loading…</p>
        <table><thead><tr><th>Time</th><th>Severity</th><th>Program</th><th>Source</th><th>Message</th></tr></thead>
        <tbody id="ev-body"><tr><td colspan="5" class="muted small">Loading…</td></tr></tbody></table>
        <div style="display:flex;gap:8px;margin-top:10px">
          <button class="btn" id="ev-newer">‹ Newer</button>
          <button class="btn" id="ev-older">Older ›</button>
        </div>
      </div></div>`;

  document.getElementById("ev-apply").addEventListener("click", () => {
    eventsState.severity = document.getElementById("ev-sev").value;
    eventsState.program = document.getElementById("ev-prog").value;
    eventsState.q = document.getElementById("ev-q").value.trim();
    eventsState.offset = 0;
    loadEvents(main);
  });
  document.getElementById("ev-reset").addEventListener("click", () => {
    eventsState = { severity: "", program: "", q: "", offset: 0, pages: eventsState.pages };
    document.getElementById("ev-sev").value = "";
    document.getElementById("ev-prog").value = "";
    document.getElementById("ev-q").value = "";
    loadEvents(main);
  });
  // Enter in the search box applies, matching how a log filter is expected to behave.
  document.getElementById("ev-q").addEventListener("keydown", (e) => {
    if (e.key === "Enter") document.getElementById("ev-apply").click();
  });
  document.getElementById("ev-newer").addEventListener("click", () => {
    eventsState.offset = Math.max(0, eventsState.offset - EVENTS_PAGE);
    loadEvents(main);
  });
  document.getElementById("ev-older").addEventListener("click", () => {
    eventsState.offset += EVENTS_PAGE;
    loadEvents(main);
  });

  await loadEvents(main);
}

async function loadEvents(main) {
  const qs = new URLSearchParams();
  if (eventsState.severity) qs.set("severity", eventsState.severity);
  if (eventsState.program) qs.set("program", eventsState.program);
  if (eventsState.q) qs.set("q", eventsState.q);
  qs.set("limit", EVENTS_PAGE);
  qs.set("offset", eventsState.offset);

  const body = document.getElementById("ev-body");
  const summary = document.getElementById("ev-summary");
  const msg = document.getElementById("ev-msg");
  if (!body) return;                       // view was navigated away mid-flight
  try {
    const d = await MM.get("/syslog-events?" + qs.toString());

    const sevSel = document.getElementById("ev-sev");
    if (sevSel && sevSel.options.length <= 1) {
      (d.severities || []).forEach(s => sevSel.add(new Option(s, s)));
      sevSel.value = eventsState.severity;
    }
    const progSel = document.getElementById("ev-prog");
    if (progSel && progSel.options.length <= 1) {
      (d.programs || []).forEach(p => progSel.add(new Option(p, p)));
      progSel.value = eventsState.program;
    }

    const events = asArray(d.events);
    body.innerHTML = events.length ? events.map(e => `<tr>
        <td class="muted small">${esc(ts(e.received_at))}</td>
        <td>${sevBadge(e.severity)}${e.ai_severity ? ` <span class="muted small">ai:${esc(e.ai_severity)}</span>` : ""}</td>
        <td>${e.program ? `<span class="mono">${esc(e.program)}</span>` : `<span class="muted small">—</span>`}</td>
        <td>${e.source_ip ? `<span class="mono">${esc(e.source_ip)}</span>` : `<span class="muted small">—</span>`}</td>
        <td title="${esc(e.message)}">${esc(clampMsg(e.message, 140))}</td>
      </tr>`).join("") : `<tr><td colspan="5" class="muted small">No events match these filters.</td></tr>`;

    const from = d.total ? eventsState.offset + 1 : 0;
    const to = eventsState.offset + events.length;
    summary.textContent = `Showing ${from}–${to} of ${d.total} event(s)` +
      (eventsState.severity || eventsState.program || eventsState.q ? " (filtered)" : "");

    document.getElementById("ev-newer").disabled = eventsState.offset === 0;
    document.getElementById("ev-older").disabled = !d.has_more;
    if (msg) msg.textContent = "";
  } catch (e) {
    if (msg) msg.textContent = (e.data && e.data.error) ? e.data.error : e.message;
    body.innerHTML = `<tr><td colspan="5" class="muted small">Could not load events.</td></tr>`;
  }
}

function routerCapabilityButton(deviceID, kind, label, available, title) {
  return `<button class="routerboard-capability ${available ? "available" : "pending"}" type="button" data-router-capability="${esc(kind)}" data-router-capability-device="${esc(deviceID)}"${title ? ` title="${esc(title)}"` : ""}>${esc(label)}</button>`;
}

// Capability buttons for one router card. status drives the loading contract:
// "checking" while the live probe runs, "ready" once the probe answered,
// "error" with a per-card retry button when the bounded probe failed, and
// "unknown" before any check (legacy rendering). Cards render immediately
// from saved data; the live checks refresh them card by card afterwards.
function routerCapabilitySlot(router, caps, status, message) {
  const localRadios = caps ? Number((caps.modern_wifi && caps.modern_wifi.count) || 0) + Number((caps.legacy_wireless && caps.legacy_wireless.count) || 0) : 0;
  const controller = !!(caps && ((caps.modern_capsman && caps.modern_capsman.supported) || (caps.legacy_capsman && caps.legacy_capsman.supported)));
  const hotspot = !!(caps && caps.hotspot && caps.hotspot.supported);
  const webfig = !!(caps && caps.webfig && caps.webfig.https_enabled);
  const pending = status === "checking" || status === "error";
  const capabilityTitle = status === "error" ? (message || "Capability discovery failed")
    : status === "checking" ? "Checking this router…"
    : (caps && caps.error) ? caps.error
    : caps ? "Detected from this router" : "Capability discovery unavailable";
  return `${router.deployment_layer === "MAIN_GATEWAY" ? routerCapabilityButton(router.device_id, "gateway", "Router name and DNS", !pending && !!(caps && caps.gateway), capabilityTitle) : ""}
    ${router.deployment_layer === "MAIN_GATEWAY" ? routerCapabilityButton(router.device_id, "hotspot", "Hotspot readiness", !pending && hotspot, hotspot ? "View this router's hotspot readiness" : capabilityTitle) : ""}
    ${localRadios > 0 || controller || ["ACCESS_POINT","CONTROLLER"].includes(router.deployment_layer) ? routerCapabilityButton(router.device_id, "wireless", "Wi-Fi readiness", !pending && (localRadios > 0 || controller), "Read-only capability information; SSID configuration is not available here yet") : ""}
    ${routerCapabilityButton(router.device_id, "webfig", "WebFig status", !pending, webfig ? "HTTPS WebFig is available" : "View what is needed for secure WebFig access")}
    ${status === "error" ? `<button class="btn btn-sm" type="button" data-capability-retry="${esc(router.device_id)}">Retry capability check</button>` : ""}`;
}

// Rewrite exactly one card's capability slot. Returns false when the card is
// gone (the view re-rendered), so a late probe answer cannot touch fresh DOM.
function renderCapabilityCardSlot(content, router, capabilityByID, status, message) {
  const card = Array.from(content.querySelectorAll('[data-gateway-id]')).find(item => item.dataset.gatewayId === router.device_id);
  const slot = card && card.querySelector(".routerboard-capabilities");
  if (!card?.isConnected || !slot) return false;
  slot.innerHTML = routerCapabilitySlot(router, capabilityByID.get(router.device_id) || null, status, message);
  slot.querySelectorAll("[data-capability-retry]").forEach(button => button.addEventListener("click", () => { loadRouterCapability(content, router, capabilityByID); }));
  return true;
}

const ROUTER_CAPABILITY_TIMEOUT_MS = 20000;

// One bounded, per-card live capability probe. The card already rendered from
// saved data; this only refreshes that card's buttons, and leaves a retry
// button instead of stalling the page when the router does not answer.
async function loadRouterCapability(content, router, capabilityByID) {
  if (!renderCapabilityCardSlot(content, router, capabilityByID, "checking")) return;
  const controller = new AbortController();
  const bound = setTimeout(() => controller.abort(), ROUTER_CAPABILITY_TIMEOUT_MS);
  try {
    const response = await MM.get(`/routers/${encodeURIComponent(router.device_id)}/capabilities`, { signal: controller.signal });
    const caps = response.capabilities || response;
    if (caps.device_id !== router.device_id || caps.detected !== true) throw Error("Router tools are unverified");
    capabilityByID.set(router.device_id, caps);
    renderCapabilityCardSlot(content, router, capabilityByID, "ready");
  } catch (error) {
    const message = error && error.name === "AbortError" ? `Capability check timed out after ${Math.round(ROUTER_CAPABILITY_TIMEOUT_MS / 1000)}s. The router may be unreachable right now.` : ((error.data && error.data.error) || error.message);
    capabilityByID.set(router.device_id, { error: `Capability discovery failed: ${message}` });
    renderCapabilityCardSlot(content, router, capabilityByID, "error", message);
  } finally { clearTimeout(bound); }
}

function hubLookupMarkup(peer) {
  const label = peer.handshake_status === "recent_handshake" ? "Recent tunnel handshake"
    : peer.handshake_status === "inactive" ? "Hub connection inactive" : "No recent tunnel handshake";
  return `<strong>${esc(label)}</strong><dl><dt>Tunnel address</dt><dd>${esc(peer.tunnel_address || "Not reported")}</dd><dt>Last handshake</dt><dd>${peer.last_handshake_at ? esc(ts(peer.last_handshake_at)) : "Never observed"}</dd></dl><p class="muted small">Read-only Hub check. This does not verify LAN access or router authentication and does not change the connection.</p>`;
}

function wireHubLookup(content) {
  content.querySelectorAll("button[data-hub-check]").forEach(button => button.addEventListener("click", async () => {
    if (button.disabled || !SITE_EDITOR_ROLES.includes(ME?.user?.user_role)) return;
    const status = button.closest("article").querySelector("[data-hub-status]");
    button.disabled = true;
    button.textContent = "Checking Magic Hub…";
    status.hidden = false;
    status.textContent = "Reading this gateway's Hub connection…";
    try {
      const peer = await MM.get(`/vps/peers/${encodeURIComponent(button.dataset.hubCheck)}/live`);
      if (!status.isConnected) return;
      status.innerHTML = hubLookupMarkup(peer);
    } catch (error) {
      if (!status.isConnected) return;
      const code = error.data?.code;
      status.textContent = ["subscription_required","account_pass_required"].includes(code) ? "Your trial or subscription has ended. Open Store to renew monthly or annual access."
        : code === "plan_required" ? "Magic Hub access is unavailable under the current account policy. Contact support."
        : code === "hub_lookup_disabled" ? "Magic Hub lookup is not enabled for this app."
        : error.status === 404 ? "No verified Magic Hub enrollment was found for this gateway. Open Connect Magic Hub to complete setup."
        : error.message === "unauthorized" ? "Please sign in again to check this gateway."
        : "Magic Hub lookup could not be completed. Verify that this gateway is enrolled and try again. No connection changes were made.";
    } finally {
      if (button.isConnected) { button.disabled = false; button.textContent = "Check Magic Hub"; }
    }
  }));
}

function confirmDeviceRemoval(router) {
  return new Promise(resolve => {
    const previousFocus = document.activeElement;
    const dialog = document.createElement("dialog");
    dialog.className = "app-confirm-dialog";
    dialog.id = "device-removal-dialog";
    dialog.setAttribute("aria-labelledby", "device-removal-title");
    dialog.setAttribute("aria-describedby", "device-removal-description");
    dialog.innerHTML = `<div class="app-confirm-content">
      <span class="app-confirm-kicker">DEVICE MANAGEMENT</span>
      <h2 id="device-removal-title">Delete device record?</h2>
      <div class="app-confirm-device"><strong data-device-name></strong><span data-device-id></span></div>
      <div id="device-removal-description"><p>Associated telemetry, backups and change history may also be deleted. Linked voucher records can prevent deletion.</p>
      <p>This does not reset the physical router or revoke its Magic Hub connection.</p>
      <p class="app-confirm-warning">This action is permanent and cannot be undone.</p></div>
      <div class="app-confirm-actions"><button type="button" class="btn" data-confirm-cancel autofocus>Cancel</button><button type="button" class="btn app-confirm-delete" data-confirm-delete>Delete device record</button></div>
    </div>`;
    dialog.querySelector("[data-device-name]").textContent = router.hardware_name || "Unnamed device";
    dialog.querySelector("[data-device-id]").textContent = "Device ID: " + router.device_id;
    let settled = false;
    const finish = confirmed => {
      if (settled) return;
      settled = true;
      if (dialog.open) dialog.close();
      dialog.remove();
      if (previousFocus?.isConnected) previousFocus.focus({preventScroll:true});
      resolve(confirmed);
    };
    dialog.querySelector("[data-confirm-cancel]").addEventListener("click", () => finish(false));
    dialog.querySelector("[data-confirm-delete]").addEventListener("click", () => finish(true));
    dialog.addEventListener("cancel", event => { event.preventDefault(); finish(false); });
    dialog.addEventListener("close", () => finish(false));
    document.body.appendChild(dialog);
    dialog.showModal();
    dialog.querySelector("[data-confirm-cancel]").focus({preventScroll:true});
  });
}

function wireRouterRemoval(content, main, routers, workspace, onError) {
  content.querySelectorAll("button[data-router-delete]").forEach(button => button.addEventListener("click", async () => {
    if (button.disabled || !SITE_EDITOR_ROLES.includes(ME?.user?.user_role)) return;
    const router = routers.find(item => item.device_id === button.dataset.routerDelete);
    if (!router) return;
    const removalStatus = button.closest("article")?.querySelector("[data-router-removal-status]");
    if (removalStatus) { removalStatus.hidden = true; removalStatus.textContent = ""; }
    button.disabled = true;
    const confirmed = await confirmDeviceRemoval(router);
    if (!confirmed || !content.isConnected || !SITE_EDITOR_ROLES.includes(ME?.user?.user_role)) {
      if (button.isConnected) button.disabled = false;
      return;
    }
    let removed = false;
    try {
      await MM.del(`/routers/${encodeURIComponent(router.device_id)}`);
      removed = true;
      if (content.isConnected) await renderSites(main, workspace);
    } catch (error) {
      if (content.isConnected) {
        const failure = removed ? new Error("The device record was deleted, but the list could not refresh. Reload this page.") : error;
        if (removalStatus?.isConnected) {
          removalStatus.textContent = failure.data?.reason || failure.data?.error || failure.message || "Could not delete the device record. Try again.";
          removalStatus.hidden = false;
          removalStatus.scrollIntoView?.({block:"nearest"});
        }
        onError?.(failure);
      }
    } finally {
      if (!removed && button.isConnected) button.disabled = false;
    }
  }));
}

          <form class="quick-config-form"><label>Router HTTPS management port<input name="management_rest_port" type="number" min="1" max="65535" value="443" required></label>

            <label class="check-label" data-hub-recovery-option hidden><input name="resume_existing" type="checkbox"> Repair installed connection — this RouterBOARD already has its original Magic Hub tunnel. Preserve its router key.</label>
            <p class="muted small">Run the script within 30 minutes. It grants the app management access through the private tunnel.</p>
            <button type="submit" class="btn">Generate one-paste script</button><div role="status" aria-live="polite"></div>
          </form>
          <h3>2. Finish connection</h3><p>After running the entire script in WinBox, verify the connection here. No router username, password or fingerprint entry is needed for automatic setup.</p>
          <button type="button" class="btn" data-hub-finish>Finish connection</button><div data-hub-finish-status role="status" aria-live="polite"></div>
        </details>` : `<div class="notice" role="status"><strong>Magic Hub connection unavailable</strong><p>${esc(hubEnrollmentUnavailableMessage(hubCapability.code))}</p></div>`}</div>` : ""}
      <footer>${canEdit ? `<button class="btn btn-sm" type="button" data-edit="${esc(router.device_id)}">Edit record</button><button class="btn btn-sm" type="button" data-router-delete="${esc(router.device_id)}">Delete device record</button>` : ""}<button class="btn btn-sm" type="button" data-router-topology="${esc(router.device_id)}">Topology</button>${canEdit ? `<button class="btn btn-sm" type="button" data-reboot="${esc(router.device_id)}"${state !== "up" ? " disabled title=\"No verified reachability\"" : ""}>Reboot</button>` : ""}</footer>
      <p class="alert" role="alert" data-router-removal-status hidden></p>
    </article>`;
  }).join("");
  return `<section class="routerboard-console"><header><div><span class="fleet-kicker">ROUTER MANAGEMENT</span><h2>Your router${routers.length === 1 ? "" : "s"}</h2></div></header><div class="routerboard-grid mobile-device-list">${cards}</div></section>`;
}

async function renderSites(main, workspace = location.hash === "#gateways" ? "gateways" : "routers") {
  const gatewayOnly = workspace === "gateways";

  const routers = allRouters.filter(router => gatewayOnly

  let fleet = { peers: [] };
  try { fleet = await MM.get("/fleet/health"); } catch (_) {}
  let hubCapability = {available:false, lookup_enabled:false, code:"capability_unavailable"};

    try { hubCapability = await MM.get("/vps/enrollment-capability"); } catch (_) {}
  }
  const routerStateByID = new Map(asArray(fleet.peers).map(peer => [peer.device_id, String(peer.state || "unknown").toLowerCase()]));
  // Saved gateway cards render immediately; the live capability probes run
  // per card after the page paints, each bounded and retryable on its own.
  const capabilityByID = new Map();
  const capabilityStatusByID = new Map(routers.map(router => [router.device_id, "checking"]));
  // Sites carry the geo data migrated from Mikromagic. Loaded separately so a
  // site-endpoint failure still leaves router management usable.
  let sites = [];
  try { const sr = await MM.get("/sites"); sites = sr.sites || []; } catch (_) {}
  // Saved management connections (also ported) — same defence.
  let conns = [];
  try { const cr = await MM.get("/router-connections"); conns = cr.connections || []; } catch (_) {}
  // Granted capacity + its request workflow.
  let allowance = null, requests = [], allowanceKinds = [];
  if (capacityLimitsEnabled) try {
    const ar = await MM.get("/device-allowances");
    allowance = ar.allowance || null;
    allowanceKinds = ar.kinds || [];
  } catch (_) {}
  if (capacityLimitsEnabled) try { const qr = await MM.get("/device-requests"); requests = qr.requests || []; } catch (_) {}
  if (!content?.isConnected) return;
  const layers = gatewayOnly ? ["MAIN_GATEWAY"] : ["DOWNSTREAM_SWITCH", "ACCESS_POINT", "CONTROLLER"];


  content.innerHTML = `

    ${routerBoardPanel(routers, fleet, capabilityByID, hubCapability, capabilityStatusByID)}
    ${gatewayOnly ? '<div id="hub-management"></div>' : ""}
    <dialog class="router-capability-dialog" id="router-capability-dialog"><div class="router-capability-shell"><button type="button" class="dialog-close" data-capability-close aria-label="Close">×</button><div id="router-capability-content"></div><div class="dialog-actions"><button type="button" class="btn" data-capability-close>Close</button></div></div></dialog>
    ${gatewayOnly ? `<details class="panel"><summary>Connection details</summary>${connPanel(conns)}</details>` : ""}
    ${canEdit ? `<div class="workspace-actions"><button class="btn btn-primary" type="button" id="site-add"${gatewayOnly && !sites.length ? ' disabled' : ''}>${gatewayOnly ? "Add site RouterBOARD" : "Add managed device record"}</button>${gatewayOnly && !sites.length ? '<p><a href="#sites">Add a site first to begin onboarding.</a></p>' : ''}</div>` : ""}
    ${gatewayOnly || !capacityLimitsEnabled ? "" : allowancePanel(allowance)}
    ${gatewayOnly || !capacityLimitsEnabled ? "" : requestPanel(requests)}
    <div class="panel" id="site-form" hidden><div class="panel-head"><h2 class="panel-title">${gatewayOnly ? "Add gateway" : "Add device record"}</h2></div>
      <div class="panel-body record-form-grid">
        <div class="field"><label>${gatewayOnly ? "RouterBOARD name" : "Device name"} *</label><input class="input" id="sr-name"></div>
        ${gatewayOnly ? `<div class="field"><label for="sr-site">Business site *</label><select class="input" id="sr-site" required><option value="">Choose the site you added</option>${sites.map(s=>`<option value="${esc(s.site_id)}">${esc(s.name)}</option>`).join("")}</select></div>` : ''}
        <div class="field"${gatewayOnly ? ' hidden' : ''}><label>Model</label><input class="input" id="sr-model"></div>
        <div class="field"${gatewayOnly ? ' hidden' : ''}><label>Deployment layer</label><select class="input" id="sr-layer">${layers.map(l => `<option value="${l}">${l}</option>`).join("")}</select></div>
        ${gatewayOnly ? '<p class="muted small">Magic Hub assigns the management address automatically. Add your gateway, then run its one-paste connection script.</p>' : '<div class="field"><label>Management IP</label><input class="input" id="sr-ip"></div><div class="field"><label>MAC address</label><input class="input" id="sr-mac"></div>'}
        <button class="btn btn-primary" type="button" id="sr-save">Create device record</button>
        <span id="sr-msg" class="muted small" role="status"></span>
      </div></div>
    <div id="site-alert"></div>
    ${routers.length ? ""
      : gatewayOnly ? '<div class="panel"><div class="panel-body">No gateways registered. Adding a record does not establish a Magic Hub connection; a verified tunnel and router authentication are required before remote management.</div></div>'
      : `<div class="panel"><div class="panel-body">
          <div class="empty"><div class="empty-title">No downstream devices registered</div>Register switches, access points or controllers behind your gateway. Records alone do not connect devices; connector binding and verified authentication are still required.</div>
          <ol style="margin:0 0 4px 18px;line-height:1.9">
            <li><b>Add a device record.</b> Record the device's identity and management address.
              ${canEdit ? '<div style="margin:6px 0 14px"><button class="btn btn-primary" id="wz-add">Add device record</button></div>' : ""}</li>
            <li><b>Step 2 — Verify its connection.</b> A saved device record is not a live connection. Check its management path in Fleet health.
              <div style="margin:6px 0 14px"><button class="btn" id="wz-fleet">See live fleet</button></div></li>
          </ol>
        </div></div>`}`;

  const goView = (name) => {
    location.hash = name;
  };
  if (gatewayOnly && canEdit) await MMRevamp.bindSites(content, sites, MM, () => renderSites(main, workspace));
  const wzAdd = document.getElementById("wz-add");
  if (wzAdd) wzAdd.addEventListener("click", () => {
    document.getElementById("site-form").hidden = false;
    refreshRouterCapacityState();
    document.getElementById("sr-name").focus();
  });
  const wzFleet = document.getElementById("wz-fleet");
  if (wzFleet) wzFleet.addEventListener("click", () => goView("overview"));
  const wzPortal = document.getElementById("wz-portal");
  if (wzPortal) wzPortal.addEventListener("click", () => goView("portal"));

  const alert = (msg) => {
    const el = document.getElementById("site-alert");
