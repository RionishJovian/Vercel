<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mega Magic</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="/assets/css/styles.css">
  <script src="/assets/js/api.js" defer></script>
  <script src="/assets/js/app.js" defer></script>
</head>
<body>
<div class="layout">
  <nav class="rail" aria-label="Primary">
    <div>
      <div class="rail-brand"><span class="dot"></span>Mega Magic</div>
      <div class="rail-sub" id="rail-biz">—</div>
    </div>
    <div class="rail-section">Operations</div>
    <button class="nav-item" data-view="overview" aria-current="page">Overview</button>
    <button class="nav-item" data-view="fleet">Fleet health</button>
    <button class="nav-item" data-view="sites">Sites</button>
    <button class="nav-item" data-view="topology">Topology</button>
    <button class="nav-item" data-view="incidents">Incidents</button>
    <button class="nav-item" data-view="security">Security</button>
    <button class="nav-item" data-view="backups">Backups</button>
    <div class="rail-section">Account</div>
    <button class="nav-item" data-view="vouchers">Vouchers</button>
    <button class="nav-item" data-view="portal">Captive portal</button>
    <button class="nav-item" data-view="team">Team</button>
    <div class="rail-section">Operator</div>
    <button class="nav-item" data-view="platform" id="nav-platform" hidden>Platform</button>
    <div style="flex:1"></div>
    <button class="nav-item" id="signout">Sign out</button>
  </nav>

  <main id="main">
    <noscript>Mega Magic needs JavaScript to run.</noscript>
  </main>
</div>

<script>
const VIEWS = {
  overview: { title: "Overview", lead: "How the fleet is doing, at a glance." },
  fleet:    { title: "Fleet health", lead: "Every peer and its tunnel state." },
  sites:    { title: "Sites", lead: "Routers and gateways by layer." },
  topology: { title: "Topology", lead: "The live network map." },
  incidents:{ title: "Incidents", lead: "Problems detected across the fleet." },
  security: { title: "Security", lead: "RouterOS version posture — affected vs safe." },
  backups:  { title: "Backups", lead: "Config snapshots, change history and one-click restore." },
  vouchers: { title: "Vouchers", lead: "Credit codes for the captive portal." },
  portal:   { title: "Captive portal", lead: "Guest Wi-Fi config and requests." },
  team:     { title: "Team", lead: "Who can access this business, and with which role." },
  platform: { title: "Platform", lead: "Cross-tenant operator view — every business, one lens." },
};

let ME = null;

async function loadView(name, main, me) {
  const v = VIEWS[name] || VIEWS.overview;
  main.innerHTML = `<div class="page-head"><div><h1 class="page-title">${v.title}</h1><p class="page-lead">${v.lead}</p></div></div><div id="content">${loading()}</div>`;
  try {
    if (name === "overview") await renderOverview(main);
    else if (name === "fleet") await renderFleet(main);
    else if (name === "sites") await renderSites(main);
    else if (name === "topology") await renderTopology(main);
    else if (name === "incidents") await renderIncidents(main);
    else if (name === "security") await renderSecurity(main);
    else if (name === "backups") await renderBackups(main);
    else if (name === "vouchers") await renderVouchers(main);
    else if (name === "portal") await renderPortal(main);
    else if (name === "team") await renderTeam(main);
    else if (name === "platform") await renderPlatform(main);
  } catch (err) {
    main.querySelector("#content").innerHTML = `<div class="alert" role="alert">${esc(err.message)}</div>`;
  }
}

function loading() { return `<p class="muted small">Loading…</p>`; }

/* ---------- Overview ---------- */
async function renderOverview(main) {
  const fleet = await MM.get("/fleet/health");
  const topo = await MM.get("/topology/map");
  const content = main.querySelector("#content");
  content.innerHTML = `
    <div class="stat-cluster" style="margin-top:18px">
      <div class="stat"><div class="stat-label">Peers</div><div class="stat-value">${fleet.total_peers}</div></div>
      <div class="stat"><div class="stat-label">Up</div><div class="stat-value">${fleet.up}</div></div>
      <div class="stat"><div class="stat-label">Stale</div><div class="stat-value">${fleet.stale}</div></div>
      <div class="stat"><div class="stat-label">Offline</div><div class="stat-value">${fleet.offline}</div></div>
      <div class="stat"><div class="stat-label">Unknown</div><div class="stat-value">${fleet.unknown}</div></div>
    </div>
    <hr class="rule">
    <div class="panel"><div class="panel-head"><h2 class="panel-title">Fleet state</h2></div>
      <div class="panel-body" id="ov-fleet">${loading()}</div>
    </div>
    <div class="panel" style="margin-top:14px"><div class="panel-head"><h2 class="panel-title">Network map</h2></div>
      <div class="panel-body" id="ov-topo">${loading()}</div>
    </div>`;
  document.querySelector("#ov-fleet").innerHTML = fleetTable(fleet);
  document.querySelector("#ov-topo").innerHTML = topologySummary(topo);
}

/* ---------- Fleet ---------- */
async function renderFleet(main) {
  const fleet = await MM.get("/fleet/health");
  main.querySelector("#content").innerHTML = fleetTable(fleet);
}

function fleetTable(fleet) {
  if (!fleet.peers || !fleet.peers.length) return `<div class="empty"><div class="empty-title">No peers yet</div>Provision a router to see it here.</div>`;
  const rows = fleet.peers.map(p => `
    <tr>
      <td><span class="num">${esc(p.hardware_name)}</span></td>
      <td>${badge(p.state)}</td>
      <td class="mono">${esc(p.device_id)}</td>
    </tr>`).join("");
  return `<table>
    <thead><tr><th>Device</th><th>State</th><th>ID</th></tr></thead>
    <tbody>${rows}</tbody></table>`;
}

/* ---------- Sites (routers) ---------- */
async function renderSites(main) {
  const data = await MM.get("/routers");
  const routers = data.routers || data || [];
  if (!routers.length) {
    main.querySelector("#content").innerHTML = `<div class="empty"><div class="empty-title">No sites</div>Add a router to start mapping sites.</div>`;
    return;
  }
  const rows = routers.map(r => `
    <tr>
      <td><span class="num">${esc(r.hardware_name)}</span></td>
      <td><span class="mono">${esc(r.deployment_layer)}</span></td>
      <td>${esc(r.vendor)}</td>
      <td>${badge(r.is_online ? "up" : "offline")}</td>
      <td class="mono">${esc(r.device_id)}</td>
    </tr>`).join("");
  main.querySelector("#content").innerHTML = `<table>
    <thead><tr><th>Device</th><th>Layer</th><th>Vendor</th><th>Status</th><th>ID</th></tr></thead>
    <tbody>${rows}</tbody></table>`;
}

/* ---------- Topology ---------- */
async function renderTopology(main) {
  const topo = await MM.get("/topology/map");
  const content = main.querySelector("#content");
  content.innerHTML = `<div id="topo-tree">${loading()}</div>`;
  content.querySelector("#topo-tree").innerHTML = topologyTree(topo);
}

function deviceLabel(d) {
  const st = d.is_online ? "up" : "offline";
  return `<div class="dev ${st}" title="${esc(d.device_id)}">${esc((d.hardware_name||"D")[0])}</div>`;
}

function topologySummary(topo) {
  const count = (topo.roots ? topo.roots.length : 0) + (topo.orphans ? topo.orphans.length : 0);
  const s = topo.summary || {};
  return `<div class="muted small">${count} device${count === 1 ? "" : "s"} · ${esc(topo.business_id)}</div>`;
}

function topologyTree(topo) {
  const roots = topo.roots || [];
  if (!roots.length) return `<div class="empty"><div class="empty-title">Empty map</div>No devices have reported a topology yet.</div>`;
  const render = (node, depth) => {
    const d = node.device || {};
    const kids = (node.children || []).map(c => render(c, depth + 1)).join("");
    const pad = "&nbsp;".repeat(depth * 4);
    const caret = node.children && node.children.length ? (node.expanded ? "▾" : "▸") : "·";
    return `<div style="display:flex;gap:8px;align-items:center;margin-bottom:4px"><span class="mono small">${pad}${caret}</span>${deviceLabel(d)}<span class="num" style="flex:1">${esc(d.hardware_name||"(device)")}</span><span class="muted small">${esc(d.deployment_layer||"")}</span>${node.children && node.children.length ? `<span class="muted small">${node.children.length} child${node.children.length===1?"":"ren"}</span>` : ""}</div>${kids}`;
  };
  return `<div>${roots.map(r => render(r, 0)).join("")}</div>`;
}

/* ---------- Incidents ---------- */
async function renderIncidents(main) {
  const data = await MM.get("/incidents");
  const list = data.incidents || data || [];
  const content = main.querySelector("#content");
  if (!list.length) {
    content.innerHTML = `<div class="empty"><div class="empty-title">No open incidents</div>AI-detected problems and policy alerts will appear here.</div>`;
    return;
  }
  const sevBadge = (s) => {
    const m = { critical: "bad", warning: "warn" }[String(s).toLowerCase()] || "unknown";
    return `<span class="status ${m}">${esc(s)}</span>`;
  };
  const rows = list.map(inc => `
    <tr>
      <td>${sevBadge(inc.severity || "info")}</td>
      <td><span class="mono">${esc(inc.kind)}</span></td>
      <td><span class="num">${esc(inc.subject_label || inc.subject_id || "—")}</span></td>
      <td class="muted small">${esc((inc.detail && inc.detail.replace(/\s+/g," ")) ? inc.detail.slice(0,80) : "—")}</td>
      <td>${ts(inc.opened_at)}</td>
      <td>
        <button class="btn btn-sm" data-act="ack" data-id="${esc(inc.id)}">Acknowledge</button>
        <button class="btn btn-sm" data-act="resolve" data-id="${esc(inc.id)}">Resolve</button>
      </td>
    </tr>`).join("");
  content.innerHTML = `<table>
    <thead><tr><th>Severity</th><th>Kind</th><th>Subject</th><th>Detail</th><th>Opened</th><th></th></tr></thead>
    <tbody>${rows}</tbody></table>`;
  content.querySelectorAll("button[data-act]").forEach(btn => {
    btn.addEventListener("click", async () => {
      const id = btn.dataset.id, act = btn.dataset.act;
      btn.disabled = true; btn.textContent = "…";
      try {
        await MM.post(`/incidents/${encodeURIComponent(id)}/${act}`);
        await renderIncidents(main);
      } catch (e) {
        btn.disabled = false; btn.textContent = "Retry";
        content.appendChild(Object.assign(document.createElement("div"), { className: "alert", textContent: e.message }));
      }
    });
  });
}

async function renderVouchers(main) {
  const data = await MM.get("/vouchers");
  const list = data.vouchers || data || [];
  if (!list.length) {
    main.querySelector("#content").innerHTML = `<div class="empty"><div class="empty-title">No vouchers</div>Create a voucher batch to sell portal access.</div>`;
    return;
  }
  const rows = list.slice(0, 50).map(v => `
    <tr>
      <td class="mono">${esc(v.code)}</td>
      <td>${v.plan_key ? esc(v.plan_key) : "—"}</td>
      <td class="num">${esc(v.amount)}</td>
      <td>${badge((v.status||"unknown").toLowerCase())}</td>
      <td>${ts(v.created_at)}</td>
    </tr>`).join("");
  main.querySelector("#content").innerHTML = `<table>
    <thead><tr><th>Code</th><th>Plan</th><th>Amount</th><th>Status</th><th>Created</th></tr></thead>
    <tbody>${rows}</tbody></table>`;
}

/* ---------- Captive portal ---------- */
async function renderPortal(main) {
  let cfg = null, cfgErr = null;
  try { cfg = await MM.get("/portal/config"); } catch (e) { cfgErr = e.data || e.message; }
  let reqs = [], reqErr = null;
  try {
    const r = await MM.get("/billing/requests"); reqs = r.requests || r || [];
  } catch (e) { reqErr = e.data || e.message; }

  let html = `<div class="panel"><div class="panel-head"><h2 class="panel-title">Portal configuration</h2></div><div class="panel-body">`;
  if (cfg) {
    html += `<table><tbody>` +
      `<tr><td>Business</td><td class="num">${esc(cfg.business_name||"—")}</td></tr>` +
      `<tr><td>Grace window</td><td class="num">${esc(cfg.guest_grace_minutes||"—")} min</td></tr>` +
      `</tbody></table>`;
  } else if (cfgErr) { html += `<p class="muted small">${esc(cfgErr)}</p>`; }

  // Guest data plans — owner-set price (MMK) + data per location. Editable so
  // each hotspot owner prices their own market (no global pricing rule).
  const plans = (cfg && cfg.guest_plans) || [];
  html += `<h3 class="small" style="margin:14px 0 6px">MMQR payment QR<span class="muted"> — image URL guests scan to pay by bank</span></h3>`;
  html += `<input id="mmqr-url" value="${esc((cfg&&cfg.mmqr_url)||"")}" placeholder="https://…/mmqr.jpg or /assets/mmqr.jpg" style="width:100%">`;
  html += `<div class="form-row" style="margin-top:10px"><label>Trial window (minutes guests get to pay)</label><input id="grace-min" type="number" min="0" value="${(cfg&&cfg.guest_grace_minutes)||10}" style="width:120px"></div>`;
  html += `<h3 class="small" style="margin:14px 0 6px">Guest data plans</h3>`;
  html += `<table id="plans-table"><thead><tr><th>Key</th><th>Label</th><th>Minutes</th><th>Price (MMK)</th><th>Data (MB)</th><th></th></tr></thead><tbody>`;
  plans.forEach((p, i) => {
    html += `<tr id="plan-${i}">` +
      `<td><input data-k="key" value="${esc(p.key||"")}"></td>` +
      `<td><input data-k="label" value="${esc(p.label||"")}"></td>` +
      `<td><input type="number" data-k="minutes" min="0" value="${p.minutes||0}"></td>` +
      `<td><input type="number" data-k="amount" min="0" value="${p.amount||0}"></td>` +
      `<td><input type="number" data-k="data_mb" min="0" value="${p.data_mb||0}"></td>` +
      `<td><button class="btn-sm" data-act="del" data-i="${i}">Remove</button></td></tr>`;
  });
  html += `</tbody></table>`;
  html += `<div style="margin-top:8px;display:flex;gap:8px"><button class="btn-sm" id="plan-add">+ Add plan</button>` +
    `<button class="btn-sm" id="plan-save">Save plans</button><span id="plan-msg" class="muted small"></span></div>`;
  html += `</div></div>`;

  html += `<div class="panel" style="margin-top:14px"><div class="panel-head"><h2 class="panel-title">Guest purchase requests</h2></div><div class="panel-body">`;
  if (reqErr) html += `<p class="muted small">${esc(reqErr)}</p>`;
  else if (!reqs.length) html += `<div class="empty"><div class="empty-title">No requests</div>Guest purchases and redemptions will appear here.</div>`;
  else html += `<table><thead><tr><th>MAC</th><th>Plan</th><th>Phone</th><th>Last 6</th><th>Status</th><th>Submitted</th></tr></thead><tbody>` +
    reqs.slice(0, 30).map(r => `<tr><td class="mono">${esc(r.client_mac||"—")}</td><td class="num">${esc(r.plan_key||"—")}</td><td class="mono">${esc(r.paid_phone||"—")}</td><td class="mono">${esc(r.tx_last6||"—")}</td><td>${badge((r.status||"unknown").toLowerCase())}</td><td>${ts(r.created_at)}</td></tr>`).join("") +
    `</tbody></table>`;
  html += `</div></div>`;

  main.querySelector("#content").innerHTML = html;

  // Plan editor wiring (add / remove / save).
  const plansTbl = main.querySelector("#plans-table");
  const msgEl = () => main.querySelector("#plan-msg");
  const collect = () => {
    const out = [];
    plansTbl.querySelectorAll("tbody tr").forEach(tr => {
      const o = {};
      tr.querySelectorAll("input[data-k]").forEach(inp => { o[inp.dataset.k] = inp.type === "number" ? parseInt(inp.value||"0",10) : (inp.value||"").trim(); });
      out.push(o);
    });
    return out;
  };
  const save = async () => {
    msgEl().textContent = "Saving…";
    try {
      const plans = collect();
      // Preserve every existing portal field; only plans/QR change here.
      const body = Object.assign({}, cfg, {
        guest_plans: plans,
        mmqr_url: (main.querySelector("#mmqr-url")?.value || String(cfg.mmqr_url||"")).trim(),
        guest_grace_minutes: parseInt(main.querySelector("#grace-min")?.value || cfg.guest_grace_minutes || "10", 10),
      });
      await MM.put("/portal/config", body);
      msgEl().textContent = "Saved.";
      await loadView("portal", main, ME);
    } catch (e) { msgEl().textContent = "Save failed: " + (e.message||""); }
  };
  const addBtn = main.querySelector("#plan-add");
  if (addBtn) addBtn.addEventListener("click", () => {
    const tr = document.createElement("tr");
    tr.innerHTML = `<td><input data-k="key"></td><td><input data-k="label"></td><td><input type="number" data-k="minutes" min="0" value="0"></td><td><input type="number" data-k="amount" min="0" value="0"></td><td><input type="number" data-k="data_mb" min="0" value="0"></td><td><button class="btn-sm" data-act="del">Remove</button></td>`;
    plansTbl.querySelector("tbody").appendChild(tr);
  });
  const saveBtn = main.querySelector("#plan-save");
  if (saveBtn) saveBtn.addEventListener("click", save);
  plansTbl.querySelectorAll("button[data-act=del]").forEach(b => b.addEventListener("click", () => b.closest("tr").remove()));
}

/* ---------- Security (C1 posture) ---------- */
async function renderSecurity(main) {
  const data = await MM.get("/security/posture");
  const devices = data.devices || [];
  const content = main.querySelector("#content");

  if (!devices.length) {
    content.innerHTML = `<div class="empty"><div class="empty-title">No posture data yet</div>RouterOS versions are captured on each device's next evaluation.</div>`;
    return;
  }

  const rank = { affected: 0, unknown: 1, safe: 2 };
  const sorted = devices.slice().sort((a, b) => (rank[a.posture] ?? 9) - (rank[b.posture] ?? 9));
  const postureBadge = (p) => {
    const m = { affected: "bad", safe: "ok", unknown: "unknown" }[p] || "unknown";
    const label = { affected: "Affected", safe: "Safe", unknown: "Unknown" }[p] || "Unknown";
    return `<span class="status ${m}">${label}</span>`;
  };

  const rows = sorted.map(d => `
    <tr>
      <td>${postureBadge(d.posture)}</td>
      <td><span class="num">${esc(d.hardware_name)}</span></td>
      <td class="mono">${d.routeros_version ? esc(d.routeros_version) : "—"}</td>
      <td class="muted small">${d.routeros_channel ? esc(d.routeros_channel) : "—"}</td>
      <td>${ts(d.version_checked_at)}</td>
    </tr>`).join("");

  content.innerHTML = `
    <div class="stat-cluster" style="margin-top:18px">
      <div class="stat"><div class="stat-label">Affected</div><div class="stat-value">${data.affected ?? 0}</div></div>
      <div class="stat"><div class="stat-label">Safe</div><div class="stat-value">${data.safe ?? 0}</div></div>
      <div class="stat"><div class="stat-label">Unknown</div><div class="stat-value">${data.unknown ?? 0}</div></div>
    </div>
    <hr class="rule">
    <table>
      <thead><tr><th>Posture</th><th>Device</th><th>RouterOS</th><th>Channel</th><th>Checked</th></tr></thead>
      <tbody>${rows}</tbody></table>`;
}

/* ---------- Team (C3) ---------- */
const TEAM_ROLES = ["OWNER", "ADMIN", "OPERATOR", "TECHNICIAN", "VIEWER", "SUPPORT"];

async function renderTeam(main) {
  const content = main.querySelector("#content");
  let team = [];
  try {
    const r = await MM.get("/team");
    team = r.team || [];
  } catch (e) {
    if (e.status === 403) {
      content.innerHTML = `<div class="panel"><div class="panel-body"><div class="empty"><div class="empty-title">Owner access required</div>Only the business owner can manage team roles.</div></div></div>`;
      return;
    }
    throw e;
  }

  const roleOpts = (sel) => TEAM_ROLES.map(r => `<option value="${r}"${r === sel ? " selected" : ""}>${r}</option>`).join("");
  const rows = team.map(u => `
    <tr>
      <td><span class="num">${esc(u.full_name)}</span></td>
      <td class="mono">${esc(u.email)}</td>
      <td><select class="input" data-role="${esc(u.user_id)}" style="width:auto;padding:3px 6px">${roleOpts(u.user_role)}</select></td>
      <td>${u.is_active ? `<span class="status ok">Active</span>` : `<span class="status unknown">Disabled</span>`}</td>
      <td><button class="btn btn-sm" data-save="${esc(u.user_id)}">Save</button>
          <button class="btn btn-sm" data-disable="${esc(u.user_id)}"${u.is_active ? "" : " disabled"}>Disable</button></td>
    </tr>`).join("");

  content.innerHTML = `
    <div class="panel"><div class="panel-head"><h2 class="panel-title">Team</h2></div>
      <div class="panel-body">${team.length ? `<table><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th></th></tr></thead><tbody>${rows}</tbody></table>` : `<div class="empty"><div class="empty-title">No team members</div>Add a staff user below.</div>`}</div></div>
    <div class="panel" style="margin-top:14px"><div class="panel-head"><h2 class="panel-title">Add team member</h2></div>
      <div class="panel-body">
        <div class="field"><label>Full name</label><input class="input" id="tm-name"></div>
        <div class="field"><label>Email</label><input class="input" id="tm-email" type="email"></div>
        <div class="field"><label>Password (8+ chars)</label><input class="input" id="tm-pass" type="password"></div>
        <div class="field"><label>Role</label><select class="input" id="tm-role">${roleOpts("OPERATOR")}</select></div>
        <button class="btn btn-primary" id="tm-add">Add member</button>
        <span id="tm-msg" class="muted small"></span>
      </div></div>`;

  const msg = (t) => { document.getElementById("tm-msg").textContent = t; };
  const fail = (e) => { content.prepend(Object.assign(document.createElement("div"), { className: "alert", textContent: (e.data && e.data.error) ? e.data.error : e.message })); };

  content.querySelectorAll("button[data-save]").forEach(btn => btn.addEventListener("click", async () => {
    const id = btn.dataset.save;
    const role = content.querySelector(`select[data-role="${id}"]`).value;
    try { await MM.put(`/team/${encodeURIComponent(id)}`, { user_role: role }); await renderTeam(main); }
    catch (e) { btn.disabled = false; fail(e); }
  }));
  content.querySelectorAll("button[data-disable]").forEach(btn => btn.addEventListener("click", async () => {
    try { await MM.del(`/team/${encodeURIComponent(btn.dataset.disable)}`); await renderTeam(main); }
    catch (e) { fail(e); }
  }));
  document.getElementById("tm-add").addEventListener("click", async () => {
    const body = {
      full_name: document.getElementById("tm-name").value,
      email: document.getElementById("tm-email").value,
      password: document.getElementById("tm-pass").value,
      user_role: document.getElementById("tm-role").value,
    };
    try { await MM.post("/team", body); await renderTeam(main); }
    catch (e) { fail(e); }
  });
}

/* ---------- Backups (C2) ---------- */
async function renderBackups(main) {
  const content = main.querySelector("#content");
  const data = await MM.get("/routers");
  const devices = data.routers || data || [];
  if (!devices.length) {
    content.innerHTML = `<div class="empty"><div class="empty-title">No devices</div>Add a router to enable backups.</div>`;
    return;
  }
  content.innerHTML = `
    <div class="panel"><div class="panel-head"><h2 class="panel-title">Device</h2></div>
      <div class="panel-body">
        <select class="input" id="bk-dev">${devices.map(d => `<option value="${esc(d.device_id)}">${esc(d.hardware_name || d.device_id)}</option>`).join("")}</select>
        <div style="margin-top:12px;display:flex;gap:8px">
          <button class="btn btn-primary" id="bk-capture">Capture backup</button>
        </div>
      </div>
    </div>
    <div class="panel" style="margin-top:14px"><div class="panel-head"><h2 class="panel-title">Backups</h2></div>
      <div class="panel-body" id="bk-list">${loading()}</div></div>
    <div class="panel" style="margin-top:14px"><div class="panel-head"><h2 class="panel-title">Change history</h2></div>
      <div class="panel-body" id="bk-hist">${loading()}</div></div>`;

  const dev = () => document.getElementById("bk-dev").value;
  const refresh = async () => {
    document.getElementById("bk-list").innerHTML = loading();
    document.getElementById("bk-hist").innerHTML = loading();
    let backups = [], changes = [];
    try { const r = await MM.get(`/devices/${encodeURIComponent(dev())}/backups`); backups = r.backups || []; }
    catch (e) { document.getElementById("bk-list").innerHTML = `<p class="muted small">${esc(e.data && e.data.error ? e.data.error : e.message)}</p>`; }
    try { const r = await MM.get(`/devices/${encodeURIComponent(dev())}/changes`); changes = r.changes || []; }
    catch (_) {}

    const list = document.getElementById("bk-list");
    if (backups && backups.length) {
      list.innerHTML = `<table><thead><tr><th>Label</th><th>Kind</th><th>Size</th><th>Created</th><th></th></tr></thead><tbody>` +
        backups.map(b => `<tr>
          <td><span class="num">${esc(b.label || "—")}</span></td>
          <td class="mono">${esc(b.kind)}</td>
          <td class="num">${esc(b.size_bytes)}</td>
          <td>${ts(b.created_at)}</td>
          <td><button class="btn btn-sm" data-restore="${esc(b.id)}">Restore</button></td>
        </tr>`).join("") + `</tbody></table>`;
      list.querySelectorAll("button[data-restore]").forEach(btn => {
        btn.addEventListener("click", async () => {
          const otp = prompt("Enter OTP for this high-risk restore:");
          if (otp === null) return;
          btn.disabled = true; btn.textContent = "…";
          try {
            await MM.post(`/devices/${encodeURIComponent(dev())}/restore/${encodeURIComponent(btn.dataset.restore)}`, { otp });
            btn.textContent = "Restored";
          } catch (e) {
            btn.disabled = false; btn.textContent = "Restore";
            list.appendChild(Object.assign(document.createElement("div"), { className: "alert", textContent: (e.data && e.data.error) ? e.data.error : e.message }));
          }
        });
      });
    } else if (list) {
      list.innerHTML = `<div class="empty"><div class="empty-title">No backups</div>Capture a backup to snapshot this device's config.</div>`;
    }

    const hist = document.getElementById("bk-hist");
    if (changes && changes.length) {
      hist.innerHTML = `<table><thead><tr><th>When</th><th>Role</th><th>Action</th><th>Reason</th></tr></thead><tbody>` +
        changes.map(ch => `<tr><td>${ts(ch.timestamp)}</td><td class="mono">${esc(ch.user_role)}</td><td class="mono">${esc(ch.action)}</td><td class="muted small">${esc(ch.reason)}</td></tr>`).join("") +
        `</tbody></table>`;
    } else if (hist) {
      hist.innerHTML = `<div class="empty"><div class="empty-title">No changes yet</div>Backups and restores will appear here.</div>`;
    }
  };

  document.getElementById("bk-dev").addEventListener("change", refresh);
  document.getElementById("bk-capture").addEventListener("click", async () => {
    const btn = document.getElementById("bk-capture");
    btn.disabled = true; btn.textContent = "Capturing…";
    try { await MM.post(`/devices/${encodeURIComponent(dev())}/backups`, {}); }
    catch (e) { main.querySelector("#content").prepend(Object.assign(document.createElement("div"), { className: "alert", textContent: (e.data && e.data.error) ? e.data.error : e.message })); }
    btn.disabled = false; btn.textContent = "Capture backup";
    await refresh();
  });

  await refresh();
}

/* ---------- Platform (DEVELOPER) ---------- */
function sevBadge(s) {
  const m = { critical: "bad", warning: "warn", warn: "warn", info: "unknown" }[String(s).toLowerCase()] || "unknown";
  return `<span class="status ${m}">${esc(s || "info")}</span>`;
}

function bizName(bizs, id) {
  const b = (bizs || []).find(x => x.business_id === id);
  return b ? b.company_name : (id || "—");
}

async function renderPlatform(main) {
  const content = main.querySelector("#content");
  let businesses = [], incidents = [], counts = {};
  try {
    const [b, c, i] = await Promise.all([
      MM.get("/platform/businesses"),
      MM.get("/platform/incidents/counts"),
      MM.get("/platform/incidents"),
    ]);
    businesses = (b && (b.businesses || b)) || [];
    counts = (c && c.counts) || {};
    incidents = (i && (i.incidents || i)) || [];
  } catch (e) {
    if (e.status === 403) {
      content.innerHTML = `<div class="panel"><div class="panel-body">
        <div class="empty"><div class="empty-title">Developer access required</div>
        This console is limited to platform operators. Ask the platform owner for a DEVELOPER token.</div></div></div>`;
      return;
    }
    throw e;
  }

  content.innerHTML = `
    <div class="stat-cluster" style="margin-top:18px">
      <div class="stat"><div class="stat-label">Businesses</div><div class="stat-value">${businesses.length}</div></div>
      <div class="stat"><div class="stat-label">Open incidents</div><div class="stat-value">${counts.open ?? 0}</div></div>
      <div class="stat"><div class="stat-label">Resolved</div><div class="stat-value">${counts.resolved ?? 0}</div></div>
    </div>
    <hr class="rule">
    <div class="panel"><div class="panel-head"><h2 class="panel-title">Businesses</h2></div>
      <div class="panel-body">${platformBusinessTable(businesses)}</div></div>
    <div class="panel" style="margin-top:14px"><div class="panel-head"><h2 class="panel-title">Open incidents</h2></div>
      <div class="panel-body">${platformIncidentTable(incidents, businesses)}</div></div>`;
}

function platformBusinessTable(bizs) {
  if (!bizs.length) return `<div class="empty"><div class="empty-title">No businesses</div>No tenants are registered yet.</div>`;
  const rows = bizs.map(b => `
    <tr>
      <td><span class="num">${esc(b.company_name)}</span></td>
      <td>${esc(b.owner_email)}</td>
      <td><span class="mono">${esc(b.access_tier)}</span></td>
      <td class="num">${esc(b.device_quota_limit)}</td>
      <td>${b.is_active ? `<span class="status ok">Active</span>` : `<span class="status unknown">Inactive</span>`}</td>
      <td>${ts(b.created_at)}</td>
    </tr>`).join("");
  return `<table><thead><tr><th>Company</th><th>Owner</th><th>Tier</th><th>Device limit</th><th>Status</th><th>Created</th></tr></thead><tbody>${rows}</tbody></table>`;
}

function platformIncidentTable(list, bizs) {
  if (!list.length) return `<div class="empty"><div class="empty-title">No open incidents</div>Cross-tenant incidents will appear here.</div>`;
  const rows = list.map(inc => `
    <tr>
      <td>${sevBadge(inc.severity || "info")}</td>
      <td><span class="mono">${esc(inc.kind)}</span></td>
      <td><span class="num">${esc(bizName(bizs, inc.business_id))}</span></td>
      <td><span class="num">${esc(inc.subject_label || inc.subject_id || "—")}</span></td>
      <td>${ts(inc.opened_at)}</td>
    </tr>`).join("");
  return `<table><thead><tr><th>Severity</th><th>Kind</th><th>Business</th><th>Subject</th><th>Opened</th></tr></thead><tbody>${rows}</tbody></table>`;
}

/* ---------- Boot ---------- */
(async () => {
  const me = await whoami();
  if (!me) return;
  ME = me;
  document.querySelector("#rail-biz").textContent = (me.business && me.business.company_name) || "—";
  // The Platform console is DEVELOPER-only: reveal the rail item only for that role.
  if (me.user && me.user.user_role === "DEVELOPER") {
    const navP = document.getElementById("nav-platform");
    if (navP) navP.hidden = false;
  }
  const main = document.getElementById("main");

  const go = async (name) => {
    document.querySelectorAll(".nav-item[data-view]").forEach(b => b.removeAttribute("aria-current"));
    const btn = document.querySelector(`.nav-item[data-view="${name}"]`);
    if (btn) btn.setAttribute("aria-current", "page");
    history.pushState({}, "", "/#" + name);
    await loadView(name, main, ME);
  };

  document.querySelectorAll(".nav-item[data-view]").forEach(b => {
    b.addEventListener("click", () => go(b.dataset.view));
  });
  document.getElementById("signout").addEventListener("click", () => { MM.clear(); location.href = "/"; });
  window.addEventListener("popstate", () => {
    const v = location.hash.slice(1);
    loadView(VIEWS[v] ? v : "overview", main, ME);
  });

  const initial = location.hash.slice(1);
  await loadView(VIEWS[initial] ? initial : "overview", main, ME);
})();
</script>
