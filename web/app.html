/* ---------- Portal branding editor + live preview ---------- */

/** <input type="color"> only accepts #rrggbb, so a stored #rgb or a junk value
 *  must fall back rather than render an unusable swatch. */
function hexOr(v, fallback) {
  const s = String(v == null ? "" : v).trim();
  return /^#[0-9a-fA-F]{6}$/.test(s) ? s : fallback;
}

// Configs saved before access-method selection existed have no flags. Treat
// those historical rows as both enabled until the owner makes an explicit
// choice, matching the database migration defaults.
function portalMethodEnabled(cfg, key) {
  return !cfg || typeof cfg[key] !== "boolean" ? true : cfg[key];
}

/** Mounts the editor against the REAL guest portal in an iframe. The frame is the
 *  production page in preview mode, so what the operator sees is what guests get
 *  — there is no second copy of the portal markup to drift out of date. */
function wirePortalBranding(main, cfg, collect, plansTbl) {
  const frame = main.querySelector("#pb-frame");
  if (!frame) return;
  const q = id => main.querySelector("#" + id);
  const val = id => { const e = q(id); return e ? e.value.trim() : ""; };
  const numOf = id => { const e = q(id); return e ? (parseInt(e.value, 10) || 0) : 0; };
  let lang = "en";
  const draft = () => {
    const enteredPlans = (typeof collect === "function" ? collect() : ((cfg && cfg.guest_plans) || []));
    const hasPlans = enteredPlans.some(p => p && (p.key || p.label || p.minutes || p.amount || p.data_mb));
    return {
    // Empty fields get representative PREVIEW values so a new tenant can see
    // the finished guest experience before saving anything. These values exist
    // only in the postMessage payload and never reach the API.
    business_name: val("pb-name") || "Your WiFi",
    welcome_text: val("pb-welcome") || "Fast, secure internet for your stay.",
    terms_text: val("pb-terms") || "One plan connects one device.",
    primary_hex: val("pb-primary-hex"), glass_tint_hex: val("pb-tint-hex"),
    bank_name: val("pb-bank-name"), bank_holder: val("pb-bank-holder"), bank_account: val("pb-bank-acc"),
    mmqr_url: val("mmqr-url"), guest_grace_minutes: numOf("grace-min"), guest_grace_data_mb: numOf("grace-data"),
    voucher_login_enabled: q("portal-voucher-enabled") ? q("portal-voucher-enabled").checked : portalMethodEnabled(cfg, "voucher_login_enabled"),
    mobile_payment_enabled: q("portal-payment-enabled") ? q("portal-payment-enabled").checked : portalMethodEnabled(cfg, "mobile_payment_enabled"),
    guest_plans: hasPlans ? enteredPlans : [
      { key: "preview-hour", label: "1 Hour WiFi", minutes: 60, amount: 1000, data_mb: 1024 },
      { key: "preview-day", label: "Day Pass", minutes: 1440, amount: 3500, data_mb: 5120 },
    ],
    consent_required: !!cfg?.consent_required, consent_text: cfg?.consent_text || "",
    preview_sample: !hasPlans,
  }; };
  const routerFrame = main.querySelector("#pb-router-frame");
  const target = main.querySelector("#pb-preview-target");
  const routerStatus = main.querySelector("#pb-router-preview-status");
  let routerPreviewTimer, routerPreviewRevision = 0;
  const updateRouterPreview = () => {
    if (!routerFrame || !document.body.contains(routerFrame) || target?.value !== "router") return;
    const revision = ++routerPreviewRevision;
    clearTimeout(routerPreviewTimer);
    routerStatus.textContent = "Preparing router voucher preview…";
    routerPreviewTimer = setTimeout(async () => {
      try {
        const response = await MM.post("/portal/router-preview", draft());
        if (revision !== routerPreviewRevision || !document.body.contains(routerFrame)) return;
        if (typeof response.html !== "string") throw Error("Preview is unavailable.");
        routerFrame.srcdoc = response.html;
        routerStatus.textContent = "Draft preview only. Review deployment to see this gateway’s saved guest-visible design.";
      } catch (_) {
        if (revision === routerPreviewRevision && document.body.contains(routerFrame)) {
          routerFrame.removeAttribute("srcdoc");
          routerStatus.textContent = "Router preview could not load. Retry by editing a field or switching the preview destination.";
        }
      }
    }, 200);
  };
  if (target) target.addEventListener("change", () => {
    ++routerPreviewRevision;
    routerFrame.hidden = target.value !== "router";
    frame.hidden = target.value === "router";
    const controls = main.querySelector(".pv-lang-controls");
    if (controls) controls.hidden = target.value === "router";
    if (routerStatus) routerStatus.hidden = target.value !== "router";
    updateRouterPreview();
  });
  if (target) {
    const controls = main.querySelector(".pv-lang-controls");
    if (controls) controls.hidden = true;
    updateRouterPreview();
  }
  const push = () => {
    updateRouterPreview();
    if (!frame.contentWindow || !document.body.contains(frame)) return;
    frame.contentWindow.postMessage({ type: "mm-portal-preview", config: draft(), lang }, location.origin);
  };
  // The frame announces when it is listening; a frame left over from a previous
  // view is ignored so window-level listeners cannot accumulate across views.
  window.addEventListener("message", ev => {
    if (ev.origin !== location.origin || !ev.data) return;
    if (ev.data.type !== "mm-portal-preview-ready") return;
    if (!document.body.contains(frame)) return;
    push();
  });
  ["pb-name","pb-welcome","pb-terms","pb-bank-name","pb-bank-holder","pb-bank-acc","mmqr-url","pb-media-host","pb-media-port","grace-min","grace-data"]
    .forEach(id => { const e = q(id); if (e) e.addEventListener("input", push); });
  ["portal-voucher-enabled", "portal-payment-enabled"]
    .forEach(id => { const e = q(id); if (e) e.addEventListener("change", push); });
  const syncColor = (pick, hex) => {
    const p = q(pick), h = q(hex);
    if (!p || !h) return;
    p.addEventListener("input", () => { h.value = p.value; push(); });
    h.addEventListener("input", () => { if (/^#[0-9a-fA-F]{6}$/.test(h.value.trim())) p.value = h.value.trim(); push(); });
  };
  syncColor("pb-primary", "pb-primary-hex");
  syncColor("pb-tint", "pb-tint-hex");
  if (plansTbl) plansTbl.addEventListener("input", push);
  const myBtn = q("pb-lang-my"), enBtn = q("pb-lang-en");
  const syncLangButtons = () => {
    if (myBtn) myBtn.setAttribute("aria-pressed", String(lang === "my"));
    if (enBtn) enBtn.setAttribute("aria-pressed", String(lang === "en"));
  };
  if (myBtn) myBtn.addEventListener("click", () => { lang = "my"; syncLangButtons(); push(); });
  if (enBtn) enBtn.addEventListener("click", () => { lang = "en"; syncLangButtons(); push(); });
  syncLangButtons();

  const HEXISH = /^#([0-9a-fA-F]{3}|[0-9a-fA-F]{4}|[0-9a-fA-F]{6}|[0-9a-fA-F]{8})$/;
  const saveBtn = q("pb-save");
  if (saveBtn) saveBtn.addEventListener("click", async () => {
    const m = q("pb-msg");
    const d = draft();
    if (!HEXISH.test(d.primary_hex)) { m.textContent = "Brand colour must be a hex colour like #ffb547."; return; }
    if (!HEXISH.test(d.glass_tint_hex)) { m.textContent = "Accent tint must be a hex colour like #7ad0ff."; return; }
    saveBtn.disabled = true; saveBtn.textContent = "…";
    try {
      // Branding fields ONLY. The endpoint merges now, so guest plans, the MMQR
      // URL, the grace window and guest consent are left exactly as they are —
      // previously an omitted field was erased by the full-replace upsert.
      await MM.put("/portal/config", {
        // Use the literal form values here. Preview fallbacks must never be
        // persisted when an owner intentionally leaves a field empty.
        business_name: val("pb-name"), welcome_text: val("pb-welcome"), terms_text: val("pb-terms"),
        primary_hex: d.primary_hex, glass_tint_hex: d.glass_tint_hex,
        bank_name: d.bank_name, bank_holder: d.bank_holder, bank_account: d.bank_account,
        // Media fields are deliberately omitted: this editor owns internet
        // branding only. Existing media data remains intact in the database.
      });
      PORTAL_NOTICE = "Branding saved and verified from the server.";
      await loadView("portal", main, ME);
    } catch (e) {
      saveBtn.disabled = false; saveBtn.textContent = "Save branding";
      m.textContent = "Save failed: " + ((e.data && (e.data.error || e.data.reason)) || e.message || "");
    }
  });
}

/* ---------- Revenue ---------- */
function mmk(value) {
  const amount = Number(value || 0);
  return `${new Intl.NumberFormat("en-US", { maximumFractionDigits: 0 }).format(amount)} MMK`;
}

function revenueDayKey(value) {
  const d = new Date(value);
  if (Number.isNaN(d.getTime())) return "";
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}

function voucherRevenuePanel(result) {
  const report = result.status === "fulfilled" ? result.value : null;
  const fields = ["recorded_count","recorded_face_value","first_use_count","available_count","reserved_count","activated_count","expired_count","revoked_count","other_count","activation_count","activation_time_unknown_count","activation_value","activation_today","activation_last7","activation_last30"];
  const validNumber = value => typeof value === "number" && Number.isFinite(value) && value >= 0;
  const gatewayFields = ["recorded_count","available_count","reserved_count","activated_count","expired_count","revoked_count","other_count","activation_value"];
  if (!report || report.source !== "guest-internet-vouchers" || !fields.every(key=>validNumber(report[key])) || !Array.isArray(report.gateways) || !report.gateways.every(g=>g && gatewayFields.every(key=>validNumber(g[key])))) {
    return `<section class="panel" aria-label="Voucher activations"><div class="panel-head"><h2 class="panel-title">Voucher activations</h2></div><div class="panel-body"><p role="alert">Voucher activation reporting is unavailable. No voucher totals are inferred from printing, payment requests or an incomplete list.</p></div></section>`;
  }
  const periods = [["Today",report.activation_today],["Last 7 days",report.activation_last7],["Last 30 days",report.activation_last30],["All time recorded",report.activation_value]];
  const rows = report.gateways.map(g=>`<tr><td>${esc(g.gateway_name)}</td><td>${esc(g.recorded_count)}</td><td>${esc(g.available_count)}</td><td>${esc(g.reserved_count)}</td><td>${esc(g.activated_count)}</td><td>${esc(g.expired_count)}</td><td>${esc(g.revoked_count)}</td><td>${esc(g.other_count)}</td><td>${esc(mmk(g.activation_value))}</td></tr>`).join("");
  return `<section class="panel" id="voucher-activation-report" aria-label="Voucher activations"><div class="panel-head"><div><h2 class="panel-title">Voucher activations</h2><p class="muted small">Printing leaves codes unused. A successful first portal activation counts once; reconnecting does not create another activation.</p></div></div><div class="panel-body">
    <div class="revenue-summary" data-voucher-summary>${periods.map(([label,amount])=>`<div class="stat"><div class="stat-label">${label}</div><div class="stat-value revenue-value">${esc(mmk(amount))}</div><div class="muted small">Activated voucher value · Yangon time</div></div>`).join("")}</div>
    <p>${esc(report.activation_count)} recorded activations · ${esc(report.recorded_count)} current voucher records · ${esc(mmk(report.recorded_face_value))} recorded face value.</p>
    <p class="muted small">${esc(report.available_count)} unused · ${esc(report.reserved_count)} activating · ${esc(report.activated_count)} unexpired active grants · ${esc(report.expired_count)} expired · ${esc(report.revoked_count)} revoked/blocked · ${esc(report.other_count)} need inspection. First use has started for ${esc(report.first_use_count)} codes. These counts do not show guests currently online.</p>
    <p class="muted small">Activated voucher value is separate from bank-confirmed payments. Unused printed codes do not count toward it. Current inventory excludes deleted records.</p>
    ${report.activation_time_unknown_count ? `<p role="note">${esc(report.activation_time_unknown_count)} first-use records have no verified activation timestamp and are excluded from activation-value totals.</p>` : ""}
    <div class="tablewrap"><table><thead><tr><th>Gateway</th><th>Recorded codes</th><th>Unused</th><th>Activating</th><th>Active grants</th><th>Expired</th><th>Revoked/blocked</th><th>Inspect</th><th>Activated value</th></tr></thead><tbody>${rows || '<tr><td colspan="9">No guest internet vouchers recorded.</td></tr>'}</tbody></table></div>
  </div></section>`;
}

async function renderRevenue(main) {
  // Full-ledger hotspot totals are separate from the limited review inbox.
  // Guest revenue never loads or decides legacy platform business passes.
  const canDecide = ["ADMIN", "OWNER", "DEVELOPER"].includes(ME?.user?.user_role);
  const [guestResult, summaryResult, voucherResult] = await Promise.allSettled([
    MM.get("/guest-wifi/requests"),
    MM.get("/guest-wifi/revenue"),
    MM.get("/voucher-report"),
  ]);
  const candidate = summaryResult.status === "fulfilled" ? summaryResult.value : null;
  const summary = candidate && ["today","last7","last30","all_time","total","approved","pending","rejected"].every(key=>typeof candidate[key] === "number" && Number.isFinite(candidate[key]) && candidate[key] >= 0) && Array.isArray(candidate.days) && Array.isArray(candidate.plans) ? candidate : null;
  const sourced = (result, source) => result.status === "fulfilled"
    ? asArray(result.value && result.value.requests ? result.value.requests : result.value)
      .map(request => ({ ...request, _revenue_source: source }))
    : [];
  const requests = [
    ...sourced(guestResult, "guest-wifi"),
  ];
  const now = new Date();
  const startToday = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const start7 = new Date(startToday); start7.setDate(start7.getDate() - 6);
  const start30 = new Date(startToday); start30.setDate(start30.getDate() - 29);
  const sumSince = start => Number(start === startToday ? summary.today : start === start7 ? summary.last7 : summary.last30);
  const all = Number(summary?.all_time);

  const days = asArray(summary?.days).map(d => ({ ...d, amount: Number(d.amount), label: new Date(`${d.key}T12:00:00+06:30`).toLocaleDateString(undefined, { weekday: "short", timeZone: "Asia/Yangon" }) }));
  const dayMax = Math.max(1, ...days.map(d => d.amount));

  const plans = asArray(summary?.plans);

  const planRows = plans.length ? plans.map(p => `<tr>
    <td><span class="num">${esc(p.key)}</span></td><td class="num">${p.requests}</td>
    <td class="num">${p.approved}</td><td class="num">${p.requests ? Math.round(p.approved / p.requests * 100) : 0}%</td>
    <td class="num">${esc(mmk(p.revenue))}</td></tr>`).join("")
    : `<tr><td colspan="5" class="muted small">No plan activity yet.</td></tr>`;

  const requestRows = requests.length ? requests.map(r => {
    const state = String(r.status || "unknown").toLowerCase();
    const source = "guest-wifi";
    const reference = r.bank_reference || (r.tx_last6 ? `MMQR ••••••${r.tx_last6}` : "—");
    const actions = state === "pending" && canDecide ? `<div class="revenue-actions">
      <button class="btn btn-sm" data-purchase-action="approve" data-purchase-source="${source}" data-request-id="${esc(r.id)}">Approve</button>
      <button class="btn btn-sm" data-purchase-action="reject" data-purchase-source="${source}" data-request-id="${esc(r.id)}">Reject</button>
    </div>` : `<span class="muted small">${state === "pending" ? "Read only" : "Decided"}</span>`;
    return `<tr><td>${ts(r.created_at)}</td><td>${source === "guest-wifi" ? "Portal payment" : "Business pass"}</td><td class="num">${esc(r.plan_key || "—")}</td>
      <td class="num">${esc(mmk(r.amount))}</td><td class="mono">${esc(reference)}</td>
      <td>${businessStatusBadge(state, "payment")}</td><td>${actions}</td></tr>`;
  }).join("") : `<tr><td colspan="7" class="muted small">${guestResult.status === "rejected" ? "Payment inbox unavailable." : "No payment requests reported by available sources."}</td></tr>`;

  main.querySelector("#content").innerHTML = `
    ${voucherRevenuePanel(voucherResult)}
    <h2>Approved portal payments</h2>
    ${summary ? `<div class="revenue-summary" data-portal-summary aria-label="Portal payment summary">
      <div class="stat"><div class="stat-label">Today</div><div class="stat-value revenue-value">${esc(mmk(sumSince(startToday)))}</div><div class="muted small">Owner-approved hotspot sales · Yangon time</div></div>
      <div class="stat"><div class="stat-label">Last 7 days</div><div class="stat-value revenue-value">${esc(mmk(sumSince(start7)))}</div><div class="muted small">Rolling window</div></div>
      <div class="stat"><div class="stat-label">Last 30 days</div><div class="stat-value revenue-value">${esc(mmk(sumSince(start30)))}</div><div class="muted small">Rolling window</div></div>
      <div class="stat"><div class="stat-label">All time</div><div class="stat-value revenue-value">${esc(mmk(all))}</div><div class="muted small">${Number(summary.approved)} approved hotspot sales · full ledger</div></div>
    </div>
    <div class="revenue-grid">
      <section class="panel"><div class="panel-head"><div><h2 class="panel-title">Seven-day approved payments</h2><p class="muted small">Approved portal payments only. Voucher activation value and business passes are separate.</p></div></div>
        <div class="panel-body"><div class="revenue-bars">${days.map(d => `<div class="revenue-bar-item" title="${esc(d.key)} · ${esc(mmk(d.amount))}"><span class="revenue-bar-value">${d.amount ? esc(mmk(d.amount)) : "—"}</span><span class="revenue-bar-track"><i style="height:${Math.max(d.amount ? 8 : 2, Math.round(d.amount / dayMax * 100))}%"></i></span><span>${esc(d.label)}</span></div>`).join("")}</div></div>
      </section>
      <section class="panel"><div class="panel-head"><h2 class="panel-title">Payment funnel</h2></div><div class="panel-body">
        <div class="funnel-row"><span>Submitted</span><strong>${Number(summary.total)}</strong></div>
        <div class="funnel-row"><span>Approved</span><strong>${Number(summary.approved)}</strong></div>
        <div class="funnel-row"><span>Pending review</span><strong>${Number(summary.pending)}</strong></div>
        <div class="funnel-row"><span>Rejected</span><strong>${Number(summary.rejected)}</strong></div>
        <p class="muted small">Approval rate: ${summary.total ? Math.round(summary.approved / summary.total * 100) : 0}% · manual approval, not bank settlement verification</p>
      </div></section>
    </div>
    <section class="panel" style="margin-top:14px"><div class="panel-head"><h2 class="panel-title">Portal plan performance</h2></div><div class="panel-body tablewrap"><table><thead><tr><th>Plan</th><th>Requests</th><th>Approved</th><th>Approval rate</th><th>Approved value</th></tr></thead><tbody>${planRows}</tbody></table></div></section>` : `<section class="panel"><div class="panel-body"><p role="alert">Complete portal-payment totals are unavailable. Totals are not calculated from the limited payment inbox.</p></div></section>`}
    <section class="panel" style="margin-top:14px"><div class="panel-head"><div><h2 class="panel-title">Payment inbox</h2><p class="muted small">Latest guest WiFi requests only. Platform subscription and old Store decisions are kept outside this inbox. ${guestResult.status === "rejected" ? "Warning: the guest payment inbox is unavailable." : ""}</p><button class="btn btn-sm" id="revenue-export" type="button">Export payment inbox CSV</button></div><span id="revenue-message" class="muted small" role="status" aria-live="polite"></span></div><div class="panel-body tablewrap"><table><thead><tr><th>Submitted</th><th>Source</th><th>Plan</th><th>Amount</th><th>Bank reference</th><th>Status</th><th>Decision</th></tr></thead><tbody>${requestRows}</tbody></table></div></section>`;

  main.querySelector("#revenue-export").addEventListener("click", () => {
    const cell = value => {
      let text = String(value == null ? "" : value);
      if (/^(?:\s*[=+\-@]|\t|\r)/.test(text)) text = "'" + text;
      return `"${text.replaceAll('"', '""')}"`;
    };
    const lines = [["source", "submitted_at", "decided_at", "plan", "amount_mmk", "bank_reference", "status"],
      ...requests.map(r => [r._revenue_source, r.created_at, r.decided_at || "", r.plan_key || "", Number(r.amount || 0), r.bank_reference || "", r.status || ""])]
      .map(row => row.map(cell).join(","));
    const url = URL.createObjectURL(new Blob([lines.join("\n")], { type: "text/csv;charset=utf-8" }));
    const a = document.createElement("a"); a.href = url; a.download = `mega-magic-payment-inbox-${revenueDayKey(now)}.csv`;
    document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
  });

  main.querySelectorAll("[data-purchase-action]").forEach(button => button.addEventListener("click", async () => {
    const message = main.querySelector("#revenue-message");
    const action = button.dataset.purchaseAction;
    const source = "guest-wifi";
    const id = button.dataset.requestId;
    button.disabled = true;
    message.textContent = `${action === "approve" ? "Approving" : "Rejecting"}…`;
    try {
      await MM.post(`/${source}/${action}/${encodeURIComponent(id)}`, {});
      await renderRevenue(main);
    } catch (e) {
      button.disabled = false;
      message.textContent = apiErrorText(e, `Could not ${action} this request.`);
    }
  }));
}

/* ---------- Captive portal ---------- */
async function renderPortal(main) {
  let cfg = null, cfgErr = null;
  try {
    const response = await MM.get("/portal/config");
    // StaffGetConfig returns { config: ... }. Reading the response envelope as
    // the config made successfully saved plans appear to vanish after reload.
    cfg = response && response.config ? response.config : response;
  } catch (e) { cfgErr = e.status === 404 ? "No Internet Hotspot Portal settings yet. Add your internet plans and branding, then save." : errorText(e, "Portal configuration could not be loaded."); }
  let reqs = [], reqErr = null;
  try {
    const r = await MM.get("/billing/requests"); reqs = r.requests || r || [];
  } catch (e) { reqErr = errorText(e, "Guest purchase requests could not be loaded."); }

  let html = `<div class="panel"><div class="panel-head"><h2 class="panel-title">Portal configuration</h2></div><div class="panel-body">`;
  if (cfg) {
    html += `<table><tbody>` +
      `<tr><td>Business</td><td class="num">${esc(cfg.business_name||"—")}</td></tr>` +
      `<tr><td>Grace window</td><td class="num">${esc(cfg.guest_grace_minutes||"—")} min</td></tr>` +
      `<tr><td>Grace data allowance</td><td class="num">${esc(cfg.guest_grace_data_mb ?? 50)} MB</td></tr>` +
      `</tbody></table>`;
  } else if (cfgErr) { html += `<p class="muted small">${esc(cfgErr)}</p>`; }

  // Guest data plans — owner-set price (MMK) + data per location. Editable so
  // each hotspot owner prices their own market (no global pricing rule).
  const plans = (cfg && cfg.guest_plans) || [];
  const voucherEnabled = portalMethodEnabled(cfg, "voucher_login_enabled");
  const paymentEnabled = portalMethodEnabled(cfg, "mobile_payment_enabled");
  html += `<h3 class="small" style="margin:14px 0 8px">Guest access methods</h3>`;
  html += `<div class="portal-method-grid">
    <label class="portal-method-option"><input type="checkbox" id="portal-voucher-enabled" ${voucherEnabled ? "checked" : ""}>
      <span><strong>Voucher code</strong><small>Guests enter a printed or issued WiFi voucher. This is the first screen when both methods are enabled.</small></span></label>
    <label class="portal-method-option"><input type="checkbox" id="portal-payment-enabled" ${paymentEnabled ? "checked" : ""}>
      <span><strong>Mobile payment</strong><small>Guests choose a plan and pay by MMQR. When both are enabled, guests reach this on the next screen.</small></span></label>
  </div><p class="muted small portal-method-hint">Select one or both. At least one guest access method must remain enabled.</p>`;
  html += `<h3 class="small" style="margin:14px 0 6px">MMQR payment QR<span class="muted"> — image URL guests scan to pay by bank</span></h3>`;
  html += `<input id="mmqr-url" value="${esc((cfg&&cfg.mmqr_url)||"")}" placeholder="https://…/mmqr.jpg or /assets/mmqr.jpg" style="width:100%">`;
  html += `<div class="grid-2" style="margin-top:16px"><div class="form-row"><label for="grace-min">Grace time (minutes)</label><input id="grace-min" type="number" min="1" max="1440" step="1" value="${cfg?.guest_grace_minutes ?? 10}"></div><div class="form-row"><label for="grace-data">Grace data (MB)</label><input id="grace-data" type="number" min="1" max="10240" step="1" value="${cfg?.guest_grace_data_mb ?? 50}"></div></div><p class="muted small">Temporary internet for completing a bank transfer ends when either limit is reached. Data includes uploads and downloads.</p><p class="muted small">Browser recognition guard: on the HTTPS guest portal, a secure cookie remembers the payment request. Reconnecting does not reset its allowance. A recognized MAC change cannot start fresh grace during the existing window or six-hour failed-payment cooldown; reconnect support requires the owner. Clearing cookies or using another browser can evade this extra guard. Banking-only access is not enabled.</p>`;
  html += `<h3 class="small" style="margin:14px 0 6px">Guest data plans</h3>`;
  html += `<div class="table-scroll"><table id="plans-table"><thead><tr><th>Key</th><th>Label</th><th>Minutes</th><th>Price (MMK)</th><th>Data (MB)</th><th></th></tr></thead><tbody>`;
  plans.forEach((p, i) => {
    html += `<tr id="plan-${i}">` +
      `<td><input data-k="key" value="${esc(p.key||"")}"></td>` +
      `<td><input data-k="label" value="${esc(p.label||"")}"></td>` +
      `<td><input type="number" data-k="minutes" min="0" value="${p.minutes||0}"></td>` +
      `<td><input type="number" data-k="amount" min="0" value="${p.amount||0}"></td>` +
      `<td><input type="number" data-k="data_mb" min="0" value="${p.data_mb||0}"></td>` +
      `<td><button class="btn-sm" type="button" data-act="del" data-i="${i}">Remove</button></td></tr>`;
  });
  html += `</tbody></table></div>`;
  html += `<div style="margin-top:8px;display:flex;gap:8px"><button class="btn-sm" type="button" id="plan-add">+ Add plan</button>` +
    `<button class="btn-sm" type="button" id="plan-save">Save access &amp; plans</button><span id="plan-msg" class="muted small" role="status" aria-live="polite"></span></div>`;
  html += `</div></div>`;

  if (SITE_EDITOR_ROLES.includes(ME?.user?.user_role)) {
    html += `<div class="panel" style="margin-top:14px"><div class="panel-head"><h2 class="panel-title">Deploy portal to router</h2></div><div class="panel-body">
      <p class="muted small">Save your plans and branding above, then install the portal entrypoint on a connected gateway. The router voucher page works locally. Changes to its saved branding need a reviewed redeployment; hosted payment settings update separately. Deployment replaces the selected HotSpot login page, with a verified backup.</p>
      <div class="form-row"><label for="pd-router">Gateway</label><select id="pd-router"><option value="">Loading gateways…</option></select></div>
      <div class="form-row"><label for="pd-profile">HotSpot profile</label><select id="pd-profile" disabled><option value="">Select a gateway first</option></select></div>
      <p class="muted" id="pd-media-note"></p>
      <button class="btn btn-sm" type="button" id="pd-preview" disabled>Review deployment</button>
      <div id="pd-review" hidden></div><button class="btn btn-sm" type="button" id="pd-apply" hidden disabled>Deploy to router</button>
      <p class="muted small" id="pd-status" role="status" aria-live="polite"></p></div></div>`;
  }

  // Branding + live guest-portal preview. These fields were stored and accepted
  // by the API but never surfaced anywhere in the console, so an owner could not
  // set their own brand at all — and the portal never applied them anyway (it
  // does now).
  html += `<div class="panel" style="margin-top:14px"><div class="panel-head"><h2 class="panel-title">Portal branding &amp; live preview</h2></div><div class="panel-body">
    <div class="pv-split">
      <div>
        <div class="field"><label>Business name shown to guests</label><input class="input" id="pb-name" value="${esc((cfg&&cfg.business_name)||"")}"></div>
        <div class="field"><label>Welcome message</label><input class="input" id="pb-welcome" value="${esc((cfg&&cfg.welcome_text)||"")}" placeholder="Welcome! Fast internet for your stay."></div>
        <div class="field"><label>Terms shown to guests</label><input class="input" id="pb-terms" value="${esc((cfg&&cfg.terms_text)||"")}" placeholder="One voucher = one device."></div>
        <div class="pl-grid">
          <div class="field"><label>Brand colour</label>
            <div style="display:flex;gap:8px;align-items:center">
              <input type="color" id="pb-primary" value="${esc(hexOr((cfg&&cfg.primary_hex), "#ffb547"))}">
              <input class="input" id="pb-primary-hex" value="${esc((cfg&&cfg.primary_hex)||"#ffb547")}">
            </div></div>
          <div class="field"><label>Accent tint</label>
            <div style="display:flex;gap:8px;align-items:center">
              <input type="color" id="pb-tint" value="${esc(hexOr((cfg&&cfg.glass_tint_hex), "#7ad0ff"))}">
              <input class="input" id="pb-tint-hex" value="${esc((cfg&&cfg.glass_tint_hex)||"#7ad0ff")}">
            </div></div>
        </div>
        <div class="field"><label>Bank details shown on the pay screen</label>
          <div class="pl-grid">
            <input class="input" id="pb-bank-name" placeholder="Bank name" value="${esc((cfg&&cfg.bank_name)||"")}">
            <input class="input" id="pb-bank-holder" placeholder="Account holder" value="${esc((cfg&&cfg.bank_holder)||"")}">
            <input class="input" id="pb-bank-acc" placeholder="Account number" value="${esc((cfg&&cfg.bank_account)||"")}">
          </div></div>
        <p class="muted small">This portal sells internet data and time only. Configure your media guest experience under <a href="#jellyfin-portal">Jellyfin Guest Portal</a>.</p>
        <button class="btn btn-primary" type="button" id="pb-save">Save branding</button>
        <span id="pb-msg" class="muted small" role="status" aria-live="polite"></span>
      </div>
      <div>
        <div class="field"><label>Guest portal preview <span class="muted small">(live, unsaved)</span></label>
          <div class="pv-lang-controls">
            <button class="btn btn-sm" type="button" id="pb-lang-my" aria-pressed="false">မြန်မာ</button>
            <button class="btn btn-sm" type="button" id="pb-lang-en" aria-pressed="true">English</button>
          </div></div>
        <label for="pb-preview-target">Preview destination</label><select class="input" id="pb-preview-target"><option value="router">Router voucher page</option><option value="hosted">Hosted payment page</option></select><div class="pv-stage"><iframe class="pv-phone" id="pb-router-frame" sandbox="allow-scripts" title="Router voucher design preview"></iframe><iframe class="pv-phone" id="pb-frame" src="/portal.html?preview=1" title="Hosted payment portal preview" hidden></iframe></div><p id="pb-router-preview-status" class="muted small" role="status"></p>
        <p class="muted small pv-hint">Choose the offline router voucher page or the hosted payment page. Preview clicks never use a voucher. Save changes first; deployment review shows the selected gateway’s saved guest-visible design.</p>
      </div>
    </div>
  </div></div>`;

  html += `<div class="panel" style="margin-top:14px"><div class="panel-head"><h2 class="panel-title">Guest purchase requests</h2></div><div class="panel-body">`;
  if (reqErr) html += `<p class="muted small">${esc(reqErr)}</p>`;
  else if (!reqs.length) html += `<div class="empty"><div class="empty-title">No requests</div>Guest purchases and redemptions will appear here.</div>`;
  else html += `<table><thead><tr><th>MAC</th><th>Plan</th><th>Phone</th><th>Last 6</th><th>Status</th><th>Submitted</th></tr></thead><tbody>` +
    reqs.slice(0, 30).map(r => `<tr><td class="mono">${esc(r.client_mac||"—")}</td><td class="num">${esc(r.plan_key||"—")}</td><td class="mono">${esc(r.paid_phone||"—")}</td><td class="mono">${esc(r.tx_last6||"—")}</td><td>${badge((r.status||"unknown").toLowerCase())}</td><td>${ts(r.created_at)}</td></tr>`).join("") +
    `</tbody></table>`;
  html += `</div></div>`;

  main.querySelector("#content").innerHTML = html;

  if (PORTAL_NOTICE) {
    const planMessage = main.querySelector("#plan-msg");
    const brandingMessage = main.querySelector("#pb-msg");
    const target = PORTAL_NOTICE.startsWith("Branding") ? brandingMessage : planMessage;
    if (target) target.textContent = PORTAL_NOTICE;
    PORTAL_NOTICE = "";
    PORTAL_MEDIA = {media_host: (cfg && cfg.media_host) || "", media_port: (cfg && cfg.media_port) || ""};
  }

  // Plan editor wiring (add / remove / save).
  const plansTbl = main.querySelector("#plans-table");
  const msgEl = () => main.querySelector("#plan-msg");
  const collect = () => {
    const out = [];
    plansTbl.querySelectorAll("tbody tr").forEach(tr => {
      const o = {};
      tr.querySelectorAll("input[data-k]").forEach(inp => { o[inp.dataset.k] = inp.type === "number" ? parseInt(inp.value||"0",10) : (inp.value||"").trim(); });
      out.push(o);
    });
    return out;
  };
  const save = async () => {
    const button = main.querySelector("#plan-save");
    msgEl().textContent = "Saving…";
    if (button) button.disabled = true;
    try {
      const plans = collect();
      // The backend performs a merge, so send only the fields owned by this
      // editor. This prevents a stale browser copy overwriting branding or
      // consent settings changed elsewhere.
      const body = {
        guest_plans: plans,
        voucher_login_enabled: !!main.querySelector("#portal-voucher-enabled")?.checked,
        mobile_payment_enabled: !!main.querySelector("#portal-payment-enabled")?.checked,
        mmqr_url: (main.querySelector("#mmqr-url")?.value || String((cfg && cfg.mmqr_url) || "")).trim(),
        guest_grace_minutes: Number(main.querySelector("#grace-min")?.value),
        guest_grace_data_mb: Number(main.querySelector("#grace-data")?.value),

        throw new Error("Select Voucher code, Mobile payment, or both.");
      }
      if (!Number.isInteger(body.guest_grace_minutes) || body.guest_grace_minutes < 1 || body.guest_grace_minutes > 1440) throw new Error("Enter a grace time from 1 to 1440 minutes.");
      if (!Number.isInteger(body.guest_grace_data_mb) || body.guest_grace_data_mb < 1 || body.guest_grace_data_mb > 10240) throw new Error("Enter a grace data allowance from 1 to 10240 MB.");
      await MM.put("/portal/config", body);
      PORTAL_NOTICE = "Access methods and plans saved and verified from the server.";
      await loadView("portal", main, ME);
    } catch (e) {
      if (button) button.disabled = false;
      msgEl().textContent = "Save failed: " + ((e.data && (e.data.error || e.data.reason)) || e.message || "unknown error");
    }
  };
  const addBtn = main.querySelector("#plan-add");
  if (addBtn) addBtn.addEventListener("click", () => {
    const tr = document.createElement("tr");
    tr.innerHTML = `<td><input data-k="key"></td><td><input data-k="label"></td><td><input type="number" data-k="minutes" min="0" value="0"></td><td><input type="number" data-k="amount" min="0" value="0"></td><td><input type="number" data-k="data_mb" min="0" value="0"></td><td><button class="btn-sm" type="button" data-act="del">Remove</button></td>`;
    plansTbl.querySelector("tbody").appendChild(tr);
    plansTbl.dispatchEvent(new Event("input", { bubbles: true }));
  });
  const saveBtn = main.querySelector("#plan-save");
  if (saveBtn) saveBtn.addEventListener("click", save);
  plansTbl.addEventListener("click", e => {
    const b = e.target.closest("button[data-act=del]");
    if (!b || !plansTbl.contains(b)) return;
    b.closest("tr").remove();
    plansTbl.dispatchEvent(new Event("input", { bubbles: true }));
  });

  // Branding editor + the REAL portal rendered live beside it.
  wirePortalBranding(main, cfg, collect, plansTbl);
  wirePortalDeployment(main);
}

// The owner's LAN media server, stored once per business. Private IPv4 only:
// loopback, unspecified, multicast and public addresses are refused so a LAN
// service can never be published through the HotSpot walled garden.
function readMediaSettings() {
  const hostInput = document.getElementById("pb-media-host");
  const portInput = document.getElementById("pb-media-port");
  if (!hostInput) return {media_host: "", media_port: ""};
  const host = (hostInput.value || "").trim();
  const port = (portInput?.value || "").trim();
  if (!host) return {media_host: "", media_port: ""};
  if (!/^(\d{1,3}\.){3}\d{1,3}$/.test(host)) throw new Error("Enter the media server address as numbers, for example 192.168.88.10");
  const parts = host.split(".").map(n => Number(n));
  if (parts.some(n => !Number.isInteger(n) || n < 0 || n > 255)) throw new Error("That media address is not a valid IP address.");
  if (host.startsWith("127.") || parts[0] === 0 || parts[0] >= 224) throw new Error("Enter the address of your media server on your own network.");
  const isPrivate = parts[0] === 10 || (parts[0] === 192 && parts[1] === 168) || (parts[0] === 172 && parts[1] >= 16 && parts[1] <= 31);
  if (!isPrivate) throw new Error("The media server must be on your own private network so guests cannot reach it from the internet.");
  if (port && (!/^\d{1,5}$/.test(port) || Number(port) < 1 || Number(port) > 65535)) throw new Error("Enter a port between 1 and 65535.");
  return {media_host: host, media_port: port};
}

async function wirePortalDeployment(main) {
  const router = main.querySelector("#pd-router"), profile = main.querySelector("#pd-profile");
  if (!router) return;
  const mediaNote = main.querySelector("#pd-media-note");
  // The media server is configured once in the portal settings and reused here, so
  // a redeploy never asks for it again.
  const mediaPayload = () => ({media_host: "", media_port: ""});
  const preview = main.querySelector("#pd-preview"), apply = main.querySelector("#pd-apply");
  const status = main.querySelector("#pd-status"), review = main.querySelector("#pd-review");
  let plan = null, revision = 0, gateways = [];
  const reset = () => { plan = null; apply.hidden = true; apply.disabled = true; review.hidden = true; };
  try {
    const response = await MM.get("/routers");
    gateways = (response.routers || []).filter(r => r.deployment_layer === "MAIN_GATEWAY");
    router.innerHTML = `<option value="">${gateways.length ? "Select gateway" : "No gateways — connect Magic Hub first"}</option>` + gateways.map(r => `<option value="${esc(r.device_id)}">${esc(r.hardware_name || r.device_id)}</option>`).join("");
  } catch (e) { status.textContent = errorText(e, "Gateways could not be loaded."); }
  router.addEventListener("change", async () => {
    reset(); const current = ++revision, id = router.value;
    preview.disabled = true; profile.disabled = true;
    profile.innerHTML = '<option value="">Loading HotSpot profiles…</option>';
    status.textContent = "";
    if (!id) { profile.innerHTML = '<option value="">Select a gateway first</option>'; return; }
    try {
      const response = await MM.get(`/routers/${encodeURIComponent(id)}/portal/profiles`);
      if (current !== revision) return;
      profile.innerHTML = '<option value="">Select profile</option>' + (response.profiles || []).map(p => `<option value="${esc(p)}">${esc(p)}</option>`).join("");
      profile.disabled = false;
      if (response.profiles?.length === 1) { profile.value = response.profiles[0]; preview.disabled = false; status.textContent = "HotSpot profile found. Review deployment to continue."; }
      if (!response.profiles?.length) status.textContent = "No eligible HotSpot profile found. A profile must belong to one enabled HotSpot server. Open Magic Hub → Router → HotSpot & LAN to check the guest network.";
    } catch (e) { if (current === revision) { profile.innerHTML = '<option value="">Profiles unavailable</option>'; status.textContent = errorText(e, "Finish Magic Hub management connection first."); } }
  });
  profile.addEventListener("change", () => { ++revision; reset(); preview.disabled = !profile.value; status.textContent = ""; });
  const preferred = sessionStorage.getItem("mm_selected_router");
  const context = gateways.length === 1 ? gateways[0] : gateways.find(r=>r.device_id === preferred);
  if (context) { router.value = context.device_id; router.dispatchEvent(new Event("change")); }

  if (mediaNote) {
    mediaNote.textContent = "Internet access only. Jellyfin Guest Portal is configured separately; this deployment does not publish a media-server access rule.";
  }
  preview.addEventListener("click", async () => {
    reset(); const current = revision; preview.disabled = true; status.textContent = "Checking router and preparing review…";
    try {
      const response = await MM.post(`/routers/${encodeURIComponent(router.value)}/portal/preview`, {profile:profile.value, ...mediaPayload()});
      if (current !== revision) return;
      plan = response.plan;
      review.innerHTML = `<h3 class="small">Review changes for ${esc(plan.profile)}</h3><ol>${plan.steps.map(s => `<li>${esc(s)}</li>`).join("")}</ol><p class="muted small">File: ${esc(plan.file)}. This changes the guest login page, not WAN or management settings. Verify a real guest connection after deployment.</p>`;
      if (typeof plan.preview_html === "string") {
        const label = document.createElement("p"); label.className = "muted small";
        label.textContent = "Saved guest-visible router design to be installed:";
        const image = document.createElement("iframe"); image.className = "pv-phone";
        image.title = "Saved router portal deployment preview";
        image.setAttribute("sandbox", "allow-scripts"); image.srcdoc = plan.preview_html;
        review.append(label, image);
      }
      review.hidden = false; apply.hidden = false; apply.disabled = false; status.textContent = "Review ready. No router changes have been made.";
    } catch (e) { status.textContent = errorText(e, "Deployment review failed."); }
    finally { if (current === revision) preview.disabled = !profile.value; }
  });
  apply.addEventListener("click", async () => {
    if (!plan) return;
    const approved = plan, id = router.value;
    apply.disabled = true; preview.disabled = true; router.disabled = true; profile.disabled = true;
    status.textContent = "Backing up, deploying and verifying…";
    try {
      const response = await MM.post(`/routers/${encodeURIComponent(id)}/portal/apply`, {profile:approved.profile, version:approved.version, confirmation:approved.confirmation, media_host:approved.media_host || "", media_port:approved.media_port || ""});
      if (!response.result?.verified) throw new Error("Router readback was not verified.");
      const mediaNote = approved.media_host ? ` Media server ${approved.media_host}:${approved.media_port || "8096"} is reachable by guests on this network.` : "";
      status.textContent = `Router files and access rule verified. Backup: ${response.result.backup}.${mediaNote} Next: test from a guest device on this HotSpot.`;
    } catch (e) { status.textContent = errorText(e, "Deployment could not be confirmed.") + (e.data?.result?.rolled_back ? " Previous login page restored and verified." : " Check router and backup before retrying."); }
    finally { reset(); router.disabled = false; profile.disabled = false; preview.disabled = !profile.value; }
  });
}

/* ---------- Security (C1 posture) ---------- */
async function renderSecurity(main) {
  const data = await MM.get("/security/posture");
  const devices = data.devices || [];
  const content = main.querySelector("#content");

  if (!devices.length) {
    content.innerHTML = `<div class="empty"><div class="empty-title">No posture data yet</div>RouterOS versions are captured on each device's next evaluation.</div>`;
    return;
  }

  // Worst first. An unfixable finding outranks a fixable one, which outranks
  // "we could not tell", which outranks fine — so the thing an operator must
  // act on is never buried under rows that are merely unreadable.
  const rank = (d) => {
    if (d.posture === "affected") return d.unpatchable ? 0 : 1;
    if (d.posture === "unknown") return 2;
    return 3;
  };
  const sorted = devices.slice().sort((a, b) => rank(a) - rank(b));

  const postureBadge = (d) => {
    const m = { affected: "bad", safe: "ok", unknown: "unknown" }[d.posture] || "unknown";
    const label = { affected: "Affected", safe: "Safe", unknown: "Unknown" }[d.posture] || "Unknown";
    return `<span class="status ${m}">${label}</span>`;
  };

  // An advisory the vendor has published no fix for needs to look DIFFERENT from
  // one you can upgrade out of, otherwise "affected" just means "ignored".
  const fixBadge = (d) => {
    if (d.posture !== "affected") return "";
    if (d.unpatchable && !d.fix_first) return `<span class="status warn">No fix available</span>`;
    if (d.unpatchable) return `<span class="status warn">Partly unfixable</span>`;
    return "";
  };

  const exploitedBadge = (d) =>
    d.exploited ? `<span class="status bad">Exploited</span>` : "";

  // Two different remedies, so name the right one.
  const fixHint = (d) => {
    if (d.posture !== "affected") return "\u2014";
    if (d.fix_first) return `upgrade to \u2265 <span class="mono">${esc(d.fix_first)}</span>`;
    return "close the exposed service";
  };

  const advTitle = (d) => (d.advisories || [])
    .map(a => `${a.id} \u2014 ${a.title}${a.fix_unavailable ? " (no fix)" : ""}`)
    .join("\n");

  const controls = (d) => {
    if (!data.controls_enabled) {
      return `<span class="muted small">Control path disabled</span>`;
    }
    return `<div class="security-actions">
      <button class="btn btn-sm" data-sec-verify="${esc(d.device_id)}">Verify now</button>
      <button class="btn btn-sm" data-sec-backup="${esc(d.device_id)}">Backup</button>
      ${d.posture === "affected" ? `<button class="btn btn-sm btn-primary" data-sec-harden="${esc(d.device_id)}">Mitigate exposure</button>` : ""}
    </div>`;
  };

  const rows = sorted.map(d => `
    <tr>
      <td>${postureBadge(d)}</td>
      <td><span class="num">${esc(d.hardware_name)}</span></td>
      <td class="mono">${d.routeros_version ? esc(d.routeros_version) : "\u2014"}</td>
      <td class="muted small">${d.routeros_channel ? esc(d.routeros_channel) : "\u2014"}</td>
      <td>${fixBadge(d)} ${exploitedBadge(d)}</td>
      <td><div class="muted small" style="margin-bottom:6px">${fixHint(d)}</div>${controls(d)}</td>
      <td class="muted small">${(d.advisories || []).length
        ? `<span class="mono" title="${esc(advTitle(d))}">${d.advisories.length} matching</span>`
        : "\u2014"}</td>
      <td>${ts(d.version_checked_at)}</td>
    </tr>`).join("");

  const unpatchableNotice = (data.unpatchable ?? 0) > 0
    ? `<div class="alert">${data.unpatchable} of these ${data.count} device(s) match at least one advisory with <strong>no vendor fix</strong> \u2014 upgrading will not clear it. Apply the mitigation for those entries instead of scheduling a patch window.</div>`
    : "";
  const exploitedNotice = (data.exploited ?? 0) > 0
    ? `<div class="alert">${data.exploited} device(s) match an advisory being <strong>exploited in the wild</strong>. Treat those first.</div>`
    : "";

  content.innerHTML = `
    <div id="security-action-status" class="security-action-status" aria-live="polite"></div>
    <div class="stat-cluster security-stats" style="margin-top:18px">
      <div class="stat"><div class="stat-label">Affected</div><div class="stat-value">${data.affected ?? 0}</div></div>
      <div class="stat"><div class="stat-label">Safe</div><div class="stat-value">${data.safe ?? 0}</div></div>
      <div class="stat"><div class="stat-label">Unknown</div><div class="stat-value">${data.unknown ?? 0}</div></div>
      <div class="stat"><div class="stat-label">No fix exists</div><div class="stat-value">${data.unpatchable ?? 0}</div></div>
      <div class="stat"><div class="stat-label">Exploited</div><div class="stat-value">${data.exploited ?? 0}</div></div>
    </div>
    ${unpatchableNotice}
    ${exploitedNotice}
    <hr class="rule">
    <table>
      <thead><tr><th>Posture</th><th>Device</th><th>RouterOS</th><th>Channel</th><th>Flags</th><th>Action</th><th>Matches</th><th>Checked</th></tr></thead>
      <tbody>${rows}</tbody></table>`;

  const showAction = (text, bad = false, detail = "") => {
    const region = document.getElementById("security-action-status");
    if (!region) return;
    region.innerHTML = `<div class="security-action-result ${bad ? "is-error" : "is-success"}">
      <span class="security-action-icon" aria-hidden="true">${bad ? "!" : "✓"}</span>
      <div><strong>${esc(text)}</strong>${detail ? `<details><summary>Technical details</summary><code>${esc(detail)}</code></details>` : ""}</div>
      <button class="security-action-dismiss" type="button" aria-label="Dismiss status">×</button>
    </div>`;
    region.querySelector(".security-action-dismiss")?.addEventListener("click", () => { region.innerHTML = ""; });
    region.scrollIntoView({ behavior: "smooth", block: "nearest" });
  };
  content.querySelectorAll("button[data-sec-verify]").forEach(btn => btn.addEventListener("click", async () => {
    btn.disabled = true;
    const original = btn.textContent;
    btn.textContent = "Checking…";
    try {
      const r = await MM.post(`/devices/${encodeURIComponent(btn.dataset.secVerify)}/security/verify`, {});
      showAction(
        r.reachable ? "Router verified online" : "Router verification failed",
        !r.reachable,
        r.detail || `Reported state: ${r.state || "unknown"}`,
      );
    } catch (e) {
      showAction((e.data && e.data.error) ? e.data.error : e.message, true);
    } finally {
      btn.disabled = false;
      btn.textContent = original;
    }
  }));
  content.querySelectorAll("button[data-sec-backup]").forEach(btn => btn.addEventListener("click", async () => {
    btn.disabled = true;
    const original = btn.textContent;
    btn.textContent = "Capturing…";
    try {
      const r = await MM.post(`/devices/${encodeURIComponent(btn.dataset.secBackup)}/backups`, { label: "Pre-security-action" });
      showAction("Configuration backup captured", false, `Backup ID: ${r.id}`);
    } catch (e) {
      showAction((e.data && e.data.error) ? e.data.error : e.message, true);
    } finally {
      btn.disabled = false;
      btn.textContent = original;
    }
  }));
  content.querySelectorAll("button[data-sec-harden]").forEach(btn => btn.addEventListener("click", async () => {
    const confirmation = prompt("This will disable Telnet, FTP, HTTP WebFig and RouterOS APIs, then restrict SSH and Winbox to the management network. Type HARDEN to continue:");
    if (confirmation === null) return;
    btn.disabled = true;
    const original = btn.textContent;
    btn.textContent = "Applying…";
    try {
      const r = await MM.post(`/devices/${encodeURIComponent(btn.dataset.secHarden)}/security/harden`, { confirm: confirmation });
      showAction(
        r.verified ? "Exposure mitigation applied and connectivity verified" : "Mitigation did not verify; previous configuration restored",
        !r.verified,
        r.verified ? (r.verification_detail || "") : (r.rollback_detail || r.verification_detail || ""),
      );
    } catch (e) {
      showAction((e.data && e.data.error) ? e.data.error : e.message, true);
    } finally {
      btn.disabled = false;
      btn.textContent = original;
    }
  }));
}

  } catch (e) {

      content.innerHTML = `<div class="panel"><div class="panel-body"><div class="empty"><div class="empty-title">Platform administrator access required</div>Only the platform administrator can manage account records.</div></div></div>`;

  const roleOpts = (sel) => TEAM_ROLES.map(r => `<option value="${r}"${r === sel ? " selected" : ""}>${r}</option>`).join("");

  content.innerHTML = `
    <div class="panel"><div class="panel-head"><h2 class="panel-title">Team</h2></div>
      <div class="panel-body">
        <div class="notice" style="margin-bottom:16px">User roles (OWNER, ADMIN, VIEWER) control what each person can do inside this business. They are separate from the business access tier (capacity and pricing), which only a platform DEVELOPER can change.</div>
        ${team.length ? `<table><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th></th></tr></thead><tbody>${rows}</tbody></table>` : `<div class="empty"><div class="empty-title">No team members</div>Add a staff user below.</div>`}</div></div>
    <div class="panel" style="margin-top:14px"><div class="panel-head"><h2 class="panel-title">Add team member</h2></div>
      <div class="panel-body">
        <div class="field"><label>Full name</label><input class="input" id="tm-name"></div>
        <div class="field"><label>Email</label><input class="input" id="tm-email" type="email"></div>
        <div class="field"><label>Password (8+ chars)</label><input class="input" id="tm-pass" type="password"></div>
        <div class="field"><label>Role</label><select class="input" id="tm-role">${roleOpts("ADMIN")}</select></div>
        <button class="btn btn-primary" id="tm-add">Add member</button>
        <span id="tm-msg" class="muted small"></span>
      </div></div>`;

  const msg = (t) => { document.getElementById("tm-msg").textContent = t; };
  const fail = (e) => { content.prepend(Object.assign(document.createElement("div"), { className: "alert", textContent: (e.data && e.data.error) ? e.data.error : e.message })); };

  content.querySelectorAll("button[data-save]").forEach(btn => btn.addEventListener("click", async () => {

  content.querySelectorAll("button[data-disable]").forEach(btn => btn.addEventListener("click", async () => {
    try { await MM.del(`/team/${encodeURIComponent(btn.dataset.disable)}`); await renderTeam(main); }

}

/* ---------- Backups (C2) ---------- */
async function renderBackups(main) {
  const content = main.querySelector("#content");
  const data = await MM.get("/routers");
  const devices = Array.isArray(data.routers) ? data.routers : asArray(data);
  if (!devices.length) {
    content.innerHTML = `<div class="empty"><div class="empty-title">No devices</div>Add a router to enable backups.</div>`;
    return;
  }
  content.innerHTML = `
    <div class="panel"><div class="panel-head"><h2 class="panel-title">Device</h2></div>
      <div class="panel-body">
        <select class="input" id="bk-dev">${devices.map(d => `<option value="${esc(d.device_id)}">${esc(d.hardware_name || d.device_id)}</option>`).join("")}</select>
        <div style="margin-top:12px;display:flex;gap:8px">
          <button class="btn btn-primary" id="bk-capture" disabled>Capture backup</button>
        </div>
        <p class="muted small" id="bk-availability" role="status">Checking backup availability…</p>
      </div>
    </div>
    <div class="panel" style="margin-top:14px"><div class="panel-head"><h2 class="panel-title">Backups</h2></div>
      <div class="panel-body" id="bk-list">${loading()}</div></div>
    <div class="panel" style="margin-top:14px"><div class="panel-head"><h2 class="panel-title">Change history</h2></div>
      <div class="panel-body" id="bk-hist">${loading()}</div></div>`;

  const dev = () => document.getElementById("bk-dev").value;
  let backupRefresh = 0;
  const refresh = async () => {
    const generation = ++backupRefresh, selectedDevice = dev();
    const list = content.querySelector("#bk-list"), hist = content.querySelector("#bk-hist");
    const capture = content.querySelector("#bk-capture"), availability = content.querySelector("#bk-availability");
    const active = () => content.isConnected && generation === backupRefresh;
    list.innerHTML = loading(); hist.innerHTML = loading(); capture.disabled = true;
    availability.textContent = "Checking backup availability…";
    let backups = [], changes = [], backupError = false, historyError = false, restoreAvailable = false;
    try {
      const r = await MM.get(`/devices/${encodeURIComponent(selectedDevice)}/backups`);
      if (!active()) return;
      backups = r.backups || []; restoreAvailable = r.restore_available === true;
      capture.disabled = r.capture_available !== true;
      availability.textContent = r.capture_available === true ? "Backup capture is available. Restore also requires a valid verification code." : "Backup capture is unavailable. Administrator permission and an enabled router connection are required.";
    } catch (_) {
      if (!active()) return;
      backupError = true;
      availability.textContent = "Backup availability could not be confirmed. Reload this page to retry.";
      list.innerHTML = '<p class="muted small" role="alert">Could not load backups. Reload this page to retry.</p>';
    }
    try { const r = await MM.get(`/devices/${encodeURIComponent(selectedDevice)}/changes`); changes = r.changes || []; }
    catch (_) { historyError = true; }
    if (!active()) return;

    if (!backupError && backups.length) {
      list.innerHTML = `<table><thead><tr><th>Label</th><th>Kind</th><th>Size</th><th>Created</th><th></th></tr></thead><tbody>` +
        backups.map(b => `<tr>
          <td><span class="num">${esc(b.label || "—")}</span></td>
          <td class="mono">${esc(b.kind)}</td>
          <td class="num">${esc(b.size_bytes)}</td>
          <td>${ts(b.created_at)}</td>
          <td>${restoreAvailable ? `<button class="btn btn-sm" data-restore="${esc(b.id)}">Restore</button>` : '<span class="muted small">Restore unavailable</span>'}</td>
        </tr>`).join("") + `</tbody></table>`;
      list.querySelectorAll("button[data-restore]").forEach(btn => {
        btn.addEventListener("click", async () => {
          const otp = prompt("Enter OTP for this high-risk restore:");
          if (otp === null) return;
          btn.disabled = true; btn.textContent = "…";
          try {
            await MM.post(`/devices/${encodeURIComponent(selectedDevice)}/restore/${encodeURIComponent(btn.dataset.restore)}`, { otp });
            btn.textContent = "Restored";
          } catch (e) {
            btn.disabled = false; btn.textContent = "Restore";
            list.appendChild(Object.assign(document.createElement("div"), { className: "alert", textContent: (e.data && e.data.error) ? e.data.error : e.message }));
          }
        });
      });
    } else if (!backupError) {
      list.innerHTML = `<div class="empty"><div class="empty-title">No backups</div>No saved configuration snapshots are available for this device.</div>`;
    }

    if (historyError) {
      hist.innerHTML = '<p class="muted small" role="alert">Could not load change history. Reload this page to retry.</p>';
    } else if (changes.length) {
      hist.innerHTML = `<table><thead><tr><th>When</th><th>Role</th><th>Action</th><th>Reason</th></tr></thead><tbody>` +
        changes.map(ch => `<tr><td>${ts(ch.timestamp)}</td><td class="mono">${esc(ch.user_role)}</td><td class="mono">${esc(ch.action)}</td><td class="muted small">${esc(ch.reason)}</td></tr>`).join("") +
        `</tbody></table>`;
    } else if (hist) {
      hist.innerHTML = `<div class="empty"><div class="empty-title">No changes yet</div>Backups and restores will appear here.</div>`;
    }
  };

  document.getElementById("bk-dev").addEventListener("change", refresh);
  document.getElementById("bk-capture").addEventListener("click", async () => {
    const btn = document.getElementById("bk-capture");
    if (btn.disabled) return;
    const selectedDevice = dev();
    btn.disabled = true; btn.textContent = "Capturing…";
    try { await MM.post(`/devices/${encodeURIComponent(selectedDevice)}/backups`, {}); }
    catch (e) { if (content.isConnected) content.prepend(Object.assign(document.createElement("div"), { className: "alert", textContent: (e.data && e.data.error) ? e.data.error : e.message })); }
    if (!content.isConnected) return;
    btn.textContent = "Capture backup";
    await refresh();
  });

  await refresh();
}

async function loadPlatformRenewals(panel) {
  if(!panel?.isConnected)return;
  const request=(panel._renewalRequest||0)+1;panel._renewalRequest=request;
  try {
    const data=await MM.get("/platform/account-renewals");
    if(!Array.isArray(data.requests))throw Error("Invalid renewal response");
    if(!panel.isConnected||panel._renewalRequest!==request)return;
    panel.innerHTML=`<h2>Client activation &amp; renewal requests</h2><p>Up to 100 pending requests, oldest first. Approval starts the selected calendar month or year immediately. Verify any payment separately before approving.</p><button class="btn" type="button" data-renewal-refresh>Refresh requests</button>${data.requests.length?data.requests.map(r=>`<form data-renewal-id="${esc(r.id)}" class="panel-body"><strong>${esc(r.email)}</strong><p>${esc(r.plan)} · Requested ${esc(ts(r.created_at))}</p><label><input type="checkbox" name="confirmed" required> I have reviewed this client's request and intend to record this decision.</label><button class="btn btn-primary" type="submit" data-decision="approve">Approve and activate</button><button class="btn" type="submit" data-decision="reject">Reject request</button><p role="status"></p></form>`).join(""):'<p>No pending requests.</p>'}`;
    panel.querySelector('[data-renewal-refresh]').addEventListener('click',()=>void loadPlatformRenewals(panel));
    panel.querySelectorAll('[data-renewal-id]').forEach(form=>form.addEventListener('submit',async e=>{
      e.preventDefault();const button=e.submitter,status=form.querySelector('[role="status"]');
      if(form.dataset.pending==="true"||!button||!form.reportValidity())return;
      form.dataset.pending="true";form.querySelectorAll('button').forEach(b=>b.disabled=true);status.textContent="Recording decision…";
      try { await MM.post(`/platform/account-renewals/${encodeURIComponent(form.dataset.renewalId)}/decision`,{approve:button.dataset.decision==="approve"});await loadPlatformRenewals(panel); }
      catch(err){status.textContent=apiErrorText(err,"Decision not confirmed. Refresh requests before retrying.");}
    }));
  }catch(_){if(panel.isConnected&&panel._renewalRequest===request){panel.innerHTML='<p role="alert">Renewal requests are unavailable. No empty inbox is inferred.</p><button class="btn" data-renewal-refresh>Retry</button>';panel.querySelector('button').addEventListener('click',()=>void loadPlatformRenewals(panel));}}
}

async function renderPlatform(main) {
  const content = main.querySelector("#content");
  let businesses = [], incidents = [], counts = {}, pricing = null, pricingPublished = false;
  try {
    const [b, c, i, p] = await Promise.all([
      MM.get("/platform/businesses"),
      MM.get("/platform/incidents/counts"),
      MM.get("/platform/incidents"),
      MM.get("/platform/pricing"),
    ]);
    businesses = (b && (b.businesses || b)) || [];
    counts = (c && c.counts) || {};
    incidents = (i && (i.incidents || i)) || [];
    pricing = p && p.pricing ? p.pricing : null;
    pricingPublished = !!(p && p.published);
  } catch (e) {
    if (e.status === 403) {
      content.innerHTML = `<div class="panel"><div class="panel-body">
        <div class="empty"><div class="empty-title">Developer access required</div>
        This console is limited to platform operators. Ask the platform owner for a DEVELOPER token.</div></div></div>`;
      return;
    }
    throw e;
  }

  content.innerHTML = `
    <div class="stat-cluster" style="margin-top:18px">
      <div class="stat"><div class="stat-label">Businesses</div><div class="stat-value">${businesses.length}</div></div>
      <div class="stat"><div class="stat-label">Open incidents</div><div class="stat-value">${counts.open ?? 0}</div></div>
      <div class="stat"><div class="stat-label">Resolved</div><div class="stat-value">${counts.resolved ?? 0}</div></div>
    </div>
    <hr class="rule">
    <section class="panel" id="platform-accounts"><div class="panel-head"><div><h2 class="panel-title">Accounts, passes &amp; usage</h2><p class="muted small">One authorized login, one site and one router for each client workspace. Monthly and annual passes share features; account access is separate from observed app presence.</p></div></div><div class="panel-body"><div data-account-results>${loading()}</div></div></section>
    <section class="panel"><div class="panel-body" id="platform-renewals">Loading renewal requests…</div></section>
    ${platformPricingForm(pricing, pricingPublished)}

    ${platformCreateForm()}
    <div class="panel"><div class="panel-head"><h2 class="panel-title">Workspace records</h2></div>
      <div class="panel-body"><p class="muted">The tier and quota fields below are legacy records. Current individual-pass allowances are shown in Accounts, passes &amp; usage above.</p>${platformBusinessTable(businesses, ME && ME.business ? ME.business.business_id : null)}</div></div>
    <div class="panel" style="margin-top:14px"><div class="panel-head"><h2 class="panel-title">Open incidents</h2></div>
      <div class="panel-body">${platformIncidentTable(incidents, businesses)}</div></div>`;
  await wirePlatformAdmin(content, main);
  void loadPlatformAccounts(content.querySelector("#platform-accounts"), 0);
  void loadPlatformRenewals(content.querySelector("#platform-renewals"));
}

async function wirePlatformAdmin(content, main) {
  const msg = (t) => { const el = document.getElementById("pt-msg"); if (el) el.textContent = t; };
  const fail = (e) => {
    const t = (e.data && e.data.error) ? e.data.error : e.message;
    content.prepend(Object.assign(document.createElement("div"), { className: "alert", textContent: t }));
  };

  const create = document.getElementById("pt-create");
  if (create) create.addEventListener("click", async () => {
    const quota = parseInt(document.getElementById("pt-quota").value, 10);
    const body = {
      company_name: document.getElementById("pt-company").value.trim(),
      owner_email: document.getElementById("pt-email").value.trim(),
      owner_password: document.getElementById("pt-pass").value,
      access_tier: document.getElementById("pt-tier").value,
    };
    if (!body.company_name || !body.owner_email || body.owner_password.length < 8) { msg("Company, email and an 8+ char password are required."); return; }
    if (!isNaN(quota) && quota > 0) body.device_quota_limit = quota;
    create.disabled = true; msg("creating…");
    try { await MM.post("/platform/businesses", body); await renderPlatform(main); }
    catch (e) { create.disabled = false; msg(""); fail(e); }
  });

  const pricingSave = document.getElementById("pp-save");
  if (pricingSave) pricingSave.addEventListener("click", async () => {
    const msgEl = document.getElementById("pp-msg");
    const msg = (t) => { if (msgEl) msgEl.textContent = t; };
    const numberOrNull = (id) => {
      const raw = document.getElementById(id).value.trim();
      if (!raw) return null;
      const n = Number(raw);
      return Number.isSafeInteger(n) ? n : NaN;
    };
    const body = {
      active: document.getElementById("pp-active").checked,
      starts_on: document.getElementById("pp-starts").value || null,
      ends_on: document.getElementById("pp-ends").value || null,
      label: document.getElementById("pp-label").value.trim() || null,
      monthly_promo_mmk: numberOrNull("pp-monthly-promo"),
      monthly_standard_mmk: numberOrNull("pp-monthly-standard"),
      annual_promo_mmk: numberOrNull("pp-annual-promo"),
      annual_standard_mmk: numberOrNull("pp-annual-standard"),
    };
    if (Object.values(body).some((v) => typeof v === "number" && !Number.isSafeInteger(v))) { msg("Prices must be whole numbers."); return; }
    pricingSave.disabled = true; msg("publishing…");
    try { await MM.put("/platform/pricing", body); msg("published ✓"); await renderPlatform(main); }
    catch (e) { pricingSave.disabled = false; msg((e.data && e.data.error) || e.message || "publish failed"); }
  });

  content.querySelectorAll("button[data-susp]").forEach(btn => btn.addEventListener("click", async () => {
    const id = btn.dataset.susp, act = btn.dataset.act === "suspend" ? "suspend" : "unsuspend";
    btn.disabled = true; btn.textContent = "…";
    try { await MM.post(`/platform/businesses/${encodeURIComponent(id)}/${act}`, {}); await renderPlatform(main); }
    catch (e) { btn.disabled = false; btn.textContent = "Retry"; fail(e); }
  }));

  content.querySelectorAll("button[data-resetpw]").forEach(btn => btn.addEventListener("click", async () => {
    const id = btn.dataset.resetpw;
    const pw = prompt("New owner password (8+ chars):");
    if (pw === null) return;
    if (pw.length < 8) { fail({ message: "password must be 8+ chars" }); return; }
    try { await MM.post(`/platform/businesses/${encodeURIComponent(id)}/reset-owner-password`, { new_password: pw }); btn.textContent = "reset ✓"; }
    catch (e) { fail(e); }
  }));

  content.querySelectorAll("button[data-state]").forEach(btn => btn.addEventListener("click", async () => {
    const id = btn.dataset.state;
    try {
      const s = await MM.get(`/platform/businesses/${encodeURIComponent(id)}/state`);
      alert([
        "Company: " + s.company_name,
        "Tier: " + s.access_tier,
        "Active: " + s.is_active,
        "Owner: " + s.owner_email,
        "Devices: " + s.device_count + " / " + s.device_quota_limit,
        "Open incidents: " + s.open_incidents,
        "Extra slots: " + s.purchased_extra_slots,
        "AI tokens: " + s.ai_token_balance,
      ].join("\n"));
    } catch (e) { fail(e); }
  }));
}

       ${subscription.enforced?'<details><summary>Legacy capacity records</summary>':""}<p>Devices: ${number(l.device_count)} / base quota ${number(l.device_quota_limit)} · extra slots ${number(l.extra_slots)}</p>
       <p>Routers: ${number(l.router_count)} / ${capacity(l.router_limit)} · Sites: ${number(l.site_count)} / ${capacity(l.site_limit)} · Controllers: ${number(l.controller_count)} / ${number(l.controller_limit)}</p>

async function loadPlatformAccounts(panel, offset = 0) {
  if (!panel?.isConnected) return;
  if (panel._accountTimer) clearTimeout(panel._accountTimer);
  const expanded = new Set([...panel.querySelectorAll("details[open][data-account-id]")].map(item=>item.dataset.accountId));
  const focusedDetails = document.activeElement?.closest("details[data-account-id]")?.dataset.accountId;
  const request = (panel._accountRequest || 0) + 1;
  panel._accountRequest = request;
  const results = panel.querySelector("[data-account-results]");
  try {
    const data = await MM.get(`/platform/accounts?limit=50&offset=${offset}`);
    if (!panel.isConnected || panel._accountRequest !== request) return;
    results.innerHTML = `<p class="muted small">Observed ${esc(ts(data.as_of))}. Refreshes every 30 seconds while this page is visible. Online: app visible within 90 seconds, activity within 5 minutes and a recent heartbeat. Idle: recent heartbeat without active visible use. Offline: no recent valid-session heartbeat. Not observed: no heartbeat recorded yet. Suspended accounts stay separate.</p>
      <div class="platform-account-controls"><span>${data.total?offset+1:0}–${Math.min(offset+data.accounts.length,data.total)} of ${esc(data.total)} accounts</span><button class="btn btn-sm" data-accounts-prev ${offset===0?"disabled":""}>Previous</button><button class="btn btn-sm" data-accounts-next ${offset+data.limit>=data.total?"disabled":""}>Next</button><button class="btn btn-sm" data-accounts-refresh>Refresh presence</button></div>${platformAccountTable(data.accounts)}`;
    panel.querySelectorAll("[data-authorize-client]").forEach(form=>form.addEventListener("submit",async event=>{
      event.preventDefault();const button=form.querySelector("button"),status=form.querySelector('[role="status"]');if(button.disabled||!form.reportValidity())return;button.disabled=true;status.textContent="Saving selection…";
      try { await MM.put(`/platform/accounts/${encodeURIComponent(form.dataset.authorizeClient)}/authorized-login`,{expected_primary_user_id:form.dataset.expectedPrimary,reason:form.elements.reason.value.trim()});await loadPlatformAccounts(panel,offset); }
      catch(e){status.textContent=apiErrorText(e,"Selection not confirmed. Refresh accounts before retrying.");}
    }));
    panel.querySelectorAll("[data-record-pass]").forEach(form=>form.addEventListener("submit",async event=>{
      event.preventDefault();const button=event.submitter||form.querySelector("button"),status=form.querySelector('[role="status"]');if(form.dataset.pending==="true"||button.disabled||!form.reportValidity())return;form.dataset.pending="true";
      button.disabled=true;status.textContent="Saving…";
      try { await MM.put(`/platform/accounts/${encodeURIComponent(form.dataset.recordPass)}/pass`,{plan:form.elements.plan.value,action:button.dataset.passAction||"activate",revision:Number(form.dataset.revision)});await loadPlatformAccounts(panel,offset); }
      catch(e){status.textContent=apiErrorText(e,"Pass decision was not confirmed. Refresh before retrying.");button.disabled=false;form.dataset.pending="false";}
    }));
    panel.querySelectorAll("details[data-account-id]").forEach(item=>{
      item.open = expanded.has(item.dataset.accountId);
      if (item.dataset.accountId === focusedDetails) item.querySelector("summary").focus({preventScroll:true});
    });
    const refreshWhenVisible = () => {
      if (!panel.isConnected) return;
      if (document.visibilityState === "visible" && !panel.querySelector("form:focus-within,form[data-pending=\"true\"]")) void loadPlatformAccounts(panel, offset);
      else panel._accountTimer = setTimeout(refreshWhenVisible, 30000);
    };
    panel._accountTimer = setTimeout(refreshWhenVisible, 30000);
    panel.querySelector("[data-accounts-prev]").onclick=()=>void loadPlatformAccounts(panel,Math.max(0,offset-50));
    panel.querySelector("[data-accounts-next]").onclick=()=>void loadPlatformAccounts(panel,offset+50);
    panel.querySelector("[data-accounts-refresh]").onclick=()=>void loadPlatformAccounts(panel,offset);
  } catch(error) {
    if (!panel.isConnected || panel._accountRequest !== request) return;
    results.innerHTML='<p class="alert" role="status">Account pass, usage and presence data is unavailable. No account is assumed offline and no missing quota is shown as zero.</p><button class="btn btn-sm" data-accounts-retry>Retry account data</button>';
    panel.querySelector("[data-accounts-retry]").onclick=()=>void loadPlatformAccounts(panel,offset);
  }
}

    return `
    <tr>
      <td><span class="num">${esc(b.company_name)}</span></td>
      <td>${esc(b.owner_email)}</td>
      <td><span class="mono">${esc(b.access_tier)}</span></td>
      <td class="num">${esc(b.device_quota_limit)}</td>
      <td>${b.is_active ? `<span class="status ok">Active</span>` : `<span class="status unknown">Suspended</span>`}</td>
      <td>${ts(b.created_at)}</td>
      <td>
        ${suspBtn}
        <button class="btn btn-sm" data-resetpw="${esc(b.business_id)}">Reset pw</button>
        <button class="btn btn-sm" data-state="${esc(b.business_id)}">View state</button>
      </td>
    </tr>`; }).join("");
  return `<table><thead><tr><th>Company</th><th>Owner</th><th>Legacy tier</th><th>Legacy device quota</th><th>Status</th><th>Created</th><th></th></tr></thead><tbody>${rows}</tbody></table>`;
}

function platformIncidentTable(list, bizs) {
  if (!list.length) return `<div class="empty"><div class="empty-title">No open incidents</div>Cross-tenant incidents will appear here.</div>`;
  const rows = list.map(inc => `
    <tr>
      <td>${sevBadge(inc.severity || "info")}</td>
      <td><span class="mono">${esc(inc.kind)}</span></td>
      <td><span class="num">${esc(bizName(bizs, inc.business_id))}</span></td>
      <td><span class="num">${esc(inc.subject_label || inc.subject_id || "—")}</span></td>
      <td>${ts(inc.opened_at)}</td>
    </tr>`).join("");
  return `<table><thead><tr><th>Severity</th><th>Kind</th><th>Business</th><th>Subject</th><th>Opened</th></tr></thead><tbody>${rows}</tbody></table>`;
}

/* ---------- Personal profile ---------- */
function profileInitials(name) {
  return String(name || "U").trim().split(/\s+/).slice(0, 2).map(part => part[0] || "").join("").toUpperCase() || "U";
}

async function profileAssetURL(kind) {
  const response = await fetch(`/api/v1/me/profile/${kind}`, {
    cache: "no-store",
  });
  if (response.status === 404) return "";
  if (!response.ok) throw new Error(`Could not load ${kind} image.`);
  return URL.createObjectURL(await response.blob());
}

async function putProfileAsset(kind, file) {
  const form = new FormData(); form.append("file", file);
  const response = await fetch(`/api/v1/me/profile/${kind}`, {
    method: "POST", headers: { "X-MM-CSRF": "1" }, body: form,
  });
  const data = await response.json().catch(() => ({}));
  if (!response.ok) throw new Error(data.error || `Could not save ${kind} image.`);
  return data;
}

async function renderProfile(main) {

      const rawUser = main.querySelector("#telegram-user").value.trim();

  main.querySelector("#telegram-test").addEventListener("click", async () => {

      message.textContent = result.ok ? `Bot verified: ${result.detail || "Telegram accepted the token."}` : `Bot check failed: ${result.detail || "unknown error"}`;
    } catch (error) { message.textContent = apiErrorText(error, "Could not verify Telegram bot."); }

  for (const kind of ["avatar", "cover"]) {
    main.querySelector(`#profile-${kind}-file`).addEventListener("change", async event => {
      const file = event.target.files && event.target.files[0]; if (!file) return;
      const message = main.querySelector("#profile-message"); message.textContent = `Uploading ${kind}…`;
      try { await putProfileAsset(kind, file); await renderProfile(main); }

  }
  main.querySelectorAll("[data-remove-profile-asset]").forEach(button => button.addEventListener("click", async () => {
    try { await MM.del(`/me/profile/${button.dataset.removeProfileAsset}`); await renderProfile(main); }
    catch (error) { main.querySelector("#profile-message").textContent = apiErrorText(error, "Could not remove image."); }
  }));
}
