  const showErr = (e) => {
    // Tenant-safe, human error surfacing (401/403/503 included).
    if (e.status === 403) return alert("You do not have permission for this action (OWNER/ADMIN required).");
    alert((e.data && (e.data.reason || e.data.error)) ? (e.data.reason || e.data.error) : e.message);
  };

  document.getElementById("site-add")?.addEventListener("click", () => {
    const f = document.getElementById("site-form");
    f.hidden = !f.hidden;
    if (!f.hidden) refreshRouterCapacityState();
  });

  const refreshRouterCapacityState = () => {
    const layer = document.getElementById("sr-layer").value;
    const save = document.getElementById("sr-save");
    const msg = document.getElementById("sr-msg");
    const kind = layer === "CONTROLLER" ? "controllers"
      : ((layer === "MAIN_GATEWAY" || layer === "DOWNSTREAM_SWITCH") ? "routers" : null);
    const usedKey = kind === "routers" ? "used_routers" : "used_controllers";
    const exhausted = capacityLimitsEnabled && !!(allowance && kind && Number(allowance[usedKey] || 0) >= Number(allowance[kind] || 0));
    save.disabled = exhausted;
    msg.textContent = exhausted
      ? `No ${kind} capacity remains. Submit a capacity request first.`
      : "";
  };
  document.getElementById("sr-layer").addEventListener("change", refreshRouterCapacityState);

  document.getElementById("sr-save").addEventListener("click", async () => {
    const body = {
      hardware_name: document.getElementById("sr-name").value.trim(),
      device_model: document.getElementById("sr-model").value.trim() || null,
      deployment_layer: document.getElementById("sr-layer").value,
      management_ip: gatewayOnly ? null : (document.getElementById("sr-ip").value.trim() || null),
      mac_address: gatewayOnly ? null : (document.getElementById("sr-mac").value.trim() || null),
      vendor: "mikrotik",
      category: ({MAIN_GATEWAY: "gateway", DOWNSTREAM_SWITCH: "switch", ACCESS_POINT: "ap", CONTROLLER: "controller"})[document.getElementById("sr-layer").value],
      transport: gatewayOnly ? "tunnel" : "direct",
    };
    if (!body.hardware_name) { document.getElementById("sr-msg").textContent = "Hardware name is required."; return; }
    const selectedSite = gatewayOnly ? document.getElementById("sr-site").value : "";
    if (gatewayOnly && !sites.some(s=>s.site_id===selectedSite)) { document.getElementById("sr-msg").textContent = "Choose a business site first."; return; }
    const save = document.getElementById("sr-save");
    if (save.disabled) return;
    save.disabled = true;
    try {
      const result = await MM.post("/routers", body);
      if (gatewayOnly && result.router?.device_id) {
        try { await MM.put(`/vps/peers/${encodeURIComponent(result.router.device_id)}/site`, {site_id:selectedSite}); }
        catch (e) { await renderSites(main, workspace); showErr(e); return; }
      }
      await renderSites(main, workspace);
      if (gatewayOnly && result.router?.device_id && content.isConnected) {
        const wizard = Array.from(content.querySelectorAll('[data-hub-enrollment]')).find(el => el.dataset.hubEnrollment === result.router.device_id);
        if (wizard) { wizard.open = true; wizard.scrollIntoView({block:'center',behavior:'smooth'}); wizard.querySelector('[data-hub-bootstrap]')?.click(); }
      }
    }
    catch (e) { showErr(e); }
    finally { if (save.isConnected) save.disabled = false; }
  });

  content.querySelectorAll("button[data-edit]").forEach(btn => btn.addEventListener("click", () => {
    openEditRouter(main, routers.find(r => r.device_id === btn.dataset.edit));
  }));

  wireRouterRemoval(content, main, routers, workspace, showErr);

  content.querySelectorAll("button[data-reboot]").forEach(btn => btn.addEventListener("click", async () => {
    const id = btn.dataset.reboot;
    if (!confirm("Reboot this router now? This interrupts connectivity briefly.")) return;
    try {
      const r = await MM.post(`/topology/${encodeURIComponent(id)}/reboot`, {});
      alert(r && r.status ? r.status : "Reboot queued for approval.");
    } catch (e) { showErr(e); }
  }));

  content.querySelectorAll("button[data-router-topology]").forEach(btn => btn.addEventListener("click", () => {
    sessionStorage.setItem("mm_topology_router", btn.dataset.routerTopology);
    location.hash = "topology";
  }));

  const capabilityDialog = document.getElementById("router-capability-dialog");
  const capabilityContent = document.getElementById("router-capability-content");
  capabilityDialog.querySelectorAll("[data-capability-close]").forEach(button => button.addEventListener("click", () => capabilityDialog.close()));
  const capabilityFact = (label, value) => `<div><span>${esc(label)}</span><strong>${esc(value)}</strong></div>`;
  const menuState = (menu) => !menu || !menu.supported ? "Not detected" : (menu.configured ? `${menu.count} configured` : "Available · not configured");
  content.querySelectorAll("button[data-router-capability]").forEach(button => button.addEventListener("click", async () => {
    const router = routers.find(item => item.device_id === button.dataset.routerCapabilityDevice);
    const caps = capabilityByID.get(button.dataset.routerCapabilityDevice) || {};
    const kind = button.dataset.routerCapability;
    const localRadios = Number((caps.modern_wifi && caps.modern_wifi.count) || 0) + Number((caps.legacy_wireless && caps.legacy_wireless.count) || 0);
    const controllerAvailable = !!((caps.modern_capsman && caps.modern_capsman.supported) || (caps.legacy_capsman && caps.legacy_capsman.supported));
    const common = `<span class="fleet-kicker">ROUTER TOOLS</span><h2>${esc(router && router.hardware_name || "Router")}</h2><p class="muted">These options are based on the services and interfaces reported by this router.</p>`;
    let body = "";
    if (caps.error) {
      body = `${common}<div class="alert">${esc(caps.error)}</div>`;
    } else if (kind === "gateway") {
      capabilityContent.innerHTML = `${common}<h3>Quick Config</h3>${loading()}`;
      capabilityDialog.showModal();
      try {
        const response = await MM.get(`/routers/${encodeURIComponent(router.device_id)}/quick-config`);
        const current = response.config || {};
        const canApply = canEdit && response.write_enabled === true;
        body = `${common}<h3>Gateway basics</h3><p>${canApply ? "Change the router name and DNS settings. Mega Magic saves a backup first, confirms the new values after applying them, and restores the previous values if the check fails." : "Read-only settings. Router changes require an owner or administrator and an accepted, write-enabled deployment."}</p>
          <div class="router-capability-facts">${capabilityFact("Board", caps.board_name || "Reported by RouterOS")}${capabilityFact("RouterOS", caps.routeros_version || "Unknown")}${capabilityFact("DHCP server", menuState(caps.dhcp_server))}${capabilityFact("Hotspot", menuState(caps.hotspot))}</div>
          ${canApply ? `<div class="quick-config-form">
            <label>Router identity<input class="input" id="quick-identity" maxlength="63" value="${esc(current.identity || "")}" autocomplete="off"></label>
            <label>DNS servers<input class="input" id="quick-dns" value="${esc(asArray(current.dns_servers).join(", "))}" placeholder="1.1.1.1, 8.8.8.8" inputmode="text" autocomplete="off"><span>Comma-separated IPv4 or IPv6 addresses.</span></label>
            <label class="quick-config-check"><input id="quick-remote-dns" type="checkbox"${current.allow_remote_dns ? " checked" : ""}><span><strong>Answer DNS requests from clients</strong><small>Needed when hotspot and LAN clients use this router as their DNS resolver.</small></span></label>
            <div id="quick-config-status" role="status"></div>
            <button class="btn btn-primary" type="button" id="quick-config-apply">Backup and apply to RouterOS</button>
          </div><p><button class="btn" data-capability-view="network">Open customer network setup</button></p>` : `<dl><dt>Identity</dt><dd>${esc(current.identity || "Not reported")}</dd><dt>DNS servers</dt><dd>${esc(asArray(current.dns_servers).join(", ") || "Not reported")}</dd></dl>`}`;
      } catch (error) {
        body = `${common}<div class="alert">${esc((error.data && error.data.error) || error.message)}</div>`;
      }
    } else if (kind === "hotspot") {
      body = `${common}<h3>Hotspot gateway</h3><div class="router-capability-facts">${capabilityFact("Hotspot service", menuState(caps.hotspot))}${capabilityFact("DHCP server", menuState(caps.dhcp_server))}${capabilityFact("RADIUS", menuState(caps.radius))}${capabilityFact("Access layer", localRadios ? `${localRadios} onboard radio(s)` : "External or controller-managed APs")}</div><p>The captive portal, address pools, DHCP and RADIUS belong to the gateway. SSIDs belong to whichever access points serve this gateway.</p><button class="btn btn-primary" type="button" data-capability-view="portal">Open captive portal settings</button>`;
    } else if (kind === "wireless") {
      body = `${common}<h3>Wi-Fi and access points</h3><div class="router-capability-facts">${capabilityFact("Onboard radios", String(localRadios))}${capabilityFact("CAPsMAN", controllerAvailable ? "Control menu available" : "Not detected")}${capabilityFact("Expected layout", localRadios ? "Local wireless interfaces" : "External access points")}</div><p>${localRadios ? "SSID and radio controls can be scoped to the detected wireless interfaces." : "No onboard radio was detected. This does not disable hotspot gateway features; attach or manage access points separately."}</p><button class="btn" type="button" data-capability-view="topology">View access-layer topology</button>`;
    } else {
      const httpsEnabled = !!(caps.webfig && caps.webfig.https_enabled);
      const ready = httpsEnabled && !!(caps.webfig && caps.webfig.trusted_only);
      body = `${common}<h3>Secure WebFig</h3><div class="router-capability-facts">${capabilityFact("HTTPS WebFig", httpsEnabled ? "Enabled" : "Not enabled")}${capabilityFact("HTTPS port", caps.webfig && caps.webfig.https_port ? String(caps.webfig.https_port) : "—")}${capabilityFact("Restricted to trusted addresses", caps.webfig && caps.webfig.trusted_only ? "Yes" : "Needs attention")}</div><p>${ready ? "HTTPS WebFig is restricted to the management networks configured for this Mega Magic deployment." : "Mega Magic can create a router certificate when needed, enable HTTPS WebFig only on trusted management networks, disable plaintext WebFig, and verify the result."}</p><p class="muted">A router-generated certificate can show a browser trust warning until its certificate is installed on your device. Access also requires a route to the trusted management network.</p><div id="webfig-status" role="status"></div>${canEdit ? `<button class="btn btn-primary" type="button" id="webfig-secure">${ready ? "Re-verify and enforce secure WebFig" : "Backup and configure secure WebFig"}</button>` : ""}`;
    }
    capabilityContent.innerHTML = body;
    const quickApply = capabilityContent.querySelector("#quick-config-apply");
	    wireGatewaySetup(capabilityContent, router);
    const webfigSecure = capabilityContent.querySelector("#webfig-secure");
    if (webfigSecure) webfigSecure.addEventListener("click", async () => {
      const status = capabilityContent.querySelector("#webfig-status");
      if (!confirm(`Secure WebFig on ${router.hardware_name}? Mega Magic will back up RouterOS, restrict HTTPS to trusted management networks, and disable plaintext WebFig.`)) return;
      webfigSecure.disabled = true; webfigSecure.textContent = "Backing up and configuring…"; status.textContent = "";
      try {
        const response = await MM.post(`/routers/${encodeURIComponent(router.device_id)}/webfig/secure`, {});
        const result = response.result || {};
        status.innerHTML = `<div class="security-action-result is-success"><span class="security-action-icon" aria-hidden="true">✓</span><div><strong>Secure WebFig configured and verified on RouterOS</strong><p>Plain HTTP is disabled. HTTPS is limited to trusted management networks.</p>${result.url ? `<a class="btn" href="${esc(result.url)}" target="_blank" rel="noopener noreferrer">Open WebFig</a>` : ""}<details><summary>Backup details</summary><code>${esc(result.backup || "On-device backup captured")}</code></details></div></div>`;
        webfigSecure.textContent = "Configured and verified";
      } catch (error) {
        const result = (error.data && error.data.result) || {};
        status.innerHTML = `<div class="security-action-result is-error"><span class="security-action-icon" aria-hidden="true">!</span><div><strong>${esc((error.data && error.data.error) || error.message)}</strong><p>${result.rolled_back ? "Previous WebFig service settings were restored." : "No verified change was reported."}</p></div></div>`;
        webfigSecure.disabled = false; webfigSecure.textContent = "Retry secure WebFig setup";
      }
    });
    if (quickApply) quickApply.addEventListener("click", async () => {
      const identity = capabilityContent.querySelector("#quick-identity").value.trim();
      const dnsServers = capabilityContent.querySelector("#quick-dns").value.split(",").map(value => value.trim()).filter(Boolean);
      const allowRemoteDNS = capabilityContent.querySelector("#quick-remote-dns").checked;
      const status = capabilityContent.querySelector("#quick-config-status");
      if (!confirm(`Apply Quick Config to ${router.hardware_name}? Mega Magic will create a backup and verify the router after writing.`)) return;
      quickApply.disabled = true;
      quickApply.textContent = "Backing up and applying…";
      status.innerHTML = "";
      try {
        const response = await MM.put(`/routers/${encodeURIComponent(router.device_id)}/quick-config`, { identity, dns_servers: dnsServers, allow_remote_dns: allowRemoteDNS });
        const result = response.result || {};
        status.innerHTML = `<div class="security-action-result is-success"><span class="security-action-icon" aria-hidden="true">✓</span><div><strong>Quick Config applied and verified on RouterOS</strong><details><summary>Backup details</summary><code>${esc(result.backup || "On-device backup captured")}</code></details></div></div>`;
        quickApply.textContent = "Applied and verified";
      } catch (error) {
        const message = (error.data && error.data.error) || error.message;
        const rolledBack = !!(error.data && error.data.rolled_back);
        status.innerHTML = `<div class="security-action-result is-error"><span class="security-action-icon" aria-hidden="true">!</span><div><strong>${esc(message)}</strong><p>${rolledBack ? "Previous RouterOS settings were restored." : "No verified change was reported."}</p></div></div>`;
        quickApply.disabled = false;
        quickApply.textContent = "Backup and apply to RouterOS";
      }
    });
    capabilityContent.querySelectorAll("[data-capability-view]").forEach(link => link.addEventListener("click", () => {
      capabilityDialog.close();
      location.hash = link.dataset.capabilityView;
    }));
    if (!capabilityDialog.open) capabilityDialog.showModal();
  }));

  routers.forEach(router => { loadRouterCapability(content, router, capabilityByID); });

  if (gatewayOnly) {
    MMHubManagement.mount(content.querySelector("#hub-management"), routers, canEdit, MM);
    wireHubLookup(content); wireConns(main, conns, sites);
    const {mountHubEnrollment}=await import("/assets/js/hub-enrollment.js?v=20261029-existing-connection");
    if(content.isConnected)mountHubEnrollment(content,{api:MM,escape:esc,onVerified:async deviceID=>{
      const data=await MM.get('/routers');if(!content.isConnected)return;
      const updated=asArray(data.routers||data).find(r=>r.device_id===deviceID);
      const router=routers.find(r=>r.device_id===deviceID);if(!router||!updated)return;
      Object.assign(router,updated);
      const address=[...content.querySelectorAll('[data-router-management-ip]')].find(el=>el.dataset.routerManagementIp===deviceID);
      if(address)address.textContent=router.management_ip||'Not registered';
      await loadRouterCapability(content,router,capabilityByID);
    }});
  }
  else if (capacityLimitsEnabled) wireAllowance(main, allowance, requests, allowanceKinds);
}

async function renderNetworkSetup(main) {
  const content = main.querySelector("#content");
  const data = await MM.get("/routers");
  if (!content.isConnected) return;
  const routers = (Array.isArray(data.routers) ? data.routers : asArray(data)).filter(r => r.deployment_layer === "MAIN_GATEWAY");
  const canEdit = SITE_EDITOR_ROLES.includes(ME?.user?.user_role);
  content.innerHTML = `<section class="panel network-workspace"><header><p class="network-eyebrow">CUSTOMER LAN AND HOTSPOT</p><p>Your saved Magic Hub connection is reused. Create a customer network only when needed; opening this page does not reconfigure your gateway.</p></header>
    <label>Working gateway<select class="input" id="network-router"><option value="">Select a gateway for this change</option>${routers.map(r=>`<option value="${esc(r.device_id)}">${esc(r.hardware_name)}</option>`).join("")}</select></label>
    <div id="network-editor" aria-live="polite">${routers.length ? "Opening this page changes nothing on the router." : 'Connect a gateway from <a href="#gateways">Gateways</a> first.'}</div></section>`;
  const editor = content.querySelector("#network-editor"), select = content.querySelector("#network-router");
  let revision = 0;
  const loadGateway = async () => {
    if (select.disabled) return;
    const request = ++revision, router = routers.find(r=>r.device_id === select.value);
    try {
      if (router) sessionStorage.setItem("mm_selected_router", router.device_id);
      else sessionStorage.removeItem("mm_selected_router");
    } catch (_) { /* Storage is optional; router access still uses the saved connection. */ }
    editor.textContent = router ? "Reading router interfaces and checking addresses and routes…" : "Choose a gateway to continue.";
    if (!router) return;
    try {
      const endpoint = `/routers/${encodeURIComponent(router.device_id)}/gateway/`;
      const [inventory, suggested] = await Promise.all([MM.get(endpoint+"interfaces"), MM.get(endpoint+"defaults")]);
      if (!editor.isConnected || revision !== request) return;
      editor.innerHTML = canEdit ? gatewaySetupForm(asArray(inventory.interfaces), suggested.defaults) : "An owner or administrator must apply network changes.";
      if (canEdit) wireGatewaySetup(editor, router, select);
    } catch (e) {
      if (editor.isConnected && revision === request) editor.textContent = `Could not read this gateway's network safely. Check its Magic Hub connection and retry by selecting the gateway again. No settings were applied. ${(e.data && e.data.error) || e.message}`;
    }
  };
  select.addEventListener("change", loadGateway);
  let saved = "";
  try { saved = sessionStorage.getItem("mm_selected_router") || ""; } catch (_) {}
  const selected = routers.find(router=>router.device_id === saved) || (routers.length === 1 ? routers[0] : null);
  if (selected) { select.value = selected.device_id; await loadGateway(); }
}

function gatewaySetupForm(interfaces, defaults = {}) {
  const optionsFor = list => `<option value="">Choose an interface</option>` + list.map(i => `<option value="${esc(i.name)}">${esc(i.name)} · ${esc(i.type || "interface")}${i.running ? " · running" : ""}</option>`).join("");
  const options = optionsFor(interfaces.filter(i=>i.type !== "loopback"));
  const lanOptions = optionsFor(interfaces.filter(i=>["ether","bridge","bond","vlan","wlan","wifi","wireless"].includes(i.type)));
  return `<hr><h3>Create a customer network</h3><p>Set up a separate LAN for your access points and guests. Your existing uplink, default route and management settings stay unchanged. Existing firewall rules may still require a separate review before guests can reach the internet.</p>
    <form id="gateway-setup-form" class="quick-config-form">
      <label>Network name<input class="input" name="name" required maxlength="24" pattern="[A-Za-z0-9][A-Za-z0-9_-]*" value="${esc(defaults.name || "guest-lan")}"></label>
      <label>Internet uplink<select class="input" name="wan_interface" required>${options}</select></label>
      <label>Customer LAN / AP-facing bridge<select class="input" name="lan_interface" required>${lanOptions}</select><small>Choose an unused customer-facing port or bridge, not the uplink or a bridge member. Loopback and management tunnels are not customer LAN choices. If no separate port is available, prepare a customer bridge/VLAN or add a router interface first.</small></label>
      <label>Tagged VLAN (optional)<input class="input" name="vlan_id" type="number" min="0" max="4094" value="0"><small>0 = untagged. Tagged clients/APs must use the same VLAN.</small></label>
      <p>Suggested addresses are checked against existing addresses and routes, then checked again before applying. Port roles are never guessed.</p>
      <details${defaults.gateway_cidr ? "" : " open"}><summary>Address settings${defaults.gateway_cidr ? " · " + esc(defaults.gateway_cidr) + " (suggested)" : ""}</summary>
      <label>Gateway address / prefix<input class="input" name="gateway_cidr" required value="${esc(defaults.gateway_cidr || "")}" placeholder="192.168.50.1/24"></label>
      <label>First DHCP address<input class="input" name="pool_start" required value="${esc(defaults.pool_start || "")}" placeholder="192.168.50.10"></label>
      <label>Last DHCP address<input class="input" name="pool_end" required value="${esc(defaults.pool_end || "")}" placeholder="192.168.50.250"></label>
      <label>Client DNS servers<input class="input" name="dns_servers" required value="1.1.1.1, 8.8.8.8"></label>
      </details>
      <label class="quick-config-check"><input name="hotspot" type="checkbox" checked><span>Enable Hotspot captive login and bank-transfer grace access</span></label>
      <label>RADIUS server (optional)<input class="input" name="radius_address" placeholder="10.0.0.10" autocomplete="off"><small>Connect an existing RADIUS server; this does not install one.</small></label>
      <label>RADIUS shared secret<input class="input" name="radius_secret" type="password" minlength="8" maxlength="128" autocomplete="new-password"></label>
      <button class="btn" type="submit" id="gateway-preview">Check router and preview changes</button>
      <div id="gateway-status" role="status"></div>
      <button class="btn btn-primary" type="button" id="gateway-apply" hidden>Backup and apply customer network</button>
    </form>`;
}

function wireGatewaySetup(container, router, targetSelect) {
  const form = container.querySelector("#gateway-setup-form");
  if (!form || !router) return;
  const status = form.querySelector("#gateway-status"), apply = form.querySelector("#gateway-apply"), preview = form.querySelector("#gateway-preview");
  let approved = null, revision = 0, applying = false;
  const payload = () => { const f = new FormData(form); return {name:f.get("name").trim(),wan_interface:f.get("wan_interface"),lan_interface:f.get("lan_interface"),vlan_id:Number(f.get("vlan_id")),gateway_cidr:f.get("gateway_cidr").trim(),pool_start:f.get("pool_start").trim(),pool_end:f.get("pool_end").trim(),dns_servers:f.get("dns_servers").split(",").map(s=>s.trim()).filter(Boolean),hotspot:f.has("hotspot"),radius_address:f.get("radius_address").trim(),radius_secret:f.get("radius_secret")}; };
  const endpoint = `/routers/${encodeURIComponent(router.device_id)}/gateway/`;
  const invalidate = () => {
    if (applying) return;
    revision++; approved=null; apply.hidden=true;
    status.textContent="Settings changed. Preview again before applying.";
  };
  form.addEventListener("input", invalidate);
  form.addEventListener("change", invalidate);
  form.addEventListener("submit", async e => {
    e.preventDefault();
    if (applying || preview.disabled || !form.isConnected || (form.reportValidity && !form.reportValidity())) return;
    approved=null; apply.hidden=true; preview.disabled=true; status.textContent="Checking the live router…";
    const requestedRevision = ++revision;
    try { const request=payload(); const response=await MM.post(endpoint+"preview",request); if (!form.isConnected) return; if (requestedRevision !== revision) {status.textContent="Settings changed while checking. Preview again before applying.";return;} approved={request,confirmation:response.plan.confirmation}; status.innerHTML=`<strong>Review changes to ${esc(router.hardware_name)}</strong><ol>${asArray(response.plan.steps).map(step=>`<li>${esc(step)}</li>`).join("")}</ol><p>Existing addresses, DHCP servers and management configuration will not be replaced.</p>`; apply.hidden=false; }
    catch(e) { if (form.isConnected && requestedRevision === revision) status.textContent=(e.data && e.data.error) || e.message; }
    finally { preview.disabled=applying; }
  });
  apply.addEventListener("click", async () => {
    if (applying || !approved || !form.isConnected || !confirm(`Create this customer network on ${router.hardware_name}? Review the preview before continuing.`)) return;
    const request = {...approved.request, confirmation:approved.confirmation};
    approved=null; applying=true; revision++;
    const controls = [...form.querySelectorAll("input,select,textarea,button"), ...(targetSelect ? [targetSelect] : [])].map(control=>[control,control.disabled]);
    controls.forEach(([control])=>control.disabled=true);
    status.textContent="Backing up, applying and reading settings back…";
    try {
      const response=await MM.post(endpoint+"apply",request);
      if (!form.isConnected) return;
      const result=response.result || {};
      if (result.verified !== true) throw new Error("Router verification did not pass.");
      status.innerHTML=`<strong>Customer network settings applied and verified.</strong><p>Backup: <code>${esc(result.backup)}</code></p><p>Connect a test guest on this LAN/VLAN to verify DHCP, internet access and captive login. Deploy your branded portal from Captive portal settings.</p>`;
      form.elements.radius_secret.value="";
    } catch(e) {
      if (!form.isConnected) return;
      const result=(e.data && e.data.result)||{};
      status.textContent=((e.data && e.data.error)||e.message)+(result.rolled_back ? " New objects were removed and rollback verified." : " No successful verification was reported; inspect the router before retrying.");
    } finally {
      applying=false; apply.hidden=true;
      controls.forEach(([control,disabled])=>control.disabled=disabled);
      request.radius_secret="";
    }
  });
}

/* ---------- Topology ---------- */
let topologyRenderRevision = 0;
async function renderTopology(main, selectedSite = null) {
  const request = ++topologyRenderRevision;
  const content = main.querySelector("#content");
  let topo = await MM.get("/topology/map");
  let sites = [];
  try { sites = asArray((await MM.get("/sites")).sites); } catch (_) {}
  let fleet = {peers: []};
  try { fleet = await MM.get("/fleet/health"); } catch (_) {}
  if (!content?.isConnected || main.querySelector("#content") !== content || request !== topologyRenderRevision) return;
  if (selectedSite === null) {
    const preferred = sessionStorage.getItem("mm_topology_router") || sessionStorage.getItem("mm_selected_router");
    const devices = [];
    const collectDevices = node => { if (node.device) devices.push(node.device); asArray(node.children).forEach(collectDevices); };
    asArray(topo.roots).forEach(collectDevices); devices.push(...asArray(topo.orphans));
    const contextSite = devices.find(device => device.device_id === preferred)?.site_id || sessionStorage.getItem("mm_selected_site");
    selectedSite = sites.some(site => site.site_id === contextSite) ? contextSite : "";
  }
  if (selectedSite) {
    const roots = asArray(topo.roots).filter(n => n.device?.site_id === selectedSite);
    const ids = new Set(); const collect = n => { ids.add(n.device?.device_id); asArray(n.children).forEach(collect); }; roots.forEach(collect);
    const orphans = asArray(topo.orphans).filter(d => d.site_id === selectedSite);
    orphans.forEach(d => ids.add(d.device_id));
    topo = {...topo, roots, orphans, cycles: [], summary: {...topo.summary,total_devices:ids.size,in_tree:ids.size-orphans.length}};
    const peers = asArray(fleet.peers).filter(p => ids.has(p.device_id));
    fleet = {...fleet,peers,unknown:peers.filter(p=>p.state==="unknown").length,offline:peers.filter(p=>p.state==="offline").length,stale:peers.filter(p=>p.state==="stale").length};
  }
  content.innerHTML = `<div class="panel"><div class="panel-body"><label>Business site<select class="input" id="topology-site"><option value="">All sites and unassigned devices</option>${sites.map(s=>`<option value="${esc(s.site_id)}"${s.site_id===selectedSite?' selected':''}>${esc(s.name)}</option>`).join("")}</select></label><p class="muted small">Live device map · Select a device to inspect its address, connection and evidence.</p></div></div><div id="topo-tree">${loading()}</div>`;
  content.querySelector("#topology-site").addEventListener("change", event => {
    sessionStorage.setItem("mm_selected_site", event.target.value);
    sessionStorage.removeItem("mm_topology_router");
    sessionStorage.removeItem("mm_selected_router");
    renderTopology(main, event.target.value);
  });
  if (window.MMNetworkTopology) {
    await MMNetworkTopology.mount(content.querySelector("#topo-tree"), {api:MM, topology:topo, isCurrent:()=>request===topologyRenderRevision && content.isConnected});
    return;
  }
  content.querySelector("#topo-tree").innerHTML = topologyTree(topo, fleet);

  const selectDevice = (detailID) => {
    content.querySelectorAll("[data-topo-detail]").forEach(el => el.classList.toggle("is-selected", el.dataset.topoDetail === detailID));
    content.querySelectorAll(".topo-detail").forEach(el => { el.hidden = el.id !== detailID; });
    const selected = content.querySelector(`#${detailID} [data-config-device]`);
    if (selected) sessionStorage.setItem("mm_selected_router", selected.dataset.configDevice);
  };
  content.querySelectorAll("[data-topo-detail]").forEach(el => el.addEventListener("click", () => selectDevice(el.dataset.topoDetail)));
  const preferredID = sessionStorage.getItem("mm_topology_router") || sessionStorage.getItem("mm_selected_router");
  const preferredLink = Array.from(content.querySelectorAll("[data-config-device]")).find(link => link.dataset.configDevice === preferredID);
  if (preferredLink) selectDevice(preferredLink.closest(".topo-detail").id);
  const refresh = content.querySelector("#topo-refresh");
  if (refresh) refresh.addEventListener("click", async () => {
    refresh.disabled = true;
    refresh.textContent = "Refreshing…";
    await renderTopology(main, selectedSite);
  });
  const manage = content.querySelector("#topo-manage-routers");
  if (manage) manage.addEventListener("click", () => { location.hash = "routers"; });
  content.querySelectorAll("[data-config-device]").forEach(link => link.addEventListener("click", () => { sessionStorage.setItem("mm_selected_router", link.dataset.configDevice); }));
}

function topologyState(d, states) {
  return states[d.device_id] || "unknown";
}

function topologyGlyph(d) {
  const layer = String(d.deployment_layer || "").toUpperCase();
  const category = String(d.category || "").toLowerCase();
  if (layer === "MAIN_GATEWAY" || category === "gateway" || category === "router") return MMTheme.icon("router", 18);
  if (layer === "DOWNSTREAM_SWITCH" || category === "switch") return MMTheme.icon("network", 18);
  if (layer === "ACCESS_POINT" || category === "ap") return MMTheme.icon("wifi", 18);
  if (layer === "CONTROLLER" || category === "controller") return MMTheme.icon("gauge", 18);
  return MMTheme.icon("activity", 18);
}

function topologyLayerLabel(value) {
  return String(value || "device").toLowerCase().replace(/_/g, " ");
}

function topologySummary(topo) {
  const s = topo.summary || {};
  const total = Number(s.total_devices || 0), mapped = Number(s.in_tree || 0);
  const broken = (topo.orphans || []).length + (topo.cycles || []).length;
  return `<div class="muted small">${total} managed device${total === 1 ? "" : "s"} · ${mapped} mapped${broken ? ` · ${broken} relationship issue${broken === 1 ? "" : "s"}` : " · relationships valid"}</div>`;
}

function topologyTree(topo, fleet) {
  const roots = topo.roots || [];
  const orphans = topo.orphans || [], cycles = topo.cycles || [], s = topo.summary || {};
  if (!roots.length && !orphans.length) return `<div class="panel"><div class="empty"><div class="empty-title">No network relationships yet</div>Add a gateway to begin building the live topology.</div></div>`;
  const states = {};
  (fleet.peers || []).forEach(p => { states[p.device_id] = p.state || "unknown"; });
  const total = Number(s.total_devices || 0);
  const attention = (fleet.stale || 0) + (fleet.offline || 0);
  const unknown = Number(fleet.unknown || 0);
  const links = Number(s.in_tree || 0); // one hub/root path + one path per child

  const stateMeta = {
    up: { label: "ONLINE", note: "MANAGEMENT REACHABLE", level: 5 },
    stale: { label: "STALE", note: "CHECK SIGNAL", level: 3 },
    offline: { label: "OFFLINE", note: "NO REACHABILITY", level: 1 },
    unknown: { label: "UNKNOWN", note: "AWAITING SIGNAL", level: 0 },
  };
  const signal = (level, state) => `<span class="topo-signal" aria-label="${level} of 5 reachability segments">${Array.from({length: 5}, (_, i) => `<i class="${i < level ? `on ${state}` : ""}"></i>`).join("")}</span>`;
  const pathRows = [];
  const detailRows = [];
  let nodeIndex = 0;

  const render = (node, depth) => {
    const d = node.device || {};
    const children = node.children || [];
    const state = topologyState(d, states);
    const meta = stateMeta[state] || stateMeta.unknown;
    const model = d.device_model ? `${d.vendor || "device"} ${d.device_model}` : (d.vendor || "Managed device");
    nodeIndex += 1;
    const index = String(nodeIndex).padStart(2, "0");
    const detailID = `topo-detail-${nodeIndex}`;
    const selected = nodeIndex === 1 ? " is-selected" : "";
    pathRows.push(`<button class="topo-path-row${selected}" type="button" data-topo-detail="${detailID}" style="--topo-indent:${9 + Math.min(depth, 5) * 7}px">
      <span class="topo-path-index">${index}</span><span class="topo-path-name"><strong>${esc(d.hardware_name || "Unnamed device")}</strong><small>${esc(topologyLayerLabel(d.deployment_layer))}</small></span><span class="topo-path-state ${esc(state)}">${meta.label}</span>
    </button>`);
    detailRows.push(`<div class="topo-detail" id="${detailID}"${nodeIndex === 1 ? "" : " hidden"}>
      <div class="topo-detail-title"><span class="topo-glyph">${topologyGlyph(d)}</span><div><small>NODE ${index}</small><strong>${esc(d.hardware_name || "Unnamed device")}</strong></div></div>
      <div class="topo-detail-signal">${signal(meta.level, state)}<strong class="${esc(state)}">${meta.label}</strong><small>${meta.note}</small></div>
      <dl><dt>Role</dt><dd>${esc(topologyLayerLabel(d.deployment_layer))}</dd><dt>Hardware</dt><dd>${esc(model)}</dd><dt>Transport</dt><dd>${esc(d.transport || "direct")}</dd><dt>Device ID</dt><dd class="mono">${esc(d.device_id || "—")}</dd></dl>
      <div class="revamp-task-grid"><a class="btn" href="#gateways">Connection &amp; supported quick settings</a><a class="btn" href="#existing" data-config-device="${esc(d.device_id)}">Quick network configuration</a><a class="btn" href="#routers" data-config-device="${esc(d.device_id)}">Discover site devices</a></div><p class="muted small">Configuration requires an authenticated device and supported capabilities. This map does not prove physical cabling.</p>
    </div>`);
    return `<li><button class="topo-device topo-state-${esc(state)}${selected}" type="button" data-topo-detail="${detailID}" aria-label="${esc(d.hardware_name || "Device")}, ${esc(state)}">
      <div class="topo-device-head"><span class="topo-node-number">NODE ${index}</span><span class="status ${state === "up" ? "ok" : state === "stale" ? "warn" : state === "offline" ? "bad" : "unknown"}">${esc(state)}</span></div>
      <div class="topo-device-identity"><span class="topo-glyph">${topologyGlyph(d)}</span><div><strong>${esc(d.hardware_name || "Unnamed device")}</strong><span>${esc(model)}</span></div></div>
      ${signal(meta.level, state)}
      <div class="topo-device-meta"><span>${esc(topologyLayerLabel(d.deployment_layer))}</span><span>${esc(d.transport || "direct")}</span></div>
    </button>${children.length ? `<ul>${children.map(child => render(child, depth + 1)).join("")}</ul>` : ""}</li>`;
  };
  const problems = [];
  if (orphans.length) problems.push(`<div class="topo-problem"><span class="status warn">${orphans.length} orphan${orphans.length === 1 ? "" : "s"}</span><span>${orphans.map(d => esc(d.hardware_name || d.device_id)).join(", ")} ${orphans.length === 1 ? "has" : "have"} no valid parent in this tenant.</span></div>`);
  if (cycles.length) problems.push(`<div class="topo-problem"><span class="status bad">${cycles.length} cycle${cycles.length === 1 ? "" : "s"}</span><span>A parent loop was detected and excluded from the diagram.</span></div>`);

  const treeHTML = roots.map(root => render(root, 0)).join("");

  return `<section class="topo-console" aria-label="Live network topology board">
    <header class="topo-console-head"><div><span class="fleet-kicker">NETWORK MAP</span><h2>${total} managed node${total === 1 ? "" : "s"}</h2><p>View saved device relationships and current management reachability. This is not a verified WireGuard or customer-traffic map.</p></div><div class="topo-console-actions"><button class="btn" id="topo-refresh" type="button">Refresh paths</button><button class="btn" id="topo-manage-routers" type="button">Manage routers</button></div></header>
    <div class="topo-stats">
      <div><span>Managed devices</span><strong>${total}</strong></div>
      <div><span>Mapped relationships</span><strong>${links}</strong></div>
      <div><span>Needs attention</span><strong>${attention}</strong></div>
      <div><span>Awaiting signal</span><strong>${unknown}</strong></div>
    </div>
    <div class="topo-modebar" role="toolbar" aria-label="Topology data modes"><button class="btn btn-sm is-active" type="button" aria-pressed="true">Tree</button><button class="btn btn-sm" type="button" disabled title="Requires a RouterOS port inventory snapshot">Ports · awaiting RouterOS inventory</button><button class="btn btn-sm" type="button" disabled title="Requires device coordinate inventory">Map · awaiting device coordinates</button><span>Inventory and properties are available in the node inspector.</span></div>
    <div class="topo-workspace"><section class="topo-panel" aria-label="Network topology diagram">
      <div class="panel-head topo-panel-head"><div><h2 class="panel-title">Device relationships</h2><span class="muted small">Management service → gateways → downstream devices; transport shown per device</span></div>
        <div class="topo-legend"><span><i class="topo-dot up"></i>Up</span><span><i class="topo-dot stale"></i>Stale</span><span><i class="topo-dot offline"></i>Offline</span><span><i class="topo-dot unknown"></i>Unknown</span></div>
      </div>
      <div class="topo-canvas">
        <div class="topo-hub"><span class="topo-hub-mark">MM</span><div><strong>Mega Magic</strong><span>Management service</span></div><span class="topo-role">Cloud</span></div>
        ${roots.length ? `<div class="topo-hub-link"></div><ul class="topo-tree">${treeHTML}</ul>` : `<div class="empty">No valid gateway path is available.</div>`}
      </div>
    </section><aside class="topo-inspector" aria-label="Topology path inspector"><div class="topo-inspector-head"><span>PATH INDEX</span><small>Select a node</small></div><div class="topo-path-list">${pathRows.join("") || `<p class="muted small">No mapped devices.</p>`}</div><div class="topo-detail-stack">${detailRows.join("")}</div></aside></div>
    <footer class="topo-console-foot"><span><i class="fleet-live-dot"></i>Current router relationships</span><span>Select a node to inspect its details</span></footer>
  </section>
  ${problems.length ? `<section class="panel topo-integrity"><div class="panel-head"><h2 class="panel-title">Relationship integrity</h2></div><div class="panel-body">${problems.join("")}</div></section>` : ""}`;
}

/* ---------- Incidents ---------- */
async function renderIncidents(main) {
  const data = await MM.get("/incidents");
  const list = Array.isArray(data.incidents) ? data.incidents : asArray(data);
  const content = main.querySelector("#content");
  const canManage = ["ADMIN", "OWNER", "DEVELOPER"].includes(ME?.user?.user_role);
  if (!list.length) {
    content.innerHTML = `<div class="empty"><div class="empty-title">No open incidents</div>AI-detected problems and policy alerts will appear here.</div>`;
    return;
  }
  const sevBadge = (s) => {
    const m = { critical: "bad", warning: "warn" }[String(s).toLowerCase()] || "unknown";
    return `<span class="status ${m}">${esc(s)}</span>`;
  };
  const rows = list.map(inc => `
    <tr>
      <td>${sevBadge(inc.severity || "info")}</td>
      <td><span class="mono">${esc(inc.kind)}</span></td>
      <td><span class="num">${esc(inc.subject_label || inc.subject_id || "—")}</span></td>
      <td class="muted small">${esc((inc.detail && inc.detail.replace(/\s+/g," ")) ? inc.detail.slice(0,80) : "—")}</td>
      <td>${ts(inc.opened_at)}</td>
      <td>
        ${canManage ? `<button class="btn btn-sm" data-act="acknowledge" data-id="${esc(inc.id)}">Acknowledge</button>
        <button class="btn btn-sm" data-act="resolve" data-id="${esc(inc.id)}">Resolve</button>
        ${applyFixCell(inc)}` : '<span class="muted small">Read only</span>'}
      </td>
    </tr>`).join("");
  content.innerHTML = `<table>
    <thead><tr><th>Severity</th><th>Kind</th><th>Subject</th><th>Detail</th><th>Opened</th><th></th></tr></thead>
    <tbody>${rows}</tbody></table>`;
  wireFixes(content, main, () => renderIncidents(main));
  content.querySelectorAll("button[data-act]").forEach(btn => {
    btn.addEventListener("click", async () => {
      const id = btn.dataset.id, act = btn.dataset.act;
      btn.disabled = true; btn.textContent = "…";
      try {
        await MM.post(`/incidents/${encodeURIComponent(id)}/${act}`);
        await renderIncidents(main);
      } catch (e) {
        btn.disabled = false; btn.textContent = "Retry";
        content.appendChild(Object.assign(document.createElement("div"), { className: "alert", textContent: e.message }));
      }
    });
  });
}

/* ---------- Translations (i18n overrides) ---------- */
// UI string overrides. ⚠️ This table is GLOBAL: it has no business_id and RLS is
// disabled, so every business reads the same rows. Editing is therefore a
// platform action — the write controls only appear for an exact DEVELOPER role,
// and the API enforces the same gate independently of this check.
let i18nState = { locale: "", namespace: "", q: "", limit: 100, offset: 0 };
let i18nEditing = null; // id being edited, or "new"

function isDeveloper() {
  return ((ME && ME.user && ME.user.user_role) || "") === "DEVELOPER";
}

function renderI18nForm(o) {

        <div class="field"><label>Namespace</label><select class="input" id="i18n-f-ns">${NAMESPACES}</select></div>
        <div class="field"><label>Key (the English source string)</label>

let LOCALES = "", NAMESPACES = "";
function fillOptions(list, selected) {
  return asArray(list).map(v =>
    `<option value="${esc(v)}"${v === selected ? " selected" : ""}>${esc(v)}</option>`).join("");
}

async function renderI18n(main) {
  i18nState = { locale: "", namespace: "", q: "", limit: 100, offset: 0 };
  LOCALES = fillOptions(["en", "zh", "my"], "");
  NAMESPACES = fillOptions(["ui", "copy"], "");
  main.querySelector("#content").innerHTML = `

      <div class="panel-body">
        <div class="alert" role="alert">

function openI18nEditor(o) {
  i18nEditing = o ? o.id : "new";
  const host = document.getElementById("i18n-editor");
  if (!host) return;
  host.innerHTML = renderI18nForm(o);
  const l = document.getElementById("i18n-f-locale"), n = document.getElementById("i18n-f-ns");
  if (o) { l.value = o.locale; n.value = o.namespace; }
  document.getElementById("i18n-cancel").addEventListener("click", () => {
    i18nEditing = null; host.innerHTML = "";
  });
  document.getElementById("i18n-save").addEventListener("click", async () => {
    const err = document.getElementById("i18n-form-err");
    const body = {
      locale: document.getElementById("i18n-f-locale").value,
      namespace: document.getElementById("i18n-f-ns").value,
      key: document.getElementById("i18n-f-key").value.trim(),
      value: document.getElementById("i18n-f-value").value,
    };
    if (!body.key) { err.innerHTML = `<div class="alert" role="alert">Key is required.</div>`; return; }
    if (!body.value.trim()) { err.innerHTML = `<div class="alert" role="alert">Translation is required — an empty value would blank the string.</div>`; return; }
    try {
      if (o) await MM.put("/i18n-overrides/" + o.id, body);
      else await MM.post("/i18n-overrides", body);
      i18nEditing = null;
      await loadI18n();
    } catch (e) {
      err.innerHTML = `<div class="alert" role="alert">${esc(apiErrorText(e, "Could not save."))}</div>`;
    }
  });
}

async function loadI18n() {
  const body = document.getElementById("i18n-body");
  if (!body) return;
  const qs = new URLSearchParams();
  qs.set("limit", i18nState.limit);
  qs.set("offset", i18nState.offset);
  if (i18nState.locale) qs.set("locale", i18nState.locale);
  if (i18nState.namespace) qs.set("namespace", i18nState.namespace);
  if (i18nState.q) qs.set("q", i18nState.q);

  let d;
  try { d = await MM.get("/i18n-overrides?" + qs.toString()); }
  catch (e) {
    body.innerHTML = `<tr><td colspan="6" class="muted small">${esc(apiErrorText(e, "Could not load translations."))}</td></tr>`;
    return;
  }

  const ls = document.getElementById("i18n-locale"), ns = document.getElementById("i18n-ns");
  if (ls && ls.options.length <= 1) {
    asArray(d.locales).forEach(v => ls.add(new Option(v, v)));
    asArray(d.namespaces).forEach(v => ns.add(new Option(v, v)));
    ls.value = i18nState.locale; ns.value = i18nState.namespace;
  }

  const bl = d.by_locale || {}, bn = d.by_namespace || {};
  document.getElementById("i18n-facets").textContent =
    `${tok(d.total)} override(s) · by locale: ` +
    (Object.keys(bl).length ? Object.entries(bl).map(([k, v]) => `${k} ${v}`).join(", ") : "none") +
    " · by namespace: " +
    (Object.keys(bn).length ? Object.entries(bn).map(([k, v]) => `${k} ${v}`).join(", ") : "none");

  const canEdit = isDeveloper();
  const items = asArray(d.overrides);
  body.innerHTML = items.length ? items.map(o => `<tr>
      <td>${esc(o.locale)}</td>
      <td>${esc(o.namespace)}</td>
      <td>${esc(o.key)}</td>
      <td>${esc(o.value)}</td>
      <td>${ts(o.updated_at)}</td>
      ${canEdit ? `<td class="num">
        <button class="btn btn-sm" data-i18n-edit="${esc(o.id)}">Edit</button>
        <button class="btn btn-sm" data-i18n-del="${esc(o.id)}">Delete</button></td>` : ""}
    </tr>`).join("") : `<tr><td colspan="6" class="muted small">No overrides match.</td></tr>`;

  if (canEdit) {
    body.querySelectorAll("[data-i18n-edit]").forEach(el =>
      el.addEventListener("click", () => openI18nEditor(items.find(x => x.id === el.getAttribute("data-i18n-edit")))));
    body.querySelectorAll("[data-i18n-del]").forEach(el =>
      el.addEventListener("click", async () => {
        const id = el.getAttribute("data-i18n-del");
        try { await MM.del("/i18n-overrides/" + id); await loadI18n(); }
        catch (e) {
          document.getElementById("i18n-form-err").innerHTML =
            `<div class="alert" role="alert">${esc(apiErrorText(e, "Could not delete."))}</div>`;
        }
      }));
    const host = document.getElementById("i18n-editor");
    if (host && !i18nEditing) host.innerHTML = `<button class="btn btn-primary" id="i18n-add">Add override</button>`;
    const add = document.getElementById("i18n-add");
    if (add) add.addEventListener("click", () => openI18nEditor(null));
  }

  const from = items.length ? i18nState.offset + 1 : 0;
  document.getElementById("i18n-summary").textContent =
    `Showing ${from}–${i18nState.offset + items.length} of ${tok(d.total)} override(s)` +
    (i18nState.locale || i18nState.namespace || i18nState.q ? " (filtered)" : "");
  document.getElementById("i18n-newer").disabled = i18nState.offset === 0;
  document.getElementById("i18n-older").disabled = !d.has_more;
}

/* ---------- Terminal log ---------- */
// Audit log of commands run against routers. Read-only.
//
// The API redacts credential values before returning, so a script like
// `/user add name=x password=y` renders as `password=***`. The banner says so, so
// nobody reads `***` as the literal value the router received.
let termLogState = { source: "", status: "", q: "", limit: 50, offset: 0 };

// apiErrorText renders why a call failed. api.js already puts the server's own
// `error` field into err.message ("status must be an integer"), so discarding it
// for a generic string throws away the most useful part of the response.
function apiErrorText(e, fallback) {
  const m = (e && e.message) || "";
  if (m === "network-unreachable") return "The server could not be reached.";
  if (m === "unauthorized") return "Your session expired — sign in again.";
  if (m && !/^http-\d+$/.test(m)) return m;
  return fallback;
}

function statusCell(e) {
  if (!e.status_known) return `<span class="muted" title="The old app did not record a status.">—</span>`;
  const ok = Number(e.status) < 400;
  return `<span class="${ok ? "status ok" : "status warn"}">${esc(e.status)}</span>`;
}

async function renderTerminalLog(main) {
  termLogState = { source: "", status: "", q: "", limit: 50, offset: 0 };
  main.querySelector("#content").innerHTML = `

          <code>secret=</code> or <code>token=</code> value in a command or reply is
          replaced with <code>***</code> before it reaches this page.
        </div>
        <div class="field"><label>Source</label><select class="input" id="tl-source">
          <option value="">all sources</option></select></div>
        <div class="field"><label>Status</label><input class="input" id="tl-status"
          placeholder="e.g. 200" inputmode="numeric"></div>
        <div class="field"><label>Search</label><input class="input" id="tl-q"
          placeholder="script, path or reply"></div>
        <button class="btn btn-primary" id="tl-apply">Apply</button>
        <button class="btn" id="tl-reset">Reset</button>
        <p class="muted small" id="tl-summary">Loading…</p>
        <table><thead><tr><th>When</th><th>Command</th><th>Source</th>
          <th>Status</th><th class="num">ms</th><th>Reply</th></tr></thead>
          <tbody id="tl-body"><tr><td colspan="6" class="muted small">Loading…</td></tr></tbody></table>
        <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:10px">
          <button class="btn btn-sm" id="tl-newer">‹ Newer</button>
          <button class="btn btn-sm" id="tl-older">Older ›</button>
        </div>
      </div></div>`;

  const apply = () => {
    termLogState.source = document.getElementById("tl-source").value;
    termLogState.status = document.getElementById("tl-status").value.trim();
    termLogState.q = document.getElementById("tl-q").value.trim();
    termLogState.offset = 0;
    loadTerminalLog();
  };
  document.getElementById("tl-apply").addEventListener("click", apply);
  document.getElementById("tl-q").addEventListener("keydown", ev => { if (ev.key === "Enter") apply(); });
  document.getElementById("tl-reset").addEventListener("click", () => {
    termLogState = { source: "", status: "", q: "", limit: 50, offset: 0 };
    ["tl-source", "tl-status", "tl-q"].forEach(id => { const el = document.getElementById(id); if (el) el.value = ""; });
    loadTerminalLog();
  });
  document.getElementById("tl-older").addEventListener("click", () => {
    termLogState.offset += termLogState.limit; loadTerminalLog();
  });
  document.getElementById("tl-newer").addEventListener("click", () => {
    termLogState.offset = Math.max(0, termLogState.offset - termLogState.limit); loadTerminalLog();
  });

  await loadTerminalLog();
}

async function loadTerminalLog() {
  const body = document.getElementById("tl-body");
  if (!body) return;
  const qs = new URLSearchParams();
  qs.set("limit", termLogState.limit);
  qs.set("offset", termLogState.offset);

// does not silently change the totals above it.
let aiUsageState = { feature: "", model: "", limit: 50, offset: 0 };

function tok(n) { return Number(n || 0).toLocaleString(); }

function usageRows(groups) {
  const list = asArray(groups);
  if (!list.length) return `<tr><td colspan="3" class="muted small">none</td></tr>`;
  return list.map(g => `<tr>
      <td>${esc(g.name)}</td>
      <td class="num">${tok(g.events)}</td>

/* ---------- Magic Dude ---------- */
let magicDudeTurns = [];
let magicDudePending = false;
let magicDudeScrollFrame = null;
let magicDudeResizeObserver = null;

function scrollMagicDudeToLatest() {
  if (magicDudeScrollFrame !== null) cancelAnimationFrame(magicDudeScrollFrame);
  magicDudeScrollFrame = requestAnimationFrame(() => {
    magicDudeScrollFrame = null;
    const list = document.getElementById("md-messages");
    if (list && !document.getElementById("magic-dude-popup")?.hidden) list.scrollTop = list.scrollHeight;
  });
}

function magicDudeText(value) {
  return esc(String(value || "")).replace(/\n/g, "<br>");
}

function drawMagicDudeMessages() {
  const list = document.getElementById("md-messages");
  if (!list) return;
  if (!magicDudeTurns.length) {
    list.innerHTML = `<div class="md-welcome">
      <img class="md-avatar md-avatar-welcome" src="/assets/images/magic-dude-mascot-20260930.png" alt="">
      <div><strong>ဘာကူညီပေးရမလဲ? 🙂</strong>
      <p>စက်အခြေအနေ၊ ပြဿနာနဲ့ app ထဲက နေရာတွေ ရှာပေးမယ်။ ကိုယ်တိုင်တော့ ပြင်ဆင်မှု မလုပ်ပါဘူး။</p>
      <div class="md-quick-prompts" aria-label="Suggested questions">
        <button class="md-prompt" type="button">စက်တွေ အခြေအနေ ဘယ်လိုလဲ?</button>
        <button class="md-prompt" type="button">Jellyfin library ဘယ်မှာ ထည့်ရမလဲ?</button>
        <button class="md-prompt" type="button">Gateway ဘယ်မှာ ချိတ်ရမလဲ?</button>
      </div></div>
    </div>`;
    bindMagicDudePrompts();
  } else {
  list.innerHTML = magicDudeTurns.map(m => `<div class="md-message ${m.role}">
    <div class="md-message-label">${m.role === "user" ? "သင်" : "Magic Dude"}</div>
    <div class="md-message-body">${magicDudeText(m.content)}</div>
  </div>`).join("");
  }
  // Observe content, not the scroller: fonts/images and responsive wrapping can
  // change its height after a reply is drawn. Never scroll the surrounding page.
  const stack = document.createElement("div");
  stack.className = "md-message-stack";
  while (list.firstChild) stack.appendChild(list.firstChild);
  list.appendChild(stack);
  if (typeof ResizeObserver !== "undefined") {
    if (!magicDudeResizeObserver) magicDudeResizeObserver = new ResizeObserver(scrollMagicDudeToLatest);
    magicDudeResizeObserver.disconnect();
    magicDudeResizeObserver.observe(stack);
  }
  scrollMagicDudeToLatest();
}

function bindMagicDudePrompts() {
  const input = document.getElementById("md-question");
  document.querySelectorAll("#magic-dude-popup .md-prompt").forEach(btn => {
    if (btn.dataset.bound) return;
    btn.dataset.bound = "true";
    btn.addEventListener("click", () => { input.value = btn.textContent.trim(); input.focus(); });
  });
}

function setMagicDudeOpen(open) {
  const popup = document.getElementById("magic-dude-popup");
  if (!popup) return;
  popup.hidden = !open;
  document.querySelectorAll("[data-md-open]").forEach(btn => btn.setAttribute("aria-expanded", open ? "true" : "false"));
  if (open) {
    drawMagicDudeMessages();
    requestAnimationFrame(() => document.getElementById("md-question")?.focus({preventScroll: true}));
  }
}

function initMagicDudePopup() {
  const popup = document.getElementById("magic-dude-popup");
  if (!popup || popup.dataset.bound) return;
  popup.dataset.bound = "true";
  document.querySelectorAll("[data-md-open]").forEach(btn => btn.addEventListener("click", () => setMagicDudeOpen(true)));
  document.getElementById("md-close").addEventListener("click", () => setMagicDudeOpen(false));
  document.addEventListener("keydown", e => {
    if (e.key === "Escape" && !popup.hidden) setMagicDudeOpen(false);
  });
  drawMagicDudeMessages();

  const form = document.getElementById("md-form");
  const input = document.getElementById("md-question");
  const send = document.getElementById("md-send");
  const note = document.getElementById("md-note");
  input.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); if (!magicDudePending) form.requestSubmit(); }
  });
  form.addEventListener("submit", async e => {
    e.preventDefault();
    const question = input.value.trim();
    if (!question || magicDudePending) return;
    magicDudePending = true;
    const history = magicDudeTurns.slice(-6).map(({role, content}) => ({role, content}));
    magicDudeTurns.push({role: "user", content: question});
    input.value = ""; input.disabled = true; send.disabled = true;
    note.textContent = "ခဏလေး စစ်ကြည့်ပေးမယ်နော်…";
    drawMagicDudeMessages();
    try {
      const reply = await MM.post("/magic-dude/chat", {question, history});
      magicDudeTurns.push({role: "assistant", content: reply.answer || "အဖြေ မရသေးဘူး။ ပြန်မေးပေးပါနော်။"});
      note.textContent = "အကြံပေးသီးသန့်ပါ။ ပြင်ဆင်မှု မလုပ်ထားပါဘူး။";
    } catch (err) {
      if (err.status === 403 && err.data && err.data.code === "MAGIC_DUDE_UNLOCK_REQUIRED") {
        magicDudeTurns.push({role: "assistant", content: "Magic Dude သုံးဖို့ unlock key လိုပါတယ်။ Owner ဒါမှမဟုတ် Admin ကို မေးပေးပါနော်။"});
        note.textContent = "အသုံးပြုခွင့် လိုအပ်ပါတယ်။";
      } else if (err.status === 429) {
        magicDudeTurns.push({role: "assistant", content: "AI အသုံးပြုမှု ကန့်သတ်ချက် ပြည့်နေပါတယ်။ ခဏနေရင် ပြန်မေးပေးပါနော်။"});
        note.textContent = "လောလောဆယ် အသုံးပြုမှု ကန့်သတ်ထားပါတယ်။";
      } else {
        magicDudeTurns.push({role: "assistant", content: "လောလောဆယ် အဖြေ မပေးနိုင်သေးဘူး။ ပြန်ကြိုးစားပေးပါနော်။ စက်တွေကို မပြင်ထားပါဘူး။"});
        note.textContent = "မေးခွန်း ပို့ခြင်း မအောင်မြင်ပါ။";
      }
    } finally {
      magicDudePending = false;
      input.disabled = false; send.disabled = false;
      if (!popup.hidden) input.focus({preventScroll: true});
      drawMagicDudeMessages();
    }
  });
}

async function loadAIUsage() {
  const body = document.getElementById("ai-body");
  if (!body) return;
  const qs = new URLSearchParams();
  qs.set("limit", aiUsageState.limit);
  qs.set("offset", aiUsageState.offset);
  if (aiUsageState.feature) qs.set("feature", aiUsageState.feature);
  if (aiUsageState.model) qs.set("model", aiUsageState.model);

  let d;
  try { d = await MM.get("/ai-usage-events?" + qs.toString()); }
  catch (e) {
    body.innerHTML = `<tr><td colspan="6" class="muted small">${esc(apiErrorText(e, "Could not load AI usage."))}</td></tr>`;
    return;
  }

  // Populate the facet dropdowns from the summary (unfiltered, so they stay stable).
  const s = d.summary || {};
  const fs = document.getElementById("ai-feat"), ms = document.getElementById("ai-model");
  if (fs && fs.options.length <= 1) {
    asArray(s.by_feature).forEach(g => fs.add(new Option(`${g.name} (${tok(g.total_tokens)})`, g.name)));
    asArray(s.by_model).forEach(g => ms.add(new Option(`${g.name} (${tok(g.total_tokens)})`, g.name)));
    fs.value = aiUsageState.feature; ms.value = aiUsageState.model;
  }

  document.getElementById("ai-totals").textContent =
    `${tok(s.events)} call(s) · ${tok(s.total_tokens)} tokens total ` +
    `(${tok(s.prompt_tokens)} prompt + ${tok(s.completion_tokens)} completion)` +
    (Number(s.cached_events) > 0 ? ` · ${tok(s.cached_events)} cached` : "");
  document.getElementById("ai-byfeat").innerHTML = usageRows(s.by_feature);
  document.getElementById("ai-bymodel").innerHTML = usageRows(s.by_model);

  // Honesty: flag rows whose recorded total does not equal prompt + completion,
  // rather than printing arithmetic that does not add up.
  const notice = document.getElementById("ai-notice");
  const bad = Number(s.mismatched_events || 0);
  if (notice) {
    notice.innerHTML = bad > 0 ? `<div class="alert" role="alert">
      <strong>${tok(bad)} call(s) have a total that is not prompt + completion.</strong>
      The recorded figure is shown as-is and marked below; the previous system did not
      break out the difference.</div>` : "";
  }

  const evs = asArray(d.events);
  body.innerHTML = evs.length ? evs.map(e => `<tr>
      <td>${ts(e.created_at)}</td>
      <td>${esc(e.feature)}</td>
      <td>${esc(e.model)}</td>
      <td class="num">${tok(e.prompt_tokens)}</td>
      <td class="num">${tok(e.completion_tokens)}</td>
      <td class="num">${tok(e.total_tokens)}${e.token_mismatch
        ? ` <span class="status warn" title="Recorded total does not equal prompt + completion.">≠</span>` : ""}</td>
    </tr>`).join("") : `<tr><td colspan="6" class="muted small">No calls match.</td></tr>`;

  const from = evs.length ? aiUsageState.offset + 1 : 0;
  document.getElementById("ai-summary").textContent =
    `Showing ${from}–${aiUsageState.offset + evs.length} of ${tok(d.total)} call(s)` +
    (aiUsageState.feature || aiUsageState.model ? " (filtered)" : "");
  document.getElementById("ai-newer").disabled = aiUsageState.offset === 0;
  document.getElementById("ai-older").disabled = !d.has_more;
}

/* ---------- Fleet scans ---------- */
// Read-only history of automatic fleet scans. The ported payload is genuinely
// heterogeneous (some rows carry `insights`, others a node/connectivity event), so
// both shapes are rendered rather than assuming one.
//
// IMPORTANT: 1,102 of the 1,156 migrated scans contain a JavaScript error that the
// OLD app persisted ("Cannot read properties of undefined (reading 'rest')") under
// the title "Router unreachable". Those are labelled `scan error` here instead of
// being presented as live critical alerts. The data is untouched.
let scansState = { kind: "", severity: "", findings_only: false, limit: 50, offset: 0 };

function scanSevBadge(s) {
  const cls = s === "critical" ? "bad" : s === "warning" ? "warn" : s === "ok" ? "ok" : "";
  return `<span class="status ${cls}">${esc(s)}</span>`;
}

function findingLine(f) {
  const sev = f.severity || "info";
  const tag = f.runtime_error
    ? `<span class="status warn" title="This is a program error recorded by the previous system, not a network finding.">scan error</span>`
    : scanSevBadge(sev);
  const who = f.router ? `<span class="muted small">${esc(f.router)}</span>` : "";
  return `<div style="margin:2px 0">${tag} ${esc(f.title || "(untitled)")} ${who}
    <div class="muted small">${esc(f.subtitle || "")}</div>
    ${f.suggestion ? `<div class="muted small">→ ${esc(f.suggestion)}</div>` : ""}</div>`;
}

async function renderScans(main) {
  scansState = { kind: "", severity: "", findings_only: false, limit: 50, offset: 0 };
  const content = main.querySelector("#content");
  content.innerHTML = `
