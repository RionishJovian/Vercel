<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mega Magic</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="/assets/css/styles.css">
  <!-- Live-preview surfaces (guest-portal frame + voucher sheet). Scoped to their
       own classes and kept inline deliberately: Cloudflare serves /assets/* as
       immutable for a week, and deploy.sh only hash-stamps the asset URLs written
       into this file, so adding to the shared stylesheet would risk week-stale CSS. -->
  <style>
    .pv-split { display: grid; grid-template-columns: minmax(300px, 1fr) minmax(320px, 430px); gap: 18px; align-items: start; }
    @media (max-width: 900px) { .pv-split { grid-template-columns: 1fr; } }
    .pv-stage { display: flex; justify-content: center; }
    .pv-phone { width: 390px; max-width: 100%; height: 660px; border: 1px solid var(--border, #2a3550);
                border-radius: 18px; background: #fff; }
    .pv-hint { margin: 8px 0 0; }
    .sheet-stage { background: #0d1117; border: 1px solid var(--border, #2a3550); border-radius: 10px;
                   padding: 12px; overflow: auto; max-height: 480px; }
    /* .sheet / .sheet-tile / .sheet-code / .sheet-qr are NOT defined here — they
       are injected from the SHEET_CSS constant in the voucher script, which the
       print document embeds too, so the preview and the printed page can never
       drift apart. */
    .pl-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  </style>
  <script src="/assets/js/api.js" defer></script>
  <script src="/assets/js/app.js" defer></script>
  <style>
    /* ════════════════════════════════════════════════════════════════════
       Mega Magic — Liquid-Glass luxury overlay (inline, scoped to this page)
       Backdrop-blur glass surfaces over ambient glow orbs, light sweeps,
       3D hover depth, animate-in transitions. Vanilla CSS only.
       ════════════════════════════════════════════════════════════════════ */
    :root{
      --bg:#070a10; --bg-subtle:#0a0e15;
      --surface:rgba(255,255,255,.05);
      --ink:#f4f1ea; --ink-soft:#c6c1b6; --ink-muted:#8d8a83;
      --line:rgba(255,255,255,.10); --line-soft:rgba(255,255,255,.055);
      --accent:#7dd3fc; --accent-hover:#a5e6ff; --accent-wash:rgba(125,211,252,.12);
      --gold:#e7b457; --gold-deep:#b9882c;
      --ok:#61d395; --warn:#f0b35c; --bad:#f27c83; --unknown:#9a96a0;
      --ok-wash:rgba(97,211,149,.15); --warn-wash:rgba(240,179,92,.16);
      --bad-wash:rgba(242,124,131,.15); --unknown-wash:rgba(154,150,160,.17);
      --focus:#7dd3fc; --focus-wash:rgba(125,211,252,.18);
      --radius:16px;
      --glass:blur(22px) saturate(165%);
      --ease:cubic-bezier(.20,.70,.20,1);
    }
    html{color-scheme:dark;}
    /* One stacking root + content plane so the backdrop-filter panels never
       compose against the fixed glow orbs/grain (overlap artifact fix). */
    body{
      margin:0; min-height:100vh; color:var(--ink);
      isolation:isolate;
      background:
        radial-gradient(1100px 720px at 10% -12%, rgba(56,189,248,.18), transparent 62%),
        radial-gradient(900px 640px at 102% 6%, rgba(147,51,234,.15), transparent 55%),
        radial-gradient(1000px 780px at 46% 112%, rgba(231,180,87,.12), transparent 60%),
        var(--bg);
    }
    ::selection{background:rgba(125,211,252,.28);}

    /* Ambient glow orbs (decorative, behind glass) */
    .lg-orb{position:fixed;border-radius:50%;filter:blur(88px);pointer-events:none;z-index:0;contain:layout paint;}
    .lg-orb-a{width:540px;height:540px;top:-150px;left:-130px;background:radial-gradient(circle,rgba(56,189,248,.55),transparent 70%);}
    .lg-orb-b{width:480px;height:480px;top:26%;right:-170px;background:radial-gradient(circle,rgba(168,85,247,.5),transparent 70%);}
    .lg-orb-c{width:460px;height:460px;bottom:-150px;left:36%;background:radial-gradient(circle,rgba(231,180,87,.45),transparent 70%);}
    .lg-grain{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.055;
      background-image:radial-gradient(#fff 1px,transparent 1px);background-size:3px 3px;}

    .layout{position:relative;z-index:1;isolation:isolate;}

    /* ---------- Left rail: frosted glass ---------- */
    .rail{
      background:rgba(9,12,18,.55);
      -webkit-backdrop-filter:var(--glass); backdrop-filter:var(--glass);
      border-right:1px solid var(--line);
      box-shadow:1px 0 40px -20px rgba(0,0,0,.9);
    }
    .rail-brand{color:#fff;text-shadow:0 0 24px rgba(125,211,252,.28);}
    .rail-brand .dot{
      background:radial-gradient(circle at 32% 30%, #ffe9ae, var(--gold) 58%, var(--gold-deep));
      box-shadow:0 0 16px rgba(231,180,87,.7), inset 0 0 6px rgba(255,255,255,.55);
      border-radius:4px;
    }
    .rail-sub{color:var(--ink-muted);}
    .rail-section{color:var(--ink-muted);letter-spacing:.16em;}
    .nav-item{
      color:var(--ink-soft); border-radius:11px; position:relative;
      transition:transform var(--ease) .35s, background .25s, color .25s, box-shadow .35s;
    }
    .nav-item:hover{background:rgba(125,211,252,.10);color:#fff;transform:translateX(3px);}
    .nav-item[aria-current="page"],.nav-item.active{
      background:rgba(125,211,252,.14);color:#fff;font-weight:650;
      box-shadow:inset 0 0 0 1px rgba(125,211,252,.30), 0 10px 30px -12px rgba(56,189,248,.55);
    }
    .nav-item#signout{margin-top:auto;}

    main{padding:34px 40px;}
    #content>*{animation:lgIn .55s var(--ease) both;}
    @keyframes lgIn{from{opacity:0;transform:translateY(12px) scale(.99);}to{opacity:1;transform:none;}}

    .page-title{color:#fff;font-size:22px;}
    .page-lead{color:var(--ink-soft);}

    /* ---------- Glass panels with sweep + 3D hover ---------- */
    .panel{
      position:relative;overflow:hidden;
      background:rgba(255,255,255,.05);
      -webkit-backdrop-filter:var(--glass); backdrop-filter:var(--glass);
      border:1px solid var(--line); border-radius:18px;
      box-shadow:0 24px 55px -32px rgba(0,0,0,.95), inset 0 1px 0 rgba(255,255,255,.07);
      transition:transform var(--ease) .4s, box-shadow var(--ease) .4s, border-color .4s;
    }
    .panel:hover{
      transform:translateY(-3px);
      box-shadow:0 34px 80px -38px rgba(0,0,0,.98), 0 0 0 1px rgba(255,255,255,.09),
                 inset 0 1px 0 rgba(255,255,255,.09);
    }
    .panel::after{ /* hairline top gleam */
      content:"";position:absolute;top:0;left:10%;right:10%;height:1px;
      background:linear-gradient(90deg,transparent,rgba(255,255,255,.28),transparent);
    }
    .panel::before{ /* periodic light sweep */
      content:"";position:absolute;top:-20%;left:-80%;width:52%;height:140%;
      background:linear-gradient(105deg,transparent,rgba(255,255,255,.06),transparent);
      transform:skewX(-12deg);animation:lgSweep 4.6s ease-in-out infinite;pointer-events:none;
    }
    @keyframes lgSweep{0%{left:-80%;}62%,100%{left:135%;}}
    .panel-head{border-bottom:1px solid var(--line-soft);padding:14px 18px;}
    .panel-title{color:#fff;letter-spacing:.02em;}
    .panel-body{padding:6px 18px 16px;}

    /* ---------- Stats ---------- */
    .stat .stat-label{color:var(--ink-soft);letter-spacing:.05em;}
    .stat .stat-value{color:#fff;font-size:30px;text-shadow:0 0 26px rgba(125,211,252,.40);}

    /* ---------- Tables ---------- */
    thead th{color:var(--ink-muted);border-bottom:1px solid var(--line);}
    tbody td{border-bottom:1px solid var(--line-soft);}
    tbody tr:hover{background:rgba(255,255,255,.045);}
    .num{color:var(--ink);}
    .mono{color:var(--ink-soft);}

    /* Status pills on glass: glowing dot, frosted body */
    .status{-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);}
    .status::before{box-shadow:0 0 11px currentColor;}

    /* Device marker: luminous orbs */
    .dev{box-shadow:0 0 0 3px rgba(255,255,255,.06), 0 0 18px currentColor;}

    /* ---------- Buttons ---------- */
    .btn{
      background:rgba(255,255,255,.045);
      -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
      border:1px solid var(--line); color:var(--ink); border-radius:11px;
      text-decoration:none;
      transition:transform var(--ease) .3s, background .25s, box-shadow .3s, border-color .3s;
    }
    .btn:hover{background:rgba(255,255,255,.10);transform:translateY(-1px);}
    .btn-primary{
      background:radial-gradient(130% 220% at 22% 0%, #43b8f8, #0ea5e9 55%, #0369a1);
      color:#04121a;border:none;font-weight:650;
      box-shadow:inset 0 0 0 1px rgba(255,255,255,.18), 0 10px 28px -10px rgba(56,189,248,.65);
    }
    .btn-primary:hover{box-shadow:inset 0 0 0 1px rgba(255,255,255,.28), 0 16px 34px -10px rgba(56,189,248,.8);}
    .btn-danger{color:#ffb0b5;border-color:rgba(242,124,131,.35);}
    .btn-danger:hover{background:rgba(242,124,131,.14);}
    .btn:disabled{opacity:.45;cursor:not-allowed;transform:none;}

    /* ---------- Forms ---------- */
    input,select,textarea{
      font:inherit;color:var(--ink);
      background:rgba(0,0,0,.28);border:1px solid var(--line);
      border-radius:10px;padding:8px 10px;
      transition:border-color .2s, box-shadow .2s;
    }
    input::placeholder{color:var(--ink-muted);}
    input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px var(--focus-wash);}
    .input{background:rgba(0,0,0,.28);color:var(--ink);border-color:var(--line);}
    .field label{color:var(--ink-soft);}
    select option{background:#0c1016;color:var(--ink);}

    /* ---------- Empty / alerts ---------- */
    .empty{color:var(--ink-soft);}
    .empty .empty-title{color:#fff;}
    .alert{
      background:rgba(242,124,131,.16);border:1px solid rgba(242,124,131,.34);
      color:#ffd6d8;border-radius:12px;
      -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
    }
    hr.rule{border-top:1px solid var(--line);}

    .muted{color:var(--ink-muted);}

    @media (prefers-reduced-motion: reduce){
      *{transition:none!important;animation:none!important;}
      .panel::before{animation:none;display:none;}
    }
  </style>
  <link rel="stylesheet" href="/assets/css/redesign.css">
</head>
<body class="page-app">
<div class="lg-orb lg-orb-a"></div>
<div class="lg-orb lg-orb-b"></div>
<div class="lg-orb lg-orb-c"></div>
<div class="lg-grain"></div>
<div class="layout">
  <nav class="rail" aria-label="Primary">
    <div class="rail-head">
      <div>
        <div class="rail-brand"><span class="dot"></span>Mega Magic</div>
        <div class="rail-sub" id="rail-biz">—</div>
      </div>
      <button class="rail-toggle" id="rail-toggle" type="button" aria-expanded="false" aria-controls="rail-menu" title="Menu">
        <span class="sr-only">Toggle navigation</span><span aria-hidden="true">☰</span>
      </button>
    </div>
    <div class="rail-menu" id="rail-menu">
      <div class="rail-section">Operations</div>
      <button class="nav-item" data-view="overview" aria-current="page">Overview</button>
      <button class="nav-item" data-view="fleet">Fleet health</button>
      <button class="nav-item" data-view="topology">Topology</button>
      <button class="nav-item" data-view="incidents">Incidents</button>
      <button class="nav-item" data-view="sites">Sites &amp; routers</button>
      <div class="rail-section">Automation</div>
      <button class="nav-item" data-view="security">Security</button>
      <button class="nav-item" data-view="backups">Backups</button>
      <button class="nav-item" data-view="scans">Fleet scans</button>
      <button class="nav-item" data-view="templates">Templates</button>
      <button class="nav-item" data-view="termlog">Terminal log</button>
      <div class="rail-section">Business</div>
      <button class="nav-item" data-view="portal">Captive portal</button>
      <button class="nav-item" data-view="vouchers">Vouchers</button>
      <button class="nav-item" data-view="coins">Magic Coins</button>
      <button class="nav-item" data-view="unlockkeys">Unlock keys</button>
      <button class="nav-item" data-view="team">Team</button>
      <div class="rail-section">Audit</div>
      <button class="nav-item" data-view="events">Event log</button>
      <button class="nav-item" data-view="aiusage">AI usage</button>
      <button class="nav-item" data-view="i18n">Translations</button>
      <div class="rail-section">Operator</div>
      <button class="nav-item" data-view="platform" id="nav-platform" hidden>Platform</button>
      <div style="flex:1"></div>
      <div class="rail-profile">
        <div class="rail-profile-name" id="rail-user-name">—</div>
        <div class="rail-profile-role" id="rail-user-role">—</div>
      </div>
      <button class="nav-item" id="signout">Sign out</button>
    </div>
  </nav>

  <main id="main">
    <noscript>Mega Magic needs JavaScript to run.</noscript>
  </main>
</div>

<script>
const VIEWS = {
  overview: { title: "Overview", lead: "Fleet status, active incidents, and network shape." },
  fleet:    { title: "Fleet health", lead: "Current WireGuard state for every managed peer." },
  sites:    { title: "Sites & routers", lead: "Physical locations, router access, and maintenance requests." },
  topology: { title: "Topology", lead: "Live relationships between the hub, sites, and peers." },
  incidents:{ title: "Incidents", lead: "Detected problems, recommended actions, and resolution state." },
  security: { title: "Security", lead: "RouterOS exposure and version posture across the fleet." },
  backups:  { title: "Backups", lead: "Configuration snapshots, verified change history, and restore controls." },
  events:   { title: "Event log", lead: "Router syslog and operational events, newest first." },
  templates:{ title: "Templates", lead: "Reusable RouterOS requests for controlled terminal work." },
  termlog:  { title: "Terminal log", lead: "Executed router commands with credentials redacted." },
  scans:    { title: "Fleet scans", lead: "Automated fleet inspections and their results." },
  aiusage:  { title: "AI usage", lead: "Model activity, token use, and cost records." },
  i18n:     { title: "Translations", lead: "Platform-wide interface text overrides." },
  vouchers: { title: "Vouchers", lead: "Guest access codes, resellers, and print layouts." },
  coins:    { title: "Magic Coins", lead: "Current balance and the immutable transaction ledger." },
  unlockkeys:{ title: "Unlock keys", lead: "Purchased keys and the capabilities they unlock." },
  portal:   { title: "Captive portal", lead: "Guest Wi-Fi presentation, payment settings, and requests." },
  team:     { title: "Team", lead: "People with access to this business and their roles." },
  platform: { title: "Platform", lead: "Cross-tenant health, incidents, and account administration." },
};

let ME = null;

async function loadView(name, main, me) {
  const v = VIEWS[name] || VIEWS.overview;
  main.innerHTML = `<div class="page-head"><div><h1 class="page-title">${v.title}</h1><p class="page-lead">${v.lead}</p></div></div><div id="content" aria-live="polite">${loading()}</div>`;
  try {
    if (name === "overview") await renderOverview(main);
    else if (name === "fleet") await renderFleet(main);
    else if (name === "sites") await renderSites(main);
    else if (name === "topology") await renderTopology(main);
    else if (name === "incidents") await renderIncidents(main);
    else if (name === "security") await renderSecurity(main);
    else if (name === "backups") await renderBackups(main);
    else if (name === "events") await renderEvents(main);
    else if (name === "templates") await renderTemplates(main);
    else if (name === "termlog") await renderTerminalLog(main);
    else if (name === "scans") await renderScans(main);
    else if (name === "aiusage") await renderAIUsage(main);
    else if (name === "i18n") await renderI18n(main);
    else if (name === "vouchers") await renderVouchers(main);
    else if (name === "coins") await renderMagicCoins(main);
    else if (name === "unlockkeys") await renderUnlockKeys(main);
    else if (name === "portal") await renderPortal(main);
    else if (name === "team") await renderTeam(main);
    else if (name === "platform") await renderPlatform(main);
  } catch (err) {
    const content = main.querySelector("#content");
    content.innerHTML = `<div class="panel"><div class="empty error-empty" role="alert">
      <div class="empty-title">Couldn’t load ${esc(v.title.toLowerCase())}</div>
      <p>${esc(errorText(err, "The server did not return this view."))}</p>
      <button class="btn" id="view-retry" type="button">Try again</button>
    </div></div>`;
    content.querySelector("#view-retry").addEventListener("click", () => loadView(name, main, me));
  }
}

function loading() {
  return `<div class="loading-state" role="status"><span class="loading-pulse"></span><span>Loading…</span></div>`;
}

function errorText(err, fallback = "The server did not return a usable response.") {
  if (!err) return fallback;
  if (typeof err === "string") return err;
  const data = err.data !== undefined ? err.data : err;
  if (typeof data === "string") return data;
  if (data && typeof data === "object") {
    return String(data.error || data.reason || data.message || fallback);
  }
  return String(err.message || fallback);
}

/* ---------- Overview ---------- */
async function renderOverview(main) {
  const fleet = await MM.get("/fleet/health");
  const topo = await MM.get("/topology/map");
  let security = null;
  try { security = await MM.get("/security/posture"); } catch (_) {}
  const content = main.querySelector("#content");
  const securityAttention = security && Number(security.affected || 0) > 0
    ? `<div class="security-banner">
        <span class="status ${Number(security.exploited || 0) > 0 ? "bad" : "warn"}">${Number(security.affected || 0)} affected</span>
        <div><strong>Security action required</strong><span>${Number(security.exploited || 0) > 0 ? `${Number(security.exploited)} device(s) match an actively exploited advisory.` : "Review affected RouterOS versions and mitigations."}${Number(security.unpatchable || 0) > 0 ? ` ${Number(security.unpatchable)} device(s) also match an advisory with no vendor fix.` : ""}</span></div>
        <button class="btn btn-sm" id="overview-security" type="button">Review security</button>
      </div>`
    : "";
  content.innerHTML = `
    <div class="stat-cluster fleet-stats" style="margin-top:18px">
      <div class="stat"><div class="stat-label">Peers</div><div class="stat-value">${fleet.total_peers}</div></div>
      <div class="stat"><div class="stat-label">Up</div><div class="stat-value">${fleet.up}</div></div>
      <div class="stat"><div class="stat-label">Stale</div><div class="stat-value">${fleet.stale}</div></div>
      <div class="stat"><div class="stat-label">Offline</div><div class="stat-value">${fleet.offline}</div></div>
      <div class="stat"><div class="stat-label">Unknown</div><div class="stat-value">${fleet.unknown}</div></div>
    </div>
    ${securityAttention}
    <hr class="rule">
    <div class="panel"><div class="panel-head"><h2 class="panel-title">Fleet state</h2></div>
      <div class="panel-body" id="ov-fleet">${loading()}</div>
    </div>
    <div class="panel" style="margin-top:14px"><div class="panel-head"><h2 class="panel-title">Network map</h2></div>
      <div class="panel-body" id="ov-topo">${loading()}</div>
    </div>`;
  document.querySelector("#ov-fleet").innerHTML = fleetTable(fleet);
  document.querySelector("#ov-topo").innerHTML = topologySummary(topo);
  const securityBtn = document.getElementById("overview-security");
  if (securityBtn) securityBtn.addEventListener("click", () => {
    const nav = document.querySelector('.nav-item[data-view="security"]');
    if (nav) nav.click();
  });
  await renderPulse(main);
}

/* ---------- Fleet pulse (Stage 1) ---------- */
const FIX_KINDS = { reboot: 1, restore_backup: 1, reprovision_peer: 1 };
const FIX_HIGH_RISK = { reboot: 1, restore_backup: 1 };

function actionKind(inc) {
  return (inc && inc.suggested_action && inc.suggested_action.kind) ? inc.suggested_action.kind : "";
}
function applyFixCell(inc) {
  const k = actionKind(inc);
  if (FIX_KINDS[k]) return `<button class="btn btn-sm" data-fix="${esc(inc.id)}" data-kind="${esc(k)}">Apply fix</button>`;
  if (k === "review" || k === "none") return `<span class="muted small">Manual review</span>`;
  return "";
}
function wireFixes(scope, main, refresh) {
  scope.querySelectorAll("button[data-fix]").forEach(btn => {
    btn.addEventListener("click", async () => {
      const id = btn.dataset.fix, kind = btn.dataset.kind;
      if (!FIX_KINDS[kind]) return;
      if (FIX_HIGH_RISK[kind] && !confirm("Apply " + kind + " to fix this incident? This is a high-risk action.")) return;
      btn.disabled = true; btn.textContent = "…";
      try {
        await MM.post("/incidents/" + encodeURIComponent(id) + "/action", {});
        btn.textContent = "fix queued";
        if (refresh) await refresh();
      } catch (e) {
        if (e.status === 503) { btn.textContent = "auto-fix unavailable offline"; btn.disabled = true; }
        else if (e.status === 400) { btn.textContent = "Manual review"; btn.disabled = true; }
        else { btn.disabled = false; btn.textContent = "Retry"; }
      }
    });
  });
}

async function renderPulse(main) {
  let pulse;
  try { pulse = await MM.get("/fleet/pulse"); } catch (_) { return; }
  if (!pulse) return;
  const content = main.querySelector("#content");
  const head = pulse.open_incidents_head || [];
  const attention = (pulse.attention && pulse.attention[0]) || null;
  const sev = (s) => `<span class="status ${{ critical: "bad", warning: "warn", warn: "warn" }[String(s).toLowerCase()] || "unknown"}">${esc(s || "info")}</span>`;
  const headRows = head.map(inc => `<tr><td>${sev(inc.severity)}</td><td><span class="num">${esc(inc.subject_label || "—")}</span></td><td class="mono">${esc(inc.kind)}</td><td>${applyFixCell(inc)}</td></tr>`).join("");
  const strip = document.createElement("div");
  strip.innerHTML = (attention ? `<div class="panel" style="margin-bottom:14px;border-left:3px solid var(--bad)"><div class="panel-head"><h2 class="panel-title">Needs attention</h2></div><div class="panel-body"><div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">${sev(attention.severity)}<span class="num">${esc(attention.subject_label || "—")}</span><span class="muted small">${esc(attention.kind)}</span><span style="flex:1"></span>${applyFixCell(attention)}</div></div></div>` : "") +
    (head.length
      ? `<div class="panel" style="margin-bottom:14px"><div class="panel-head"><h2 class="panel-title">Open incidents</h2></div><div class="panel-body"><table><thead><tr><th>Severity</th><th>Subject</th><th>Kind</th><th></th></tr></thead><tbody>${headRows}</tbody></table></div></div>`
      : `<div class="health-banner"><span class="status ok">Clear</span><div><strong>No recovery incidents</strong><span>No unresolved tunnel or policy incidents right now.</span></div></div>`);
  const stats = content.querySelector(".stat-cluster");
  if (attention) content.insertBefore(strip, content.firstChild);
  else if (stats) stats.insertAdjacentElement("afterend", strip);
  else content.insertBefore(strip, content.firstChild);
  wireFixes(content, main, async () => { await renderOverview(main); });
}

/* ---------- Fleet ---------- */
async function renderFleet(main) {
  const fleet = await MM.get("/fleet/health");
  main.querySelector("#content").innerHTML = fleetTable(fleet);
}

function fleetTable(fleet) {
  if (!fleet.peers || !fleet.peers.length) return `<div class="empty"><div class="empty-title">No peers yet</div>Provision a router to see it here.</div>`;
  const rows = fleet.peers.map(p => `
    <tr>
      <td><span class="num">${esc(p.hardware_name)}</span></td>
      <td>${badge(p.state)}</td>
      <td class="mono">${esc(p.device_id)}</td>
    </tr>`).join("");
  return `<table>
    <thead><tr><th>Device</th><th>State</th><th>ID</th></tr></thead>
    <tbody>${rows}</tbody></table>`;
}

/* ---------- Sites (geo) ---------- */
// Sites hold the physical-location data migrated from Mikromagic: a free-text
// location, a timezone label, and latitude/longitude. This is the only surface
// in the app that shows that geo data.
const SITE_EDITOR_ROLES = ["OWNER", "ADMIN", "DEVELOPER"];

// A Go nil slice marshals to JSON null, so `data.routers || data` yields the
// wrapper OBJECT when a tenant has none and the next .map() throws. Never trust
// the shape — coerce to an array.
function asArray(v) { return Array.isArray(v) ? v : []; }

function siteGeoPanel(sites) {

           ${Number(s.latitude).toFixed(5)}, ${Number(s.longitude).toFixed(5)}</a>`

        <div class="field"><label>Latitude</label><input class="input" id="gs-lat" type="number" step="any" min="-90" max="90" placeholder="16.866"></div>
        <div class="field"><label>Longitude</label><input class="input" id="gs-lng" type="number" step="any" min="-180" max="180" placeholder="96.195"></div>
        <div class="field"><label>Notes</label><input class="input" id="gs-notes"></div>
        <button class="btn btn-primary" id="gs-save">Create site</button>
        <span id="gs-msg" class="muted small"></span>
      </div></div>` : ""}

}

function wireSiteGeo(main, sites) {
  const content = main.querySelector("#content");
  const notify = (m) => {
    const el = document.getElementById("geo-alert");
    if (el) el.innerHTML = `<div class="alert" role="alert">${esc(m)}</div>`;
  };
  const num = (id) => {
    const v = document.getElementById(id).value.trim();
    return v === "" ? null : Number(v);
  };

  const addBtn = document.getElementById("geo-add");
  if (addBtn) addBtn.addEventListener("click", () => {
    const f = document.getElementById("geo-form");
    f.hidden = !f.hidden;
    if (!f.hidden) document.getElementById("gs-name").focus();
  });

  const saveBtn = document.getElementById("gs-save");
  if (saveBtn) saveBtn.addEventListener("click", async () => {
    const body = {
      name: document.getElementById("gs-name").value.trim(),
      location: document.getElementById("gs-location").value.trim() || null,
      timezone: document.getElementById("gs-tz").value.trim() || null,
      latitude: num("gs-lat"),
      longitude: num("gs-lng"),
      notes: document.getElementById("gs-notes").value.trim() || null,
    };
    if (!body.name) { document.getElementById("gs-msg").textContent = "Name is required."; return; }
    // Half a coordinate is worse than none — require both or neither.
    if ((body.latitude === null) !== (body.longitude === null)) {
      document.getElementById("gs-msg").textContent = "Give both latitude and longitude, or neither.";
      return;
    }
    saveBtn.disabled = true; saveBtn.textContent = "…";
    try { await MM.post("/sites", body); await renderSites(main); }
    catch (e) {
      saveBtn.disabled = false; saveBtn.textContent = "Create site";
      notify((e.data && e.data.error) ? e.data.error : e.message);
    }
  });

  content.querySelectorAll("button[data-gdel]").forEach(btn => btn.addEventListener("click", async () => {

    try { await MM.del("/sites/" + encodeURIComponent(btn.dataset.gdel)); await renderSites(main); }
    catch (e) { notify((e.data && e.data.error) ? e.data.error : e.message); }
  }));

  content.querySelectorAll("button[data-gedit]").forEach(btn => btn.addEventListener("click", () => {
    openEditSite(main, sites.find(x => x.site_id === btn.dataset.gedit));

}

const CONN_CLOUD_CLASS = { online: "ok", pending: "warn", offline: "bad", error: "bad" };

function connCloudBadge(status) {

function siteOptionsHtml(sites, selectedId) {

function readConnForm(prefix) {

  const portRaw = val(prefix + "port");
  return {
    name: val(prefix + "name"),
    host: val(prefix + "host") || null,
    port: portRaw === "" ? null : Number(portRaw),
    connection_mode: val(prefix + "mode") || null,
    environment: val(prefix + "env") || null,
    site_id: val(prefix + "site") || null,

/* ---------- Device allowances + requests ---------- */
// Granted capacity ported from Mikromagic, plus the request workflow. Approving a
// request records the decision only — the ported request carries no quantity, so
// there is no amount to apply and the UI says so rather than implying a grant.
function allowancePanel(a) {
  if (!a) return "";
  const row = (label, granted, used) => `<tr>
      <td>${esc(label)}</td>
      <td class="num">${granted === null ? `<span class="muted small">—</span>` : granted}</td>
      <td class="num">${used}</td>
      <td>${granted !== null && used > granted ? `<span class="status bad">over</span>` : `<span class="status ok">ok</span>`}</td>
    </tr>`;

  return `<div class="panel"><div class="panel-head"><h2 class="panel-title">Device allowances</h2></div>
      <div class="panel-body">
        <table><thead><tr><th>Capacity</th><th>Granted</th><th>In use</th><th></th></tr></thead>
        <tbody>
          ${row("Routers", a.routers, a.used_routers)}
          ${row("Controllers", a.controllers, a.used_controllers)}
          ${row("Sites", a.sites, a.used_sites)}
          ${row("Access points", null, a.used_access_points)}
        </tbody></table>
        ${a.included_router_name ? `<p class="muted small">Grant includes router connection: <span class="mono">${esc(a.included_router_name)}</span></p>` : ""}
        <p class="muted small">Routers and controllers are counted from each device's deployment layer; access points are listed separately because the ported grant never specified whether it covered them.</p>
      </div></div>`;
}

function requestStatusBadge(status) {
  const cls = status === "approved" ? "ok" : (status === "rejected" ? "bad" : "warn");
  return `<span class="status ${cls}">${esc(status)}</span>`;
}

function requestPanel(requests) {
  const canDecide = SITE_EDITOR_ROLES.indexOf((ME && ME.user && ME.user.user_role) || "") >= 0;
  const pending = requests.filter(r => r.status === "pending").length;

      <td>${r.user_email ? esc(r.user_email) : `<span class="muted small">—</span>`}</td>
      <td>${r.reason ? esc(r.reason) : `<span class="muted small">—</span>`}</td>
      <td>${requestStatusBadge(r.status)}</td>
      <td>${r.decided_at ? esc(ts(r.decided_at)) : `<span class="muted small">—</span>`}</td>
      ${canDecide ? `<td>${r.status === "pending" ? `
        <button class="btn btn-sm" data-qapprove="${esc(r.id)}">Approve</button>
        <button class="btn btn-sm" data-qreject="${esc(r.id)}">Reject</button>` : `<span class="muted small">decided</span>`}</td>` : "<td></td>"}
    </tr>`).join("") : `<tr><td colspan="6" class="muted small">No capacity requests.</td></tr>`;

  return `<div class="panel"><div class="panel-head"><h2 class="panel-title">Device requests</h2></div>
      <div class="panel-body">
        ${canDecide && pending ? `<div class="alert" role="status">${pending} request(s) awaiting your decision. Approving records the decision — it does not raise the allowance, which is changed separately.</div>` : ""}
        <table><thead><tr><th>Kind</th><th>Requested by</th><th>Reason</th><th>Status</th><th>Decided</th><th></th></tr></thead>
        <tbody>${rows}</tbody></table>
      </div></div>

      <button class="btn btn-primary" id="req-add">Request capacity</button>

        <div class="field"><label>Capacity</label><select class="input" id="qr-kind"></select></div>

        <span id="qr-msg" class="muted small"></span>

function wireAllowance(main, allowance, requests, kinds) {
  const content = main.querySelector("#content");
  const notify = (m) => {
    const el = document.getElementById("req-alert");
    if (el) el.innerHTML = `<div class="alert" role="alert">${esc(m)}</div>`;
  };

  const addBtn = document.getElementById("req-add");
  if (addBtn) addBtn.addEventListener("click", () => {
    const f = document.getElementById("req-form");
    f.hidden = !f.hidden;
    if (!f.hidden) {
      const sel = document.getElementById("qr-kind");
      sel.innerHTML = (kinds && kinds.length ? kinds : ["routers", "controllers", "sites"])
        .map(k => `<option value="${esc(k)}">${esc(k)}</option>`).join("");
      document.getElementById("qr-reason").focus();
    }
  });

  const saveBtn = document.getElementById("qr-save");
  if (saveBtn) saveBtn.addEventListener("click", async () => {
    const kind = document.getElementById("qr-kind").value;
    const reason = document.getElementById("qr-reason").value.trim() || null;
    saveBtn.disabled = true; saveBtn.textContent = "…";
    try { await MM.post("/device-requests", { kind, reason }); await renderSites(main); }
    catch (e) {
      saveBtn.disabled = false; saveBtn.textContent = "Submit request";
      notify((e.data && e.data.error) ? e.data.error : e.message);
    }
  });

  const decide = async (id, status) => {
    try { await MM.post(`/device-requests/${encodeURIComponent(id)}/decide`, { status }); await renderSites(main); }
    catch (e) { notify((e.data && e.data.error) ? e.data.error : e.message); }
  };
  content.querySelectorAll("button[data-qapprove]").forEach(b =>
    b.addEventListener("click", () => decide(b.dataset.qapprove, "approved")));
  content.querySelectorAll("button[data-qreject]").forEach(b =>
    b.addEventListener("click", () => decide(b.dataset.qreject, "rejected")));
}

}

/* ---------- Event log (syslog) ---------- */
// Read-only, newest-first, paged. State lives here so paging and filtering can
// refresh only the table body rather than tearing down the filter controls.
const EVENTS_PAGE = 50;
let eventsState = { severity: "", program: "", q: "", offset: 0, pages: 0 };

const SEV_CLASS = { info: "", warning: "warn", critical: "bad" };

function sevBadge(sev) {
  const cls = SEV_CLASS[sev] !== undefined ? SEV_CLASS[sev] : "";
  return `<span class="status ${cls}">${esc(sev)}</span>`;
}

// Router syslog lines are long; keep rows scannable but never hide the text —
// the full message stays reachable via the title attribute.
function clampMsg(m, n) {
  const s = String(m == null ? "" : m);
  return s.length > n ? s.slice(0, n) + "…" : s;
}

async function renderEvents(main) {
  eventsState = { severity: "", program: "", q: "", offset: 0, pages: 0 };
  const content = main.querySelector("#content");
  content.innerHTML = `
    <div class="panel"><div class="panel-head"><h2 class="panel-title">Filters</h2></div>
      <div class="panel-body">
        <div class="field"><label>Severity</label><select class="input" id="ev-sev">
          <option value="">all severities</option></select></div>
        <div class="field"><label>Program</label><select class="input" id="ev-prog">
          <option value="">all programs</option></select></div>
        <div class="field"><label>Message contains</label><input class="input" id="ev-q" placeholder="e.g. logged in"></div>
        <button class="btn btn-primary" id="ev-apply">Apply</button>

      </div></div>
    <div class="panel"><div class="panel-head"><h2 class="panel-title">Events</h2></div>
      <div class="panel-body">
        <p class="muted small" id="ev-summary">Loading…</p>
        <table><thead><tr><th>Time</th><th>Severity</th><th>Program</th><th>Source</th><th>Message</th></tr></thead>
        <tbody id="ev-body"><tr><td colspan="5" class="muted small">Loading…</td></tr></tbody></table>
        <div style="display:flex;gap:8px;margin-top:10px">
          <button class="btn" id="ev-newer">‹ Newer</button>
          <button class="btn" id="ev-older">Older ›</button>
        </div>
      </div></div>`;

  document.getElementById("ev-apply").addEventListener("click", () => {
    eventsState.severity = document.getElementById("ev-sev").value;
    eventsState.program = document.getElementById("ev-prog").value;
    eventsState.q = document.getElementById("ev-q").value.trim();
    eventsState.offset = 0;
    loadEvents(main);
  });
  document.getElementById("ev-reset").addEventListener("click", () => {
    eventsState = { severity: "", program: "", q: "", offset: 0, pages: eventsState.pages };
    document.getElementById("ev-sev").value = "";
    document.getElementById("ev-prog").value = "";
    document.getElementById("ev-q").value = "";
    loadEvents(main);
  });
  // Enter in the search box applies, matching how a log filter is expected to behave.
  document.getElementById("ev-q").addEventListener("keydown", (e) => {
    if (e.key === "Enter") document.getElementById("ev-apply").click();
  });
  document.getElementById("ev-newer").addEventListener("click", () => {
    eventsState.offset = Math.max(0, eventsState.offset - EVENTS_PAGE);
    loadEvents(main);
  });
  document.getElementById("ev-older").addEventListener("click", () => {
    eventsState.offset += EVENTS_PAGE;
    loadEvents(main);
  });

  await loadEvents(main);
}

async function loadEvents(main) {
  const qs = new URLSearchParams();
  if (eventsState.severity) qs.set("severity", eventsState.severity);
  if (eventsState.program) qs.set("program", eventsState.program);
  if (eventsState.q) qs.set("q", eventsState.q);
  qs.set("limit", EVENTS_PAGE);
  qs.set("offset", eventsState.offset);

  const body = document.getElementById("ev-body");
  const summary = document.getElementById("ev-summary");
  const msg = document.getElementById("ev-msg");
  if (!body) return;                       // view was navigated away mid-flight
  try {
    const d = await MM.get("/syslog-events?" + qs.toString());

    const sevSel = document.getElementById("ev-sev");
    if (sevSel && sevSel.options.length <= 1) {
      (d.severities || []).forEach(s => sevSel.add(new Option(s, s)));
      sevSel.value = eventsState.severity;
    }
    const progSel = document.getElementById("ev-prog");
    if (progSel && progSel.options.length <= 1) {
      (d.programs || []).forEach(p => progSel.add(new Option(p, p)));
      progSel.value = eventsState.program;
    }

    const events = asArray(d.events);
    body.innerHTML = events.length ? events.map(e => `<tr>
        <td class="muted small">${esc(ts(e.received_at))}</td>
        <td>${sevBadge(e.severity)}${e.ai_severity ? ` <span class="muted small">ai:${esc(e.ai_severity)}</span>` : ""}</td>
        <td>${e.program ? `<span class="mono">${esc(e.program)}</span>` : `<span class="muted small">—</span>`}</td>
        <td>${e.source_ip ? `<span class="mono">${esc(e.source_ip)}</span>` : `<span class="muted small">—</span>`}</td>
        <td title="${esc(e.message)}">${esc(clampMsg(e.message, 140))}</td>
      </tr>`).join("") : `<tr><td colspan="5" class="muted small">No events match these filters.</td></tr>`;

    const from = d.total ? eventsState.offset + 1 : 0;
    const to = eventsState.offset + events.length;
    summary.textContent = `Showing ${from}–${to} of ${d.total} event(s)` +
      (eventsState.severity || eventsState.program || eventsState.q ? " (filtered)" : "");

    document.getElementById("ev-newer").disabled = eventsState.offset === 0;
    document.getElementById("ev-older").disabled = !d.has_more;
    if (msg) msg.textContent = "";
  } catch (e) {
    if (msg) msg.textContent = (e.data && e.data.error) ? e.data.error : e.message;
    body.innerHTML = `<tr><td colspan="5" class="muted small">Could not load events.</td></tr>`;
  }
}

function deviceLabel(d) {
  const st = d.is_online ? "up" : "offline";
  return `<div class="dev ${st}" title="${esc(d.device_id)}">${esc((d.hardware_name||"D")[0])}</div>`;
}

function topologySummary(topo) {
  const count = (topo.roots ? topo.roots.length : 0) + (topo.orphans ? topo.orphans.length : 0);
  const s = topo.summary || {};
  return `<div class="muted small">${count} device${count === 1 ? "" : "s"} · ${esc(topo.business_id)}</div>`;
}

function topologyTree(topo) {
  const roots = topo.roots || [];
  if (!roots.length) return `<div class="empty"><div class="empty-title">Empty map</div>No devices have reported a topology yet.</div>`;
  const render = (node, depth) => {
    const d = node.device || {};
    const kids = (node.children || []).map(c => render(c, depth + 1)).join("");
    const pad = "&nbsp;".repeat(depth * 4);
    const caret = node.children && node.children.length ? (node.expanded ? "▾" : "▸") : "·";
    return `<div style="display:flex;gap:8px;align-items:center;margin-bottom:4px"><span class="mono small">${pad}${caret}</span>${deviceLabel(d)}<span class="num" style="flex:1">${esc(d.hardware_name||"(device)")}</span><span class="muted small">${esc(d.deployment_layer||"")}</span>${node.children && node.children.length ? `<span class="muted small">${node.children.length} child${node.children.length===1?"":"ren"}</span>` : ""}</div>${kids}`;
  };
  return `<div>${roots.map(r => render(r, 0)).join("")}</div>`;
}

  const list = Array.isArray(data.incidents) ? data.incidents : asArray(data);

  if (!list.length) {
    content.innerHTML = `<div class="empty"><div class="empty-title">No open incidents</div>AI-detected problems and policy alerts will appear here.</div>`;
    return;
  }
  const sevBadge = (s) => {
    const m = { critical: "bad", warning: "warn" }[String(s).toLowerCase()] || "unknown";
    return `<span class="status ${m}">${esc(s)}</span>`;
  };
  const rows = list.map(inc => `
    <tr>
      <td>${sevBadge(inc.severity || "info")}</td>
      <td><span class="mono">${esc(inc.kind)}</span></td>
      <td><span class="num">${esc(inc.subject_label || inc.subject_id || "—")}</span></td>
      <td class="muted small">${esc((inc.detail && inc.detail.replace(/\s+/g," ")) ? inc.detail.slice(0,80) : "—")}</td>
      <td>${ts(inc.opened_at)}</td>
      <td>
        <button class="btn btn-sm" data-act="ack" data-id="${esc(inc.id)}">Acknowledge</button>
        <button class="btn btn-sm" data-act="resolve" data-id="${esc(inc.id)}">Resolve</button>
        ${applyFixCell(inc)}
      </td>
    </tr>`).join("");
  content.innerHTML = `<table>
    <thead><tr><th>Severity</th><th>Kind</th><th>Subject</th><th>Detail</th><th>Opened</th><th></th></tr></thead>
    <tbody>${rows}</tbody></table>`;
  wireFixes(content, main, () => renderIncidents(main));
  content.querySelectorAll("button[data-act]").forEach(btn => {
    btn.addEventListener("click", async () => {
      const id = btn.dataset.id, act = btn.dataset.act;
      btn.disabled = true; btn.textContent = "…";
      try {
        await MM.post(`/incidents/${encodeURIComponent(id)}/${act}`);
        await renderIncidents(main);
      } catch (e) {
        btn.disabled = false; btn.textContent = "Retry";
        content.appendChild(Object.assign(document.createElement("div"), { className: "alert", textContent: e.message }));
      }
    });
  });
}

/* ---------- Translations (i18n overrides) ---------- */
// UI string overrides. ⚠️ This table is GLOBAL: it has no business_id and RLS is
// disabled, so every business reads the same rows. Editing is therefore a
// platform action — the write controls only appear for an exact DEVELOPER role,
// and the API enforces the same gate independently of this check.
let i18nState = { locale: "", namespace: "", q: "", limit: 100, offset: 0 };
let i18nEditing = null; // id being edited, or "new"

function isDeveloper() {
  return ((ME && ME.user && ME.user.user_role) || "") === "DEVELOPER";
}

function renderI18nForm(o) {

      <div class="panel-body">

        <div class="field"><label>Namespace</label><select class="input" id="i18n-f-ns">${NAMESPACES}</select></div>
        <div class="field"><label>Key (the English source string)</label>
          <input class="input" id="i18n-f-key" value="${o ? esc(o.key) : ""}"></div>

let LOCALES = "", NAMESPACES = "";
function fillOptions(list, selected) {
  return asArray(list).map(v =>
    `<option value="${esc(v)}"${v === selected ? " selected" : ""}>${esc(v)}</option>`).join("");
}

async function renderI18n(main) {
  i18nState = { locale: "", namespace: "", q: "", limit: 100, offset: 0 };
  LOCALES = fillOptions(["en", "zh", "my"], "");
  NAMESPACES = fillOptions(["ui", "copy"], "");
  main.querySelector("#content").innerHTML = `
    <div class="panel"><div class="panel-head"><h2 class="panel-title">Scope</h2></div>
      <div class="panel-body">

function openI18nEditor(o) {
  i18nEditing = o ? o.id : "new";
  const host = document.getElementById("i18n-editor");
  if (!host) return;
  host.innerHTML = renderI18nForm(o);
  const l = document.getElementById("i18n-f-locale"), n = document.getElementById("i18n-f-ns");
  if (o) { l.value = o.locale; n.value = o.namespace; }
  document.getElementById("i18n-cancel").addEventListener("click", () => {
    i18nEditing = null; host.innerHTML = "";
  });
  document.getElementById("i18n-save").addEventListener("click", async () => {
    const err = document.getElementById("i18n-form-err");
    const body = {
      locale: document.getElementById("i18n-f-locale").value,
      namespace: document.getElementById("i18n-f-ns").value,
      key: document.getElementById("i18n-f-key").value.trim(),
      value: document.getElementById("i18n-f-value").value,
    };
    if (!body.key) { err.innerHTML = `<div class="alert" role="alert">Key is required.</div>`; return; }
    if (!body.value.trim()) { err.innerHTML = `<div class="alert" role="alert">Translation is required — an empty value would blank the string.</div>`; return; }
    try {
      if (o) await MM.put("/i18n-overrides/" + o.id, body);
      else await MM.post("/i18n-overrides", body);
      i18nEditing = null;
      await loadI18n();
    } catch (e) {
      err.innerHTML = `<div class="alert" role="alert">${esc(apiErrorText(e, "Could not save."))}</div>`;
    }
  });
}

async function loadI18n() {
  const body = document.getElementById("i18n-body");
  if (!body) return;
  const qs = new URLSearchParams();
  qs.set("limit", i18nState.limit);
  qs.set("offset", i18nState.offset);
  if (i18nState.locale) qs.set("locale", i18nState.locale);
  if (i18nState.namespace) qs.set("namespace", i18nState.namespace);
  if (i18nState.q) qs.set("q", i18nState.q);

  let d;
  try { d = await MM.get("/i18n-overrides?" + qs.toString()); }
  catch (e) {
    body.innerHTML = `<tr><td colspan="6" class="muted small">${esc(apiErrorText(e, "Could not load translations."))}</td></tr>`;
    return;
  }

  const ls = document.getElementById("i18n-locale"), ns = document.getElementById("i18n-ns");
  if (ls && ls.options.length <= 1) {
    asArray(d.locales).forEach(v => ls.add(new Option(v, v)));
    asArray(d.namespaces).forEach(v => ns.add(new Option(v, v)));
    ls.value = i18nState.locale; ns.value = i18nState.namespace;
  }

  const bl = d.by_locale || {}, bn = d.by_namespace || {};
  document.getElementById("i18n-facets").textContent =
    `${tok(d.total)} override(s) · by locale: ` +
    (Object.keys(bl).length ? Object.entries(bl).map(([k, v]) => `${k} ${v}`).join(", ") : "none") +
    " · by namespace: " +
    (Object.keys(bn).length ? Object.entries(bn).map(([k, v]) => `${k} ${v}`).join(", ") : "none");

  const canEdit = isDeveloper();
  const items = asArray(d.overrides);
  body.innerHTML = items.length ? items.map(o => `<tr>
      <td>${esc(o.locale)}</td>
      <td>${esc(o.namespace)}</td>
      <td>${esc(o.key)}</td>
      <td>${esc(o.value)}</td>
      <td>${ts(o.updated_at)}</td>
      ${canEdit ? `<td class="num">
        <button class="btn btn-sm" data-i18n-edit="${esc(o.id)}">Edit</button>
        <button class="btn btn-sm" data-i18n-del="${esc(o.id)}">Delete</button></td>` : ""}
    </tr>`).join("") : `<tr><td colspan="6" class="muted small">No overrides match.</td></tr>`;

  if (canEdit) {
    body.querySelectorAll("[data-i18n-edit]").forEach(el =>
      el.addEventListener("click", () => openI18nEditor(items.find(x => x.id === el.getAttribute("data-i18n-edit")))));
    body.querySelectorAll("[data-i18n-del]").forEach(el =>
      el.addEventListener("click", async () => {
        const id = el.getAttribute("data-i18n-del");
        try { await MM.del("/i18n-overrides/" + id); await loadI18n(); }
        catch (e) {
          document.getElementById("i18n-form-err").innerHTML =
            `<div class="alert" role="alert">${esc(apiErrorText(e, "Could not delete."))}</div>`;
        }
      }));
    const host = document.getElementById("i18n-editor");
    if (host && !i18nEditing) host.innerHTML = `<button class="btn btn-primary" id="i18n-add">Add override</button>`;
    const add = document.getElementById("i18n-add");
    if (add) add.addEventListener("click", () => openI18nEditor(null));
  }

  const from = items.length ? i18nState.offset + 1 : 0;
  document.getElementById("i18n-summary").textContent =
    `Showing ${from}–${i18nState.offset + items.length} of ${tok(d.total)} override(s)` +
    (i18nState.locale || i18nState.namespace || i18nState.q ? " (filtered)" : "");
  document.getElementById("i18n-newer").disabled = i18nState.offset === 0;
  document.getElementById("i18n-older").disabled = !d.has_more;
}

/* ---------- Terminal log ---------- */
// Audit log of commands run against routers. Read-only.
//
// The API redacts credential values before returning, so a script like
// `/user add name=x password=y` renders as `password=***`. The banner says so, so
// nobody reads `***` as the literal value the router received.
let termLogState = { source: "", status: "", q: "", limit: 50, offset: 0 };

// apiErrorText renders why a call failed. api.js already puts the server's own
// `error` field into err.message ("status must be an integer"), so discarding it
// for a generic string throws away the most useful part of the response.
function apiErrorText(e, fallback) {
  const m = (e && e.message) || "";
  if (m === "network-unreachable") return "The server could not be reached.";
  if (m === "unauthorized") return "Your session expired — sign in again.";
  if (m && !/^http-\d+$/.test(m)) return m;
  return fallback;
}

function statusCell(e) {
  if (!e.status_known) return `<span class="muted" title="The old app did not record a status.">—</span>`;
  const ok = Number(e.status) < 400;
  return `<span class="${ok ? "status ok" : "status warn"}">${esc(e.status)}</span>`;
}

async function renderTerminalLog(main) {
  termLogState = { source: "", status: "", q: "", limit: 50, offset: 0 };
  main.querySelector("#content").innerHTML = `

          <code>secret=</code> or <code>token=</code> value in a command or reply is
          replaced with <code>***</code> before it reaches this page.
        </div>
        <div class="field"><label>Source</label><select class="input" id="tl-source">
          <option value="">all sources</option></select></div>
        <div class="field"><label>Status</label><input class="input" id="tl-status"
          placeholder="e.g. 200" inputmode="numeric"></div>
        <div class="field"><label>Search</label><input class="input" id="tl-q"
          placeholder="script, path or reply"></div>
        <button class="btn btn-primary" id="tl-apply">Apply</button>
        <button class="btn" id="tl-reset">Reset</button>
        <p class="muted small" id="tl-summary">Loading…</p>
        <table><thead><tr><th>When</th><th>Command</th><th>Source</th>
          <th>Status</th><th class="num">ms</th><th>Reply</th></tr></thead>
          <tbody id="tl-body"><tr><td colspan="6" class="muted small">Loading…</td></tr></tbody></table>
        <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:10px">
          <button class="btn btn-sm" id="tl-newer">‹ Newer</button>
          <button class="btn btn-sm" id="tl-older">Older ›</button>
        </div>
      </div></div>`;

  const apply = () => {
    termLogState.source = document.getElementById("tl-source").value;
    termLogState.status = document.getElementById("tl-status").value.trim();
    termLogState.q = document.getElementById("tl-q").value.trim();
    termLogState.offset = 0;
    loadTerminalLog();
  };
  document.getElementById("tl-apply").addEventListener("click", apply);
  document.getElementById("tl-q").addEventListener("keydown", ev => { if (ev.key === "Enter") apply(); });
  document.getElementById("tl-reset").addEventListener("click", () => {
    termLogState = { source: "", status: "", q: "", limit: 50, offset: 0 };
    ["tl-source", "tl-status", "tl-q"].forEach(id => { const el = document.getElementById(id); if (el) el.value = ""; });
    loadTerminalLog();
  });
  document.getElementById("tl-older").addEventListener("click", () => {
    termLogState.offset += termLogState.limit; loadTerminalLog();
  });
  document.getElementById("tl-newer").addEventListener("click", () => {
    termLogState.offset = Math.max(0, termLogState.offset - termLogState.limit); loadTerminalLog();
  });

  await loadTerminalLog();

async function loadTerminalLog() {
  const body = document.getElementById("tl-body");
  if (!body) return;
  const qs = new URLSearchParams();
  qs.set("limit", termLogState.limit);
  qs.set("offset", termLogState.offset);

  document.getElementById("tl-newer").disabled = termLogState.offset === 0;
  document.getElementById("tl-older").disabled = !d.has_more;
}

/* ---------- AI usage ---------- */
// Token history for the AI features. Read-only.
//
// The dashboard figures come from an UNFILTERED summary, so narrowing the list
// does not silently change the totals above it.
let aiUsageState = { feature: "", model: "", limit: 50, offset: 0 };

function tok(n) { return Number(n || 0).toLocaleString(); }

function usageRows(groups) {
  const list = asArray(groups);
  if (!list.length) return `<tr><td colspan="3" class="muted small">none</td></tr>`;
  return list.map(g => `<tr>
      <td>${esc(g.name)}</td>
      <td class="num">${tok(g.events)}</td>
      <td class="num">${tok(g.total_tokens)}</td>
    </tr>`).join("");
}

async function renderAIUsage(main) {

async function loadAIUsage() {
  const body = document.getElementById("ai-body");
  if (!body) return;
  const qs = new URLSearchParams();
  qs.set("limit", aiUsageState.limit);
  qs.set("offset", aiUsageState.offset);
  if (aiUsageState.feature) qs.set("feature", aiUsageState.feature);
  if (aiUsageState.model) qs.set("model", aiUsageState.model);

  let d;
  try { d = await MM.get("/ai-usage-events?" + qs.toString()); }
  catch (e) {
    body.innerHTML = `<tr><td colspan="6" class="muted small">${esc(apiErrorText(e, "Could not load AI usage."))}</td></tr>`;
    return;
  }

  // Populate the facet dropdowns from the summary (unfiltered, so they stay stable).
  const s = d.summary || {};
  const fs = document.getElementById("ai-feat"), ms = document.getElementById("ai-model");
  if (fs && fs.options.length <= 1) {
    asArray(s.by_feature).forEach(g => fs.add(new Option(`${g.name} (${tok(g.total_tokens)})`, g.name)));
    asArray(s.by_model).forEach(g => ms.add(new Option(`${g.name} (${tok(g.total_tokens)})`, g.name)));
    fs.value = aiUsageState.feature; ms.value = aiUsageState.model;
  }

  document.getElementById("ai-totals").textContent =
    `${tok(s.events)} call(s) · ${tok(s.total_tokens)} tokens total ` +
    `(${tok(s.prompt_tokens)} prompt + ${tok(s.completion_tokens)} completion)` +
    (Number(s.cached_events) > 0 ? ` · ${tok(s.cached_events)} cached` : "");
  document.getElementById("ai-byfeat").innerHTML = usageRows(s.by_feature);
  document.getElementById("ai-bymodel").innerHTML = usageRows(s.by_model);

  // Honesty: flag rows whose recorded total does not equal prompt + completion,
  // rather than printing arithmetic that does not add up.
  const notice = document.getElementById("ai-notice");
  const bad = Number(s.mismatched_events || 0);
  if (notice) {
    notice.innerHTML = bad > 0 ? `<div class="alert" role="alert">
      <strong>${tok(bad)} call(s) have a total that is not prompt + completion.</strong>
      The recorded figure is shown as-is and marked below; the previous system did not
      break out the difference.</div>` : "";
  }

  const evs = asArray(d.events);
  body.innerHTML = evs.length ? evs.map(e => `<tr>
      <td>${ts(e.created_at)}</td>
      <td>${esc(e.feature)}</td>
      <td>${esc(e.model)}</td>
      <td class="num">${tok(e.prompt_tokens)}</td>
      <td class="num">${tok(e.completion_tokens)}</td>
      <td class="num">${tok(e.total_tokens)}${e.token_mismatch
        ? ` <span class="status warn" title="Recorded total does not equal prompt + completion.">≠</span>` : ""}</td>
    </tr>`).join("") : `<tr><td colspan="6" class="muted small">No calls match.</td></tr>`;

  const from = evs.length ? aiUsageState.offset + 1 : 0;
  document.getElementById("ai-summary").textContent =
    `Showing ${from}–${aiUsageState.offset + evs.length} of ${tok(d.total)} call(s)` +
    (aiUsageState.feature || aiUsageState.model ? " (filtered)" : "");
  document.getElementById("ai-newer").disabled = aiUsageState.offset === 0;
  document.getElementById("ai-older").disabled = !d.has_more;
}

/* ---------- Fleet scans ---------- */
// Read-only history of automatic fleet scans. The ported payload is genuinely
// heterogeneous (some rows carry `insights`, others a node/connectivity event), so
// both shapes are rendered rather than assuming one.
//
// IMPORTANT: 1,102 of the 1,156 migrated scans contain a JavaScript error that the
// OLD app persisted ("Cannot read properties of undefined (reading 'rest')") under
// the title "Router unreachable". Those are labelled `scan error` here instead of
// being presented as live critical alerts. The data is untouched.
let scansState = { kind: "", severity: "", findings_only: false, limit: 50, offset: 0 };

function scanSevBadge(s) {
  const cls = s === "critical" ? "bad" : s === "warning" ? "warn" : s === "ok" ? "ok" : "";
  return `<span class="status ${cls}">${esc(s)}</span>`;
}

function findingLine(f) {
  const sev = f.severity || "info";
  const tag = f.runtime_error
    ? `<span class="status warn" title="This is a program error recorded by the previous system, not a network finding.">scan error</span>`
    : scanSevBadge(sev);
  const who = f.router ? `<span class="muted small">${esc(f.router)}</span>` : "";
  return `<div style="margin:2px 0">${tag} ${esc(f.title || "(untitled)")} ${who}
    <div class="muted small">${esc(f.subtitle || "")}</div>
    ${f.suggestion ? `<div class="muted small">→ ${esc(f.suggestion)}</div>` : ""}</div>`;
}

async function renderScans(main) {
  scansState = { kind: "", severity: "", findings_only: false, limit: 50, offset: 0 };
  const content = main.querySelector("#content");
  content.innerHTML = `
    <div class="panel"><div class="panel-head"><h2 class="panel-title">Filters</h2></div>
      <div class="panel-body">

          <option value="">all kinds</option></select></div>
        <div class="field"><label>Worst severity</label><select class="input" id="sc-sev">
          <option value="">all severities</option></select></div>

          <input type="checkbox" id="sc-fo"></div>
        <button class="btn btn-primary" id="sc-apply">Apply</button>
        <button class="btn" id="sc-reset">Reset</button>
        <span id="sc-msg" class="muted small"></span>

    scansState = { kind: "", severity: "", findings_only: false, limit: 50, offset: 0 };

async function loadScans() {
  const body = document.getElementById("sc-body");
  if (!body) return;
  const qs = new URLSearchParams();
  qs.set("limit", scansState.limit);
  qs.set("offset", scansState.offset);
  if (scansState.kind) qs.set("kind", scansState.kind);
  if (scansState.severity) qs.set("severity", scansState.severity);
  if (scansState.findings_only) qs.set("findings_only", "1");

  let d;
  try { d = await MM.get("/fleet-scan-runs?" + qs.toString()); }
  catch (e) {
    body.innerHTML = `<tr><td colspan="5" class="muted small">Could not load scans.</td></tr>`;
    return;
  }

  const ks = document.getElementById("sc-kind"), sv = document.getElementById("sc-sev");
  if (ks && ks.options.length <= 1) {
    asArray(d.kinds).forEach(k => ks.add(new Option(k, k)));
    asArray(d.severities).forEach(s => {
      const o = new Option(`${s}${d.severity_counts && d.severity_counts[s] ? ` (${d.severity_counts[s]})` : ""}`, s);
      sv.add(o);
    });
    ks.value = scansState.kind; sv.value = scansState.severity;
  }

  // Honesty notice: keep crash artefacts from reading as live outages.
  const notice = document.getElementById("sc-notice");
  const crashes = Number(d.crash_artifact_scans || 0);
  if (notice) {
    notice.innerHTML = crashes > 0 ? `<div class="alert" role="alert">
      <strong>${crashes} of these ${d.severity_counts ? Object.values(d.severity_counts).reduce((a,b)=>a+b,0) : crashes} scan(s) contain a recorded program error</strong>
      from the previous system, not a finding about your network. They are marked
      <span class="status warn">scan error</span> below and are kept exactly as recorded.</div>` : "";
  }

  const runs = asArray(d.scans);
  body.innerHTML = runs.length ? runs.map(r => {
    const fs = asArray(r.findings);
    const shown = fs.slice(0, 3).map(findingLine).join("");
    const more = fs.length > 3 ? `<div class="muted small">+${fs.length - 3} more</div>` : "";
    const node = r.node ? `<div class="muted small">node ${esc(r.node.node_id || "")} ${esc(r.node.node_status || "")} ${esc(r.node.source || "")}</div>` : "";
    // Some scans carry no `insights` at all — their finding IS the node event
    // (e.g. a critical "router down" from the topology source). Showing "none"
    // beside a critical would misrepresent it, so render the node event instead.
    const nodeFinding = (!fs.length && r.node && (r.node.node_status || r.node.node_id))
      ? `<div style="margin:2px 0">${scanSevBadge(r.max_severity)}
           ${esc(r.node.node_status || r.node.node_id)}
           <span class="muted small">${esc(r.node.source || "")}</span></div>`
      : "";
    return `<tr>
      <td>${ts(r.generated_at)}</td>
      <td>${esc(r.kind)}</td>
      <td>${scanSevBadge(r.max_severity)}</td>
      <td class="num">${esc(r.router_count)}</td>
      <td>${fs.length ? shown + more + node
                      : (nodeFinding || `<span class="muted small">none</span>`)}
        ${Number(r.error_findings) > 0 ? `<div class="muted small">${r.error_findings} of ${fs.length} are scan errors</div>` : ""}</td>
    </tr>`;
  }).join("") : `<tr><td colspan="5" class="muted small">No scans match.</td></tr>`;

  const from = runs.length ? scansState.offset + 1 : 0;
  document.getElementById("sc-summary").textContent =
    `Showing ${from}–${scansState.offset + runs.length} of ${d.total} scan(s)` +
    (scansState.kind || scansState.severity || scansState.findings_only ? " (filtered)" : "");
  document.getElementById("sc-newer").disabled = scansState.offset === 0;
  document.getElementById("sc-older").disabled = !d.has_more;
}

/* ---------- Voucher print sheet: geometry, live preview, printing ----------
   The tile maths is ported from the OLD app's voucher-print-layout.ts, because
   the console's preview and the sheet that actually reaches the printer must
   agree on tile size and type scale — otherwise the preview is decoration.
   Two page shapes share one model: an A4 cut sheet (packed by columns × rows per
   page) and a continuous thermal roll (columns × rows per strip of ~120 mm).
   As packing tightens the type shrinks, and below ~9–10 mm tiles the meta line is
   dropped entirely so the CODE — the only thing a voucher exists for — stays
   readable. */
const SHEET_MM = { a4: { w: 210, h: 297, pad: 8, usable: 275 }, thermal: { usable: 120 } };

/* Injected into the preview stage AND embedded in the print document, so there is
   exactly one definition of what a sheet looks like. */
const SHEET_CSS = `
  .sheet { background:#fff; color:#111; margin:0 auto; box-sizing:border-box; display:grid; gap:1mm; }
  .sheet-tile { display:flex; flex-direction:column; align-items:center; justify-content:center;
                text-align:center; border:0.3mm dashed #99a; overflow:hidden; }
  .sheet-code { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-weight:700; letter-spacing:.06em; }
  .sheet-qr { border:0.3mm solid #99a; display:flex; align-items:center; justify-content:center;
              color:#667; font-size:7px; }`;

function pvClamp(v, lo, hi) {
  const n = Number(v);
  if (!isFinite(n)) return lo;
  return Math.min(hi, Math.max(lo, n));
}

function sheetDensity(mode, rows) {
  const r = Math.max(1, Math.round(rows));
  const usable = mode === "a4" ? SHEET_MM.a4.usable : SHEET_MM.thermal.usable;
  const rowHeightMm = usable / r;
  const k = mode === "a4"
    ? { code: [7, 18, 1.55], meta: [5.5, 10, 0.85], brand: [5.5, 9, 0.75], pad: [0.6, 3.5, 0.12], m: 9 }
    : { code: [8, 20, 1.65], meta: [5.5, 11, 0.9], brand: [5.5, 10, 0.8], pad: [0.5, 3, 0.14], m: 10 };
  return {
    rowHeightMm,
    codeFontPx: pvClamp(rowHeightMm * k.code[2], k.code[0], k.code[1]),
    metaFontPx: pvClamp(rowHeightMm * k.meta[2], k.meta[0], k.meta[1]),
    brandFontPx: pvClamp(rowHeightMm * k.brand[2], k.brand[0], k.brand[1]),
    padMm: pvClamp(rowHeightMm * k.pad[2], k.pad[0], k.pad[1]),
    showMeta: rowHeightMm >= k.m,
  };
}

/** Reads the layout from the FORM, not from the saved row — that is what makes
 *  the preview live while the operator is still typing. */
function readPrintLayout() {
  const el = id => document.getElementById(id);
  const v = id => { const e = el(id); return e ? e.value.trim() : ""; };
  const n = id => { const e = el(id); return e ? parseInt(e.value, 10) : NaN; };
  const c = id => { const e = el(id); return e ? e.checked : false; };
  const width = n("pl-width") === 58 ? 58 : 80;
  return {
    business_name: v("pl-bname"), wifi_name: v("pl-wifi"), support_contact: v("pl-support"),
    terms: v("pl-terms"), paper_width_mm: width,
    a4_columns: pvClamp(n("pl-a4c") || 3, 2, 5),
    a4_rows_per_page: pvClamp(n("pl-a4r") || 12, 4, 50),
    // 58 mm is too narrow for two readable code tiles.
    thermal_columns: width === 58 ? 1 : pvClamp(n("pl-tc") || 2, 1, 2),
    thermal_rows_per_strip: pvClamp(n("pl-tr") || 8, 4, 40),
    show_qr: c("pl-qr"), show_price: c("pl-price"), show_expiry: c("pl-expiry"),
  };
}

function sheetTile(lay, dens, v) {
  const parts = [];
  if (lay.business_name) parts.push(`<div style="font-size:${dens.brandFontPx}px;font-weight:700">${esc(lay.business_name)}</div>`);
  if (lay.wifi_name) parts.push(`<div style="font-size:${dens.metaFontPx}px;color:#556">${esc(lay.wifi_name)}</div>`);
  if (lay.show_qr) {
    const qs = Math.max(8, Math.min(24, dens.rowHeightMm * 0.42));
    parts.push(`<div class="sheet-qr" style="width:${qs.toFixed(1)}mm;height:${qs.toFixed(1)}mm">QR</div>`);
  }
  parts.push(`<div class="sheet-code" style="font-size:${dens.codeFontPx.toFixed(1)}px">${esc(v.code)}</div>`);
  if (dens.showMeta) {
    if (lay.show_price && v.amount !== null && v.amount !== undefined && v.amount !== "") {
      parts.push(`<div style="font-size:${dens.metaFontPx.toFixed(1)}px;color:#556">${esc(String(v.amount))} MMK</div>`);
    }
    if (lay.show_expiry && v.expires_at) {
      parts.push(`<div style="font-size:${dens.metaFontPx.toFixed(1)}px;color:#556">${esc(String(v.expires_at).slice(0,10))}</div>`);
    }
  }
  return `<div class="sheet-tile" style="height:${dens.rowHeightMm.toFixed(2)}mm;padding:${dens.padMm.toFixed(2)}mm">${parts.join("")}</div>`;
}

function wirePrintPreview(main, vouchers, canEdit) {
  const stage = main.querySelector("#pl-stage");
  const hint = main.querySelector("#pl-hint");
  if (!stage) return;
  const real = (vouchers || []).filter(v => v && v.code);
  let mode = "a4";
  const styleEl = document.createElement("style");
  styleEl.textContent = SHEET_CSS;
  document.head.appendChild(styleEl);

  const draw = () => {
    const lay = readPrintLayout();
    const cols = mode === "a4" ? lay.a4_columns : lay.thermal_columns;
    const rows = mode === "a4" ? lay.a4_rows_per_page : lay.thermal_rows_per_strip;
    const dens = sheetDensity(mode, rows);
    const perPage = cols * rows;
    const tiles = real.slice(0, perPage).map(v => sheetTile(lay, dens, v));
    const realShown = tiles.length;
    // Samples keep the packing visible on an empty account. They are clearly
    // labelled and never appear on a printed sheet.
    while (tiles.length < perPage) tiles.push(sheetTile(lay, dens, { code: "SAMPLE-" + String(tiles.length + 1).padStart(2, "0"), amount: 500 }));
    const mmW = mode === "a4" ? SHEET_MM.a4.w : lay.paper_width_mm;
    const pageCss = mode === "a4"
      ? `width:${SHEET_MM.a4.w}mm;height:${SHEET_MM.a4.h}mm;padding:${SHEET_MM.a4.pad}mm`
      : `width:${mmW}mm;padding:2mm`;
    stage.innerHTML = `<div class="sheet" style="${pageCss};grid-template-columns:repeat(${cols},1fr);` +
                      `grid-template-rows:repeat(${rows},${dens.rowHeightMm.toFixed(2)}mm)">${tiles.join("")}</div>`;
    const pxW = mmW * 96 / 25.4;
    const avail = Math.max(200, (stage.parentNode.clientWidth || 400) - 24);
    try { stage.style.zoom = Math.min(1, avail / pxW).toFixed(3); } catch (e) { stage.style.transform = "scale(.5)"; }
    const per = `A4 ${lay.a4_columns}×${lay.a4_rows_per_page} = ${lay.a4_columns * lay.a4_rows_per_page}/page`;
    const th = `thermal ${lay.thermal_columns}×${lay.thermal_rows_per_strip} = ${lay.thermal_columns * lay.thermal_rows_per_strip}/strip (${lay.paper_width_mm} mm)`;
    hint.textContent = `${mode === "a4" ? per : th} · ${realShown} real code(s)` +
      (realShown < perPage ? ` + ${perPage - realShown} sample tile(s)` : "") +
      (dens.showMeta ? "" : " · tiles are short, so price/expiry are dropped to keep the code readable") +
      (canEdit ? "" : " · read-only");
  };

  const setMode = m => { mode = m; draw(); };
  const a4b = main.querySelector("#pl-mode-a4");
  const thb = main.querySelector("#pl-mode-thermal");
  if (a4b) a4b.addEventListener("click", () => setMode("a4"));
  if (thb) thb.addEventListener("click", () => setMode("thermal"));
  document.querySelectorAll("#pl-bname,#pl-wifi,#pl-support,#pl-terms,#pl-width,#pl-a4c,#pl-a4r,#pl-tc,#pl-tr,#pl-qr,#pl-price,#pl-expiry")
    .forEach(el => { el.addEventListener("input", draw); el.addEventListener("change", draw); });

  const pbtn = main.querySelector("#pl-print");
  if (pbtn) pbtn.addEventListener("click", () => {
    if (!real.length) { hint.textContent = "Nothing to print yet — create vouchers first."; return; }
    printSheet(readPrintLayout(), mode, real);
  });

  draw();
}

/** Prints real voucher codes only — never samples, never invented codes. More
 *  codes than one page paginates into as many sheets as it takes. */
function printSheet(lay, mode, vouchers) {
  const cols = mode === "a4" ? lay.a4_columns : lay.thermal_columns;
  const rows = mode === "a4" ? lay.a4_rows_per_page : lay.thermal_rows_per_strip;
  const dens = sheetDensity(mode, rows);
  const perPage = cols * rows;
  const chunks = [];
  for (let i = 0; i < vouchers.length; i += perPage) chunks.push(vouchers.slice(i, i + perPage));
  const pagesHtml = chunks.map(chunk => {
    const tiles = chunk.map(v => sheetTile(lay, dens, v));
    while (tiles.length < perPage) tiles.push(`<div class="sheet-tile" style="height:${dens.rowHeightMm.toFixed(2)}mm"></div>`);
    return `<div class="sheet">${tiles.join("")}</div>`;
  }).join("");
  const pageRule = mode === "a4"
    ? `@page { size: A4 portrait; margin: 0 } .sheet { width: ${SHEET_MM.a4.w}mm; height: ${SHEET_MM.a4.h}mm; padding: ${SHEET_MM.a4.pad}mm; }`
    : `@page { size: ${lay.paper_width_mm}mm auto; margin: 0 } .sheet { width: ${lay.paper_width_mm}mm; padding: 2mm; }`;
  const doc = `<!DOCTYPE html><html><head><meta charset="utf-8"><title>Vouchers</title><style>${SHEET_CSS}
    body { margin:0; background:#fff; }
    .sheet { grid-template-columns: repeat(${cols}, 1fr); grid-template-rows: repeat(${rows}, ${dens.rowHeightMm.toFixed(2)}mm); page-break-after: always; }
    .sheet:last-child { page-break-after: auto; }
    ${pageRule}</style></head><body>${pagesHtml}</body></html>`;
  const fr = document.createElement("iframe");
  fr.setAttribute("aria-hidden", "true");
  fr.style.cssText = "position:fixed;right:0;bottom:0;width:1px;height:1px;border:0;opacity:0";
  document.body.appendChild(fr);
  fr.srcdoc = doc;
  fr.addEventListener("load", () => {
    try { fr.contentWindow.focus(); fr.contentWindow.print(); } catch (e) {}
    setTimeout(() => fr.remove(), 60000);
  });
}

/* ---------- Vouchers: list + resellers + printed layout ---------- */
// Restructured so the reseller and print-layout panels ALWAYS render. The old
// version returned early whenever a tenant had no vouchers, which would have
// hidden both new panels from exactly the tenants most likely to need them.
async function renderVouchers(main) {
  const canEdit = SITE_EDITOR_ROLES.indexOf((ME && ME.user && ME.user.user_role) || "") >= 0;
  const content = main.querySelector("#content");

  const [vRes, rRes, lRes] = await Promise.all([
    MM.get("/vouchers").catch(() => null),
    MM.get("/voucher-resellers").catch(() => null),
    MM.get("/voucher-print-layout").catch(() => null),
  ]);

  const list = vRes ? asArray(vRes.vouchers) : [];
  const vRows = list.slice(0, 50).map(v => `
    <tr>
      <td class="mono">${esc(v.code)}</td>
      <td>${v.plan_key ? esc(v.plan_key) : "—"}</td>
      <td class="num">${esc(v.amount)}</td>
      <td>${badge((v.status||"unknown").toLowerCase())}</td>
      <td>${ts(v.created_at)}</td>
    </tr>`).join("");

  const resellers = rRes ? asArray(rRes.resellers) : [];
  const rRows = resellers.map(r => `
    <tr>

      <td>${esc(r.contact_name)}</td>
      <td>${r.location ? esc(r.location) : "—"}</td>
      <td>${r.phone ? esc(r.phone) : "—"}</td>
      <td><span class="mono">${esc(r.code_prefix)}</span></td>
      <td>${r.active ? `<span class="status ok">active</span>` : `<span class="status">inactive</span>`}</td>
      <td>${canEdit ? `<button class="btn btn-sm" data-vredit="${esc(r.id)}">Edit</button>

    </tr>`).join("");

          <div class="field"><label>Phone</label><input class="input" id="nr-phone"></div>

// The ledger is append-only in the database, so this view is a read-only audit

  service_payment: "Service payment",
  service_refund: "Service refund",
  feature_key_purchase: "Feature key purchase",
  purchase_credit: "Purchase credit",

async function renderMagicCoins(main) {

  const rows = txs.length ? txs.map(t => {

      <td class="num">${coinAmt(t.balance_after)}</td>
      <td>${esc(t.note)}</td>

  }).join("") : `<tr><td colspan="5" class="muted small">No coin activity yet.</td></tr>`;

  content.innerHTML = `
