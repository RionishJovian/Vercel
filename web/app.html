async function loadScans() {
  const body = document.getElementById("sc-body");
  if (!body) return;
  const qs = new URLSearchParams();
  qs.set("limit", scansState.limit);
  qs.set("offset", scansState.offset);
  if (scansState.kind) qs.set("kind", scansState.kind);
  if (scansState.severity) qs.set("severity", scansState.severity);
  if (scansState.findings_only) qs.set("findings_only", "1");

  let d;
  try { d = await MM.get("/fleet-scan-runs?" + qs.toString()); }
  catch (e) {
    body.innerHTML = `<tr><td colspan="5" class="muted small">Could not load scans.</td></tr>`;
    return;
  }

  const ks = document.getElementById("sc-kind"), sv = document.getElementById("sc-sev");
  if (ks && ks.options.length <= 1) {
    asArray(d.kinds).forEach(k => ks.add(new Option(k, k)));
    asArray(d.severities).forEach(s => {
      const o = new Option(`${s}${d.severity_counts && d.severity_counts[s] ? ` (${d.severity_counts[s]})` : ""}`, s);
      sv.add(o);
    });
    ks.value = scansState.kind; sv.value = scansState.severity;
  }

  // Honesty notice: keep crash artefacts from reading as live outages.
  const notice = document.getElementById("sc-notice");
  const crashes = Number(d.crash_artifact_scans || 0);
  if (notice) {
    notice.innerHTML = crashes > 0 ? `<div class="alert" role="alert">
      <strong>${crashes} of these ${d.severity_counts ? Object.values(d.severity_counts).reduce((a,b)=>a+b,0) : crashes} scan(s) contain a recorded program error</strong>
      from the previous system, not a finding about your network. They are marked
      <span class="status warn">scan error</span> below and are kept exactly as recorded.</div>` : "";
  }

  const runs = asArray(d.scans);
  body.innerHTML = runs.length ? runs.map(r => {
    const fs = asArray(r.findings);
    const shown = fs.slice(0, 3).map(findingLine).join("");
    const more = fs.length > 3 ? `<div class="muted small">+${fs.length - 3} more</div>` : "";
    const node = r.node ? `<div class="muted small">node ${esc(r.node.node_id || "")} ${esc(r.node.node_status || "")} ${esc(r.node.source || "")}</div>` : "";
    // Some scans carry no `insights` at all — their finding IS the node event
    // (e.g. a critical "router down" from the topology source). Showing "none"
    // beside a critical would misrepresent it, so render the node event instead.
    const nodeFinding = (!fs.length && r.node && (r.node.node_status || r.node.node_id))
      ? `<div style="margin:2px 0">${scanSevBadge(r.max_severity)}
           ${esc(r.node.node_status || r.node.node_id)}
           <span class="muted small">${esc(r.node.source || "")}</span></div>`
      : "";
    return `<tr>
      <td>${ts(r.generated_at)}</td>
      <td>${esc(r.kind)}</td>
      <td>${scanSevBadge(r.max_severity)}</td>
      <td class="num">${esc(r.router_count)}</td>
      <td>${fs.length ? shown + more + node
                      : (nodeFinding || `<span class="muted small">none</span>`)}
        ${Number(r.error_findings) > 0 ? `<div class="muted small">${r.error_findings} of ${fs.length} are scan errors</div>` : ""}</td>
    </tr>`;
  }).join("") : `<tr><td colspan="5" class="muted small">No scans match.</td></tr>`;

  const from = runs.length ? scansState.offset + 1 : 0;
  document.getElementById("sc-summary").textContent =
    `Showing ${from}–${scansState.offset + runs.length} of ${d.total} scan(s)` +
    (scansState.kind || scansState.severity || scansState.findings_only ? " (filtered)" : "");
  document.getElementById("sc-newer").disabled = scansState.offset === 0;
  document.getElementById("sc-older").disabled = !d.has_more;
}

/* ---------- Voucher print sheet: geometry, live preview, printing ----------
   The tile maths is ported from the OLD app's voucher-print-layout.ts, because
   the console's preview and the sheet that actually reaches the printer must
   agree on tile size and type scale — otherwise the preview is decoration.
   Two page shapes share one model: an A4 cut sheet (packed by columns × rows per
   page) and a continuous thermal roll (columns × rows per strip of ~120 mm).
   As packing tightens the type shrinks, and below ~9–10 mm tiles the meta line is
   dropped entirely so the CODE — the only thing a voucher exists for — stays
   readable. */
const SHEET_MM = { a4: { w: 210, h: 297, pad: 8, usable: 281 }, thermal: { usable: 120 } };

/* Injected into the preview stage AND embedded in the print document, so there is
   exactly one definition of what a sheet looks like. */
const SHEET_CSS = `
  .sheet { background:#fff; color:#111; margin:0 auto; box-sizing:border-box; display:grid; gap:1mm; }
  .sheet-tile { display:flex; flex-direction:column; align-items:center; justify-content:center;
                text-align:center; box-sizing:border-box; line-height:1.1; border:0.3mm dashed #99a; overflow:hidden; }
  .sheet-tile > div { flex-shrink:0; max-width:100%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .sheet-code { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-weight:700; letter-spacing:.06em; }
  .sheet-qr { border:0.3mm solid #99a; display:flex; align-items:center; justify-content:center;
              color:#667; font-size:7px; }`;

function pvClamp(v, lo, hi) {
  const n = Number(v);
  if (!isFinite(n)) return lo;
  return Math.min(hi, Math.max(lo, n));
}

function sheetDensity(mode, rows) {
  const r = Math.max(1, Math.round(rows));
  const usable = mode === "a4" ? SHEET_MM.a4.usable : SHEET_MM.thermal.usable;
  // Reserve the 1 mm grid gaps as well as the page padding. Round down so
  // fractional millimetres cannot overflow the last row onto another page.
  const packedHeightMm = Math.floor((usable - (r - 1)) / r * 100) / 100;
  // Thermal paper is continuous: grow the strip rather than cutting off codes
  // when a saved layout requests many rows.
  const rowHeightMm = mode === "thermal" ? Math.max(4, packedHeightMm) : packedHeightMm;
  const k = mode === "a4"
    ? { code: [7, 18, 1.55], meta: [5.5, 10, 0.85], brand: [5.5, 9, 0.75], pad: [0.6, 3.5, 0.12], m: 9 }
    : { code: [8, 20, 1.65], meta: [5.5, 11, 0.9], brand: [5.5, 10, 0.8], pad: [0.5, 3, 0.14], m: 10 };
  return {
    rowHeightMm,
    codeFontPx: pvClamp(rowHeightMm * k.code[2], k.code[0], k.code[1]),
    metaFontPx: pvClamp(rowHeightMm * k.meta[2], k.meta[0], k.meta[1]),
    brandFontPx: pvClamp(rowHeightMm * k.brand[2], k.brand[0], k.brand[1]),
    padMm: pvClamp(rowHeightMm * k.pad[2], k.pad[0], k.pad[1]),
    showMeta: rowHeightMm >= k.m,
  };
}

/** Reads the layout from the FORM, not from the saved row — that is what makes
 *  the preview live while the operator is still typing. */
function readPrintLayout() {
  const el = id => document.getElementById(id);
  const v = id => { const e = el(id); return e ? e.value.trim() : ""; };
  const n = id => { const e = el(id); return e ? parseInt(e.value, 10) : NaN; };
  const c = id => { const e = el(id); return e ? e.checked : false; };
  const width = n("pl-width") === 58 ? 58 : 80;
  return {
    business_name: v("pl-bname"), wifi_name: v("pl-wifi"), support_contact: v("pl-support"),
    terms: v("pl-terms"), paper_width_mm: width,
    a4_columns: pvClamp(n("pl-a4c") || 3, 2, 5),
    a4_rows_per_page: pvClamp(n("pl-a4r") || 12, 4, 50),
    // 58 mm is too narrow for two readable code tiles.
    thermal_columns: width === 58 ? 1 : pvClamp(n("pl-tc") || 2, 1, 2),
    thermal_rows_per_strip: pvClamp(n("pl-tr") || 8, 4, 40),
    show_qr: c("pl-qr"), show_price: c("pl-price"), show_expiry: c("pl-expiry"),
  };
}

function sheetTile(lay, dens, v) {
  const top = [], bottom = [];
  if (lay.business_name) top.push([lay.business_name, dens.brandFontPx, "font-weight:700"]);
  if (lay.wifi_name) top.push([lay.wifi_name, dens.metaFontPx, "color:#556"]);
  if (v.plan_label) bottom.push([v.plan_label, dens.metaFontPx, ""]);
  if (v.plan_key === "guest-internet") {
    const allowance = [];
    if (v.duration_minutes > 0) allowance.push(`${v.duration_minutes} min${v.first_seen_at ? " total" : " from first use"}`);
    if (v.data_mb > 0) allowance.push(`${v.data_mb} MB`);
    if (allowance.length) bottom.push([allowance.join(" · "), dens.metaFontPx, "color:#556"]);
  }
  if(v.reseller_shop)bottom.push([`Shop: ${v.reseller_shop}${v.reseller_prefix?" · "+v.reseller_prefix:""}`,dens.metaFontPx,"color:#556"]);
  const price = v.price_mmk ?? v.amount;
  if (lay.show_price && price !== null && price !== undefined && price !== "") bottom.push([`${price} MMK`, dens.metaFontPx, "color:#556"]);
  if (lay.show_expiry && v.expires_at) bottom.push([String(v.expires_at).slice(0,10), dens.metaFontPx, "color:#556"]);

  // Both preview and print use the same border box. Fit whole lines rather than
  // clipping the code or allowances against the next tile's cut line.
  const pxPerMm = 96 / 25.4, padMm = Math.min(dens.padMm, 1);
  let qrMm = lay.show_qr ? Math.min(24, dens.rowHeightMm * 0.42, Math.max(0, dens.rowHeightMm - 2*padMm - 0.6 - dens.codeFontPx*1.1/pxPerMm)) : 0;
  if (qrMm < 4) qrMm = 0;
  const metadata = [...top, ...bottom];
  const linePixels = (dens.codeFontPx + metadata.reduce((sum, line)=>sum+line[1], 0)) * 1.1;
  const available = (dens.rowHeightMm - 2*padMm - 0.6 - qrMm) * pxPerMm - 1;
  const scale = Math.max(0, Math.min(1, available / linePixels));
  const showMeta = dens.showMeta && metadata.every(line=>line[1]*scale >= 5.5) && dens.codeFontPx*scale >= 7;
  const line = ([text, font, style]) => `<div style="font-size:${(font*scale).toFixed(1)}px;${style}">${esc(text)}</div>`;
  const parts = showMeta ? top.map(line) : [];
  if (qrMm) parts.push(`<div class="sheet-qr" style="width:${qrMm.toFixed(1)}mm;height:${qrMm.toFixed(1)}mm">QR</div>`);
  parts.push(`<div class="sheet-code" style="font-size:${(dens.codeFontPx*(showMeta ? scale : 1)).toFixed(1)}px">${esc(v.code)}</div>`);
  if (showMeta) parts.push(...bottom.map(line));
  return `<div class="sheet-tile" data-details-omitted="${!showMeta && metadata.length > 0}" style="height:${dens.rowHeightMm.toFixed(2)}mm;padding:${padMm.toFixed(2)}mm">${parts.join("")}</div>`;
}

function voucherPrintSelection(vouchers, size, page, status) {
  const count = Math.max(1, Math.min(100, Math.trunc(Number(size)) || 100));
  const eligible = (vouchers || []).filter(v => v && v.code && guestVoucherPrintable(v) &&
    (status === "all" || (status === "available" ? ["active", "unused"].includes(v.status) : v.status === status)));
  const pages = Math.max(1, Math.ceil(eligible.length / count));
  const current = Math.max(1, Math.min(pages, Math.trunc(Number(page)) || 1));
  const start = (current - 1) * count;
  return { vouchers: eligible.slice(start, start + count), page: current, pages, total: eligible.length, start, size: count };
}

function wirePrintPreview(main, vouchers, canEdit, issuedVouchers = []) {
  const stage = main.querySelector("#pl-stage");
  const hint = main.querySelector("#pl-hint");
  if (!stage) return;
  const sizeInput = main.querySelector("#pl-batch-size");
  const statusInput = main.querySelector("#pl-batch-status");
  const pageInput = main.querySelector("#pl-batch-page");
  const sourceInput = main.querySelector("#pl-batch-source");
 const issueBatchInput=main.querySelector("#pl-issue-batch");
  let selectedPage = 1;
  const selection = () => voucherPrintSelection((sourceInput && sourceInput.value === "issued" ? issuedVouchers : vouchers).filter(v=>!issueBatchInput?.value||v.issue_batch_id===issueBatchInput.value), sizeInput ? sizeInput.value : 100, selectedPage, statusInput ? statusInput.value : "available");
  let mode = "a4";
  const styleEl = document.createElement("style");
  styleEl.textContent = SHEET_CSS;
  document.head.appendChild(styleEl);

  const draw = () => {
    const batch = selection();
    selectedPage = batch.page;
    const real = batch.vouchers;
    if (pageInput) {
      pageInput.innerHTML = Array.from({ length: batch.pages }, (_, i) => `<option value="${i + 1}" ${i + 1 === batch.page ? "selected" : ""}>Page ${i + 1}</option>`).join("");
    }
    const range = main.querySelector("#pl-batch-range");
    if (range) range.textContent = batch.total ? `${batch.start + 1}–${batch.start + real.length} of ${batch.total} vouchers · page ${batch.page}/${batch.pages}` : "No vouchers match this filter.";
    const previous = main.querySelector("#pl-batch-prev"), next = main.querySelector("#pl-batch-next");
    if (previous) previous.disabled = batch.page <= 1;
    if (next) next.disabled = batch.page >= batch.pages;
    const lay = readPrintLayout();
    const cols = mode === "a4" ? lay.a4_columns : lay.thermal_columns;
    const rows = mode === "a4" ? lay.a4_rows_per_page : lay.thermal_rows_per_strip;
    const dens = sheetDensity(mode, rows);
    const perPage = cols * rows;
    const tiles = real.slice(0, perPage).map(v => sheetTile(lay, dens, v));
    const realShown = tiles.length;
    // Samples keep the packing visible on an empty account. They are clearly
    // labelled and never appear on a printed sheet.
    while (tiles.length < perPage) tiles.push(sheetTile(lay, dens, { code: "SAMPLE-" + String(tiles.length + 1).padStart(2, "0"), amount: 500 }));
    const mmW = mode === "a4" ? SHEET_MM.a4.w : lay.paper_width_mm;
    const pageCss = mode === "a4"
      ? `width:${SHEET_MM.a4.w}mm;height:${SHEET_MM.a4.h}mm;padding:${SHEET_MM.a4.pad}mm`
      : `width:${mmW}mm;padding:2mm`;
    stage.innerHTML = `<div class="sheet" style="${pageCss};grid-template-columns:repeat(${cols},1fr);` +
                      `grid-template-rows:repeat(${rows},${dens.rowHeightMm.toFixed(2)}mm)">${tiles.join("")}</div>`;
    const pxW = mmW * 96 / 25.4;
    const avail = Math.max(200, (stage.parentNode.clientWidth || 400) - 24);
    try { stage.style.zoom = Math.min(1, avail / pxW).toFixed(3); } catch (e) { stage.style.transform = "scale(.5)"; }
    const per = `A4 ${lay.a4_columns}×${lay.a4_rows_per_page} = ${lay.a4_columns * lay.a4_rows_per_page}/page`;
    const th = `thermal ${lay.thermal_columns}×${lay.thermal_rows_per_strip} = ${lay.thermal_columns * lay.thermal_rows_per_strip}/strip (${lay.paper_width_mm} mm)`;
    hint.textContent = `${mode === "a4" ? per : th} · ${realShown} real code(s)` +
      (realShown < perPage ? ` + ${perPage - realShown} sample tile(s)` : "") +
      (stage.querySelector('[data-details-omitted="true"]') ? " · some tiles omit details; reduce rows per sheet/strip to show them" : "") +
      (canEdit ? "" : " · read-only");
  };

  const setMode = m => { mode = m; draw(); };
  const a4b = main.querySelector("#pl-mode-a4");
  const thb = main.querySelector("#pl-mode-thermal");
  if (a4b) a4b.addEventListener("click", () => setMode("a4"));
  if (thb) thb.addEventListener("click", () => setMode("thermal"));
  document.querySelectorAll("#pl-bname,#pl-wifi,#pl-support,#pl-terms,#pl-width,#pl-a4c,#pl-a4r,#pl-tc,#pl-tr,#pl-qr,#pl-price,#pl-expiry")
    .forEach(el => { el.addEventListener("input", draw); el.addEventListener("change", draw); });

  const pbtn = main.querySelector("#pl-print");
  if (pbtn) pbtn.addEventListener("click", () => {
    const real = selection().vouchers;
    if (!real.length) { hint.textContent = "No verified codes in this selection. Connect the gateway and verify installation, or select another batch."; return; }
    printSheet(readPrintLayout(), mode, real);
  });

  [sizeInput, statusInput, sourceInput,issueBatchInput].filter(Boolean).forEach(el => el.addEventListener("change", () => { selectedPage = 1; draw(); }));
  if (pageInput) pageInput.addEventListener("change", () => { selectedPage = Number(pageInput.value); draw(); });
  const previous = main.querySelector("#pl-batch-prev"), next = main.querySelector("#pl-batch-next");
  if (previous) previous.addEventListener("click", () => { selectedPage--; draw(); });
  if (next) next.addEventListener("click", () => { selectedPage++; draw(); });

  draw();
}

/** Prints real voucher codes only — never samples, never invented codes. More
 *  codes than one page paginates into as many sheets as it takes. */
function printSheet(lay, mode, vouchers) {
  vouchers = (vouchers || []).filter(guestVoucherPrintable);
  if (!vouchers.length) return;
  const cols = mode === "a4" ? lay.a4_columns : lay.thermal_columns;
  const rows = mode === "a4" ? lay.a4_rows_per_page : lay.thermal_rows_per_strip;
  const dens = sheetDensity(mode, rows);
  const perPage = cols * rows;
  const chunks = [];
  for (let i = 0; i < vouchers.length; i += perPage) chunks.push(vouchers.slice(i, i + perPage));
  const pagesHtml = chunks.map(chunk => {
    const tiles = chunk.map(v => sheetTile(lay, dens, v));
    while (tiles.length < perPage) tiles.push(`<div class="sheet-tile" style="height:${dens.rowHeightMm.toFixed(2)}mm"></div>`);
    return `<div class="sheet">${tiles.join("")}</div>`;
  }).join("");
  const pageRule = mode === "a4"
    ? `@page { size: A4 portrait; margin: 0 } .sheet { width: ${SHEET_MM.a4.w}mm; height: ${SHEET_MM.a4.h}mm; padding: ${SHEET_MM.a4.pad}mm; }`
    : `@page { size: ${lay.paper_width_mm}mm auto; margin: 0 } .sheet { width: ${lay.paper_width_mm}mm; padding: 2mm; }`;
  const doc = `<!DOCTYPE html><html><head><meta charset="utf-8"><title>Vouchers</title><style>${SHEET_CSS}
    body { margin:0; background:#fff; }
    .sheet { grid-template-columns: repeat(${cols}, 1fr); grid-template-rows: repeat(${rows}, ${dens.rowHeightMm.toFixed(2)}mm); page-break-after: always; }
    .sheet:last-child { page-break-after: auto; }
    ${pageRule}</style></head><body>${pagesHtml}</body></html>`;
  const fr = document.createElement("iframe");
  fr.setAttribute("aria-hidden", "true");
  fr.style.cssText = "position:fixed;right:0;bottom:0;width:1px;height:1px;border:0;opacity:0";
  document.body.appendChild(fr);
  fr.srcdoc = doc;
  fr.addEventListener("load", () => {
    try { fr.contentWindow.focus(); fr.contentWindow.print(); } catch (e) {}
    setTimeout(() => fr.remove(), 60000);
  });
}

/* ---------- Vouchers: list + resellers + printed layout ---------- */
// Restructured so the reseller and print-layout panels ALWAYS render. The old
// version returned early whenever a tenant had no vouchers, which would have
// hidden both new panels from exactly the tenants most likely to need them.
function guestVoucherPrintable(voucher) {
  return voucher && ((!voucher.issue_batch_id && !voucher.install_state) || voucher.install_state === "verified");
}

function guestVoucherRequestStorageKey() {
  const business = ME?.business?.business_id || ME?.user?.business_id || ME?.user?.user_id || ME?.user?.email || "session";
  return "mm_guest_voucher_pending:" + business;
}

function pendingGuestVoucherRequest() {
  try {
    const value = JSON.parse(sessionStorage.getItem(guestVoucherRequestStorageKey()) || "null");
    return value && /^[a-f0-9-]{36}$/i.test(value.batch_id || "") ? value : null;
  } catch (_) { return null; }
}

function retainGuestVoucherRequest(body) {
  sessionStorage.setItem(guestVoucherRequestStorageKey(), JSON.stringify(body));
}

function clearGuestVoucherRequest(batchID) {
  if (pendingGuestVoucherRequest()?.batch_id === batchID) sessionStorage.removeItem(guestVoucherRequestStorageKey());
}

async function renderVouchers(main, issuedBatch = null) {

  const content = main.querySelector("#content");

  const [vRes, rRes, lRes, guestVoucherConfig, gatewayRes, batchRes] = await Promise.all([
    MM.get("/vouchers").catch(() => null),
    MM.get("/voucher-resellers").catch(() => null),
    MM.get("/voucher-print-layout").catch(() => null),
    canEdit ? MM.get("/guest-vouchers/config").catch(e => ({failed:true, status:e.status})) : null,
    canEdit ? MM.get("/routers").catch(() => null) : null,
    canEdit ? MM.get("/guest-vouchers/batches").catch(() => null) : null,
  ]);

  const guestGateways = asArray(gatewayRes && gatewayRes.routers).filter(d => d.deployment_layer === "MAIN_GATEWAY");
  if (!content?.isConnected) return;
  const guestIssuanceEnabled = canEdit && guestVoucherConfig && guestVoucherConfig.enabled === true && guestVoucherConfig.batch_recovery_enabled === true;
  const pendingRequest = canEdit ? pendingGuestVoucherRequest() : null;
  const batches = asArray(batchRes && batchRes.batches);
 const stockBatches=asArray(batchRes&&batchRes.stock_batches);
 const assignmentEnabled=canEdit&&batchRes?.reseller_assignment_enabled===true;

  const list = vRes ? asArray(vRes.vouchers) : [];
  const refreshed = new Map(list.map(v=>[v.id || v.code,v]));
  const issuedVouchers = asArray(issuedBatch && issuedBatch.vouchers).filter(guestVoucherPrintable).map(v=>{
    const current = refreshed.get(v.id || v.code);
    return {...v, ...(current ? {status:current.status, first_seen_at:current.first_seen_at, expires_at:current.expires_at,reseller_id:current.reseller_id,reseller_shop:current.reseller_shop,reseller_prefix:current.reseller_prefix} : {}), data_mb:issuedBatch.data_mb};
  });
  const vRows = list.slice(0, 50).map(v => `
    <tr>
      <td class="mono">${esc(v.code)}</td>
      <td>${esc(v.plan_label||v.plan_key||"—")}${v.reseller_shop?`<small class="muted"> · ${esc(v.reseller_shop)} (${esc(v.reseller_prefix||"")})</small>`:""}</td>
      <td class="num">${esc(v.price_mmk ?? v.amount ?? 0)}</td>
      <td>${guestVoucherPrintable(v) ? businessStatusBadge(v.status, "voucher") : `<span class="status warn">Router installation unconfirmed</span>`}</td>

  const resellers = rRes ? asArray(rRes.resellers) : [];
  const rRows = resellers.map(r => `
    <tr>
      <td>${esc(r.shop_name)}</td>
      <td>${esc(r.contact_name)}</td>
      <td>${r.location ? esc(r.location) : "—"}</td>
      <td>${r.phone ? esc(r.phone) : "—"}</td>

      <td>${r.active ? `<span class="status ok">active</span>` : `<span class="status">inactive</span>`}</td>
      <td>${canEdit ? `<button class="btn btn-sm" data-vredit="${esc(r.id)}">Edit</button>
        <button class="btn btn-sm" data-vrdel="${esc(r.id)}">Delete</button>` : ""}</td>
    </tr>`).join("");

  const shopOptions = selected => `<option value="">Direct sales / unassigned</option>${resellers.filter(shop=>shop.active||shop.id===selected).map(shop=>`<option value="${esc(shop.id)}"${shop.id===selected?" selected":""}>${esc(shop.shop_name)} · ${esc(shop.code_prefix)}${shop.active?"":" (inactive)"}</option>`).join("")}`;
  const stockRows=stockBatches.map(batch=>`<form class="panel-body record-form-grid" data-batch-shop="${esc(batch.batch_id)}" data-expected-shop="${esc(batch.reseller_id||"")}"><div><strong>${esc(batch.plan_label||"Voucher batch")}</strong><p>${esc(batch.total_count)} codes · ${esc(batch.installed_count)} installed · ${esc(batch.activated_count)} activated · ${esc(ts(batch.created_at))}</p><small class="mono">${esc(batch.batch_id)}</small></div><div class="field"><label>Assigned reseller shop<select class="input" name="reseller_id" aria-label="Shop for batch ${esc(batch.batch_id)}">${shopOptions(batch.reseller_id||"")}</select></label></div><div class="workspace-actions"><button class="btn" type="submit">Save shop assignment</button><button class="btn" type="button" data-shop-print="${esc(batch.batch_id)}">Select batch for printing</button></div><p role="status"></p></form>`).join("");
  const lay = (lRes && lRes.layout) || {};
  const laySaved = !!(lRes && lRes.saved);

  content.innerHTML = `
    ${issuedVouchers.length ? `<div class="panel"><div class="panel-body" id="gv-batch-result" role="status"><strong>Created ${issuedVouchers.length} guest internet codes.</strong><p>This batch is selected in the print preview below. Use Next for further selections of up to 100 codes. Reloading or leaving this page returns to the full inventory.</p></div></div>` : ""}
    ${guestIssuanceEnabled && (pendingRequest || batches.length || issuedBatch?.state && issuedBatch.state !== "ready") ? `<details class="panel voucher-attention"${pendingRequest || issuedBatch?.state && issuedBatch.state !== "ready" ? " open" : ""}><summary>Installation not verified — review batches</summary><div class="panel-body">

      ${batches.map(batch => `<p><strong>Batch of ${esc(batch.total_count)} codes</strong> · ${esc(guestGateways.find(gateway => gateway.device_id === batch.device_id)?.hardware_name || "Saved gateway")} · ${esc(({pending:"Waiting for installation",unknown:"Installation unconfirmed",installing:"Verification in progress"})[batch.state] || "Needs verification")} · ${esc(batch.verified_count)} / ${esc(batch.total_count)} verified <button class="btn btn-sm" type="button" data-gv-batch-retry="${esc(batch.batch_id)}">Install on router</button></p>`).join("")}
      <p id="gv-recovery-message" role="status">${issuedBatch?.state && issuedBatch.state !== "ready" ? "Installation is not yet verified. This batch is not ready to print." : ""}</p>
    </div></details>` : ""}
    ${guestIssuanceEnabled ? `<div class="panel" data-voucher-panel="create"><div class="panel-head"><h2 class="panel-title">Create a batch</h2></div><div class="panel-body">
      <p class="muted small">New codes use 8 uppercase letters. Validity starts on first use. Reconnecting keeps the original time and data limits.</p>

        <div class="field"><label for="gv-gateway">Gateway</label><select class="input" id="gv-gateway" required><option value="">Choose a gateway</option>${guestGateways.map(d => `<option value="${esc(d.device_id)}">${esc(d.hardware_name)}</option>`).join("")}</select></div>
        ${assignmentEnabled?`<div class="field"><label for="gv-reseller">Reseller shop</label><select class="input" id="gv-reseller">${shopOptions("")}</select><small>Optional. Stock assignment does not count as a sale.</small></div>`:""}

      </form></div></div>` : `<div class="panel" data-voucher-panel="create"><div class="panel-head"><h2 class="panel-title">Voucher creation unavailable</h2></div><div class="panel-body"><p class="muted small" role="status">${esc(canEdit && guestVoucherConfig?.enabled === true && guestVoucherConfig.batch_recovery_enabled !== true ? "Voucher creation is temporarily unavailable. Your administrator needs to complete the service update before creating new batches." : guestVoucherCapabilityMessage(guestVoucherConfig, canEdit))}</p></div></div>`}
    <div class="panel" data-voucher-panel="stock"><div class="panel-head"><h2 class="panel-title">Codes</h2>${guestIssuanceEnabled && guestGateways.length ? `<button class="btn btn-sm" id="gv-sync" type="button">Refresh usage</button><span class="muted small" id="gv-sync-message" role="status"></span>` : ""}</div>
      <div class="panel-body">
        ${!vRes ? `<p class="muted small" role="alert">Could not load vouchers. Reload this page to retry; this is not an empty voucher list.</p>` : list.length ? `<table>
          <thead><tr><th>Code</th><th>Plan</th><th>Amount</th><th>Status</th><th>Created</th></tr></thead>

          </div>
          <div>
            <div class="field"><label>Live preview</label>
              <div style="display:flex;gap:6px;flex-wrap:wrap">
                <button class="btn btn-sm" id="pl-mode-a4">A4 sheet</button>
                <button class="btn btn-sm" id="pl-mode-thermal">Thermal strip</button>
                <button class="btn btn-sm" id="pl-print">Print…</button>
              </div></div>
            ${issuedVouchers.length ? `<div class="field"><label for="pl-batch-source">Codes to print</label><select class="input" id="pl-batch-source"><option value="issued">Newly created batch · ${issuedVouchers.length} codes</option><option value="inventory">Loaded voucher inventory</option></select></div>` : ""}
            ${assignmentEnabled?`<div class="field"><label for="pl-issue-batch">Voucher batch</label><select class="input" id="pl-issue-batch"><option value="">All loaded batches</option>${stockBatches.map(b=>`<option value="${esc(b.batch_id)}">${esc(b.plan_label)} · ${esc(b.shop_name||"Unassigned")} · ${esc(b.total_count)} codes · ${esc(b.batch_id.slice(0,8))}</option>`).join("")}</select></div>`:""}
            <div class="pl-grid">
              <div class="field"><label for="pl-batch-size">Vouchers per selection (1–100)</label><input class="input" id="pl-batch-size" type="number" min="1" max="100" value="100"></div>
              <div class="field"><label for="pl-batch-status">Print filter</label><select class="input" id="pl-batch-status"><option value="available">Available codes</option><option value="all">All codes</option><option value="used">Used codes</option><option value="expired">Expired codes</option></select></div>
            </div>
            <div class="workspace-actions"><button class="btn btn-sm" id="pl-batch-prev" type="button">Previous</button><select class="input" id="pl-batch-page" aria-label="Voucher selection page"></select><button class="btn btn-sm" id="pl-batch-next" type="button">Next</button></div>
            <p class="muted small" id="pl-batch-range"></p>
            <p class="muted small">Print uses only the selected batch. Paper sheets follow the layout dimensions; the preview shows its first sheet.</p>
            <div class="sheet-stage"><div id="pl-stage"></div></div>
            <p class="muted small pv-hint" id="pl-hint"></p>
          </div>
        </div>
      </div></div>
    <div id="vr-alert"></div>`;

  const guestVoucherForm = document.getElementById("guest-voucher-form");
  if (guestVoucherForm && pendingRequest) {
    for (const [id,key] of [["gv-gateway","device_id"],["gv-label","plan_label"],["gv-minutes","duration_minutes"],["gv-data","data_mb"],["gv-price","price_mmk"],["gv-count","count"],["gv-reseller","reseller_id"]]) {
      const field = guestVoucherForm.querySelector("#"+id);
      if (field) field.value = pendingRequest[key] == null ? "" : String(pendingRequest[key]);
    }
  }
  if (guestVoucherForm) {
    const gatewaySelect = guestVoucherForm.querySelector("#gv-gateway");
    if (!pendingRequest) MMRevamp.routerContext(gatewaySelect, guestGateways, () => {});
    gatewaySelect.addEventListener("change", () => {
      const chosen = guestGateways.find(item => item.device_id === gatewaySelect.value);
      if (chosen?.site_id) sessionStorage.setItem("mm_selected_site", chosen.site_id);
    });
    const back = document.createElement("a"); back.href = "#internet"; back.className = "btn"; back.textContent = "Back to device workspace";
    guestVoucherForm.querySelector(".workspace-actions").append(back);
  }
  if (guestVoucherForm) guestVoucherForm.addEventListener("submit", async event => {
    event.preventDefault();
    if (!guestVoucherForm.reportValidity()) return;
    const button = document.getElementById("gv-create"), message = document.getElementById("gv-message");
    if (button.disabled) return;
    const value = id => document.getElementById(id).value;
    const body = { device_id: value("gv-gateway"), plan_label: value("gv-label").trim(), duration_minutes: Number(value("gv-minutes")), data_mb: Number(value("gv-data")), price_mmk: Number(value("gv-price")), count: Number(value("gv-count")) };
    const selectedShop=document.getElementById("gv-reseller")?.value||"";
    if(selectedShop)body.reseller_id=selectedShop;
    const saved = pendingGuestVoucherRequest();
    if (saved && Object.keys(body).some(key => saved[key] !== body[key])) {
      message.textContent = "Resume the saved batch before changing its settings or creating another batch.";
      return;
    }
    let refreshed = false, readyResult = false, requestSent = false;
    button.disabled = true;
    try {
      body.batch_id = saved?.batch_id || crypto.randomUUID();
      // Persist the identity BEFORE the first request. A lost response or page
      // refresh reuses these exact parameters and never creates new codes.
      retainGuestVoucherRequest(body);
      message.textContent = "Installing and verifying codes on the gateway…";
      requestSent = true;
      const response = await MM.post("/guest-vouchers", body);
      if (response.batch_id !== body.batch_id) throw Error("The batch identity could not be confirmed. Retry the saved batch.");
      readyResult = response.state === "ready";
      if (readyResult) clearGuestVoucherRequest(body.batch_id);
      refreshed = true;
      if (guestVoucherForm.isConnected) await renderVouchers(main, response);
    } catch (error) {
      const currentMessage = refreshed ? (document.getElementById("gv-message") || message) : message;
      currentMessage.textContent = !requestSent
        ? "Your browser could not retain the batch identity. No request was sent. " + (error.message || "")
        : refreshed
          ? (readyResult ? "Codes were created, but the view could not refresh. Reload the inventory before creating another batch." : "The batch is saved but not ready to print. Reload to resume verification.")
          : "Batch outcome is unconfirmed. Retry this saved batch to check the same codes. " + (error.message || "");
      const currentButton = refreshed ? (document.getElementById("gv-create") || button) : button;
      currentButton.disabled = refreshed;
    }
  });

  async function resumeGuestVoucherBatch(button, path, body, expectedBatchID = body?.batch_id) {
    const message = document.getElementById("gv-recovery-message");
    if (button.disabled) return;
    button.disabled = true;
    if (message) message.textContent = "Checking the saved batch and verifying its original codes…";
    try {
      const response = await MM.post(path, body);
      if (response.batch_id !== expectedBatchID) throw Error("The original batch could not be confirmed.");
      if (response.state === "ready") clearGuestVoucherRequest(response.batch_id);
      if (content.isConnected) await renderVouchers(main, response);
    } catch (error) {
      if (message?.isConnected) message.textContent = "The batch is retained for retry. " + (error.message || "Outcome could not be confirmed.");
      if (button.isConnected) button.disabled = false;
    }
  }
  document.getElementById("gv-resume-request")?.addEventListener("click", event => {
    const saved = pendingGuestVoucherRequest();
    if (saved) resumeGuestVoucherBatch(event.currentTarget, "/guest-vouchers", saved);
  });
  content.querySelectorAll("[data-gv-batch-retry]").forEach(button => button.addEventListener("click", () => {
    resumeGuestVoucherBatch(button, "/guest-vouchers/batches/" + encodeURIComponent(button.dataset.gvBatchRetry) + "/retry", {}, button.dataset.gvBatchRetry);
  }));

  content.querySelectorAll('[data-batch-shop]').forEach(form=>form.addEventListener('submit',async event=>{
    event.preventDefault();if(form.dataset.pending==='true')return;
    const button=form.querySelector('button[type="submit"]'),status=form.querySelector('[role="status"]');
    form.dataset.pending='true';button.disabled=true;status.textContent='Saving shop assignment…';
    const requested=form.querySelector('[name="reseller_id"]').value;
    try{const result=await MM.put('/guest-vouchers/batches/'+encodeURIComponent(form.dataset.batchShop)+'/reseller',{reseller_id:requested,expected_reseller_id:form.dataset.expectedShop,confirmed:true});
      if(result.assignment?.batch_id!==form.dataset.batchShop||result.assignment?.reseller_id!==requested||result.codes_changed!==false)throw Error('Assignment readback did not match. Refresh before retrying.');
      if(form.isConnected)await renderVouchers(main,issuedBatch);
    }catch(error){if(form.isConnected){status.textContent=error.message||'Assignment not confirmed. Refresh before retrying.';form.dataset.pending='false';button.disabled=false;}}
  }));
  content.querySelectorAll('[data-shop-print]').forEach(button=>button.addEventListener('click',()=>{
    content.querySelector('[data-voucher-tab="print"]')?.click();
    const filter=document.getElementById('pl-issue-batch'),source=document.getElementById('pl-batch-source');if(!filter)return;
    if(source){source.value='inventory';source.dispatchEvent(new Event('change'));}
    filter.value=button.dataset.shopPrint;filter.dispatchEvent(new Event('change'));filter.scrollIntoView({block:'center',behavior:'smooth'});
  }));

  // Router -> hub -> app accounting sync: the periodic system worker also does
  // this; this button is the manual, visible check on demand.
  const gvSync = document.getElementById("gv-sync");
  if (gvSync) gvSync.addEventListener("click", async () => {
    const gateway = document.getElementById("gv-gateway");
    const message = document.getElementById("gv-sync-message");
    if (!gateway || !gateway.value) { if (message) message.textContent = "Choose a gateway first."; return; }
    gvSync.disabled = true; if (message) message.textContent = "Reading router accounting…";
    try {
      const response = await MM.post("/guest-vouchers/sync", { device_id: gateway.value });
      const synced = asArray(response && response.synced).length;
      const unverified = asArray(response && response.synced).filter(row => row.first_use_status === "unverified").length;
      if (message) message.textContent = synced
        ? (unverified ? `Router accounting read. ${unverified} used code(s) lack original first-use evidence and need review; no fresh validity was granted.` : `Router accounting synchronized — ${synced} code(s) updated.`)
        : ((response && response.router) || "Synchronized.");
      await renderVouchers(main, issuedBatch);
    } catch (error) {
      if (message) message.textContent = (error && error.message) || "Router accounting could not be read.";
    } finally { gvSync.disabled = false; }
  });

  if (canEdit) {
    const addBtn = document.getElementById("vr-add");
    if (addBtn) addBtn.addEventListener("click", () => {
      const f = document.getElementById("vr-form");
      f.hidden = !f.hidden;
      if (!f.hidden) document.getElementById("nr-shop").focus();
    });
    const saveBtn = document.getElementById("nr-save");
    if (saveBtn) saveBtn.addEventListener("click", async () => {
      const val = id => document.getElementById(id).value.trim();
      const msg = document.getElementById("nr-msg");
      const body = { shop_name: val("nr-shop"), contact_name: val("nr-contact"),
                     location: val("nr-loc") || null, phone: val("nr-phone") || null,
                     code_prefix: val("nr-prefix"), active: true };
      if (!body.shop_name || !body.contact_name || !body.code_prefix) {
        msg.textContent = "Shop name, contact name and prefix are required."; return;
      }
      saveBtn.disabled = true; saveBtn.textContent = "…";
      try { await MM.post("/voucher-resellers", body); await renderVouchers(main, issuedBatch); }
      catch (e) {
        saveBtn.disabled = false; saveBtn.textContent = "Create reseller";
        msg.textContent = (e.data && e.data.reason) ? e.data.reason
                        : (e.data && e.data.error) ? e.data.error : e.message;
      }
    });
    const plSave = document.getElementById("pl-save");
    if (plSave) plSave.addEventListener("click", async () => {
      const val = id => document.getElementById(id).value.trim();
      const num = id => parseInt(document.getElementById(id).value, 10);
      const msg = document.getElementById("pl-msg");
      const width = num("pl-width") === 58 ? 58 : 80;
      const body = { business_name: val("pl-bname"), wifi_name: val("pl-wifi"),
                     support_contact: val("pl-support"), terms: val("pl-terms"),
                     paper_width_mm: width, a4_columns: num("pl-a4c"),
                     a4_rows_per_page: num("pl-a4r"),
                     // 58 mm cannot fit two readable code tiles side by side.
                     thermal_columns: width === 58 ? 1 : num("pl-tc"),
                     thermal_rows_per_strip: num("pl-tr"),
                     show_qr: document.getElementById("pl-qr").checked,
                     show_price: document.getElementById("pl-price").checked,
                     show_expiry: document.getElementById("pl-expiry").checked };
      plSave.disabled = true; plSave.textContent = "…";
      try { await MM.put("/voucher-print-layout", body); await renderVouchers(main, issuedBatch); }
      catch (e) {
        plSave.disabled = false; plSave.textContent = "Save layout";
        msg.textContent = (e.data && e.data.error) ? e.data.error : e.message;
      }
    });
  }

  // The sheet preview is wired for EVERYONE, not only editors — a viewer still
  // needs to see what the layout produces. It reads the form rather than the
  // saved row, so it tracks unsaved edits live.
  wirePrintPreview(main, list, canEdit, issuedVouchers);
  globalThis.MMWorkspace?.mountVouchers(content, issuedVouchers.length ? "print" : null);

  document.querySelectorAll("#content button[data-vrdel]").forEach(b =>
    b.addEventListener("click", async () => {
      if (!confirm("Delete this reseller?")) return;
      const el = document.getElementById("vr-alert");
      try { await MM.del("/voucher-resellers/" + encodeURIComponent(b.dataset.vrdel)); await renderVouchers(main, issuedBatch); }
      catch (e) { if (el) el.innerHTML = `<div class="alert" role="alert">${esc((e.data && e.data.error) ? e.data.error : e.message)}</div>`; }
    }));

  document.querySelectorAll("#content button[data-vredit]").forEach(b =>
    b.addEventListener("click", async () => {
      const r = resellers.find(x => x.id === b.dataset.vredit);
      if (!r) return;
      const shop = prompt("Shop name", r.shop_name); if (shop === null) return;
      const contact = prompt("Contact name", r.contact_name); if (contact === null) return;
      const prefix = prompt("Code prefix (2–4 chars)", r.code_prefix); if (prefix === null) return;
      const el = document.getElementById("vr-alert");
      try {
        await MM.put("/voucher-resellers/" + encodeURIComponent(r.id),
          { shop_name: shop, contact_name: contact, code_prefix: prefix,
            location: r.location || null, phone: r.phone || null, active: r.active });
        await renderVouchers(main, issuedBatch);
      } catch (e) {
        if (el) el.innerHTML = `<div class="alert" role="alert">${esc((e.data && e.data.reason) ? e.data.reason : (e.data && e.data.error) ? e.data.error : e.message)}</div>`;
      }
    }));
}

/* ---------- Magic Coins ---------- */
// The ledger is append-only in the database, so this view is a read-only audit
// trail plus (for OWNER/ADMIN) a manual adjustment form.
const COIN_KIND_LABEL = {
  agent_earn: "Agent earn",
  agent_reversal: "Agent reversal",
  service_payment: "Service payment",
  service_refund: "Service refund",
  feature_key_purchase: "Feature key purchase",
  purchase_credit: "Purchase credit",
  manual_credit: "Manual credit",
  manual_debit: "Manual debit",
};
const coinAmt = (n) => Number(n || 0).toFixed(2);

async function renderMagicCoins(main) {
  const content = main.querySelector("#content");
  const role = (ME && ME.user && ME.user.user_role) || "";
  const canAdjust = ["OWNER", "ADMIN", "DEVELOPER"].indexOf(role) >= 0;

  let wallet = null, txs = [];
  try { const w = await MM.get("/magic-coins/wallet"); wallet = w.wallet || null; } catch (_) {}
  try { const r = await MM.get("/magic-coins/transactions"); txs = r.transactions || []; } catch (_) {}

  const rows = txs.length ? txs.map(t => {
    const d = Number(t.delta || 0);
    return `<tr>
      <td class="muted small">${ts(t.created_at)}</td>
      <td>${esc(COIN_KIND_LABEL[t.kind] || t.kind)}</td>
      <td class="num">${d > 0 ? "+" : ""}${coinAmt(d)}</td>
      <td class="num">${coinAmt(t.balance_after)}</td>
      <td>${esc(t.note)}</td>
    </tr>`;
  }).join("") : `<tr><td colspan="5" class="muted small">No coin activity yet.</td></tr>`;

  content.innerHTML = `
    <div class="stat-cluster" style="margin-top:18px">
      <div class="stat"><div class="stat-label">Your balance</div><div class="stat-value">${coinAmt(wallet && wallet.balance)}</div></div>
      <div class="stat"><div class="stat-label">Ledger entries</div><div class="stat-value">${txs.length}</div></div>
    </div>
    <hr class="rule">
    ${canAdjust ? `<div class="panel"><div class="panel-head"><h2 class="panel-title">Manual adjustment</h2></div>
      <div class="panel-body">
        <div class="field"><label class="muted small" for="coin-user">User</label>
          <select class="input" id="coin-user"></select></div>
        <div class="field"><label class="muted small" for="coin-kind">Type</label>
          <select class="input" id="coin-kind">
            <option value="manual_credit">Credit (+)</option>
            <option value="manual_debit">Debit (−)</option>
          </select></div>
        <div class="field"><label class="muted small" for="coin-amount">Amount</label>
          <input class="input" id="coin-amount" type="number" min="0.01" step="0.01" placeholder="0.00"></div>
        <div class="field"><label class="muted small" for="coin-note">Reason</label>
          <input class="input" id="coin-note" type="text" placeholder="Why this adjustment"></div>
        <button class="btn btn-primary" id="coin-submit">Apply adjustment</button>
        <div id="coin-alert"></div>
      </div></div>` : ""}
    <div class="panel" style="margin-top:14px"><div class="panel-head"><h2 class="panel-title">Coin ledger</h2></div>
      <div class="panel-body">
        <table><thead><tr><th>When</th><th>Type</th><th>Change</th><th>Balance</th><th>Reason</th></tr></thead>
        <tbody>${rows}</tbody></table>
      </div></div>`;

  if (!canAdjust) return;

  const sel = document.getElementById("coin-user");
  try {
    const t = await MM.get("/team");
    const members = t.team || [];
    sel.innerHTML = members.length
      ? members.map(m => `<option value="${esc(m.user_id)}">${esc(m.full_name || m.email)}</option>`).join("")
      : `<option value="">(no team members)</option>`;
  } catch (_) {
    sel.innerHTML = `<option value="">(could not load users)</option>`;
  }

  const notify = (m) => {
    document.getElementById("coin-alert").innerHTML = `<div class="alert" role="alert">${esc(m)}</div>`;
  };

  document.getElementById("coin-submit").addEventListener("click", async () => {
    const btn = document.getElementById("coin-submit");
    const uid = sel.value;
    const amount = parseFloat(document.getElementById("coin-amount").value);
    const kind = document.getElementById("coin-kind").value;
    const note = document.getElementById("coin-note").value.trim();
    if (!uid) return notify("Pick a user.");
    if (!(amount > 0)) return notify("Amount must be greater than zero.");
    if (note.length < 3) return notify("Give a reason (at least 3 characters).");

    btn.disabled = true; btn.textContent = "…";
    try {
      await MM.post("/magic-coins/adjust", { user_id: uid, amount: amount, kind: kind, note: note });
      await renderMagicCoins(main); // reload balance + ledger
    } catch (e) {
      btn.disabled = false; btn.textContent = "Apply adjustment";
      notify((e.data && e.data.error) ? e.data.error : e.message);
    }
  });
}

/* ---------- Store ---------- */
function storePrice(value) {
  const amount = Number(value);
  return Number.isFinite(amount) ? `${amount.toLocaleString()} MMK` : "Not published";
}

async function renderStore(main) {
  const content=main.querySelector("#content");
  let runtime;
  try{runtime=await MM.get("/subscription");}catch(e){content.innerHTML='<section class="panel"><div class="panel-body" role="alert">Store compatibility status is unavailable. No checkout is offered.</div></section>';return;}
  // Keep the existing enforced legacy recovery route working during migration.
  if(runtime.mode==="subscription_only")return renderLegacyStoreCheckout(main);
  if(runtime.mode==="individual_pass")return renderIndividualPass(main,runtime);
  let pass=null;
  try{const result=await MM.get("/me/app-pass");if(result.scope!=="account"||result.authority!=="app_account_passes"||!["none","monthly","annual"].includes(result.kind))throw Error("Invalid pass response");pass=result;}catch(_){}
  const passPanel=pass?`<section class="panel"><div class="panel-body"><h2>Your individual app pass</h2><p>${esc(({monthly:"Monthly",annual:"Annual",none:"No current pass recorded"})[pass.kind]||"Unavailable")} · ${esc(({no_pass:"Not issued",pass_required:"Activation required",transition:"Seven-day transition",platform_exempt:"Platform administrator exempt",authorized_login_required:"Authorized login review required",active:"Active",scheduled:"Starts later",expired:"Expired",revoked:"Revoked"})[pass.state]||"Unavailable")}</p><p>Activation: ${pass.activated_at?esc(ts(pass.activated_at)):"Not recorded"} · Expiry: ${pass.expires_at?esc(ts(pass.expires_at)):"Not recorded"}</p><p class="muted">This pass belongs to this login. Existing access rules remain in effect during the subscription rollout. It is separate from guest WiFi vouchers and old Store history.</p></div></section>`:'<section class="panel"><div class="panel-body" role="alert">Your individual app pass could not be loaded.</div></section>';
  let purchases=null;
  try{const result=await MM.get("/store/purchases");if(!Array.isArray(result.purchases))throw Error("Invalid history response");purchases=result.purchases;}catch(_){}
  content.innerHTML=`${passPanel}<section class="panel"><div class="panel-body"><h2>Legacy Store history</h2><p>These records belong to the earlier Store. They do not issue or activate the current app's individual monthly/annual passes. Existing records and compatibility access are preserved.</p><p>Current account passes are recorded separately by the platform operator. New subscription checkout is not available here.</p>${purchases===null?'<p role="alert">Store history could not be loaded. No empty history is inferred.</p>':purchases.length?`<div class="tablewrap"><table><thead><tr><th>Recorded</th><th>Legacy item</th><th>Amount</th><th>Status</th></tr></thead><tbody>${purchases.map(item=>`<tr><td>${esc(ts(item.created_at))}</td><td>${esc(item.service_label||item.service_key||"Legacy service")}</td><td>${storePrice(item.price_mmk)}</td><td>${requestStatusBadge(item.status||"unknown")}</td></tr>`).join("")}</tbody></table></div>`:'<p>No legacy Store purchases recorded.</p>'}</div></section>`;
}

async function renderIndividualPass(main, pass) {
  const content=main.querySelector("#content");
  const labels={active:"Active",transition:"Seven-day transition",expired:"Expired",revoked:"Revoked",pass_required:"Activation required",authorized_login_required:"Authorized login review required",platform_exempt:"Platform administrator exempt"};
  let requests=null;
  try { const r=await MM.get("/me/app-pass/renewals");if(Array.isArray(r.requests))requests=r.requests; }catch(_){}
  const pending=requests?.find(r=>r.status==="pending");
  content.innerHTML=`<section class="panel"><div class="panel-body"><h2>Your app pass</h2><p>${esc(labels[pass.state]||"Unavailable")}</p><p>Activation: ${pass.activated_at?esc(ts(pass.activated_at)):"Not activated"}<br>Expiry: ${pass.expires_at?esc(ts(pass.expires_at)):"Not recorded"}${pass.transition_expires_at?`<br>Transition ends: ${esc(ts(pass.transition_expires_at))}`:""}</p><p>${pass.capacity_exempt?"Your platform administrator account is exempt from pass and workspace limits.":"One authorized login for your private workspace, one business site and one RouterBOARD."} Monthly and annual passes include the same features. Voucher, AI and Jellyfin usage has no app subscription quota; service availability and supported device capabilities still apply.</p><p>Expiry blocks app management. Existing guest internet sessions continue under the router's voucher limits.</p>${pass.state==="platform_exempt"?"":`<form id="account-renewal-form"><h3>Request activation or renewal</h3><p>This sends a request to the platform administrator. It does not charge money or confirm payment. Approval starts a new calendar month or year.</p><label>Plan<select class="input" name="plan"><option value="monthly">Monthly</option><option value="annual">Annual</option></select></label><button class="btn btn-primary" type="submit"${requests===null||pending||pass.authorized_login===false?" disabled":""}>Send request</button><p role="status">${requests===null?"Renewal history unavailable. Reload before submitting.":pending?"A renewal request is already awaiting review.":pass.authorized_login===false?"Contact the platform administrator to review the authorized login.":""}</p></form>`}</div></section><section class="panel"><div class="panel-body"><h2>Your renewal requests</h2>${requests===null?'<p role="alert">Could not load renewal requests.</p>':requests.length?requests.map(r=>`<p>${esc(ts(r.created_at))} · ${esc(r.plan)} · ${esc(r.status)}</p>`).join(""):'<p>No renewal requests.</p>'}</div></section>`;
  const form=content.querySelector("#account-renewal-form");
  form?.addEventListener("submit",async e=>{
    e.preventDefault();const button=form.querySelector("button"),status=form.querySelector('[role="status"]');
    if(button.disabled)return;button.disabled=true;status.textContent="Sending…";
    try { await MM.post("/me/app-pass/renewals",{plan:form.elements.plan.value});await renderIndividualPass(main,pass); }
    catch(err){status.textContent=apiErrorText(err,"Request not confirmed. Reload before retrying.");}
  });
}
