      <div class="stat"><div class="stat-label">Your balance</div><div class="stat-value">${coinAmt(wallet && wallet.balance)}</div></div>
      <div class="stat"><div class="stat-label">Ledger entries</div><div class="stat-value">${txs.length}</div></div>
    </div>
    <hr class="rule">
    ${canAdjust ? `<div class="panel"><div class="panel-head"><h2 class="panel-title">Manual adjustment</h2></div>
      <div class="panel-body">
        <div class="field"><label class="muted small" for="coin-user">User</label>
          <select class="input" id="coin-user"></select></div>
        <div class="field"><label class="muted small" for="coin-kind">Type</label>
          <select class="input" id="coin-kind">
            <option value="manual_credit">Credit (+)</option>
            <option value="manual_debit">Debit (−)</option>
          </select></div>
        <div class="field"><label class="muted small" for="coin-amount">Amount</label>
          <input class="input" id="coin-amount" type="number" min="0.01" step="0.01" placeholder="0.00"></div>
        <div class="field"><label class="muted small" for="coin-note">Reason</label>
          <input class="input" id="coin-note" type="text" placeholder="Why this adjustment"></div>
        <button class="btn btn-primary" id="coin-submit">Apply adjustment</button>
        <div id="coin-alert"></div>
      </div></div>` : ""}
    <div class="panel" style="margin-top:14px"><div class="panel-head"><h2 class="panel-title">Coin ledger</h2></div>
      <div class="panel-body">
        <table><thead><tr><th>When</th><th>Type</th><th>Change</th><th>Balance</th><th>Reason</th></tr></thead>
        <tbody>${rows}</tbody></table>
      </div></div>`;

  if (!canAdjust) return;

  const sel = document.getElementById("coin-user");
  try {
    const t = await MM.get("/team");
    const members = t.team || [];
    sel.innerHTML = members.length
      ? members.map(m => `<option value="${esc(m.user_id)}">${esc(m.full_name || m.email)}</option>`).join("")
      : `<option value="">(no team members)</option>`;
  } catch (_) {
    sel.innerHTML = `<option value="">(could not load users)</option>`;
  }

  const notify = (m) => {
    document.getElementById("coin-alert").innerHTML = `<div class="alert" role="alert">${esc(m)}</div>`;
  };

  document.getElementById("coin-submit").addEventListener("click", async () => {
    const btn = document.getElementById("coin-submit");
    const uid = sel.value;
    const amount = parseFloat(document.getElementById("coin-amount").value);
    const kind = document.getElementById("coin-kind").value;
    const note = document.getElementById("coin-note").value.trim();
    if (!uid) return notify("Pick a user.");
    if (!(amount > 0)) return notify("Amount must be greater than zero.");
    if (note.length < 3) return notify("Give a reason (at least 3 characters).");

    btn.disabled = true; btn.textContent = "…";
    try {
      await MM.post("/magic-coins/adjust", { user_id: uid, amount: amount, kind: kind, note: note });
      await renderMagicCoins(main); // reload balance + ledger
    } catch (e) {
      btn.disabled = false; btn.textContent = "Apply adjustment";
      notify((e.data && e.data.error) ? e.data.error : e.message);
    }
  });
}

/* ---------- Portal branding editor + live preview ---------- */

/** <input type="color"> only accepts #rrggbb, so a stored #rgb or a junk value
 *  must fall back rather than render an unusable swatch. */
function hexOr(v, fallback) {
  const s = String(v == null ? "" : v).trim();
  return /^#[0-9a-fA-F]{6}$/.test(s) ? s : fallback;
}

/** Mounts the editor against the REAL guest portal in an iframe. The frame is the
 *  production page in preview mode, so what the operator sees is what guests get
 *  — there is no second copy of the portal markup to drift out of date. */
function wirePortalBranding(main, cfg, collect, plansTbl) {
  const frame = main.querySelector("#pb-frame");
  if (!frame) return;
  const q = id => main.querySelector("#" + id);
  const val = id => { const e = q(id); return e ? e.value.trim() : ""; };
  const numOf = id => { const e = q(id); return e ? (parseInt(e.value, 10) || 0) : 0; };
  let lang = "en";
  const draft = () => ({
    business_name: val("pb-name"), welcome_text: val("pb-welcome"), terms_text: val("pb-terms"),
    primary_hex: val("pb-primary-hex"), glass_tint_hex: val("pb-tint-hex"),
    bank_name: val("pb-bank-name"), bank_holder: val("pb-bank-holder"), bank_account: val("pb-bank-acc"),
    mmqr_url: val("mmqr-url"), guest_grace_minutes: numOf("grace-min"),
    guest_plans: (typeof collect === "function" ? collect() : ((cfg && cfg.guest_plans) || [])),
  });
  const push = () => {
    if (!frame.contentWindow || !document.body.contains(frame)) return;
    frame.contentWindow.postMessage({ type: "mm-portal-preview", config: draft(), lang }, location.origin);
  };
  // The frame announces when it is listening; a frame left over from a previous
  // view is ignored so window-level listeners cannot accumulate across views.
  window.addEventListener("message", ev => {
    if (ev.origin !== location.origin || !ev.data) return;
    if (ev.data.type !== "mm-portal-preview-ready") return;
    if (!document.body.contains(frame)) return;
    push();
  });
  ["pb-name","pb-welcome","pb-terms","pb-bank-name","pb-bank-holder","pb-bank-acc","mmqr-url","grace-min"]
    .forEach(id => { const e = q(id); if (e) e.addEventListener("input", push); });
  const syncColor = (pick, hex) => {
    const p = q(pick), h = q(hex);
    if (!p || !h) return;
    p.addEventListener("input", () => { h.value = p.value; push(); });
    h.addEventListener("input", () => { if (/^#[0-9a-fA-F]{6}$/.test(h.value.trim())) p.value = h.value.trim(); push(); });
  };
  syncColor("pb-primary", "pb-primary-hex");
  syncColor("pb-tint", "pb-tint-hex");
  if (plansTbl) plansTbl.addEventListener("input", push);
  const myBtn = q("pb-lang-my"), enBtn = q("pb-lang-en");
  if (myBtn) myBtn.addEventListener("click", () => { lang = "my"; push(); });
  if (enBtn) enBtn.addEventListener("click", () => { lang = "en"; push(); });

  const HEXISH = /^#([0-9a-fA-F]{3}|[0-9a-fA-F]{4}|[0-9a-fA-F]{6}|[0-9a-fA-F]{8})$/;
  const saveBtn = q("pb-save");
  if (saveBtn) saveBtn.addEventListener("click", async () => {
    const m = q("pb-msg");
    const d = draft();
    if (!HEXISH.test(d.primary_hex)) { m.textContent = "Brand colour must be a hex colour like #ffb547."; return; }
    if (!HEXISH.test(d.glass_tint_hex)) { m.textContent = "Accent tint must be a hex colour like #7ad0ff."; return; }
    saveBtn.disabled = true; saveBtn.textContent = "…";
    try {
      // Branding fields ONLY. The endpoint merges now, so guest plans, the MMQR
      // URL, the grace window and guest consent are left exactly as they are —
      // previously an omitted field was erased by the full-replace upsert.
      await MM.put("/portal/config", {
        business_name: d.business_name, welcome_text: d.welcome_text, terms_text: d.terms_text,
        primary_hex: d.primary_hex, glass_tint_hex: d.glass_tint_hex,
        bank_name: d.bank_name, bank_holder: d.bank_holder, bank_account: d.bank_account,
      });
      m.textContent = "Saved.";
      await loadView("portal", main, ME);
    } catch (e) {
      saveBtn.disabled = false; saveBtn.textContent = "Save branding";
      m.textContent = "Save failed: " + ((e.data && (e.data.error || e.data.reason)) || e.message || "");
    }
  });
}

async function renderPortal(main) {
  let cfg = null, cfgErr = null;
  try { cfg = await MM.get("/portal/config"); } catch (e) { cfgErr = errorText(e, "Portal configuration has not been created yet."); }
  let reqs = [], reqErr = null;
  try {
    const r = await MM.get("/billing/requests"); reqs = r.requests || r || [];
  } catch (e) { reqErr = errorText(e, "Guest purchase requests could not be loaded."); }

  let html = `<div class="panel"><div class="panel-head"><h2 class="panel-title">Portal configuration</h2></div><div class="panel-body">`;

      `<tr><td>Grace window</td><td class="num">${esc(cfg.guest_grace_minutes||"—")} min</td></tr>` +
      `</tbody></table>`;
  } else if (cfgErr) { html += `<p class="muted small">${esc(cfgErr)}</p>`; }

  // Guest data plans — owner-set price (MMK) + data per location. Editable so
  // each hotspot owner prices their own market (no global pricing rule).
  const plans = (cfg && cfg.guest_plans) || [];
  html += `<h3 class="small" style="margin:14px 0 6px">MMQR payment QR<span class="muted"> — image URL guests scan to pay by bank</span></h3>`;
  html += `<input id="mmqr-url" value="${esc((cfg&&cfg.mmqr_url)||"")}" placeholder="https://…/mmqr.jpg or /assets/mmqr.jpg" style="width:100%">`;

/* ---------- Security (C1 posture) ---------- */
async function renderSecurity(main) {
  const data = await MM.get("/security/posture");
  const devices = data.devices || [];
  const content = main.querySelector("#content");

  if (!devices.length) {
    content.innerHTML = `<div class="empty"><div class="empty-title">No posture data yet</div>RouterOS versions are captured on each device's next evaluation.</div>`;
    return;
  }

  // Worst first. An unfixable finding outranks a fixable one, which outranks
  // "we could not tell", which outranks fine — so the thing an operator must
  // act on is never buried under rows that are merely unreadable.
  const rank = (d) => {
    if (d.posture === "affected") return d.unpatchable ? 0 : 1;
    if (d.posture === "unknown") return 2;
    return 3;
  };
  const sorted = devices.slice().sort((a, b) => rank(a) - rank(b));

  const postureBadge = (d) => {
    const m = { affected: "bad", safe: "ok", unknown: "unknown" }[d.posture] || "unknown";
    const label = { affected: "Affected", safe: "Safe", unknown: "Unknown" }[d.posture] || "Unknown";
    return `<span class="status ${m}">${label}</span>`;
  };

  // An advisory the vendor has published no fix for needs to look DIFFERENT from
  // one you can upgrade out of, otherwise "affected" just means "ignored".
  const fixBadge = (d) => {
    if (d.posture !== "affected") return "";
    if (d.unpatchable && !d.fix_first) return `<span class="status warn">No fix available</span>`;
    if (d.unpatchable) return `<span class="status warn">Partly unfixable</span>`;
    return "";
  };

  const exploitedBadge = (d) =>
    d.exploited ? `<span class="status bad">Exploited</span>` : "";

  // Two different remedies, so name the right one.
  const fixHint = (d) => {
    if (d.posture !== "affected") return "\u2014";
    if (d.fix_first) return `upgrade to \u2265 <span class="mono">${esc(d.fix_first)}</span>`;
    return "close the exposed service";
  };

  const advTitle = (d) => (d.advisories || [])
    .map(a => `${a.id} \u2014 ${a.title}${a.fix_unavailable ? " (no fix)" : ""}`)
    .join("\n");

  const rows = sorted.map(d => `
    <tr>
      <td>${postureBadge(d)}</td>
      <td><span class="num">${esc(d.hardware_name)}</span></td>
      <td class="mono">${d.routeros_version ? esc(d.routeros_version) : "\u2014"}</td>
      <td class="muted small">${d.routeros_channel ? esc(d.routeros_channel) : "\u2014"}</td>
      <td>${fixBadge(d)} ${exploitedBadge(d)}</td>
      <td class="muted small">${fixHint(d)}</td>
      <td class="muted small">${(d.advisories || []).length
        ? `<span class="mono" title="${esc(advTitle(d))}">${d.advisories.length} matching</span>`
        : "\u2014"}</td>
      <td>${ts(d.version_checked_at)}</td>
    </tr>`).join("");

  const unpatchableNotice = (data.unpatchable ?? 0) > 0
    ? `<div class="alert">${data.unpatchable} of these ${data.count} device(s) match at least one advisory with <strong>no vendor fix</strong> \u2014 upgrading will not clear it. Apply the mitigation for those entries instead of scheduling a patch window.</div>`
    : "";
  const exploitedNotice = (data.exploited ?? 0) > 0
    ? `<div class="alert">${data.exploited} device(s) match an advisory being <strong>exploited in the wild</strong>. Treat those first.</div>`
    : "";

  content.innerHTML = `
    <div class="stat-cluster security-stats" style="margin-top:18px">
      <div class="stat"><div class="stat-label">Affected</div><div class="stat-value">${data.affected ?? 0}</div></div>
      <div class="stat"><div class="stat-label">Safe</div><div class="stat-value">${data.safe ?? 0}</div></div>
      <div class="stat"><div class="stat-label">Unknown</div><div class="stat-value">${data.unknown ?? 0}</div></div>
      <div class="stat"><div class="stat-label">No fix exists</div><div class="stat-value">${data.unpatchable ?? 0}</div></div>
      <div class="stat"><div class="stat-label">Exploited</div><div class="stat-value">${data.exploited ?? 0}</div></div>
    </div>
    ${unpatchableNotice}
    ${exploitedNotice}
    <hr class="rule">
    <table>
      <thead><tr><th>Posture</th><th>Device</th><th>RouterOS</th><th>Channel</th><th>Flags</th><th>Action</th><th>Matches</th><th>Checked</th></tr></thead>
      <tbody>${rows}</tbody></table>`;
}

const TEAM_ROLES = ["OWNER", "ADMIN", "OPERATOR", "TECHNICIAN", "VIEWER", "SUPPORT"];

async function renderTeam(main) {
  const content = main.querySelector("#content");

  try {

  } catch (e) {

      content.innerHTML = `<div class="panel"><div class="panel-body"><div class="empty"><div class="empty-title">Owner access required</div>Only the business owner can manage team roles.</div></div></div>`;
      return;
    }
    throw e;
  }

  const roleOpts = (sel) => TEAM_ROLES.map(r => `<option value="${r}"${r === sel ? " selected" : ""}>${r}</option>`).join("");
  const rows = team.map(u => `
    <tr>
      <td><span class="num">${esc(u.full_name)}</span></td>
      <td class="mono">${esc(u.email)}</td>
      <td><select class="input" data-role="${esc(u.user_id)}" style="width:auto;padding:3px 6px">${roleOpts(u.user_role)}</select></td>
      <td>${u.is_active ? `<span class="status ok">Active</span>` : `<span class="status unknown">Disabled</span>`}</td>
      <td><button class="btn btn-sm" data-save="${esc(u.user_id)}">Save</button>
          <button class="btn btn-sm" data-disable="${esc(u.user_id)}"${u.is_active ? "" : " disabled"}>Disable</button></td>
    </tr>`).join("");

  content.innerHTML = `
    <div class="panel"><div class="panel-head"><h2 class="panel-title">Team</h2></div>
      <div class="panel-body">${team.length ? `<table><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th></th></tr></thead><tbody>${rows}</tbody></table>` : `<div class="empty"><div class="empty-title">No team members</div>Add a staff user below.</div>`}</div></div>
    <div class="panel" style="margin-top:14px"><div class="panel-head"><h2 class="panel-title">Add team member</h2></div>
      <div class="panel-body">
        <div class="field"><label>Full name</label><input class="input" id="tm-name"></div>
        <div class="field"><label>Email</label><input class="input" id="tm-email" type="email"></div>
        <div class="field"><label>Password (8+ chars)</label><input class="input" id="tm-pass" type="password"></div>
        <div class="field"><label>Role</label><select class="input" id="tm-role">${roleOpts("OPERATOR")}</select></div>
        <button class="btn btn-primary" id="tm-add">Add member</button>
        <span id="tm-msg" class="muted small"></span>
      </div></div>`;

  const msg = (t) => { document.getElementById("tm-msg").textContent = t; };
  const fail = (e) => { content.prepend(Object.assign(document.createElement("div"), { className: "alert", textContent: (e.data && e.data.error) ? e.data.error : e.message })); };

  content.querySelectorAll("button[data-save]").forEach(btn => btn.addEventListener("click", async () => {
    const id = btn.dataset.save;
    const role = content.querySelector(`select[data-role="${id}"]`).value;
    try { await MM.put(`/team/${encodeURIComponent(id)}`, { user_role: role }); await renderTeam(main); }
    catch (e) { btn.disabled = false; fail(e); }
  }));
  content.querySelectorAll("button[data-disable]").forEach(btn => btn.addEventListener("click", async () => {
    try { await MM.del(`/team/${encodeURIComponent(btn.dataset.disable)}`); await renderTeam(main); }
    catch (e) { fail(e); }
  }));
  document.getElementById("tm-add").addEventListener("click", async () => {
    const body = {
      full_name: document.getElementById("tm-name").value,
      email: document.getElementById("tm-email").value,
      password: document.getElementById("tm-pass").value,
      user_role: document.getElementById("tm-role").value,
    };
    try { await MM.post("/team", body); await renderTeam(main); }
    catch (e) { fail(e); }
  });
}

/* ---------- Backups (C2) ---------- */
async function renderBackups(main) {
  const content = main.querySelector("#content");
  const data = await MM.get("/routers");
  const devices = Array.isArray(data.routers) ? data.routers : asArray(data);
  if (!devices.length) {
    content.innerHTML = `<div class="empty"><div class="empty-title">No devices</div>Add a router to enable backups.</div>`;
    return;
  }
  content.innerHTML = `
    <div class="panel"><div class="panel-head"><h2 class="panel-title">Device</h2></div>
      <div class="panel-body">
        <select class="input" id="bk-dev">${devices.map(d => `<option value="${esc(d.device_id)}">${esc(d.hardware_name || d.device_id)}</option>`).join("")}</select>
        <div style="margin-top:12px;display:flex;gap:8px">
          <button class="btn btn-primary" id="bk-capture">Capture backup</button>
        </div>
      </div>
    </div>
    <div class="panel" style="margin-top:14px"><div class="panel-head"><h2 class="panel-title">Backups</h2></div>
      <div class="panel-body" id="bk-list">${loading()}</div></div>
    <div class="panel" style="margin-top:14px"><div class="panel-head"><h2 class="panel-title">Change history</h2></div>
      <div class="panel-body" id="bk-hist">${loading()}</div></div>`;

  const dev = () => document.getElementById("bk-dev").value;
  const refresh = async () => {
    document.getElementById("bk-list").innerHTML = loading();
    document.getElementById("bk-hist").innerHTML = loading();
    let backups = [], changes = [];
    try { const r = await MM.get(`/devices/${encodeURIComponent(dev())}/backups`); backups = r.backups || []; }
    catch (e) { document.getElementById("bk-list").innerHTML = `<p class="muted small">${esc(e.data && e.data.error ? e.data.error : e.message)}</p>`; }
    try { const r = await MM.get(`/devices/${encodeURIComponent(dev())}/changes`); changes = r.changes || []; }
    catch (_) {}

    const list = document.getElementById("bk-list");
    if (backups && backups.length) {
      list.innerHTML = `<table><thead><tr><th>Label</th><th>Kind</th><th>Size</th><th>Created</th><th></th></tr></thead><tbody>` +
        backups.map(b => `<tr>
          <td><span class="num">${esc(b.label || "—")}</span></td>
          <td class="mono">${esc(b.kind)}</td>
          <td class="num">${esc(b.size_bytes)}</td>
          <td>${ts(b.created_at)}</td>
          <td><button class="btn btn-sm" data-restore="${esc(b.id)}">Restore</button></td>
        </tr>`).join("") + `</tbody></table>`;
      list.querySelectorAll("button[data-restore]").forEach(btn => {
        btn.addEventListener("click", async () => {
          const otp = prompt("Enter OTP for this high-risk restore:");
          if (otp === null) return;
          btn.disabled = true; btn.textContent = "…";
          try {
            await MM.post(`/devices/${encodeURIComponent(dev())}/restore/${encodeURIComponent(btn.dataset.restore)}`, { otp });
            btn.textContent = "Restored";
          } catch (e) {
            btn.disabled = false; btn.textContent = "Restore";
            list.appendChild(Object.assign(document.createElement("div"), { className: "alert", textContent: (e.data && e.data.error) ? e.data.error : e.message }));
          }
        });
      });
    } else if (list) {
      list.innerHTML = `<div class="empty"><div class="empty-title">No backups</div>Capture a backup to snapshot this device's config.</div>`;
    }

    const hist = document.getElementById("bk-hist");
    if (changes && changes.length) {
      hist.innerHTML = `<table><thead><tr><th>When</th><th>Role</th><th>Action</th><th>Reason</th></tr></thead><tbody>` +
        changes.map(ch => `<tr><td>${ts(ch.timestamp)}</td><td class="mono">${esc(ch.user_role)}</td><td class="mono">${esc(ch.action)}</td><td class="muted small">${esc(ch.reason)}</td></tr>`).join("") +
        `</tbody></table>`;
    } else if (hist) {
      hist.innerHTML = `<div class="empty"><div class="empty-title">No changes yet</div>Backups and restores will appear here.</div>`;
    }
  };

  document.getElementById("bk-dev").addEventListener("change", refresh);
  document.getElementById("bk-capture").addEventListener("click", async () => {
    const btn = document.getElementById("bk-capture");
    btn.disabled = true; btn.textContent = "Capturing…";
    try { await MM.post(`/devices/${encodeURIComponent(dev())}/backups`, {}); }
    catch (e) { main.querySelector("#content").prepend(Object.assign(document.createElement("div"), { className: "alert", textContent: (e.data && e.data.error) ? e.data.error : e.message })); }
    btn.disabled = false; btn.textContent = "Capture backup";
    await refresh();
  });

  await refresh();
}

async function wirePlatformAdmin(content, main) {
  const msg = (t) => { const el = document.getElementById("pt-msg"); if (el) el.textContent = t; };
  const fail = (e) => {
    const t = (e.data && e.data.error) ? e.data.error : e.message;
    content.prepend(Object.assign(document.createElement("div"), { className: "alert", textContent: t }));
  };

  const create = document.getElementById("pt-create");
  if (create) create.addEventListener("click", async () => {
    const quota = parseInt(document.getElementById("pt-quota").value, 10);
    const body = {
      company_name: document.getElementById("pt-company").value.trim(),
      owner_email: document.getElementById("pt-email").value.trim(),
      owner_password: document.getElementById("pt-pass").value,
      access_tier: document.getElementById("pt-tier").value,
    };
    if (!body.company_name || !body.owner_email || body.owner_password.length < 8) { msg("Company, email and an 8+ char password are required."); return; }
    if (!isNaN(quota) && quota > 0) body.device_quota_limit = quota;
    create.disabled = true; msg("creating…");
    try { await MM.post("/platform/businesses", body); await renderPlatform(main); }
    catch (e) { create.disabled = false; msg(""); fail(e); }
  });

  content.querySelectorAll("button[data-susp]").forEach(btn => btn.addEventListener("click", async () => {
    const id = btn.dataset.susp, act = btn.dataset.act === "suspend" ? "suspend" : "unsuspend";
    btn.disabled = true; btn.textContent = "…";
    try { await MM.post(`/platform/businesses/${encodeURIComponent(id)}/${act}`, {}); await renderPlatform(main); }
    catch (e) { btn.disabled = false; btn.textContent = "Retry"; fail(e); }
  }));

  content.querySelectorAll("button[data-resetpw]").forEach(btn => btn.addEventListener("click", async () => {
    const id = btn.dataset.resetpw;
    const pw = prompt("New owner password (8+ chars):");
    if (pw === null) return;
    if (pw.length < 8) { fail({ message: "password must be 8+ chars" }); return; }
    try { await MM.post(`/platform/businesses/${encodeURIComponent(id)}/reset-owner-password`, { new_password: pw }); btn.textContent = "reset ✓"; }
    catch (e) { fail(e); }
  }));

  content.querySelectorAll("button[data-state]").forEach(btn => btn.addEventListener("click", async () => {
    const id = btn.dataset.state;
    try {
      const s = await MM.get(`/platform/businesses/${encodeURIComponent(id)}/state`);
      alert([
        "Company: " + s.company_name,
        "Tier: " + s.access_tier,
        "Active: " + s.is_active,
        "Owner: " + s.owner_email,
        "Devices: " + s.device_count + " / " + s.device_quota_limit,
        "Open incidents: " + s.open_incidents,
        "Extra slots: " + s.purchased_extra_slots,
        "AI tokens: " + s.ai_token_balance,
      ].join("\n"));
    } catch (e) { fail(e); }
  }));
}

function platformBusinessTable(bizs, selfBusinessID) {
  if (!bizs.length) return `<div class="empty"><div class="empty-title">No businesses</div>No tenants are registered yet.</div>`;
  const rows = bizs.map(b => {
    const isSelf = selfBusinessID && b.business_id === selfBusinessID;
    const suspBtn = isSelf
      ? `<span class="muted small" title="You can't suspend your own tenant">(yours)</span>`
      : `<button class="btn btn-sm" data-susp="${esc(b.business_id)}" data-act="${b.is_active ? "suspend" : "unsuspend"}">${b.is_active ? "Suspend" : "Unsuspend"}</button>`;
    return `
    <tr>
      <td><span class="num">${esc(b.company_name)}</span></td>
      <td>${esc(b.owner_email)}</td>
      <td><span class="mono">${esc(b.access_tier)}</span></td>
      <td class="num">${esc(b.device_quota_limit)}</td>
      <td>${b.is_active ? `<span class="status ok">Active</span>` : `<span class="status unknown">Suspended</span>`}</td>
      <td>${ts(b.created_at)}</td>
      <td>
        ${suspBtn}
        <button class="btn btn-sm" data-resetpw="${esc(b.business_id)}">Reset pw</button>
        <button class="btn btn-sm" data-state="${esc(b.business_id)}">View state</button>
      </td>
    </tr>`; }).join("");
  return `<table><thead><tr><th>Company</th><th>Owner</th><th>Tier</th><th>Device limit</th><th>Status</th><th>Created</th><th></th></tr></thead><tbody>${rows}</tbody></table>`;
}

function platformIncidentTable(list, bizs) {
  if (!list.length) return `<div class="empty"><div class="empty-title">No open incidents</div>Cross-tenant incidents will appear here.</div>`;
  const rows = list.map(inc => `
    <tr>
      <td>${sevBadge(inc.severity || "info")}</td>
      <td><span class="mono">${esc(inc.kind)}</span></td>
      <td><span class="num">${esc(bizName(bizs, inc.business_id))}</span></td>
      <td><span class="num">${esc(inc.subject_label || inc.subject_id || "—")}</span></td>
      <td>${ts(inc.opened_at)}</td>
    </tr>`).join("");
  return `<table><thead><tr><th>Severity</th><th>Kind</th><th>Business</th><th>Subject</th><th>Opened</th></tr></thead><tbody>${rows}</tbody></table>`;
}

/* ---------- Boot ---------- */
// External api.js/app.js load deferred; wait for window.load so MM/whoami
// exist before we boot (they are undefined before that -> ReferenceError).
window.addEventListener("load", async () => {
  const me = await whoami();
  if (!me) return;
  ME = me;
  document.querySelector("#rail-biz").textContent = (me.business && me.business.company_name) || "—";
  document.querySelector("#rail-user-name").textContent = (me.user && (me.user.full_name || me.user.email)) || "Signed in";
  document.querySelector("#rail-user-role").textContent = (me.user && me.user.user_role) || "Member";
  // The Platform console is DEVELOPER-only: reveal the rail item only for that role.
  if (me.user && me.user.user_role === "DEVELOPER") {
    const navP = document.getElementById("nav-platform");
    if (navP) navP.hidden = false;
  }
  const main = document.getElementById("main");

  // Narrow screens: wide data tables scroll inside their panel instead of
  // running off the edge. Handled here so the 30 table render sites stay as-is.
  const wrapTables = () => main.querySelectorAll("table").forEach((t) => {
    const p = t.parentElement;
    if (p && p.classList.contains("tablewrap")) return;
    const d = document.createElement("div");
    d.className = "tablewrap";
    p.replaceChild(d, t);
    d.appendChild(t);
  });
  new MutationObserver(wrapTables).observe(main, { childList: true, subtree: true });

  // The rail collapses into a menu below 900px: close it once a view is chosen,
  // or when the tap lands outside the rail.
  const railToggle = document.getElementById("rail-toggle");
  const railMenu = document.getElementById("rail-menu");
  const setRailOpen = (open) => {
    if (!railToggle || !railMenu) return;
    railMenu.classList.toggle("open", open);
    railToggle.setAttribute("aria-expanded", open ? "true" : "false");
  };
  if (railToggle) railToggle.addEventListener("click", (event) => {
    event.stopPropagation();
    setRailOpen(railToggle.getAttribute("aria-expanded") !== "true");
  });
  document.addEventListener("click", (e) => {
    if (!railMenu || !railMenu.classList.contains("open")) return;
    if (e.target.closest(".nav-item") || !e.target.closest(".rail")) setRailOpen(false);
  });

  const go = async (name) => {
    document.querySelectorAll(".nav-item[data-view]").forEach(b => b.removeAttribute("aria-current"));
    const btn = document.querySelector(`.nav-item[data-view="${name}"]`);
    if (btn) btn.setAttribute("aria-current", "page");
    history.pushState({}, "", "/#" + name);
    await loadView(name, main, ME);
  };

  document.querySelectorAll(".nav-item[data-view]").forEach(b => {
    b.addEventListener("click", () => go(b.dataset.view));
  });
  document.getElementById("signout").addEventListener("click", () => { MM.clear(); location.href = "/"; });
  window.addEventListener("popstate", () => {
    const v = location.hash.slice(1);
    loadView(VIEWS[v] ? v : "overview", main, ME);
  });

  const initial = location.hash.slice(1);
  await loadView(VIEWS[initial] ? initial : "overview", main, ME);
});
</script>
</body>
</html>
