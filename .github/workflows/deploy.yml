name: Validate and release Mega Magic

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy_vps:
        description: 'Release this main commit to the existing production VPS'
        type: boolean
        default: false
        required: true

permissions:
  contents: read
concurrency:
  group: mega-magic-${{ github.ref }}
  cancel-in-progress: false

env:
  VPS_HOST: 207.148.76.172
  VPS_USER: root
  DEPLOY_PATH: /opt/mega-magic-go-restored-20261018T100554Z

jobs:
  validate:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          PGUSER: postgres
          POSTGRES_PASSWORD: disposable-ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      CHROME_BIN: /usr/bin/google-chrome
      MM_TEST_DB_URL: postgres://postgres:disposable-ci-only@127.0.0.1:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - name: Go toolchain must match go.mod
        run: |
          want=$(awk '/^toolchain /{print $2}' go.mod)
          have=$(go env GOVERSION)
          echo "Go $have (go.mod toolchain $want)"
          test -n "$want" && test "$have" = "$want"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:deployment && npm run test:vercel && npm run build && npm run test:critical-ui
      - run: npm ci --ignore-scripts && npm run lint && npm test && npm run build
        working-directory: app
      - run: go test -race ./internal/... && go build ./...
      - name: Known vulnerabilities in reachable code
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0 && "$(go env GOPATH)/bin/govulncheck" ./...
      - run: bash -n deploy/deploy-vps.sh
      - run: for f in deploy/server/mm-db-backup deploy/server/mm-restore-drill deploy/server/mm-offsite-copy deploy/server/mm-offsite-setup deploy/server/install-backup-tools.sh; do bash -n "$f"; done && bash deploy/server/test-mm-db-backup.sh && bash deploy/server/test-mm-offsite-copy.sh
      - name: Migration runner (needs psql/pg_dump 17 to match the service)
        run: |
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y >/dev/null
          sudo apt-get install -y postgresql-client-17 >/dev/null
          export PATH=/usr/lib/postgresql/17/bin:$PATH
          bash -n deploy/server/mm-migrate && bash deploy/server/test-mm-migrate.sh

  build:
    needs: validate
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_vps && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      api: ${{ steps.images.outputs.api }}@${{ steps.api.outputs.digest }}
      web: ${{ steps.images.outputs.web }}@${{ steps.web.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - name: Go toolchain must match go.mod
        run: |
          want=$(awk '/^toolchain /{print $2}' go.mod)
          have=$(go env GOVERSION)
          echo "Go $have (go.mod toolchain $want)"
          test -n "$want" && test "$have" = "$want"
      - name: Build runtime binaries
        run: |
          mkdir -p restore-bin
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -buildvcs=false -o restore-bin/mega-magic ./cmd/server
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -buildvcs=false -o restore-bin/config-check ./cmd/config-check
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -buildvcs=false -o restore-bin/rotate-credential-key ./cmd/rotate-credential-key
      - id: images
        run: |
          repo=${GITHUB_REPOSITORY,,}
          echo "api=ghcr.io/$repo/mega-magic-api" >> "$GITHUB_OUTPUT"
          echo "web=ghcr.io/$repo/mega-magic-web" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: api
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: deploy/Dockerfile.go-restore
          platforms: linux/amd64
          push: true
          tags: ${{ steps.images.outputs.api }}:${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
      - id: web
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: Dockerfile.web.prod
          platforms: linux/amd64
          push: true
          tags: ${{ steps.images.outputs.web }}:${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}

  deploy-vps:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_vps && github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    env:
      API_IMAGE: ${{ needs.build.outputs.api }}
      WEB_IMAGE: ${{ needs.build.outputs.web }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install explicit identity and pinned host
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/megamagic-app
          ssh-keygen -y -f ~/.ssh/megamagic-app >/dev/null
          test -s deploy/vps-known-hosts
      - name: Transfer verified release metadata and deployment script
        run: |
          python3 - <<'PY'
          import os,json
          json.dump({'api':os.environ['API_IMAGE'],'web':os.environ['WEB_IMAGE'],'sha':os.environ['GITHUB_SHA']},open('release.json','w'))
          PY
          release_dir="/root/mm-ci-releases/$GITHUB_SHA"
          ssh -i ~/.ssh/megamagic-app -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=deploy/vps-known-hosts "$VPS_USER@$VPS_HOST" "mkdir -p '$release_dir' && chmod 700 '$release_dir'"
          scp -i ~/.ssh/megamagic-app -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=deploy/vps-known-hosts release.json deploy/deploy-vps.sh "$VPS_USER@$VPS_HOST:$release_dir/"
          tar czf release-db.tgz db deploy/runtime-db-role.sql deploy/server/mm-migrate
          scp -i ~/.ssh/megamagic-app -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=deploy/vps-known-hosts release-db.tgz "$VPS_USER@$VPS_HOST:$release_dir/"
      - name: Release with backup, real readiness and automatic rollback
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
        run: |
          printf '%s\n' "$REGISTRY_TOKEN" | ssh -i ~/.ssh/megamagic-app -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=deploy/vps-known-hosts "$VPS_USER@$VPS_HOST" "bash '/root/mm-ci-releases/$GITHUB_SHA/deploy-vps.sh' '/root/mm-ci-releases/$GITHUB_SHA' '$REGISTRY_USER'"
      - name: Remove temporary runner identity
        if: always()
        run: rm -f ~/.ssh/megamagic-app release.json release-db.tgz
