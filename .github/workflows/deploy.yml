name: Validate and release Mega Magic

on:
  push:
    branches: [main, 'fix/**']
  pull_request:
  workflow_dispatch:
    inputs:
      deploy_vps:
        description: 'Release this main commit to the existing production VPS'
        type: boolean
        default: false
        required: true

permissions:
  contents: read
concurrency:
  group: mega-magic-${{ github.ref }}
  cancel-in-progress: false

env:
  VPS_HOST: 156.67.216.128
  VPS_USER: root
  DEPLOY_PATH: /opt/mega-magic-go-restored-20261018T100554Z

jobs:
  validate:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          PGUSER: postgres
          POSTGRES_PASSWORD: disposable-ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      CHROME_BIN: /usr/bin/google-chrome
      MM_TEST_DB_URL: postgres://postgres:disposable-ci-only@127.0.0.1:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:deployment && npm run test:vercel && npm run build && npm run test:critical-ui
      - run: go test -race ./internal/... && go build ./...
      - run: bash -n deploy/deploy-vps.sh

  build:
    needs: validate
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_vps && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      api: ${{ steps.images.outputs.api }}@${{ steps.api.outputs.digest }}
      web: ${{ steps.images.outputs.web }}@${{ steps.web.outputs.digest }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
      - name: Build runtime binaries
        run: |
          mkdir -p restore-bin
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -buildvcs=false -o restore-bin/mega-magic ./cmd/server
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -buildvcs=false -o restore-bin/config-check ./cmd/config-check
      - id: images
        run: |
          repo=${GITHUB_REPOSITORY,,}
          echo "api=ghcr.io/$repo/mega-magic-api" >> "$GITHUB_OUTPUT"
          echo "web=ghcr.io/$repo/mega-magic-web" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: api
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25
        with:
          context: .
          file: deploy/Dockerfile.go-restore
          platforms: linux/amd64
          push: true
          tags: ${{ steps.images.outputs.api }}:${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
      - id: web
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25
        with:
          context: .
          file: Dockerfile.web.prod
          platforms: linux/amd64
          push: true
          tags: ${{ steps.images.outputs.web }}:${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}

  deploy-vps:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_vps && github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    env:
      API_IMAGE: ${{ needs.build.outputs.api }}
      WEB_IMAGE: ${{ needs.build.outputs.web }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install explicit identity and pinned host
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/megamagic-app
          ssh-keygen -y -f ~/.ssh/megamagic-app >/dev/null
          test -s deploy/vps-known-hosts
      - name: Transfer verified release metadata and deployment script
        run: |
          python3 - <<'PY'
          import os,json
          json.dump({'api':os.environ['API_IMAGE'],'web':os.environ['WEB_IMAGE'],'sha':os.environ['GITHUB_SHA']},open('release.json','w'))
          PY
          release_dir="/root/mm-ci-releases/$GITHUB_SHA"
          ssh -i ~/.ssh/megamagic-app -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=deploy/vps-known-hosts "$VPS_USER@$VPS_HOST" "mkdir -p '$release_dir' && chmod 700 '$release_dir'"
          scp -i ~/.ssh/megamagic-app -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=deploy/vps-known-hosts release.json deploy/deploy-vps.sh "$VPS_USER@$VPS_HOST:$release_dir/"
      - name: Release with backup, real readiness and automatic rollback
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
        run: |
          printf '%s\n' "$REGISTRY_TOKEN" | ssh -i ~/.ssh/megamagic-app -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=deploy/vps-known-hosts "$VPS_USER@$VPS_HOST" "bash '/root/mm-ci-releases/$GITHUB_SHA/deploy-vps.sh' '/root/mm-ci-releases/$GITHUB_SHA' '$REGISTRY_USER'"
      - name: Remove temporary runner identity
        if: always()
        run: rm -f ~/.ssh/megamagic-app release.json
