<!doctype html>
<html lang="my" data-theme="night">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>MegaMagic</title>
  <meta name="theme-color" content="#0b0e14">
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" sizes="64x64" href="/assets/images/megamagic-logo-b-64.png?v=20261113">
  <script src="/theme-init.js"></script>
  <style>
    /* Painted before the app bundle arrives on slow connections; React replaces it. Same frame as the app shell. */
    html, body { margin: 0; background: #f8fafc; }
    html[data-theme="night"], html[data-theme="night"] body { background: #0b0e14; }
    .boot { min-height: 100dvh; padding: 0 16px; }
    .boot-top { height: 64px; display: flex; align-items: center; gap: 10px; }
    .boot-mark { width: 32px; height: 32px; border-radius: 10px; background: #0f1420; border: 1px solid rgba(56, 189, 248, .4); }
    .boot-bar { height: 14px; border-radius: 7px; background: rgba(15, 23, 42, .08); }
    html[data-theme="night"] .boot-bar, html[data-theme="night"] .boot-card { background: rgba(255, 255, 255, .06); }
    .boot-card { height: 180px; border-radius: 20px; margin-top: 16px; background: rgba(15, 23, 42, .05); }
    .boot-tabs { position: fixed; left: 16px; right: 16px; bottom: calc(10px + env(safe-area-inset-bottom)); max-width: 460px; margin: 0 auto; height: 66px; border-radius: 999px; border: 1px solid #e2e8f0; background: rgba(255, 255, 255, .9); }
    html[data-theme="night"] .boot-tabs { border-color: rgba(255, 255, 255, .09); background: rgba(18, 22, 32, .9); }
    /* System font on purpose: a web font here would compete with the app bundle for bandwidth. */
    .boot, .boot-sr { font-family: system-ui, sans-serif; }
    html[lang="en"] .boot-my, html[lang="my"] .boot-en { display: none; }
    .boot-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    @media (min-width: 900px) { .boot { padding-left: 280px; } .boot-tabs { display: none; } }
  </style>
</head>
<body>
  <div id="root"><div class="boot" role="status" aria-busy="true"><span class="boot-sr"><span class="boot-en" lang="en">Loading MegaMagic</span><span class="boot-my" lang="my">MegaMagic ဖွင့်နေသည်</span></span><div class="boot-top" aria-hidden="true"><span class="boot-mark"></span><span class="boot-bar" style="width:110px"></span></div><div aria-hidden="true"><div class="boot-bar" style="width:45%;height:28px;margin-top:8px"></div><div class="boot-card"></div><div class="boot-card"></div></div><div class="boot-tabs" aria-hidden="true"></div></div></div>
  <noscript>MegaMagic needs JavaScript.</noscript>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
